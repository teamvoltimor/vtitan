{{/*
  Custom brand section with integrated theme switcher
  Displays site logo/title on left and theme switcher on right
*/}}

<div class="book-brand-wrapper">
  <h2 class="book-brand">
    <a class="flex align-center" href="{{ cond (not .Site.Home.File) .Sites.Default.Home.RelPermalink .Site.Home.RelPermalink }}">
      {{- with .Site.Params.BookLogo -}}
      <img src="{{ . | relURL }}" alt="{{ partial "docs/text/i18n" "Logo" }}" />
      {{- end -}}
      <span>{{ .Site.Title }}</span>
    </a>
  </h2>

  <div class="book-brand-theme">
    {{/* Theme switcher */}}
    {{ partial "docs/theme-switcher.html" . }}
  </div>
</div>
