version: v2
plugins:
  # Go — messages + gRPC stubs (consumed by backend)
  - remote: buf.build/protocolbuffers/go:v1.36.5
    out: ../../apps/backend/gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: ../../apps/backend/gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # Python — messages + gRPC stubs (consumed by the ROS2 robot)
  # include_imports generates buf/validate/validate_pb2.py too: every message
  # here carries buf.validate field options, so the generated code imports
  # that module unconditionally at load time, and (unlike Go, where
  # protovalidate-go ships its own compiled validate.pb.go) no PyPI
  # `protovalidate` release actually bundles it. include_wkt stays default
  # (false) so google/protobuf/*_pb2.py isn't regenerated here too -- those
  # already come from the protobuf runtime package and would just duplicate/
  # shadow it.
  - remote: buf.build/protocolbuffers/python:v28.3
    out: ../../src/python/src/gen
    include_imports: true
  - remote: buf.build/grpc/python:v1.68.1
    out: ../../src/python/src/gen

  # TypeScript — protobuf-es types (consumed by the frontend)
  - remote: buf.build/bufbuild/es:v2.3.0
    out: ../../apps/frontend/src/gen
    opt:
      - target=ts
