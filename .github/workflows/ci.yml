name: CI

on:
  push:
    branches: [master, platform]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot:
    name: Robot — lint + unit tests (pixi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/robot
    steps:
      - uses: actions/checkout@v4

      # Robot is pixi-only (RoboStack). The unit subset has no ROS2/hardware
      # deps, so it runs in CI without a Pi.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: platform/robot/pixi.toml
          environments: dev
          cache: true

      - name: Ruff
        run: pixi run -e dev ruff check src/ tests/

      - name: Unit tests
        run: pixi run -e dev pytest tests/unit -q

  backend:
    name: Backend — build + test (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/backend/go.mod
          cache-dependency-path: platform/backend/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  auto-annotator-api:
    name: Auto-Annotator API — build + test (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-annotator/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: auto-annotator/api/go.mod
          cache-dependency-path: auto-annotator/api/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  auto-annotator-ml-service:
    name: Auto-Annotator ML Service — lint + typecheck + unit tests (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-annotator/ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy src/

      # Pure modules only (no GPU/model weights) per Taskfile's ml-service:test.
      - name: Unit tests
        run: uv run pytest tests/ -q

  hailo:
    name: Hailo — lint + typecheck + unit tests (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hailo
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy .

      - name: Unit tests
        run: uv run pytest -q

  docker:
    name: "Docker — build + Trivy scan (${{ matrix.image }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: auto-annotator-api
            context: auto-annotator
            dockerfile: auto-annotator/Dockerfile.api
          - image: auto-annotator-frontend
            context: auto-annotator
            dockerfile: auto-annotator/Dockerfile.frontend
          - image: auto-annotator-ml-service
            context: auto-annotator
            dockerfile: auto-annotator/Dockerfile.ml-service
          - image: platform-frontend
            context: platform/frontend
            dockerfile: platform/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: "${{ matrix.image }}:ci"
          cache-from: "type=gha,scope=${{ matrix.image }}"
          cache-to: "type=gha,mode=max,scope=${{ matrix.image }}"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ matrix.image }}:ci"
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
