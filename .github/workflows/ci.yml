name: CI

on:
  push:
    branches: [master, platform]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot:
    name: Robot — lint + unit tests (pixi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/python
    steps:
      - uses: actions/checkout@v4

      # Robot is pixi-only (RoboStack). The unit subset has no ROS2/hardware
      # deps, so it runs in CI without a Pi.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: src/python/pixi.toml
          environments: dev
          cache: true

      - name: Ruff
        run: pixi run -e dev ruff check src/ tests/

      # Same Ruff -> Typecheck -> tests order the ml-service and hailo jobs
      # already use. mypy never executes module-level code, so this needs no
      # VTITAN_HARDWARE_PROFILE and no hardware.
      #
      # This check was configured but never enforced, and stood at 11 errors.
      # c5739d35 then shipped `exc_info=True` on an rclpy logger -- which mypy
      # reports as an ordinary call-arg error -- and it killed the navigator
      # mid-race on hardware. A 12th entry in an 11-entry list is invisible;
      # zero is the only count a checker can be read against.
      - name: Typecheck
        run: pixi run -e dev typecheck

      - name: Unit tests
        run: pixi run -e dev pytest tests/unit -q

  robot-go:
    name: Robot Go — build + vet + test (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go
    steps:
      - uses: actions/checkout@v4
        with:
          # The lint step diffs against a pinned revision; a shallow clone
          # does not contain it.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go/go.mod
          cache-dependency-path: src/go/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The whole module is linted. The findings grandfathered when lint
      # joined CI (the --new-from-rev=a28a0cf6 pin) are paid down, so there is
      # no baseline left to hide behind: a finding is fixed or carries a
      # //nolint with its reason.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: src/go

  # pkg/portable is shared with the Pico 2 firmware, so it must build under
  # TinyGo (ADR 0098). The depguard rule catches forbidden imports; this job
  # catches everything else TinyGo cannot compile, per package, for the real
  # target. Versions match mise.toml.
  robot-go-tinygo:
    name: Robot Go - TinyGo build of pkg/portable (pico2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go/go.mod
          cache-dependency-path: src/go/go.sum

      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.42.0"

      - name: TinyGo check
        run: bash scripts/tinygo-check.sh

  robot-go-proto:
    name: Robot Go - buf lint + breaking (proto)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking reads the base revision out of the local .git.
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.71.0

      - name: Lint
        run: buf lint

      # Against the PR base, or on push against the commit the push replaced.
      # A new branch has no replaced commit (all zeros), so there is nothing
      # to compare and the step says so instead of guessing a base.
      - name: Breaking
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base revision to compare against; skipping"
            exit 0
          fi
          buf breaking --against "../../.git#ref=${BASE},subdir=src/go"

  config:
    name: Config and docs - schema coverage, x-journal refs, doc drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every model TOML key described, every x-journal ref resolving. This is
      # the repo's only drift check, and until now nothing ran it but a person.
      # configgen's check mode is stdlib-only, so no install step.
      - name: Config check
        run: python src/tools/configgen.py check

      # The generated Go DTOs must match their schemas. check above only proves
      # each TOML key is described; it let five navigation DTOs fall behind
      # their schemas unnoticed. Regenerate with the pinned go-jsonschema and
      # fail on any difference.
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go/go.mod
          cache-dependency-path: src/go/go.sum

      - name: Generated DTOs are current
        run: |
          python src/tools/configgen.py generate-go
          git diff --exit-code -- src/go/internal/config/generated
          untracked=$(git ls-files --others --exclude-standard -- src/go/internal/config/generated)
          if [ -n "$untracked" ]; then
            echo "generated DTOs not committed:" >&2
            echo "$untracked" >&2
            exit 1
          fi

      # The prose equivalent (ADR 0097): accepted ADRs' Decision/Consequences
      # paths, golangci exclusion scopes, and citations of missing or ignored
      # docs, the last against a baseline that may only shrink.
      - name: Docs check
        run: python src/tools/doc_audit.py check

      # The sweep results store (src/tools/sweep_results.py) and the sweep
      # scripts' syntax, the two halves of the harness that replaced the /tmp
      # habit. Stdlib only; pytest is the one install.
      - name: Sweep tooling tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest src/tools/tests -q

  backend:
    name: Backend — build + test (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: other/apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: other/apps/backend/go.mod
          cache-dependency-path: other/apps/backend/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  auto-annotator-api:
    name: Auto-Annotator API — build + test (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: other/apps/auto-annotator/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: other/apps/auto-annotator/api/go.mod
          cache-dependency-path: other/apps/auto-annotator/api/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  auto-annotator-ml-service:
    name: Auto-Annotator ML Service — lint + typecheck + unit tests (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: other/apps/auto-annotator/ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy src/

      # Pure modules only (no GPU/model weights) per Taskfile's ml-service:test.
      - name: Unit tests
        run: uv run pytest tests/ -q

  hailo:
    name: Hailo — lint + typecheck + unit tests (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: other/ml/hailo
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy .

      - name: Unit tests
        run: uv run pytest -q

  frontend:
    name: Platform Frontend — lint + format + test + build (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: other/apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"

      - run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: "Docker — build + Trivy scan (${{ matrix.image }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: auto-annotator-api
            context: other/apps/auto-annotator
            dockerfile: other/apps/auto-annotator/Dockerfile.api
          - image: auto-annotator-frontend
            context: other/apps/auto-annotator
            dockerfile: other/apps/auto-annotator/Dockerfile.frontend
          - image: auto-annotator-ml-service
            context: other/apps/auto-annotator
            dockerfile: other/apps/auto-annotator/Dockerfile.ml-service
          - image: platform-frontend
            context: other/apps/frontend
            dockerfile: other/apps/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: "${{ matrix.image }}:ci"
          cache-from: "type=gha,scope=${{ matrix.image }}"
          cache-to: "type=gha,mode=max,scope=${{ matrix.image }}"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ matrix.image }}:ci"
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
