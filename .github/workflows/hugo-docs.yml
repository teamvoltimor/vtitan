name: Build and Deploy Docs

# Manual-dispatch only, deliberately: push/PR/tag triggers are off so nothing
# runs on a billed GitHub-hosted runner. The same workflow runs locally instead
# (`task ci:local`), and workflow_dispatch stays so it can still be run by hand
# from the Actions tab when needed.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.0"
          extended: true

      - name: Build
        working-directory: other/apps/hugo-docs
        run: hugo --minify --gc

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.0"
          extended: true

      - name: Build
        working-directory: other/apps/hugo-docs
        run: hugo --minify --gc

      - name: Deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: klevor-docs
          directory: other/apps/hugo-docs/public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
