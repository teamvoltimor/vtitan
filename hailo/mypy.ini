[mypy]
plugins = pydantic.mypy
python_version = 3.14
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True

# cv2/onnx/onnxruntime/ultralytics/fiftyone ship no type stubs (or only
# partial ones). Blanket-ignore missing imports rather than enumerating
# every one -- this still catches real errors in our own code (wrong
# return types, undeclared attributes, etc.), just not type-mismatches
# against those specific untyped externals.
ignore_missing_imports = True

exclude = (?x)(
    ^\.venv/
  )
