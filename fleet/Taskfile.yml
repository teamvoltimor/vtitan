version: "3"

vars:
  RPI_5_SSH: rpi-5-local
  RPI_5_HOST: 192.168.0.50
  RPI_ZERO_SSH: rpi-zero-ethernet
  RPI_ZERO_HOST: ralvarezdev-raspberrypi-zero.local

tasks:
  default:
    desc: List all fleet tasks
    cmds:
      - task --list

  ping:
    desc: "Ping a fleet member (usage: task fleet:ping HOST=rpi-5|rpi-zero)"
    requires:
      vars: [HOST]
    vars:
      PING_HOST: '{{if eq .HOST "rpi-5"}}{{.RPI_5_HOST}}{{else}}{{.RPI_ZERO_HOST}}{{end}}'
    cmds:
      - cmd: powershell -NoProfile -Command "Test-Connection -ComputerName '{{.PING_HOST}}' -Count 3"
        platforms: [windows]
      - cmd: ping -c3 {{.PING_HOST}}
        platforms: [linux, darwin]

  ssh:
    desc: "SSH into a fleet member (usage: task fleet:ssh HOST=rpi-5|rpi-zero)"
    requires:
      vars: [HOST]
    vars:
      SSH_ALIAS: '{{if eq .HOST "rpi-5"}}{{.RPI_5_SSH}}{{else}}{{.RPI_ZERO_SSH}}{{end}}'
    cmds:
      - ssh {{.SSH_ALIAS}}

  run:
    desc: "Run a command on a fleet member (usage: task fleet:run HOST=rpi-5|rpi-zero CMD=command)"
    requires:
      vars: [HOST, CMD]
    vars:
      SSH_ALIAS: '{{if eq .HOST "rpi-5"}}{{.RPI_5_SSH}}{{else}}{{.RPI_ZERO_SSH}}{{end}}'
    cmds:
      - ssh {{.SSH_ALIAS}} "{{.CMD}}"
