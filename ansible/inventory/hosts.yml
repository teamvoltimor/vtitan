---
# ansible-playbook runs FROM the dev Pi 5 (same place scripts/setup_pi_*.sh
# run today, see Taskfile.yml's rpi:provision:* tasks) directly to the robot
# Pis' local-network/WiFi addresses — NOT through the Windows ~/.ssh/config
# aliases (rpi-5-direct etc.), which are for a different hop (Windows -> Pi 5).
# Defaults mirror the equivalent Taskfile.yml vars (RPI_LOCAL_IP/ZERO_WIFI_IP).
#
# ansible_host is templated from per-host vars (pi5_ip / zero_ip), NOT set
# directly — `-e ansible_host=x` is a GLOBAL extra-var that would silently
# override BOTH hosts' addresses at once, breaking the Zero playbook's
# delegate_to: pi5 tasks (WiFi band lock, SSH trust), which need the real Pi
# 5 address even while re-targeting the Zero. Override with `-e pi5_ip=<ip>`
# / `-e zero_ip=<ip>` instead — each only touches its own host. E.g. to
# target the Pi Zero over the usb0 gadget link (192.168.250.1) once it's
# already provisioned, instead of its WiFi first-contact address.
all:
  children:
    robot_pi5:
      hosts:
        pi5:
          ansible_host: "{{ pi5_ip | default('192.168.0.50') }}"
          # These runs happen FROM the Pi 5 (see the note above), which meant
          # every `delegate_to: pi5` task opened an SSH connection from the Pi 5
          # to the Pi 5 -- over its own WiFi address, the least reliable link in
          # the fleet. On 2026-08-01 that WiFi dropped its DHCP lease mid-run and
          # the deploy task died with UNREACHABLE, having already done its work.
          # Connect locally instead when the target address is one this machine
          # already owns; fall back to ssh when provisioning from elsewhere.
          ansible_connection: >-
            {{ 'local'
               if (pi5_ip | default('192.168.0.50')) in lookup('pipe', 'hostname -I 2>/dev/null || true').split()
               else 'ssh' }}
    robot_pi_zero:
      hosts:
        pi_zero:
          ansible_host: "{{ zero_ip | default('192.168.0.51') }}"
