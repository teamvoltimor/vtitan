---
# Mirrors the Pi-Zero-specific tail of scripts/setup_pi_zero.sh. common role
# has already run gh auth, apt upgrade, hardware groups, deps, pixi, repo
# clone, .env, and udev rules by this point.

- name: Install Pi-Zero-specific dependencies
  become: true
  ansible.builtin.apt:
    name:
      - python3-lgpio
    state: present

# RPi OS Bookworm/Trixie keep boot config under /boot/firmware.
- name: Detect boot config directory
  ansible.builtin.stat:
    path: /boot/firmware
  register: boot_firmware_stat

- name: Set boot_dir fact
  ansible.builtin.set_fact:
    boot_dir: "{{ '/boot/firmware' if boot_firmware_stat.stat.exists else '/boot' }}"

# Gadget-link setup (dwc2/g_ether/usb0) is deliberately FIRST in this role,
# ahead of I2C/PWM/swap/everything else, with its own early reboot below
# rather than waiting for the role's usual end-of-play flush_handlers. Every
# task after this point in the role runs over the same flaky WiFi first-
# contact link that this whole play exists to get off of (confirmed
# 2026-08-09: repeated UNREACHABLE drops mid-role on a stock Zero, at
# different tasks each time -- apt upgrade, a lightweight config.txt edit,
# even loginctl). Getting the wire up in the very first successful pass
# means every retry after a drop can target the gadget IP directly instead
# of re-fighting WiFi for the full 20-40 min run.
#
# Strip any prior dwc2 overlay first (e.g. a stock dr_mode=host image
# default) — otherwise it survives alongside the one ensured below.
#
# The negative lookahead spares the exact line the next task ensures. Without
# it this pair removed and re-added the same overlay on every single run, which
# reported changed both times and rebooted the Zero for no reason — an
# expensive no-op on a board that takes minutes to come back.
- name: Remove any other dtoverlay=dwc2 lines from config.txt
  become: true
  ansible.builtin.lineinfile:
    path: "{{ boot_dir }}/config.txt"
    regexp: '^dtoverlay=dwc2(?!,dr_mode=peripheral$)'
    state: absent
  notify: Reboot pi zero

# dr_mode is explicit rather than left to the overlay's default of otg.
# This is hardening, NOT a fix for the half-dead-link failure -- that was
# traced to a cdc_ether transmit-queue timeout and reproduced with this
# exact line in place, so do not read it as the cure (see
# scripts/usb-link-watchdog.sh). It is here to remove USB role negotiation
# as a variable: the Zero is only ever the peripheral in this build, and
# letting it negotiate that on every boot is one more nondeterministic step
# in the path that is already nondeterministic.
- name: Ensure dwc2 peripheral overlay is present in config.txt
  become: true
  ansible.builtin.lineinfile:
    path: "{{ boot_dir }}/config.txt"
    line: dtoverlay=dwc2,dr_mode=peripheral
    state: present
  notify: Reboot pi zero

- name: Check if g_ether modules-load already present in cmdline.txt
  become: true
  ansible.builtin.command: "grep -q modules-load=dwc2,g_ether {{ boot_dir }}/cmdline.txt"
  register: cmdline_check
  changed_when: false
  failed_when: false

- name: Append g_ether modules-load to cmdline.txt
  become: true
  ansible.builtin.shell: "sed -i 's/[[:space:]]*$/ modules-load=dwc2,g_ether/' {{ boot_dir }}/cmdline.txt"
  args:
    executable: /bin/bash
  when: cmdline_check.rc != 0
  notify: Reboot pi zero

# Stable, locally-administered MACs so the host side sees a consistent link.
- name: Configure g_ether stable MACs
  become: true
  ansible.builtin.copy:
    content: "options g_ether dev_addr={{ gadget_dev_mac }} host_addr={{ gadget_host_mac }}\n"
    dest: /etc/modprobe.d/g_ether.conf
    mode: "0644"
  notify: Reboot pi zero

# The Zero has no real Ethernet hardware, but its first-boot netplan config
# (from Raspberry Pi Imager's cloud-init customization) renders a generic
# "netplan-eth0" NetworkManager profile that matches ANY ethernet-class
# device -- which usb0/cdc_ether is, once the gadget enumerates. Confirmed on
# hardware 2026-08-09: netplan-eth0 and this role's usb0 profile were both
# valid candidates for the device, NetworkManager picked netplan-eth0, and it
# sat forever in "connecting (getting IP configuration)" waiting on a DHCP
# server that doesn't exist on this point-to-point link -- usb0 never got its
# static address, so the gadget link looked fully healthy at the USB/kernel
# level (carrier up, correct MAC, clean enumeration) while being completely
# unreachable at the IP level. Neither `ip -s link show` nor dmesg show any
# of this; only `nmcli device status` does.
- name: Check for netplan's auto-generated ethernet profile
  become: true
  ansible.builtin.command: nmcli -t -f NAME connection show
  register: nm_connections
  changed_when: false

- name: Stop netplan's ethernet profile from claiming usb0
  become: true
  community.general.nmcli:
    type: ethernet
    conn_name: netplan-eth0
    autoconnect: false
    state: present
  when: "'netplan-eth0' in nm_connections.stdout_lines"

# usb0 owned solely by NetworkManager (one manager per interface). Created
# now even though the interface doesn't exist until the reboot below --
# NetworkManager applies a matching autoconnect profile to an interface as
# soon as it appears, so this doesn't need to wait for the reboot either.
# autoconnect_priority is belt-and-suspenders on top of disabling
# netplan-eth0 above: it's what actually decides the winner on hardware
# where the conflicting profile has some OTHER name we haven't seen yet.
- name: Configure usb0 gadget static IP ({{ usb_gadget_zero_ip }})
  become: true
  community.general.nmcli:
    type: ethernet
    conn_name: usb0
    ifname: usb0
    method4: manual
    ip4: "{{ usb_gadget_zero_ip }}/{{ usb_gadget_subnet_prefix }}"
    # Must match the Pi 5 side — see the matching comment in roles/pi5. The
    # Zero has a default route via WiFi, so without this its multicast leaves
    # over wlan0 while the Pi 5's leaves over usb0 and the two never meet.
    routes4:
      - 224.0.0.0/4
    method6: disabled
    autoconnect: true
    autoconnect_priority: 10
    state: present

- name: Re-activate usb0 in case netplan-eth0 already claimed the device this boot
  become: true
  ansible.builtin.command: nmcli con up usb0
  register: usb0_reactivate
  changed_when: usb0_reactivate.rc == 0
  failed_when: false

# Reboot NOW instead of deferring to the play's end-of-role flush_handlers --
# that's the entire point of moving this block to the front of the role. See
# the comment at the top of this block.
- name: Reboot the Zero now so the gadget link comes up before the rest of this role runs
  ansible.builtin.meta: flush_handlers

# Explicit pin=/func= mapping, not a bare "dtoverlay=pwm-2chan" — see
# servo_pwm_pin/motor_pwm_pin in defaults/main.yml for why this matters.
- name: Remove any existing dtoverlay=pwm-2chan lines from config.txt
  become: true
  ansible.builtin.lineinfile:
    path: "{{ boot_dir }}/config.txt"
    regexp: '^dtoverlay=pwm(-2chan)?(,|$)'
    state: absent
  notify: Reboot pi zero

- name: Map hardware PWM overlay onto servo + drive motor pins
  become: true
  ansible.builtin.lineinfile:
    path: "{{ boot_dir }}/config.txt"
    line: "dtoverlay=pwm-2chan,pin={{ servo_pwm_pin }},func=4,pin2={{ motor_pwm_pin }},func2=4"
    state: present
  notify: Reboot pi zero

- name: Ensure remaining config.txt overlays are present
  become: true
  ansible.builtin.lineinfile:
    path: "{{ boot_dir }}/config.txt"
    line: "{{ item }}"
    state: present
  loop:
    - dtparam=i2c_arm=on
    - enable_uart=1
  notify: Reboot pi zero

# dtparam=i2c_arm=on only loads the i2c_bcm2835 bus driver — it does NOT
# create /dev/i2c-1 on its own. raspi-config's "Enable I2C" also loads
# i2c-dev for the userspace device node; do that explicitly since we're
# bypassing raspi-config.
- name: Ensure i2c-dev module loads at boot
  become: true
  ansible.builtin.copy:
    content: "i2c-dev\n"
    dest: /etc/modules-load.d/i2c-dev.conf
    mode: "0644"

- name: Load i2c-dev module now
  become: true
  community.general.modprobe:
    name: i2c-dev
    state: present

# More swap so pixi/the ROS2 colcon build survives on 512MB RAM.
- name: Check for dphys-swapfile config
  ansible.builtin.stat:
    path: /etc/dphys-swapfile
  register: dphys_stat

- name: Increase swap via dphys-swapfile
  become: true
  when: dphys_stat.stat.exists
  block:
    - name: Set CONF_SWAPSIZE
      ansible.builtin.lineinfile:
        path: /etc/dphys-swapfile
        regexp: '^CONF_SWAPSIZE='
        line: "CONF_SWAPSIZE={{ swap_size_mb }}"
    - name: Set CONF_MAXSWAP
      ansible.builtin.lineinfile:
        path: /etc/dphys-swapfile
        regexp: '^CONF_MAXSWAP='
        line: "CONF_MAXSWAP={{ swap_size_mb }}"
    - name: Apply dphys-swapfile setup
      ansible.builtin.command: dphys-swapfile setup
      changed_when: true
    - name: Enable dphys-swapfile
      ansible.builtin.command: dphys-swapfile swapon
      changed_when: true
      failed_when: false  # already-on is a non-zero exit, not a real failure

- name: Check for plain swapfile
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat
  when: not dphys_stat.stat.exists

# Newer Pi OS (Bookworm/Trixie) uses rpi-swap's zram+file hybrid instead of
# dphys-swapfile, but its file-backing only writes back after a long delay
# (hours), so it doesn't help a short memory-intensive burst like `pixi
# install`/colcon — a plain always-active swapfile is simpler and reliable.
- name: Create plain 2GB swapfile
  become: true
  when: not dphys_stat.stat.exists and not swapfile_stat.stat.exists
  block:
    - name: Allocate swapfile
      ansible.builtin.command: "fallocate -l {{ (swap_size_mb / 1024) | int }}G /swapfile"
      changed_when: true
    - name: Restrict swapfile permissions
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"
    - name: Format swapfile
      ansible.builtin.command: mkswap /swapfile
      changed_when: true
    - name: Persist swapfile in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"

# Deliberately OUTSIDE the block above and gated only on dphys_stat, not on
# swapfile_stat -- confirmed on hardware 2026-08-09: nesting this inside the
# creation-gated block meant a run that created /swapfile but got interrupted
# before reaching this step (e.g. the play failing on a later task) left swap
# permanently inactive, since every future run then sees the file already
# exists and skips the whole block, including this. Matches the pattern
# dphys-swapfile already uses above (its own "Enable" task is unconditional).
- name: Ensure plain swapfile is active
  become: true
  ansible.builtin.command: swapon /swapfile
  when: not dphys_stat.stat.exists
  changed_when: true
  failed_when: false  # already-on is a non-zero exit, not a real failure

# Built on the Pi 5 and shipped, NOT built here. Installing a full ROS2 Kilted
# + robostack env directly on the Zero swap-thrashes its ~415 MB of RAM hard
# enough to spike load average into double digits, leave SSH unresponsive for
# minutes, and crash the board outright with an unclean shutdown — a real
# filesystem-corruption risk on repeat. Confirmed again on 2026-08-01: the Zero
# rebooted on its own mid-`pixi install`. The Pi 5 does the same work in under a
# minute. See docs/sensor-verification.md's "Pi Zero deployment" section.
#
# Delegated to the existing deploy script rather than reimplemented as tasks:
# it already handles the transfer retries, the atomic swap into place, and the
# --symlink-install dereference trap (both boards share the same absolute repo
# path, so an un-dereferenced symlink extracted on the Zero silently resolves
# to the Zero's own stale src instead of what was just built).
- name: Verify PWM availability
  ansible.builtin.command: ls /sys/class/pwm/pwmchip0/
  register: pwm_check
  changed_when: false
  failed_when: false

- name: Warn if PWM chip not yet present
  ansible.builtin.debug:
    msg: "PWM chip not present yet — it appears after the reboot below."
  when: pwm_check.rc != 0

# Trusts the Pi 5's key into the Zero's authorized_keys so the day-2 ops
# scripts that SSH from Pi 5 -> Zero (deploy-dev-env-to-zero.sh,
# verify-zero-integration.sh, safe-shutdown-zero.sh) work without a separate
# manual bootstrap-fresh-zero.sh run — mirrors that script's step 1.
- name: Check for existing Pi 5 SSH key
  delegate_to: pi5
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.ssh/id_ed25519.pub"
  register: pi5_ssh_key_stat

- name: Generate Pi 5 SSH key
  delegate_to: pi5
  ansible.builtin.command: "ssh-keygen -t ed25519 -N '' -f /home/{{ ansible_user }}/.ssh/id_ed25519"
  when: not pi5_ssh_key_stat.stat.exists

- name: Read Pi 5's public key
  delegate_to: pi5
  ansible.builtin.slurp:
    src: "/home/{{ ansible_user }}/.ssh/id_ed25519.pub"
  register: pi5_pubkey_slurp

- name: Trust Pi 5's SSH key into the Zero's authorized_keys
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ pi5_pubkey_slurp.content | b64decode }}"
    state: present

# The reverse direction, which used to be missing. It matters when the Pi 5 is
# the board in trouble: observed 2026-08-01 with the Pi 5 off WiFi for ~5
# minutes after a reboot, where the gadget link was the only route to it and
# the Zero — reachable the whole time — could not be used to get in.
- name: Check for existing Zero SSH key
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.ssh/id_ed25519.pub"
  register: zero_ssh_key_stat

- name: Generate Zero SSH key
  ansible.builtin.command: "ssh-keygen -t ed25519 -N '' -f /home/{{ ansible_user }}/.ssh/id_ed25519"
  when: not zero_ssh_key_stat.stat.exists

- name: Read the Zero's public key
  ansible.builtin.slurp:
    src: "/home/{{ ansible_user }}/.ssh/id_ed25519.pub"
  register: zero_pubkey_slurp

- name: Trust the Zero's SSH key into the Pi 5's authorized_keys
  delegate_to: pi5
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ zero_pubkey_slurp.content | b64decode }}"
    state: present

# Ordered after the authorized_keys task above, not before it: the deploy
# script SSHes from the Pi 5 into the Zero and runs non-interactively, so
# without that trust already in place it fails outright on a fresh board.
- name: Build the Zero's pixi env and ROS2 workspace on the Pi 5, then ship it
  delegate_to: pi5
  ansible.builtin.command: "bash scripts/deploy-dev-env-to-zero.sh"
  args:
    chdir: "{{ robot_dir }}"
  environment:
    ZERO_HOST: "{{ ansible_user }}@{{ usb_gadget_zero_ip }}"
  register: zero_deploy
  # The script skips whatever already matches the Zero's fingerprints, so a
  # converged run must report ok rather than changed -- otherwise the recap
  # claims work that did not happen, which is exactly the kind of noise that
  # makes a recap stop being worth reading.
  changed_when: "'DEPLOYED' in zero_deploy.stdout"

# Repairs the gadget link when it comes up half-dead. Installed on the Zero
# rather than the Pi 5 because the link it repairs may be the robot's only
# path, so the repair cannot depend on having another one.
- name: Install usb-link watchdog units
  become: true
  ansible.builtin.copy:
    src: "{{ robot_dir }}/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    remote_src: true
    mode: "0644"
  loop: "{{ zero_watchdog_units }}"
  notify: Reload systemd zero

- name: Substitute __TARGET_HOME__ placeholder in watchdog units
  become: true
  ansible.builtin.replace:
    path: "/etc/systemd/system/{{ item }}"
    regexp: '__TARGET_HOME__'
    replace: "/home/{{ ansible_user }}"
  loop: "{{ zero_watchdog_units }}"
  notify: Reload systemd zero

# Only the timer is enabled: it is what pulls in the oneshot service. Enabling
# the service itself would additionally run it once at boot, inside the very
# window its own uptime grace exists to skip.
- name: Enable usb-link watchdog timer
  become: true
  ansible.builtin.systemd_service:
    name: vtitan-usb-link-watchdog.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Install vtitan-pi-zero systemd unit
  become: true
  ansible.builtin.copy:
    src: "{{ robot_dir }}/systemd/vtitan-pi-zero.service"
    dest: /etc/systemd/system/vtitan-pi-zero.service
    remote_src: true
    mode: "0644"
  notify: Reload systemd zero

- name: Substitute __TARGET_USER__ placeholder in unit file
  become: true
  ansible.builtin.replace:
    path: /etc/systemd/system/vtitan-pi-zero.service
    regexp: '__TARGET_USER__'
    replace: "{{ ansible_user }}"
  notify: Reload systemd zero

- name: Substitute __TARGET_HOME__ placeholder in unit file
  become: true
  ansible.builtin.replace:
    path: /etc/systemd/system/vtitan-pi-zero.service
    regexp: '__TARGET_HOME__'
    replace: "/home/{{ ansible_user }}"
  notify: Reload systemd zero

- name: Enable vtitan-pi-zero service
  become: true
  ansible.builtin.systemd_service:
    name: vtitan-pi-zero.service
    enabled: true
    daemon_reload: true

# Removal of the leftover pre-rename deployment ({{ old_repo_dir }}) is
# handled generically by the common role now (covers both the Zero's
# tarball deployment and the Pi 5's git checkout the same way).
