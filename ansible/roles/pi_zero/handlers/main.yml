---
- name: Reload systemd zero
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reboot pi zero
  become: true
  ansible.builtin.reboot:
    # 300 was not enough and failed a run that had otherwise succeeded: the
    # Zero took 314s to answer again. It is a 2W, it comes back slowly, and
    # Ansible waits on it over the usb0 gadget address — which can itself take
    # extra time to start passing traffic after a reboot (see
    # scripts/usb-link-watchdog.sh for the failure mode that delays it).
    reboot_timeout: 900
