---
# Mirrors the Pi-5-specific tail of scripts/setup_pi_5.sh. common role has
# already run gh auth, apt upgrade, hardware groups, deps, pixi, repo clone,
# .env, and udev rules by this point.

# raspi-config nonint isn't natively idempotent-tracked by Ansible, but the
# underlying config.txt edits are (raspi-config won't duplicate a line it's
# already written) — always reporting "changed" here is a known simplification.
- name: Enable camera/i2c/spi/serial interfaces via raspi-config
  become: true
  ansible.builtin.command: "raspi-config nonint {{ item }}"
  loop:
    - do_camera 0
    - do_i2c 0
    - do_spi 0
    # Current raspi-config (Bookworm/Trixie) split the old combined
    # do_serial 0/1/2 into do_serial_hw/do_serial_cons — do_serial no
    # longer accepts "2" as a nonint arg and falls back to an interactive
    # whiptail dialog instead, which then fails with no real pty available.
    - do_serial_hw 0    # serial hardware on (IMU UART-RVC)
    - do_serial_cons 1  # login shell over serial off
  environment:
    TERM: linux
  changed_when: true
  notify: Reboot pi5

- name: Install Hailo AI HAT+ runtime (hailo-all)
  become: true
  ansible.builtin.apt:
    name: hailo-all
    state: present
    update_cache: true

# Model files themselves are a day-2 concern (scripts/deploy-to-pi5.sh pushes
# the .hef built by `task gmr:workflow`) — just make sure the target
# directory HAILO_MODEL_PATH expects exists so that first deploy doesn't fail.
- name: Ensure Hailo models directory exists
  become: true
  ansible.builtin.file:
    path: /usr/local/hailo/models
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Enable hailort service
  become: true
  ansible.builtin.systemd_service:
    name: hailort
    enabled: true
    daemon_reload: true

- name: Configure usb0 host static IP ({{ usb_gadget_pi5_ip }})
  become: true
  community.general.nmcli:
    type: ethernet
    conn_name: usb0
    ifname: usb0
    method4: manual
    ip4: "{{ usb_gadget_pi5_ip }}/{{ usb_gadget_subnet_prefix }}"
    method6: disabled
    autoconnect: true
    state: present

- name: Fetch LiDAR driver (sllidar_ros2) before build
  ansible.builtin.command: "{{ pixi_bin }} run fetch-lidar-driver"
  args:
    chdir: "{{ robot_dir }}"
  changed_when: true

# Built under -e vision, not -e dev: colcon bakes the building env's own
# python path into each generated executable's shebang (e.g.
# install/lib/vtitan_vision/vision_node), so whichever env builds the
# workspace is also the one that runs it at launch time regardless of which
# env `ros2 launch` itself is invoked under. vision_node needs hailo_platform
# (a vision-only pypi-dependency, see [feature.vision.target.linux-aarch64.
# pypi-dependencies] in pixi.toml) at import time, so building under -e dev
# left it crash-looping with "No module named 'hailo_platform'" even though
# the vision env had it installed and importable directly. -e vision is a
# strict superset of -e dev (see [environments] in pixi.toml: vision =
# features ["dev", "vision"]), so this single step also installs
# ultralytics + hailort -- no separate vision-env install step needed.
- name: Install pixi vision env and build ROS2 workspace
  ansible.builtin.shell: "{{ pixi_bin }} install -e vision && {{ pixi_bin }} run -e vision build-ws"
  args:
    executable: /bin/bash
    chdir: "{{ robot_dir }}"
  changed_when: true

# The telemetry backend runs on the Pi 5 itself rather than on a dev laptop:
# a laptop behind a VPN whose LAN filter drops inbound connections is simply
# unreachable from the robot (verified 2026-08-01 -- an explicit allow rule in
# Windows Firewall for the backend's ports made no difference, and even ICMP
# was dropped). Keeping the backend on the robot also means the robot's own
# localhost defaults just work, with no per-host address wiring.
- name: Install mise (Go toolchain manager)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://mise.run | sh
  args:
    executable: /bin/bash
    creates: "{{ mise_bin }}"

# Without this, mise prompts for confirmation the first time it picks up the
# repo's root mise.toml while resolving the build below -- which would hang a
# non-interactive provisioning run.
- name: Trust the repo's mise config
  ansible.builtin.command: "{{ mise_bin }} trust {{ repo_dir }}"
  changed_when: false

- name: Install Go via mise
  ansible.builtin.command: "{{ mise_bin }} install go@{{ go_version }}"
  register: mise_go_install
  changed_when: "'installing' in (mise_go_install.stderr | lower)"

# vtitan-backend.service runs a prebuilt binary, so the build happens here
# rather than at service start -- `go run` would recompile on every restart
# (over a minute on this hardware) and turn a crash-loop into a CPU sink.
- name: Build the telemetry backend binary
  ansible.builtin.command: "{{ mise_bin }} exec go@{{ go_version }} -- go build -o bin/server ./cmd/server"
  args:
    chdir: "{{ backend_dir }}"
  changed_when: true

- name: Install vtitan-pi5 + vtitan-lidar + vtitan-backend systemd units
  become: true
  ansible.builtin.copy:
    src: "{{ robot_dir }}/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    remote_src: true
    mode: "0644"
  loop: "{{ pi5_systemd_units }}"
  notify: Reload systemd

- name: Substitute __TARGET_USER__ placeholder in unit files
  become: true
  ansible.builtin.replace:
    path: "/etc/systemd/system/{{ item }}"
    regexp: '__TARGET_USER__'
    replace: "{{ ansible_user }}"
  loop: "{{ pi5_systemd_units }}"
  notify: Reload systemd

- name: Substitute __TARGET_HOME__ placeholder in unit files
  become: true
  ansible.builtin.replace:
    path: "/etc/systemd/system/{{ item }}"
    regexp: '__TARGET_HOME__'
    replace: "/home/{{ ansible_user }}"
  loop: "{{ pi5_systemd_units }}"
  notify: Reload systemd

- name: Enable vtitan-pi5 + vtitan-lidar + vtitan-backend services
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop: "{{ pi5_systemd_units }}"

# Sibling git-worktree checkouts (auto-annotator/docs/hailo/hugo-docs/platform
# branches) plus a stale manual session-backup dir — verified 2026-07-30 via
# `git log --branches --not --remotes` (empty in every one) that none carry
# commits missing from GitHub, and their content is largely redundant with
# what's already on GitHub, so dropped in favor of a single ~/vtitan
# checkout. Gated on the common role's migration (old_repo_dir_stat /
# final_env_stat) having actually run, so a fresh Pi 5 with none of these
# directories present doesn't need special-casing.
- name: Remove old sibling worktree / backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ old_worktree_dirs }}"
  when: old_repo_dir_stat.stat.exists and final_env_stat.stat.exists
