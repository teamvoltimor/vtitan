---
# Mirrors scripts/setup_common.sh + the shared prefix of setup_pi_5.sh /
# setup_pi_zero.sh. Board-specific steps (interfaces, overlays, pixi env,
# systemd units) live in the pi5 / pi_zero roles.

# Verify GitHub access up front (private repo) before any heavy work — same
# fail-fast rationale as require_github_auth() in setup_common.sh.
- name: Install GitHub CLI apt key + repo
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    install -d -m 0755 /etc/apt/keyrings
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | gpg --dearmor -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
    chmod 0644 /etc/apt/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
  args:
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/github-cli.list

- name: Install gh package
  become: true
  ansible.builtin.apt:
    name: gh
    update_cache: true

- name: Authenticate gh via GH_TOKEN
  # gh refuses to persist credentials via `auth login` when GH_TOKEN is set
  # in its own environment ("use the env var, don't store it"), so the token
  # must reach stdin without also being exported for this shell.
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s' {{ lookup('env', 'GH_TOKEN') | quote }} | gh auth login --with-token
  args:
    executable: /bin/bash
  when: lookup('env', 'GH_TOKEN') | length > 0
  changed_when: true
  no_log: true

- name: Check gh auth status
  ansible.builtin.command: gh auth status
  register: gh_auth_status
  changed_when: false
  failed_when: false

- name: Fail fast if gh is not authenticated
  ansible.builtin.fail:
    msg: >-
      gh is not authenticated for {{ ansible_user }} (private repo teamvoltimor/vtitan).
      Run `gh auth login` on the control host or pass GH_TOKEN=... to ansible-playbook.
  when: gh_auth_status.rc != 0

- name: Configure gh as git credential helper
  ansible.builtin.command: gh auth setup-git
  changed_when: false

- name: Update apt cache and full-upgrade
  become: true
  ansible.builtin.apt:
    update_cache: true
    upgrade: full

- name: Add {{ ansible_user }} to hardware groups
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: "{{ hardware_groups }}"
    append: true

- name: Install common dependencies
  become: true
  ansible.builtin.apt:
    name:
      - git
      - build-essential
      - python3-pip
      - i2c-tools
      - network-manager
      # Long provisioning runs (the Zero's colcon build takes hours) must
      # survive the SSH session that launched them; nohup alone does not.
      - tmux
    state: present

# tmux alone is not enough: a detached tmux server is still owned by the
# user's login session and dies with it on an abrupt disconnect (confirmed
# 2026-08-09 -- `client_loop: send disconnect` during provision_pi_zero.yml
# took the whole tmux server down, not just the SSH session, and
# `tmux attach` afterwards found no sessions at all). Linger keeps the
# user's systemd instance -- and anything it owns, including a detached
# tmux server -- running independent of whether they're logged in.
- name: Enable linger for {{ ansible_user }} (tmux/background jobs survive a dropped SSH session)
  become: true
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"

# Root cause of a session-long Pi5<->Zero ROS2/DDS delivery failure, found
# 2026-08-09 via `netstat -su`: 1018 UDP receive buffer errors out of 62075
# packets on the Zero (342/1083746 on the Pi 5 -- same pattern, much lower
# rate, more CPU headroom to drain the socket before it overflows). The
# default net.core.rmem_default (~208KB) is too small to absorb a burst of
# DDS traffic before the receiving thread drains it, especially on the
# Zero's single weak core -- packets are dropped at the kernel UDP layer
# before FastDDS/CycloneDDS ever sees them, which looks identical from the
# application's side regardless of which RMW implementation is in use
# (confirmed: swapping FastDDS for Cyclone DDS as a diagnostic did not
# change the symptom). Small discovery/control traffic gets through fine
# (low volume, rarely overflows the buffer); real topic data does not,
# producing an endless retry/heartbeat loop with no error on either side --
# raw ping stayed 0% loss throughout, which is what made this so hard to
# find. Confirmed fixed live on hardware: after raising these, a jumper
# reading that had timed out after 60s on every previous attempt this
# session arrived within the state machine's normal boot-check window, and
# /ui/telemetry_summary held a steady 10Hz on the Zero.
- name: Raise UDP socket buffer limits (DDS cross-board delivery reliability)
  become: true
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "8388608"
    sysctl_file: /etc/sysctl.d/99-vtitan-udp-buffers.conf
    reload: true
  loop:
    - net.core.rmem_max
    - net.core.rmem_default
    - net.core.wmem_max
    - net.core.wmem_default

- name: Check if pixi is already installed
  ansible.builtin.stat:
    path: "{{ pixi_bin }}"
  register: pixi_stat

- name: Install pixi
  ansible.builtin.shell: curl -fsSL https://pixi.sh/install.sh | bash
  args:
    executable: /bin/bash
  when: not pixi_stat.stat.exists

# Pre-rename deployment migration (teamvoldemor/voldemorbot ->
# teamvoltimor/vtitan). Always a fresh clone now, git-based (Pi 5's
# ~/voldemorbot and its sibling git-worktree checkouts) or tarball-deployed
# (Pi Zero, via scripts/deploy-dev-env-to-zero.sh) alike -- verified
# 2026-07-30 that no worktree/branch on the Pi 5 had commits missing from
# GitHub (`git log --branches --not --remotes` empty everywhere), so nothing
# is lost by discarding the old checkout(s) outright. Only the real
# gitignored .env (steering offsets, LiDAR yaw, Hailo model path) is carried
# over, since a fresh clone can't reproduce it.
- name: Check for pre-rename deployment ({{ old_repo_dir }})
  ansible.builtin.stat:
    path: "{{ old_repo_dir }}"
  register: old_repo_dir_stat

- name: Clone vtitan repo
  ansible.builtin.command: "gh repo clone {{ github_repo }} {{ repo_dir }}"
  args:
    creates: "{{ repo_dir }}/.git"

# The clone above is `creates:`-guarded, so on a board that already has a
# checkout it does nothing -- which meant provisioning never updated the code.
# Boards stayed pinned at whatever commit they were first cloned at (the Pi 5
# was months behind and still pointing at the pre-rename URL), and every deploy
# quietly shipped stale source unless someone remembered to pull by hand.
- name: Read the checkout's current origin URL
  ansible.builtin.command: "git remote get-url origin"
  args:
    chdir: "{{ repo_dir }}"
  register: repo_origin_url
  changed_when: false

- name: Point origin at the canonical repo URL
  ansible.builtin.command: "git remote set-url origin https://github.com/{{ github_repo }}.git"
  args:
    chdir: "{{ repo_dir }}"
  when: repo_origin_url.stdout | trim != "https://github.com/" ~ github_repo ~ ".git"
  changed_when: true

- name: Fetch latest refs
  ansible.builtin.command: "git fetch --prune origin"
  args:
    chdir: "{{ repo_dir }}"
  changed_when: false

- name: Check out {{ repo_ref }}
  ansible.builtin.command: "git checkout {{ repo_ref }}"
  args:
    chdir: "{{ repo_dir }}"
  changed_when: true

# --ff-only deliberately, never a merge or a reset. A board that has diverged is
# something to look at by hand -- provisioning should not paper over local work
# by discarding it, and a failure here is more useful than a silent overwrite.
- name: Fast-forward {{ repo_ref }} to origin
  ansible.builtin.command: "git merge --ff-only origin/{{ repo_ref }}"
  args:
    chdir: "{{ repo_dir }}"
  changed_when: true

- name: Check for real .env in the pre-rename deployment
  ansible.builtin.stat:
    path: "{{ old_repo_dir }}/platform/robot/.env"
  register: old_env_stat
  when: old_repo_dir_stat.stat.exists

- name: Check for existing .env in the fresh clone
  ansible.builtin.stat:
    path: "{{ robot_dir }}/.env"
  register: env_stat

- name: Copy real .env from the pre-rename deployment into the fresh clone
  ansible.builtin.copy:
    src: "{{ old_repo_dir }}/platform/robot/.env"
    dest: "{{ robot_dir }}/.env"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: old_repo_dir_stat.stat.exists and old_env_stat.stat.exists and not env_stat.stat.exists

- name: Copy .env.example to .env
  ansible.builtin.copy:
    src: "{{ robot_dir }}/.env.example"
    dest: "{{ robot_dir }}/.env"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: not env_stat.stat.exists and not (old_repo_dir_stat.stat.exists and old_env_stat.stat.exists)

- name: Confirm .env landed before removing the pre-rename deployment
  ansible.builtin.stat:
    path: "{{ robot_dir }}/.env"
  register: final_env_stat
  when: old_repo_dir_stat.stat.exists

- name: Remove pre-rename deployment ({{ old_repo_dir }})
  ansible.builtin.file:
    path: "{{ old_repo_dir }}"
    state: absent
  when: old_repo_dir_stat.stat.exists and final_env_stat.stat.exists

- name: Install udev rules
  become: true
  ansible.builtin.copy:
    src: "{{ robot_dir }}/udev/99-vtitan-gpio.rules"
    dest: /etc/udev/rules.d/99-vtitan-gpio.rules
    remote_src: true
    mode: "0644"
  notify: Reload udev rules

# Was a manual `task rpi:setup-journal-persist` step — folds in here so logs
# survive reboots on both boards without a separate manual pass.
- name: Ensure journald.conf.d exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Enable persistent systemd journal (50M cap)
  become: true
  ansible.builtin.copy:
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=50M
    dest: /etc/systemd/journald.conf.d/persistent.conf
    mode: "0644"
  notify: Restart journald
