# Ruff Configuration — robot package.
#
# Extends the common base at platform/ruff.toml (shared with src/shared);
# only robot-specific settings live here.
# Documentation: https://docs.astral.sh/ruff/

extend = "../../ruff.toml"

# NOTE: `extend` does NOT merge `[lint.per-file-ignores]` entry-by-entry --
# declaring this table at all replaces the base's table wholesale (unlike
# e.g. [lint.isort], which does merge per-key). So this table must repeat the
# base's common patterns (test files, __init__.py, etc.) alongside robot's
# own path-specific entries, verified via `ruff check --show-settings`
# against the pre-split config.
[lint.per-file-ignores]
# Tests
"test_*.py" = [
    "S101",
    "PLR2004",
    "ANN",
    "D",
    "BLE001",
    "SLF001",
    "ARG002",
    "B905",
    "PTH123",
    "F841",
    "PLC0415",
    "E402",
    "F401",
    "S110",
    "TRY400",
    "PT006",
    "PT007",
    "SIM105",
    "SIM108",
    "RUF059",
    "N801",    # Test classes mirror production CapWords-violating names (e.g. TestIMU_I2CNodeInit)
    "N806",    # Fixtures yield the class itself; tests unpack it into a same-named local
]
"tests/*.py" = [
    "S101",
    "PLR2004",
    "ANN",
    "D",
    "BLE001",
    "SLF001",
    "ARG002",
    "B905",
    "PTH123",
    "F841",
    "PLC0415",
    "E402",
    "F401",
    "S110",
    "TRY400",
    "PT006",
    "PT007",
    "SIM105",
    "SIM108",
    "RUF059",
    "N801",    # Test classes mirror production CapWords-violating names (e.g. TestIMU_I2CNodeInit)
    "N806",    # Fixtures yield the class itself; tests unpack it into a same-named local
]
"conftest.py" = [
    "F401",
    "BLE001",
    "B905",
    "PTH123",
]

# Setup and config files
"setup.py" = ["INP001"]

# Scripts
"scripts/*.py" = [
    "INP001",
]

# Root-level entrypoints (not in a package)
"main.py" = [
    "PLC0415",
]

# ROS2 launch files are implicit namespace packages; function sig required by ROS2
"**/launch/*.py" = ["INP001", "ANN201", "D103"]

# scipy's own docs use `from scipy.spatial.transform import Rotation as R`
"src/hardware/imu/bno08x/utils.py" = ["N817"]

# IMU_I2CNode / IMU_UART_RVCNode violate CapWords (N801) but renaming ripples
# across ~90 call sites (driver, the ros2_ws ament re-export shim including its
# IMU_RVCNode backward-compat alias, and both test files); deferred as a
# deliberate follow-up rather than done incidentally while enabling N.
"src/ros2/imu/bno08x/mcp2221/i2c_node.py" = ["N801"]
"src/ros2/imu/bno08x/mcp2221/uart_rvc_node.py" = ["N801"]

# Telemetry-bridge DTOs (RobotSnapshot, TelemetryMetrics, _IMUPayload, etc.)
# mirror the backend's camelCase gRPC/JSON wire contract field-for-field;
# renaming them to snake_case would change the on-wire schema.
"ros2_ws/src/vtitan_state_machine/vtitan_state_machine/telemetry_bridge_node.py" = ["N815"]

# Core navigator step() is complex by design — orchestrates all navigation subsystems
"src/navigation/core_navigator/**" = ["C901", "PLR0911", "PLR0912", "PLR0915"]

# ScenarioSimulator.run() is complex by design — drives the whole closed-loop tick
"src/simulation/scenario_simulator/**" = ["C901", "PLR0912", "PLR0915"]

# `assert self.<property> is not None` narrows an internal invariant already
# enforced by the calling convention (e.g. only reachable after a successful
# connect()) so mypy can see it too -- not a bypassable security check.
"src/hardware/display/ssd1306/driver_raw_i2c.py" = ["S101"]
"src/hardware/hailo/streaming.py" = ["S101"]
"ros2_ws/src/vtitan_drivers/vtitan_drivers/oled_display_node.py" = ["S101"]
# `assert lateral_offset is not None` narrows an invariant always set by
# SignRouterConfig.__post_init__ (and mypy-visible there), not a bypassable check.
"src/navigation/planning/sign_router/router.py" = ["S101"]

# Optional hardware and heavy backends are imported inside the function that
# needs them: HailoRT and the GPIO libraries only exist on-device, and importing
# them at module scope would make the module unimportable on a dev machine (and
# break every test that merely imports it).
"src/vision/__init__.py" = ["PLC0415"]
"src/vision/detector.py" = ["PLC0415"]
"src/hardware/hailo/__init__.py" = ["PLC0415"]
"src/hardware/hailo/inferences.py" = ["PLC0415"]
"src/hardware/motors/bts7960/driver.py" = ["PLC0415", "S603"]
"src/hardware/motors/l298n/driver.py" = ["PLC0415"]
"src/hardware/motors/encoder/driver.py" = ["PLC0415"]

# `LidarScan.sector_ranges` delegates to the collision-avoidance controller,
# which imports the ports module back -- a module-scope import here is a cycle.
"src/navigation/ports.py" = ["PLC0415"]

# rpicam-vid is invoked with an argv this module builds itself from typed
# config; no shell, and no caller-supplied string reaches it.
"src/hardware/camera/rpicam/driver.py" = ["S603"]

# Optional lifecycle hooks: a backend that needs to open or release hardware
# overrides them, and most have nothing to do. Marking them @abstractmethod
# would force every backend to write an empty body.
"src/hardware/motors/base.py" = ["B027"]

# `assert self._input is not None` narrows an invariant the connect() above it
# has just established, so mypy can see it too -- not a bypassable check.
"src/hardware/challenge_mode/driver.py" = ["S101"]

# A driver teardown path must release what it can and keep going: a failure
# deinitialising the bus is logged, not propagated into the caller's shutdown.
"src/hardware/imu/bno08x/mcp2221/i2c.py" = ["BLE001"]
"src/ros2/hardware_node.py" = ["BLE001"]

# ROS2 node callbacks run on the executor: an exception escaping one kills the
# node mid-race, so they log and continue. The asserts narrow invariants
# established at construction; the lazy imports keep optional vision backends
# off the module-import path (see src/vision above).
"src/ros2/vision/node.py" = ["BLE001", "PLC0415", "S101", "PLR0915"]
"src/ros2/navigation/track_navigator_node.py" = [
    "BLE001",
    "PLC0415",
    "S101",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",
]

# `_control_points` is a branch per lane geometry -- splitting it would scatter
# one contiguous decision across helpers that only ever have one caller.
"src/navigation/planning/sign_lane.py" = ["C901"]

# isort configuration
[lint.isort]
known-first-party = ["src"]

# Usage Examples
# Lint entire project:
#   ruff check .
#
# Auto-fix issues:
#   ruff check --fix .
#
# Format code:
#   ruff format .
#
# Check and format:
#   ruff check --fix . && ruff format .
#
# Show violations without fixing:
#   ruff check --no-fix .
#
# Check specific files:
#   ruff check src/ tests/
#
# Watch mode (re-run on changes):
#   ruff check --watch .
#
# Generate configuration:
#   ruff check --show-settings
#
# List all rules:
#   ruff rule --all
#
# Explain a specific rule:
#   ruff rule E501
