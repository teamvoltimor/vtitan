# LIDAR angular-sector definitions shared by collision avoidance and the OLED.
#
# See shared.config.navigation_tuning.LidarSectorParams.

front_half_fov_deg = 30.0          # compute_forward_clearance's cone
threat_half_fov_deg = 45.0         # detect_threat_direction's sectors
self_detection_threshold_m = 0.08  # chassis/cable self-reflection floor
# Gate the REAR sector's self-detection by chassis geometry instead, per
# bearing. One scalar cannot describe the rear: the chassis boundary runs from
# 0.137 m at the sector edges to 0.2722 m straight back, and 0.08 is inside the
# body everywhere in between. Measured on run_20260906_192424 the rear minimum
# was the ROBOT on 100% of scans (-157 deg / 0.125 m, -172 deg / 0.187 m), so
# most_constrained_side read BACK on 84% of driving ticks -- and there is no
# BACK escape branch, so no maneuver was ever generated. 212 ticks of
# escape_risk=critical across the five pillar contacts produced zero escapes.
rear_self_detection_from_chassis = true
# No-return / invalid reading floor. Must sit STRICTLY BELOW
# RobotSpecs.LIDAR_MIN_RANGE (0.045, the C1's rated minimum), because the
# filter is `r > min_valid_range_m` and the sensor REPORTS 0.045 for anything
# closer than it can measure. Held 0.05 until 2026-09-10 while its comment
# claimed to "match" 0.045: every floor reading was therefore discarded as
# invalid, so a chassis nosed into a corner had its whole forward cone thrown
# away and AssessRisk returned the unconditional RiskCritical for a
# fully-invalid lane -- a wedge it could not read its way out of.
min_valid_range_m = 0.044
threat_no_detection_range_m = 1.0  # beyond this, a sector's nearest reading isn't a threat
no_data_range_m = 10.0             # sentinel when a sector has no valid rays at all
# Rear occlusion. Measured 2026-08-04 against a real bag as -160..-115 and
# 115..175, which left a ~25 deg slot straight back -- the mount's only rear
# vision, and what every reverse gate was implicitly relying on.
#
# The slot was GONE on the 2026-08-22 build, so the two wedges met at 180 and
# the rear was fully masked. The reverse gates branch on whether the rear
# sector was MEASURED rather than on a distance, so closing the gap disabled
# reversing on sensed clearance without touching any of that logic.
#
# RE-MEASURED 2026-08-31 on the current mount, and the slot is back and WIDER
# than the 2026-08-04 one: about 40 deg (+/-160..180) against that build's
# ~25 deg. Do not restore the 08-04 numbers -- they describe a superseded
# mount. Reproduced across three post-08-08 bags
# (run_20260830_{182505,181916,025327}) via
# `diag_bag_side_ray_robustness.py --rear-occlusion`:
#
#   bearing      -180..-160   -155..-120   -120..-90   +90..+115   +120..+150   +160..+180
#   valid rays      45-78%        0.0%       31-93%      11-98%        0.0%        57-98%
#
# The two 0.0% arcs are identical on all three bags and return 0.006-0.04 m
# with near-zero spread -- the mount's own structure, essentially AT the
# sensor. The mount is asymmetric: 35 deg blind left, 40 deg right.
#
# Readability CANNOT be decided per-tick, which is why this is measured once
# into config rather than inferred at runtime: a no-return is substituted with
# max range, so an occluded bearing reads 12 m and looks maximally clear. Over
# a whole bag it IS decidable, because occlusion is geometric and static -- an
# occluded bearing answers the same however the robot moves, an open one
# varies because the robot drove. The diagnostic therefore requires BOTH a
# valid-ray fraction and a range spread; valid fraction alone passed a bearing
# pinned to a constant by a stationary period in one of the three bags.
#
# Measured over the full 640-case Open space against the 2026-08-31 shipped
# config: 612 -> 617 ok, collisions 3 -> 1. It fixes all three collisions that
# survived steer_cap_from_commit_distance -- the ones that never entered the
# corner or back-off branches -- but INTRODUCES one new collision (case 64)
# and 3 new failures, and churns trajectories broadly (126 of 604 cases
# identical, against 587 for the steer-cap change). Net +5.
#
# NOT HARDWARE-VALIDATED. This is the first time since 2026-08-22 that the
# reverse gates can fire at all, so the back-off branch now reverses where it
# used to creep forward under lock. Validate on track before trusting it.
blind_wedge_left_min_deg = -155.0
blind_wedge_left_max_deg = -120.0
blind_wedge_right_min_deg = 120.0
blind_wedge_right_max_deg = 160.0
direction_arc_half_fov_deg = 8.0   # src.navigation.utils' corner-detection cone -- NOT front_half_fov_deg, see the field's docstring
