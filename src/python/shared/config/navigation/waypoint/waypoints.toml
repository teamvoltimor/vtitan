# Waypoint generation geometry parameters.
#
# See shared.config.navigation_tuning.WaypointParams.

# Ceiling on the corner arc radius (m), NOT the radius itself. Each corner sizes
# its own arc from the two corridors it joins -- max(W_entry, W_exit)/2 minus
# that corridor's center bias, see waypoints.corner_arc_radius.
#
# ON THIS TRACK THE CEILING NEVER BINDS. Verified 2026-08-29 by running the real
# corner_arc_radius, not by reading this comment, which had drifted: it still
# described the 0.05-bias era, where wide corners hit this 0.45 cap and a
# narrow-to-narrow corner came out at 0.25. With the shipped biases (0.10 wide /
# 0.0 narrow) and the rule widths 0.6/1.0 the arcs are:
#     narrow -> narrow   0.6/2 - 0.0  = 0.30 m   (demands 17.6 deg)
#     anything -> wide   1.0/2 - 0.10 = 0.40 m   (demands 13.4 deg)
# Both are below 0.45, so lowering this only starts to matter below 0.40, and
# only for wide corners until it goes below 0.30.
#
# Do not "fix" a clearance problem by lowering this. Clearance is flat below the
# per-corner value, so a smaller radius buys nothing and costs lap length
# (dP/dr = 2*pi - 8, so a WIDER arc is a SHORTER lap). Measured: dropping this to
# 0.30 globally cost +5.8 s across 24 scenarios and changed no verdict.
#
# Lowering it IS the lever for sharper corners, and the only one -- the bias
# cannot do it, since reducing the bias widens the arc. That trade is lap time
# for steering angle, priced by the dP/dr above.
#
# Must exceed the Ackermann minimum turning radius (~0.034m: WHEELBASE=0.19m /
# tan(MAX_STEERING_ANGLE=1.2252rad), reduced further by counter-phase steering).
arc_radius = 0.45

# Size every corner arc as if BOTH corridors were WIDE, ignoring the width
# belief. OPEN-CHALLENGE-ONLY IN EFFECT without needing a gate: every Obstacles
# corridor is 1.0 m by rule, so there the substitution is the IDENTITY and the
# radius is unchanged (verified 2026-08-30 at both OBSTACLES_CENTER_BIAS_M and
# WIDE_CENTER_BIAS_M). An Obstacles A/B on this returns byte-identical arms by
# construction. Written here with its shipped value rather than left to the
# model default, so the value the robot drives is readable in one place.
corner_arc_assume_wide = true

# Distance below which consecutive generated waypoints are treated as duplicates.
dedupe_distance_m = 0.001

# How far (m) to shift corridor centreline waypoints off centre, and toward
# which boundary. Split so a side can be A/B'd without touching the distance.
#
# The path is a loop around the inner block, so each centimetre nearer it comes
# off all four sides: 8 cm of lap per cm of bias. Measured inward vs outward at
# 0.05, the inward path finished 24/24 against 21/24 and was faster on all 21
# comparable scenarios (+18.2 s mean for outward).
#
# Raised 0.05 -> 0.10 once the per-corner arc radius landed. Before that the
# corner was a hidden bottleneck: at 0.10 with a flat 0.45 arc, clearance to the
# inner block corner was exactly 0.000 m while the straight still showed 10 cm
# spare, so the ceiling was invisible in this file. With per-corner arcs the
# corner margin equals the straight margin at every bias -- a single budget,
# 0.203 - center_bias_m -- and this is a plain trade of margin for lap time.
# Measured at 0.10: 24/24 ok, -5.5 s mean over 24 scenarios, 23 of 24 faster.
#
# 0.103 m of margin is what remains here. Hardware crosstrack was last measured
# at 0.16 m median, so this is NOT margin to spend freely: it is already below
# the tracking error, and the only reason to go further would be a measurement
# of real crosstrack against this geometry.
# Applies to WIDE corridors only, i.e. those above narrow_width_threshold_m.
# Named wide_ rather than left bare when the narrow/wide split landed
# 2026-08-29: a bare center_bias_m reads as "the" bias and would have kept
# reading that way after the split, hiding a behaviour change behind a name.
wide_center_bias_m = 0.10

# Which boundary wide_center_bias_m shifts the path toward.
wide_center_bias_side = "inner"

# The same, for narrow_center_bias_m. Split from the wide side 2026-08-29
# alongside the magnitudes: a shared side can only say "narrow hugs the same
# boundary, less far", and the measurement points the other way. Narrow
# corridors are where the INNER block binds -- run_20260829_020308 measured a
# median 0.113 m to the inner wall against 0.435 m outer -- so the useful
# direction to tune narrow is "outer", which a shared inner side can only
# reach by passing through zero.
# Inert while narrow_center_bias_m is 0.0; here so that trade needs a config
# edit, not a code change.
narrow_center_bias_side = "inner"

# The same shift for NARROW corridors (at or below narrow_width_threshold_m).
# 0.0 plans them down the true centreline.
#
# Split from wide_center_bias_m 2026-08-29. The same absolute shift costs a much
# larger FRACTION of a 0.6 m corridor than of a 1.0 m one, so one value has to
# be safe narrow and therefore gives up lap time wide. The comment above named
# the condition for revisiting it -- "a measurement of real crosstrack against
# this geometry" -- and run_20260829_020308 supplied it: over 3 hardware laps
# the narrowest quartile ran a median 0.113 m and p05 0.069 m from the INNER
# wall against 0.435 m from the outer. That is ~0.17 m off centre where 0.10 m
# was planned: tracking error ADDS to the commanded bias instead of averaging
# out, so the narrow corridor was spending margin twice.
#
# Read this together with arc_radius above: corner_arc_radius is
# max(W_entry, W_exit)/2 - center_bias, so dropping the narrow bias to 0
# WIDENS the narrow-to-narrow arc (0.20 -> 0.30 m) and makes that corner
# demand LESS steering (25.4 -> 17.6 deg at L_eff=0.095). Separation and
# corner sharpness are the same knob pulling opposite ways; a sharper corner
# needs the radius pushed below the clearance-preserving max, which is a
# different change and costs lap length.
narrow_center_bias_m = 0.0

# Inner bias for a narrow corridor still on the PRIOR rather than a measurement.
# 0.0 = inert, i.e. an unconfirmed corridor takes narrow_center_bias_m as before.
#
# The ceiling is CLEARANCE, and 0.05 is not known to be the optimum. Measured:
# 0.15 LOSES 16 cases on balanced128 (18 worse, 2 better), almost all
# ok -> incomplete -- it leaves a corridor that really is narrow only 0.053 m of
# inner margin against ~0.07 m of measured inward tracking drift, so the chassis
# is pressed toward the inner block and dithers.
#
# This bias does NOT touch the corner arc: calculate_waypoints passes
# corner_arc_radius the CONFIRMED bias, so the arc is invariant to this field.
# 0.10 is untested -- it was skipped on a mistaken arc-coupling argument, not on
# evidence, and the dose-response is still climbing at 0.05.
#
# A blind round starts believing every corridor narrow, and both hypotheses share
# the fixed OUTER wall, so the whole width error becomes a lateral shift of the
# planned line: believed-narrow plans at MAX-0.30, confirmed-wide at MAX-0.60,
# and the belief update moves it 0.30 m in ONE tick. Measured across six hardware
# runs (see replan_blend_ticks) and reported from the driver's seat 2026-08-31 as
# a decaying zigzag on wide corridors during lap 1 only.
#
# Pre-positioning inward shrinks that step to 0.30 - value. It cannot be
# cancelled: the narrow bias budget is width/2 - RobotSpecs.WIDTH/2 = 0.203 m.
# Separate from narrow_center_bias_m because that value is 0.0 on evidence
# (run_20260829_020308: median 0.113 m to the inner wall, tracking error adds to
# the commanded bias) -- this spends that margin ONLY while the corridor might
# not be narrow at all, and hands it back the moment the width resolves.
#
# Measured 2026-08-31 over the FULL 640-case Open space: 618 -> 631 ok,
# collisions 1 -> 0, incompletes 21 -> 9, sim time -12.80 s mean (555 of 610
# cases faster). 21 fixed against 8 regressed. Every gain and every residual
# failure is in a MIXED-width layout; uniform ones (nnnn, wwww) do not move at
# all, which is the fingerprint of a width-belief step rather than a general
# handling change. SIM ONLY -- not track-validated, and the simulator weaves
# 1.6-3.3x more than hardware, so expect the magnitude to shrink on track.
#
# Do not RAISE without re-reading the arc coupling above.
unconfirmed_width_inner_bias_m = 0.05

# Hold a width change back until the robot has LEFT the corridor it describes.
# OPEN-CHALLENGE-ONLY by construction rather than by this flag: both callers
# build the gate only for Open (None otherwise, which keeps the pre-gate control
# flow byte-for-byte). On Obstacles the estimator is fixed=True and the bias
# comes from OBSTACLES_CENTER_BIAS_M, so the gate's confirmed-ness trigger would
# rebuild an identical path and re-seek the waypoint index for nothing.
#
# The replan step is not inherent to replanning, only to replanning UNDERNEATH
# the chassis: a width update for the corridor the robot is standing in moves
# the line it is actively tracking. Width and confirmed-ness are gated as ONE
# unit -- a genuinely narrow corridor confirms at its prior value, so the width
# does not move, but dropping unconfirmed_width_inner_bias_m above still shifts
# the line 0.05 m.
#
# Measured over the full 640-case Open space 2026-08-31: 634 -> 638 ok, failures
# 6 -> 2, no collisions in either arm, sim time -4.74 s mean (497 of 633 cases
# faster). 5 fixed against 1 regressed, no width bucket worse. It also closes the
# case cluster {38, 64, 71, 207, 264, 368, 407, 426} that flipped as a unit under
# every previous attempt on this step -- shrinking it
# (unconfirmed_width_inner_bias_m) or fading it (replan_blend_ticks) traded those
# cases against each other, while removing it passes all eight.
defer_current_corridor_replan = true

# Corridor width (m) at or below which narrow_center_bias_m applies. Midway
# between the rule widths CorridorDimensions.NARROW (0.6) and .WIDE (1.0), so
# both classify with maximum room for width-estimation error either side. A
# threshold and not an interpolation: the rules only present those two widths,
# so interpolating would invent behaviour for widths the track cannot have.
narrow_width_threshold_m = 0.8

# Number of intermediate sample points per corner arc.
num_intermediate_arc_points = 3

# Number of evenly spaced waypoints generated along a straight corridor segment.
straight_waypoint_count = 8

# Distance within which CoreNavigator's own main loop counts a waypoint as
# reached. Deliberately different from CONTROLLER_REACHED_DISTANCE_M below --
# the two serve different layers, not a single duplicated concept.
main_loop_reached_distance_m = 0.20

# Distance within which WaypointController's own internal pure-pursuit logic
# counts a waypoint as reached.
controller_reached_distance_m = 0.01

# How far short of the finish line the robot drops to slow_mps on its LAST lap.
#
# Scoring rule 1.3 pays 3 points for "stopped in the finish section after three
# laps". A section straight is only 1 m long (corridor_for_position splits on
# CORNER_MIN/MAX = 1.0/2.0) and start_pose puts the line at its along-track
# CENTRE, so the entire budget past the line is 0.50 m before the robot is in
# the corner and out of the section.
#
# The robot used to hold whatever speed it had until the crossing registered and
# then command zero, which is not a stop but the START of one: the drivetrain
# decays with speed_response_tau_s = 0.35 s, so a 0.50 m/s Open ladder coasts
# ~0.175 m. That fits. What did not fit is the ~0.6 m the 2026-09-01 bags
# actually show between the start square and the resting place, which lands past
# the boundary -- forfeiting the 3 points while appearing to finish cleanly.
#
# Slowing to the shipped slow_mps (0.26) cuts the coast to ~0.09 m. The value
# here only needs to cover the decay from fast to slow: ~0.23 s at tau, ~0.13 m
# of travel, so 0.40 m is roughly triple the required runway and still well
# inside the 0.50 m the straight offers before the line.
finish_approach_m = 0.40

# When CoreNavigator.replace_path is given the robot's current heading,
# candidate waypoints within this much of the nearest one's distance are
# re-ranked by heading agreement instead of taking the nearest purely by
# position -- near a corner several waypoints can sit at almost the same
# distance while pointing in very different directions. Measured on real
# hardware: picking purely by position handed pursuit a ~193 deg correction
# where finishing the corner only needed ~90 deg, right after a blind round's
# direction inference committed.
replan_heading_tie_margin_m = 0.15

# Written out 2026-09-05
#
# All six existed only as Python literals, so no edit to this file could reach
# them. Shipped values, so naming them changed nothing.

# Inward bias applied to the Obstacles Challenge's planned path, in metres.
# The Open Challenge passes None here instead and uses its own clearance-driven
# bias, so this key is Obstacles-only.
obstacles_center_bias_m = 0.15

# Corner caution: slow the approach to a corner. Restricted to the FIRST lap,
# where the layout belief is still forming; all_laps applies it for the whole
# round, narrow_only restricts it to corridors believed narrow.
first_lap_corner_caution = true
corner_caution_all_laps = false
first_lap_corner_caution_narrow_only = false

# Advance the waypoint index past one already passed. Off: measured to stall
# the index at corners.
advance_past_passed_waypoint = false

# Ticks over which a replaced path is blended into the old one. 0 = hard
# switch. REFUTED twice (2026-08-31) as a fix for anything -- kept
# configurable, not kept as a lever.
replan_blend_ticks = 0

# Written out 2026-09-10 at its shipped value: until then it existed only as a
# Python literal, so no edit here could reach it (pytest's shipped-tree
# completeness check now requires every concrete default to appear in this
# file).
forward_only_reseek = false

