[pytest]
# The RoboStack ROS2 packages ship pytest plugins (launch_testing, launch_ros)
# whose hookspecs are incompatible with pytest >=8, which aborts collection.
# This project's tests use plain pytest + mocks, so disable those plugins.
# -n 8+ crashes native xdist workers on Windows (rclpy context teardown);
# -n 6 --dist loadscope is the highest count confirmed to complete full runs.
addopts =
    -p no:launch_testing
    -p no:launch_ros
    -n 6
    --dist loadscope
testpaths = tests
markers =
    hardware: tests that require physical Raspberry Pi hardware/peripherals
    slow: full closed-loop simulation tests that take multiple seconds per case
