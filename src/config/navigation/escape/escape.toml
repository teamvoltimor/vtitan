#:schema ../../../model/navigation/escape/escape.schema.json
# Escape maneuver parameters (K-turn, slalom, side correction).
# Rationale: adr:0050-escape-steering-degrees-and-committed-side, adr:0055-escape-maneuver-selection, adr:0088-refuted-config-knobs, adr:0092-escape-does-not-retire-committed-sign

pose_trail_min_step_m = 0.01
pose_trail_len = 128
rev_speed = -0.20
rev_steer_deg = 44.0
k_turn_min_s = 0.54
k_turn_max_s = 1.08
k_turn_fit_rear_gap = false
obstacles_k_turn_fit_rear_gap = true
k_turn_tail_clearance_m = 0.0
# ON for Obstacles since 2026-09-16: in the corpus 5 of 6 pillar pushes accrued IN REVERSE,
# the locked K-turn (fired by the WALL ahead) backing the tail into the pillar the chassis
# was passing, 0.15-0.20 m beside the rear flank inside the LIDAR's rear occlusion band.
# Lateral reach beyond the flank of the strip the tail sweeps; the strip runs back by the
# manoeuvre's own reverse distance. 0.08-0.15 give the same verdict on the 9 moving scenarios.
obstacles_k_turn_tail_clearance_m = 0.10
slalom_reverse_s = 0.40
slalom_forward_s = 0.50
stuck_move_threshold = 0.03
stuck_timeout_s = 2.0
side_correction_steer_deg = 16.5
side_correction_speed = 0.1
side_correction_s = 0.20
side_correction_blends = false
tick_router_during_maneuver = false
escalate_after_attempts = 3
escalate_doubles_duration = true
# Measured 2026-09-16 and left ON: turning the doubling off is INERT on the corpus (13 failures,
# identical set) and on hardware the escalation count rarely reaches the threshold at all
# (0% inside the wedges, see adr:0055). The knob stays so the next round can flip it with a
# one-line change, but nothing measured yet earns it.
obstacles_escalate_doubles_duration = true

# The dwell gate. OFF (0.0) until a hardware round backs it: it is measured on recorded
# runs, not simulated ones, because the corpus has no wedge to gate. It switches the
# committed side only -- it deliberately does NOT double the duration the way
# escalate_after_attempts does, since the windows it fires in are already 56-95% k_turn
# ticks and the k_turn still turns against the plan 57% of the time. See the schema.
setup_reverse_room_m = 0.0
# REFUTED 2026-09-16, ships OFF. Backing straight until the front gap reaches 0.35 m (2 legs)
# does buy the room (0.08 -> 0.35 m measured), and the planner then re-approaches with the pillar
# 35 deg off the nose at 0.3 m and dies the same way: corpus 13 -> 15 (breaks 0006, 0012);
# 0.30 m breaks 0004 and 0012; 0.40 m x3 legs breaks 0004, 0006, 0012. The room is not the
# missing piece; the re-approach target is. See adr:0055.
obstacles_setup_reverse_room_m = 0.0
setup_reverse_legs = 2
escape_dwell_seconds = 0.0
escape_dwell_radius_m = 0.30
escape_dwell_cooldown_s = 10.0
escape_dwell_max_per_place = 3
escape_side_commit_attempts = 2
max_escape_s = 1.8
stuck_confirmation_checks = 3
stuck_escalation_per_attempt_s = 0.10
stuck_history_floor_s = 3.0
min_history_for_distance = 2
escape_mirrors_reverse = false
obstacles_escape_mirrors_reverse = true
escape_side_follows_committed_sign = false
obstacles_escape_side_follows_committed_sign = true
escape_side_override_min_clearance_m = 0.12
side_correction_follows_committed_sign = false
# ON since 2026-09-16: corpus 22 -> 14, nothing broken, and the refusal would fire on
# 24.4% of the 213 real side-correction episodes of the 2026-09-15 rounds. The BASE key
# above stays off and is INERT on Obstacles anyway -- this value shadows it. See the schema.
obstacles_side_correction_follows_committed_sign = true
escape_retires_committed_sign = false
