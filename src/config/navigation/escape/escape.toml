#:schema ../../../model/navigation/escape/escape.schema.json
# Escape maneuver parameters for collision recovery (K-turn, slalom, side
# correction).
#
# See shared.config.navigation_tuning.EscapeManeuverParams.

# Pose trail followed by a retrace-reverse: ground the chassis occupied a
# moment ago is known free without any rear-facing sensor, which is the only
# reason reversing blind is safe at all. Module constants in core_navigator
# until 2026-08-22.
#
# The spacing is a distance-per-TICK threshold, so it interacts with speed: at
# 0.156 m/s and 20 Hz the chassis advances ~0.008 m per tick and a creeping
# robot's trail gets thinned as intended; at 0.234 m/s it advances ~0.012 m and
# nothing is thinned. Re-check this alongside any speed-profile change.
pose_trail_min_step_m = 0.01
pose_trail_len = 128          # ~1.3 m of travel at the spacing above

rev_speed = -0.20             # Reverse speed during escapes (m/s)

# Road-wheel steering angle held while reversing out, in DEGREES.
#
# Was rev_steering_scale = 0.8, a normalised fraction of full lock -- which
# named itself a scale while every call site used it as a magnitude
# (steering = value * side_sign), and which silently meant a different
# physical angle on every steering geometry: 44 deg at the bench-measured
# 55 deg limit, 68 deg on a 270 deg servo. 44.0 preserves the 55 deg
# behaviour exactly.
rev_steer_deg = 44.0
# Escape durations are in SECONDS, converted to control ticks at load by
# EscapeManeuverParams.frames(). They used to be frame counts, which silently
# mean a different duration at a different loop rate: 40 frames is 2 s at the
# shipped 20 Hz and 0.8 s at 50 Hz, so raising control_hz would have made the
# robot declare itself stuck 2.5x sooner and truncate every escape, with
# nothing raising and no value here edited. Each value below is the old frame
# count divided by 20, so behaviour at the shipped rate is unchanged.
k_turn_min_s = 0.54           # Minimum K-turn duration (OBSTACLE risk)
k_turn_max_s = 1.08           # Maximum K-turn duration (CRITICAL risk)

# Cap the reverse above by the rear room the LIDAR actually measures, instead
# of committing the full duration chosen from FRONT severity alone. At
# rev_speed 0.20 m/s those two durations are 10.8 cm and 21.6 cm of reverse,
# against a rear gap measured at p50 17 cm / p10 7 cm over 46 escape episodes
# (09-10 bags) -- the reverse did not fit in 35% of them, and the existing
# rear guard cannot see it because it only checks the gap at the START of the
# manoeuvre. A CEILING, not a replacement: a reverse that fits is untouched,
# and an unmeasured rear sector is left alone rather than capped to zero.
#
# Obstacles only. All of the evidence is Obstacles bags (the thing 7-17 cm
# behind the chassis is a pillar); Open escapes fire in corners against walls,
# where a shortened reverse under-rotates and re-triggers, feeding the corner
# escape loop that already costs ~20% of runs. Set k_turn_fit_rear_gap = true
# to extend it to Open -- unmeasured there.
k_turn_fit_rear_gap = false
obstacles_k_turn_fit_rear_gap = true
slalom_reverse_s = 0.40       # Time spent reversing during slalom
slalom_forward_s = 0.50       # Time spent forward-turning during slalom
stuck_move_threshold = 0.03   # Distance threshold (m) to detect stuck
stuck_timeout_s = 2.0         # Time without movement before "stuck"
# Road-wheel steering angle for a side-threat correction, in DEGREES.
# Was side_correction_steer = 0.3 normalised; 16.5 deg is that value at the
# 55 deg road-wheel limit it was tuned against.
side_correction_steer_deg = 16.5
side_correction_speed = 0.1   # Forward speed during a side-threat correction
side_correction_s = 0.20      # Duration of a side-threat correction
# Let a FORWARD side correction bias the planned steering instead of replacing
# it. A latched manoeuvre makes the navigator return before the planner runs,
# so the router's deformation is not merely overridden, it is never computed:
# measured 2026-09-11, the manoeuvre supplied 100% of the commanded steering
# while steer_target went unpublished on 92-93% of those ticks, and the two
# layers alternated at 2.7-4.4x absolute-over-signed wheel travel.
# side_correction dominates those windows 184/198 ticks against the k-turn's 22.
# Scoped to the forward nudge: a k-turn, a stuck reverse, or a side correction
# already reversing off a wall all still own the chassis outright. SHIPS OFF --
# summing two steering signals can saturate the wheel. REFUTED and left off:
# the scoping is what makes it inert -- practically every side correction on
# hardware is the already-touching REVERSE branch, which this excludes. The
# forward nudge it qualifies is 44/12/0/0 ticks (0.8/0.3/0.0/0.0%) against
# 550/572/143/88 reversing, over the four 2026-09-11 Obstacles rounds.
side_correction_blends = false

# Keep FEEDING the sign router while a maneuver holds the chassis. Not the same
# knob as side_correction_blends above: that one lets the planner STEER during a
# correction and is refuted; this one only keeps the map current and discards
# the deformed waypoint, so it cannot move the wheel.
#
# What it addresses: step() returns early for a latched maneuver, so the router
# call -- which owns the blind discovery ingest, engage/pass bookkeeping and
# routed_sign_positions, the list the escape mask itself reads -- does not run
# at all for the maneuver's duration. Measured 2026-09-12 over three hardware
# rounds: 183 episodes, 22.3% of all ticks (150 s of 686 s), and 179 of 183
# (97.8%) hold a CONSTANT steering value, up to 44 ticks / 2.2 s. For a quarter
# of the race the wheel is open-loop AND the sign map takes in nothing.
#
# SHIPS OFF AND UNVALIDATED. Track access was lost before it could be run, and
# the sim cannot stand in for this class -- it exercises side_correction on
# 1.09% of ticks against hardware's 19-25%. Validate by re-running
# scripts/bag/diag_bag_planner_silence.py and scripts/bag/diag_bag_pass_side.py
# with the three 2026-09-12 rounds as the control arm.
tick_router_during_maneuver = false

escalate_after_attempts = 3   # Consecutive escapes before escalating (longer duration, opposite side)
escape_side_commit_attempts = 2  # Attempts spent on one side before trying the other (1 = alternate every attempt, which cancels itself out)
max_escape_s = 1.8            # Hard cap on any single escalated escape duration
stuck_confirmation_checks = 3            # Consecutive below-threshold checks before declaring "stuck"
stuck_escalation_per_attempt_s = 0.10    # Time added to a stuck-reverse duration per repeated attempt
stuck_history_floor_s = 3.0              # Minimum position history kept, even when timeout*2 is smaller

# Written out 2026-09-05; existed only as a Python literal, so no edit to this
# file could reach it. Shipped value, so naming it changed nothing.
min_history_for_distance = 2             # Position samples needed before recent-movement distance is trusted

# Steer the OPPOSITE way on an escape's reverse leg, so the forward and reverse
# arcs curve opposite ways and rotation accumulates instead of cancelling.
# Measured 2026-09-11: 208 of 243 forward/reverse leg pairs (85.6%) hold the
# SAME sign today, which is the bay pendulum outside the bay.
#
# FALSE shared, TRUE for Obstacles -- same split as k_turn_fit_rear_gap above,
# and for the same reason: the measurement is entirely from Obstacles bags
# (the thing being rocked against is a pillar), while Open escapes in corners
# against walls and sits at 638/640. The sim cannot screen either side; the
# first hardware round with this on IS the A/B.
escape_mirrors_reverse = false
obstacles_escape_mirrors_reverse = true

# Steer a K-turn toward the side the ROUTER committed to passing on, instead of
# toward whichever +-45 deg side sector reads further away.
#
# The two answer different questions -- "which wall is nearer" against "which
# side of the PILLAR must I pass" -- and they agree 56% of the time, 48-49% in
# a corner. MEASURED over 194 hardware escape episodes with a sign committed,
# 2026-09-12: when the steering agrees with the router the escape nets +0.050 m
# toward the pass and improves 87% of episodes; when it opposes, -0.017 m and
# 16%. So half the time the escape SPENDS the placement the plan bought.
#
# REFUTED, do not re-try: that this is a near-tie the LIDAR cannot resolve. 18
# of 37 opposing escapes were decided on a margin of 0.20 m or more.
#
# ON for Obstacles since 2026-09-14, decided on the OPERATOR'S cost function
# rather than on an A/B: a wrong-side pass ENDS THE ROUND, so an escape that
# clears the pillar but leaves the robot on the wrong side has bought nothing.
# That reclassifies the opposing escapes from a time cost into a round-ender.
# Re-measured on the nine 2026-09-13/14 bags with diag_bag_escape_intent: the
# K-turn steers OPPOSITE the plan's own intent in 73 of 128 episodes (57%),
# against 51 of 239 (21%) for side_correction and 0 of 20 for stuck_reverse.
# The K-turn is also 88% of hardware manoeuvre time, so this is the manoeuvre
# that decides which side the robot comes out on.
#
# The shared flag stays off: the Open Challenge has no committed sign, so it is
# inert there anyway.
#
# The simulator still cannot screen this (there the sign map is exact and the
# disagreement collapses to nothing), so the first hardware round IS the A/B.
escape_side_follows_committed_sign = false
obstacles_escape_side_follows_committed_sign = true

# Clearance the router's side must ALREADY have before it may be forced.
# Not optional alongside the flag above: forcing a side in a 1.00 m corridor
# with no floor drives the chassis into the wall the LIDAR was right about.
#
# ABSOLUTE, not a margin between sides. A relative band wide enough to catch
# the problem (0.20 m) also overrules 22 of the 49 episodes that choose
# correctly today; the sensitivity table sits at a ratio of 1.00 or worse from
# 0.05 m upward. An absolute floor only engages when the wanted side is
# physically shut. 0.12 is a shade over half the 0.194 m chassis width.
#
# OPEN QUESTION, and the operator's rule is what opens it. Below this floor the
# code falls through and takes the OTHER side, on the reasoning that a
# wrong-side pass is cheaper than driving into a wall. That reasoning is dead:
# the wrong-side pass ends the round, so it is not cheaper than anything.
#
# CORRECTED 2026-09-14, an earlier revision of this note was wrong: the third
# option is NOT `sign_router.retrace_escape`. That flag only substitutes the
# steering inside an already-decided 21.6 cm reverse leg (k_turn_max_s 1.08 at
# rev_speed -0.20); it has no decline semantics, arranges no second attempt,
# and does not extend the manoeuvre. It was MEASURED AND REJECTED in 6102224f:
# wall strikes 13 -> 7 but sign collisions 41 -> 53, "because backing straight
# out does not reposition the chassis and the forward re-approach repeats the
# line that just failed". (That measurement ran blind with the mask OFF, a
# configuration that does not ship, so it does not transfer cleanly here --
# but it is the evidence, NOT the 640-case Open sweep this file's sibling note
# in sign_router.toml cites, where retrace was inert for want of a sign.)
#
# The cheapest shape that is correct under the operator's rule is a straight
# reverse (steering = 0.0) instead of the fall-through: it neither topples the
# pillar nor displaces the chassis toward the wrong side, needs no new state,
# and survives _maybe_escalate unchanged (`abs(steering) * side if steering`
# keeps a zero-steer manoeuvre at zero). NOT done in the same round as the flag
# above, so the first hardware round can attribute what it sees.
escape_side_override_min_clearance_m = 0.12

# Let the router's committed pass side outrank "steer away from the threat" in
# a SIDE_CORRECTION, as escape_side_follows_committed_sign already does for the
# K-turn. See the schema for the hardware measurement that motivates it.
#
# SHIPS OFF, and the A/B is the reason rather than caution. THREE formulations
# now cost the same scenario on the obstacles corpus, 12 -> 15, fixing nothing:
#
#   steer TOWARD the wanted side when it holds 0.12 m   -> 12 -> 15
#   refuse, zero the steering, keep creeping FORWARD    -> 12 -> 15
#   refuse and actually REVERSE, for a K-turn duration  -> 12 -> 15
#
# The second was a bug rather than a formulation: it zeroed the steering while
# the branch kept side_correction_speed (+0.1 m/s, forward) unless the flank was
# already touching, so it deleted the steer-away and crept at the threat. That
# is fixed, and the third row is the manoeuvre this comment always described.
# It fails the same way, which is what makes "the steer-away is load-bearing"
# worth believing: two arms that behave very differently fail identically.
#
# Identical failure set all three times -- go_obstacles_0004[South/
# counterclockwise] on all three assertions, colliding at (2.05, 2.27), the
# north-east corner beside the green sign at (2.00, 2.40). Measured exactly:
# the arms differ on 0004 AND NOTHING ELSE, nothing is recovered anywhere.
#
# HOW MUCH EVIDENCE THAT IS, because it decides what to do next.
# scripts/sim/diag_side_correction_refusal_weight.py counts the ticks the rule
# actually changed:
#
#   0004  flag off -> 10 side corrections,  0 refusals, ok,       3/3, 144.3 s
#   0004  flag on  ->  6 side corrections,  6 REFUSALS, COLLIDED, 1/3,  71.0 s
#
# The whole 12 -> 15 rests on SIX manoeuvres in ONE scenario, in a simulator
# that runs side_correction on 1.09% of ticks against hardware's 19-25% and
# under-rotates 40-50% during escapes -- the exact regime. So "the mechanism
# fails" and "the corpus cannot adjudicate it" both fit this number, and the
# corpus cannot separate them.
#
# Kept wired, tested and off because the FAILURE IT TARGETS IS REAL and this
# corpus cannot see it: there is no pass-side assertion, so an arm can only
# ever measure this change's cost. On run_20260915_002408 the escape agreed
# with the router's side on 3 of 12 episodes, the alignment delta was negative
# in every category, and 10 of those 12 were SIDE_CORRECTION -- the branch that
# ignored the rule entirely until now. Settle it on a counter-clockwise
# hardware round, not here.
side_correction_follows_committed_sign = false
obstacles_side_correction_follows_committed_sign = false
