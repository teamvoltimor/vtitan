#:schema ../../../model/navigation/signs/sign_router.schema.json
# Traffic-sign avoidance routing parameters.
# Rationale: adr:0051-sign-lane-planner, adr:0058-sign-discovery-range-and-barrier-belief, adr:0063-corridor-flip-and-sense-guards, adr:0064-corridor-by-depth-and-clearance-budget, adr:0088-refuted-config-knobs

sign_clearance_margin_m = 0.10
wall_clearance_margin_m = 0.04
activation_dist_m = 1.40
passed_dist_m = 1.60
deform_depth_buffer_m = 0.5
detection_match_dist_m = 0.30
min_confidence = 0.25
settle_ticks = 150
slot_sign_map = true
slot_accept_radius_m = 0.30
slot_min_evidence = 0.75
slot_repoint_margin = 1.5
# OFF, measured 2026-09-16: the WRO table never pairs depth 1.5 with 1.0 or 2.0, yet on the
# 09-14/15 rounds 27% of commits happened with beliefs at adjacent depths in the window ahead,
# and the crossing passes made against such a pair failed 62%. Treating the adjacent row as the
# same pillar (heaviest wins, no margin) scores corpus 13 -> 12 (fixes the knife-edge 0005) but
# does not move the replayed pass verdicts on the 19 bags (execution 28/180 against 23/163) and
# 11 of the 13 near-opposite pairs survive it, so the pairs are not adjacent-cell twins alone.
slot_exclusive_adjacent_depths = false
escape_mask_radius_m = 0.12
escape_mask_cluster_assoc_m = 0.35
escape_mask_chassis_margin_m = 0.01
commit_hysteresis = true
corridor_flip_ticks = 1
sign_aware_speed = true
# OFF, measured 2026-09-16: on the 09-14/15 rounds the router commits at p50 0.54 m (p10 0.33)
# and within the passes that must CROSS the failure rate is 61% under 0.40 m against 4% past
# 0.55, so the cap fits the turn radius (a speed curve) to the run-up left. Refuted: corpus
# 13 -> 18 (fixes 5, breaks 10), and on the bags it would bind on 47% of committed ticks, 92%
# of them ON the floor, costing 21% of driving time (~30 s a round). Even the most lenient
# calibration (cross the sign's line only, run-up from the centre) costs 6.7% with 73% at the
# floor: once the commit is late the geometry asks for a crawl, not a fit.
sign_commit_fit_speed = false
sign_commit_fit_floor_mps = 0.10
# OFF, under measurement 2026-09-17: when the committed crossing's arc does not fit the run-up
# left at the fit speed, back straight (legs of k_turn_min_s per committed sign) before driving on.
sign_crossing_reverse_legs = 0
sign_crossing_reverse_fit_mps = 0.117
sign_lane_planner = true
sign_lane_offset_frac = 1.0
sign_lane_ramp_m = 0.9
sign_lane_hold_m = 0.25
sign_lane_gap_centre_frac = 1.0
sign_lane_commit_ahead_m = 0.0
sign_lane_corner_entry_m = 0.5
sign_lane_suppress_deform = true
# REFUTED 2026-09-17, stays OFF -- and its ALIBI is refuted too. Over 129 bags the deform's target
# was on the legal side of a failed crossing 47.3% of the time against the lane's 37.4% (chi2 17.0,
# p=4e-5), and the stated reason for never measuring it was that the sim's sign map is exact, so
# the branch "barely fires". It fires: corpus 13 -> 17 at 0.13 and 13 -> 31 at 0.28, monotone in
# the magnitude, and 13 -> 24 combined with tick_router_during_maneuver (worse than either alone).
sign_lane_deform_fallback_m = 0.0
sign_deform_sense_guard = false
sign_lane_relabel_unsatisfiable = true
sign_lane_skip_unsatisfiable = false
sign_lane_depth_consistent_corridor = true
sign_lane_split_overlap = false
depth_pin = true
pin_corner_guard = true
pin_heading_guard = true
pin_heading_guard_deg = 35.0
sign_deform_speed_threshold_m = 0.02
explore_lap_speed_frac = 1.0
retrace_escape = false
retrace_dist_m = 0.25
retrace_steer_gain_deg = 55.0
sign_contact_evade = false
sign_contact_dist_m = 0.6
sign_contact_steer_deg = 19.25
sign_aware_lookahead = true
sign_lidar_align = false
stale_target_rescue = false
sign_lidar_align_min_m = 0.4
sign_lidar_align_max_m = 1.5
sign_lidar_align_fov_deg = 45.0
sign_lidar_align_depth_m = 0.08
sign_lidar_align_max_width_m = 0.15
sign_lidar_align_deadband_deg = 8.0
sign_lidar_align_gain = 0.35
sign_lidar_align_max_steer = 0.15
sign_lidar_propose = false
pair_handoff_span_m = 0.30
