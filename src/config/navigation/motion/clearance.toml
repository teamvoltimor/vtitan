#:schema ../../../model/navigation/motion/clearance.schema.json
# LIDAR clearance thresholds for speed control (meters).
#
# Zones around the robot where speed is controlled based on obstacle
# proximity. See shared.config.navigation_tuning.ClearanceZones.
#
# Loaded via NavigationTuning.load_from_toml_dir(). Regenerate nothing --
# this file IS the source of truth; edit it directly and restart the
# navigator (or re-run tests) to pick up changes.

contact_dist = 0.10    # Robot creeps forward (< this) -- immediate danger
slow_dist = 0.25       # Reduced speed zone
medium_dist = 0.50     # Normal speed zone
fast_dist = 1.00       # Full speed capability (> this)
path_margin = 0.10     # Extra clearance beyond chassis half-width still counted as "in the forward path"
# Back off when the chassis has closed to contact_dist, instead of creeping
# forward into it. ~0.4 s / 25 mm at creep, with a cooldown that only counts
# down while CLEAR so the pair cannot oscillate against the same obstacle.
#
# SHIPS DISABLED (0), and the trail gate did not rescue it. Three back-to-back
# passes over the 256 corpus, 2026-09-06, differing only in this value and the
# gate:
#
#                  off(0)   ungated(8)   trail-gated(8)
#   in-time         149        150           150
#   laps>=3         150        151           151
#   stuck            26         15            24
#   collisions        8         13            11
#     of which wall   4         10             9
#   timeouts         65         70            66
#   rev-run           5          4             2
#
# Gating gave back the timeouts and most of the extra collisions, and gave back
# the stall benefit with them -- the trail rarely confirms 6.1 cm of covered
# ground at the moment the chassis is against something, which is precisely
# when it has stopped moving and stopped laying trail. What survives is +5 wall
# contacts against a FLAT headline, so the behaviour is not earned in either
# form. The code stays, measured and documented; the value stays 0.
#
# The hardware case it was written for (run_20260906_121254: ten seconds of
# +0.152 m/s against a green pillar) is real and still unaddressed -- but the
# sim says a blind reverse is not the answer, and this mount has no rear
# sensing to make a seeing one.
contact_reverse_ticks = 0
contact_reverse_cooldown_ticks = 20

# Obstacles-Challenge contact zone. Resolved by
# ClearanceZones.for_obstacles_challenge(), which CoreNavigator calls once at
# construction; Open keeps contact_dist above. There is deliberately no
# open_contact_dist -- nothing measured wants Open to differ, and an unset knob
# nothing has ever moved reads as tuning that exists.
#
# Why the zone is per-challenge at all: this threshold fires the reversing
# escape (assess_risk returns CRITICAL below it), and the two challenges
# present different things to escape FROM. A wall 0.10 m ahead in Open is a
# genuine emergency. Obstacles additionally has signs the router deliberately
# routes PAST at ~0.175 m from their surface, so 0.10 fires on geometry the
# planner chose on purpose -- the robot escapes from clearances it was aimed
# at. Measured 2026-08-31 on subset128: ~180 escapes per run while colliding
# with a sign only 4-5 times in 128 runs.
#
# Worth, on the full 256 corpus (2026-09-01, raw in
# src/.corpus/contactdist_256_fixed.txt):
#
#   laps>=3      11 -> 82        timeouts   126 -> 48
#   laps >=1     41 -> 136       stuck       19 -> 10
#   in-time       3 -> 52        escapes/lap 685 -> 44
#   sign collisions/lap 0.132 -> 0.009
#
# Wall collisions stay FLAT at 17, which is the check that the extra laps are
# not bought by driving harder at walls. Pass-side goes 82 -> 122, but that is
# an artefact of survival: it is counted per run, and the 0.10 arm dies early
# enough to drive only 68 laps against 434, so it never reaches enough signs to
# misroute. Per lap it moves the other way.
#
# Verify on 256, never a subset. This exact plumbing check PASSED on 16
# fixtures and on 128 scenarios and FAILED at 256 -- the escape gates never
# bound in the smaller sets.
#
# *** NOT HARDWARE-VALIDATED. THE STOPPING-DISTANCE BENCH IS STILL UNRUN. ***
#
# bumper_gap_ahead already removes the 12.2 cm LIDAR mount offset, so the gate
# compares a CHASSIS-to-obstacle distance: at 0.05 the robot drives normally
# until its bumper is 5 cm out, then declares CRITICAL and reverses. Nobody has
# measured how far the chassis travels between that tick and standstill --
# LIDAR scan period, nav tick, PID response, mechanical deceleration. If that
# chain exceeds 5 cm at Obstacles cruise, this value generates the collisions
# it was meant to prevent, and the sim CANNOT say otherwise: contact there is
# absorbing, so a run ends before the robot can be wedged.
#
# Run docs/internal/algorithms/hardware-bench-procedure.md Session A before any
# Obstacles track run, and revert this line to 0.10 if A3's decision rule says
# so. Its preflight matters: verify reverse on blocks FIRST -- nav commands
# reverse, this whole mechanism IS a reverse, and reverse has never been
# observed on hardware.
# 0.04 only works PAIRED with min_valid_range_m = 0.044. Alone it is a
# threshold the guard can never observe -- the sector filter discarded
# everything below 0.05 -- which measured +3 collisions on Go sighted. With the
# floor reading valid the threshold becomes actionable and collisions FALL.
#
# HARDWARE CAUTION: 0.04 sits 5 mm below the C1's rated minimum, where a real
# sensor is least trustworthy. The sim clips cleanly at 0.045 and cannot model
# that, so bench the sensor at close range before racing on that value.
#
# SET TO 0.07 ON 2026-09-14 (operator's call), replacing the 0.10 set earlier
# the same day. 0.10 was chosen when the only corpus evidence came from a sim
# whose LIDAR was unrealistically clean; ced51207 fixed that model and the
# picture inverted. Measured the same day, all cells at ced51207 on the
# 82-scenario file, with REAL_SENSOR_ERRORS injected (5 cm start error,
# 0.03 rad yaw bias, BNO085 drift) so the pose is not idealised:
#
#   contact_dist 0.04 ->  9 failed      0.06 -> 15 failed
#   contact_dist 0.05 -> 12 failed      0.07 -> 15 failed
#                                       0.10 -> 28 failed
#
# Monotonic: there is no sim-supported compromise, the corpus simply prefers
# smaller. 0.07 is deliberately NOT the corpus optimum. It takes most of the
# K-turn reduction (79% of latches -> 20%, table below) while keeping 7 cm of
# stopping room rather than 4 cm, because the corpus CANNOT price the risk that
# a smaller value creates: contact in the sim is absorbing, so a run ends before
# a chassis that failed to stop can be wedged. The sim is blind to exactly the
# failure a too-small value causes.
#
# REFUTED the same day, so it is not a reason to prefer 0.10: the "narrow
# observable window" argument. contact_dist is a BUMPER GAP, not a raw range
# (gap = range - LIDAR_TO_FRONT_BUMPER = range - 0.0278), so 0.04 fires on a
# 6.8 cm return, well above the C1's 4.5 cm floor. The live window is
# (min_valid_range_m, contact_dist + 0.0278], 24 mm wide at 0.04 against 84 mm
# at 0.10 -- but measured over 18 bags / 27,271 forward scans / 4.9M rays,
# ticks where something is genuinely inside the filter floor yet the trigger
# does NOT fire are 11 at 0.04 and 10 at 0.10. FLAT. The filter does not hide
# close obstacles from this gate, so sensing does not favour the larger value.
# See scripts/bag/diag_bag_front_trigger_window.py.
#
# ATTRIBUTION COST, accepted knowingly: the next round now carries BOTH this
# change and obstacles_escape_side_follows_committed_sign, so a regression
# cannot be attributed to one of them without a third round.
#
# Until 1a6a46c3 this whole override never reached the navigator -- the first
# Obstacles race of every process resolved its clearance zones as OPEN and kept
# them (see that commit). So every hardware round to date ran contact_dist =
# 0.10, and 0.04 has never been observed on track. Fixing the plumbing silently
# promoted it from dead config to the live emergency-escape threshold.
#
# Priced on the nine 2026-09-13/14 rounds, 141 K-turn latches, by their
# forward_clearance_m at the latch:
#
#   contact_dist 0.10 -> 112 of 141 fire (79%)   <- what those rounds ran
#   contact_dist 0.07 ->  28 of 141 (20%)
#   contact_dist 0.04 ->  20 of 141 (14%)
#
# So 0.04 removes 86% of K-turns and 0.07 removes 75% of them. That is the
# point of moving off 0.10 -- the K-turn steers against the plan in 57% of
# episodes, so triggering it more often does not buy safety. The cost is
# reaction distance to WALLS and to not-yet-mapped pillars, 10 cm -> 7 cm (a
# COMMITTED pillar is masked out of this trigger, so it is not what this knob
# protects).
#
# Cross-checked against the same bags per TICK rather than per latch, over the
# forward threat cone: the front gate fires on 15.1% of forward ticks at 0.10,
# 11.3% at 0.07, 3.4% at 0.04.
#
# STILL UNRUN, and it is the only thing that can settle this: Session A's
# stopping-distance bench. Nobody has measured how far the chassis travels
# between the CRITICAL tick and standstill at Obstacles cruise. If that chain
# exceeds the value here, this threshold generates the collisions it exists to
# prevent -- and per the note above, the sim cannot say so. If the bench shows
# standstill well inside 4 cm, take the corpus optimum and go to 0.04. If it
# shows 6-8 cm, 0.10 was accidentally right and the trigger needs rethinking
# rather than retuning.
obstacles_contact_dist = 0.07

# Written out 2026-09-05
#
# Both existed only as Python literals, so no edit to this file could reach
# them. Shipped values, so naming them changed nothing.

# Select the forward lane from the BUMPER plane rather than from the LIDAR.
#
# ON since 2026-09-14. The old comment here claimed "the gates above already
# subtract the mount offset where they need to, and flipping this would
# double-apply it". That is wrong, and it kept a geometry bug alive: this flag
# moves the ALONG-TRACK selection threshold in _forward_path_selection
# (sectors.py), while bumper_gap_ahead subtracts the offset from the RADIAL
# range. Different axes, different roles, nothing is applied twice.
#
# What was actually happening. CRITICAL fires on `gap < contact_dist`, and
# gap = range - LIDAR_TO_FRONT_BUMPER, so only a return inside 0.128 m can ever
# trigger it. The lateral gate is `|range*sin(theta)| < path_half_width`, and
# path_half_width = WIDTH/2 + path_margin = 0.197 m. Since lateral <= range
# <= 0.128 < 0.197 by construction, THE LATERAL GATE CANNOT REJECT ANYTHING in
# the CRITICAL band. With this flag off, `ahead` was merely `along > 0`, so the
# whole test reduced to "any valid return within 12.8 cm anywhere in the
# forward half-plane" -- a bubble, not a lane.
#
# Measured on the nine 2026-09-13/14 rounds, 366 escape latches carrying a
# trigger ray, by |escape_trigger_angle_rad| (wrapped to [-pi, pi]):
#
#    0-15 deg   42 (11.5%)      45-60 deg   64 (17.5%)
#   15-30 deg   43 (11.7%)      60-75 deg   84 (23.0%)
#   30-45 deg   45 (12.3%)      75-90 deg   88 (24.0%)
#
# 47% of escapes fired on something more than 60 deg off the nose, i.e. abeam:
# the pillar the robot was in the middle of passing correctly. Only 11.5% were
# dead ahead. 98 of 366 (27%) sat at or BEHIND the front-bumper plane, which
# forward motion cannot reach at all -- those are the ones this flag removes.
#
# This does NOT fix the abeam 47%; a ray at 75 deg and 0.12 m still has
# along = 0.031 > 0.0278 and survives. The full fix is a steering-aware swept
# corridor in _forward_path_selection so the lateral bound stops being vacuous
# below 0.197 m. That is code, and it needs the 256-scenario corpus first.
forward_path_ahead_of_bumper = true

# Treat a forward cone that returns NOTHING as degraded rather than clear. A
# whole-cone no-return is the LIDAR failing to see, not open track -- reading
# it as "wide open" drove the robot into walls (fixed 2026-08-28).
forward_no_data_is_degraded = true

# How many ADJACENT rays in the forward lane must corroborate a short return
# before it counts as an obstacle. The bare minimum over a noisy sweep is an
# extreme-value statistic, not a clearance: with sigma=0.03 m of range noise
# across ~500 rays the smallest reading in the lane sits 2-3 sigma below the
# nearest real surface. 1 restores that bare minimum.
risk_ray_window = 1
