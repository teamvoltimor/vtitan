# Pure pursuit controller parameters for waypoint following.
#
# See shared.config.navigation_tuning.PurePursuitParams.

# Fraction of the geometrically predicted yaw the chassis actually delivers,
# divided out of the steering demand. 1.0 = OFF, the plain bicycle-model answer.
yaw_gain_compensation = 1.0   # Base/Open value: OFF

# Obstacles only. The two challenges want OPPOSITE values here, so one number
# costs whichever does not get it. Measured 2026-09-05, both arms paired:
#
#   Obstacles 256  real wrong-side passes 46 -> 6, runs with a violation
#                  33/64 -> 6/64, rule 9.21 terminations 9/64 -> 0/64,
#                  collisions flat (14 vs 15), laps credited 131 -> 196.
#   Open 640       WORSE -- 638 -> 615: rule 9.21 1 -> 15 and nine more runs
#                  time out. The 128-case screen showed only 127 -> 124, an
#                  EIGHTFOLD understatement of the cost.
#
# On the OBSTACLES side because Open is the arm that must not regress: leaving
# Open on the base value keeps it bit-identical. Unlike open_lookahead_long
# this CAN shadow the base on an Obstacles sweep, so diag_base.load_tuning sets
# both fields together.
#
# UNSETTLED ON HARDWARE: in sim this is exactly right because the plant IS
# yaw_gain 0.55; on the robot the same 1.8x is unresolved between
# rear_steer_ratio and linkage_ratio and needs the bench test.
obstacles_yaw_gain_compensation = 0.55  # Full compensation, Obstacles only

lookahead_short = 0.16        # Lookahead distance for sharp corners (m)
lookahead_long = 0.32         # Lookahead distance for straights (m)

# Open only. The two challenges want different values here and everything else
# in this file is shared, so one number costs whichever challenge does not get
# it. Measured 2026-09-03, both arms paired against the same seeded cases:
#
#   Open 640      mean sim time -5.39 s/case (530 faster, 94 slower) for ONE
#                 verdict, case 590 ok -> incomplete. Case 300 fails in both
#                 arms; that is the known free-space creep deadlock.
#   Obstacles 256 WORSE -- clean 21 -> 19, timeouts 35 -> 40, escapes/lap
#                 59.6 -> 66.4, and sign-pass crosstrack IDENTICAL at 10.32 cm
#                 median, so the Open tracking gain does not reproduce there.
#
# On the OPEN side deliberately: Obstacles keeps 0.32 and its resolution path is
# untouched, so this cannot shadow the base constant on an Obstacles sweep the
# way OBSTACLES_CONTACT_DIST did.
open_lookahead_long = 0.24    # Lookahead for straights, Open Challenge only (m)
lookahead_transition = 0.30   # Crosstrack error threshold to switch modes (m) -- a ceiling; see below

# The switch from long to short used to be a bare step on both arming signals.
# Both hover near their thresholds in normal driving, so the lookahead flipped
# every tick -- hardware run_20260829_104641 shows 0.320, 0.160, 0.320, 0.160 at
# ~2.5 Hz. Curvature is 2y/L**2, quadratic in lookahead, so each flip swung the
# commanded curvature by 4x and the chassis drew a visible zigzag; mean peak
# |steer| through corners rose 0.306 -> 0.398 with no crosstrack gain.
# Ramping removes the discontinuity rather than debouncing it. 0.7 keeps a
# deadband so straights are untouched below 70% of the threshold, and is the
# largest value that leaves every pre-existing lookahead test true.
lookahead_blend_start = 0.70  # Fraction of the threshold where the ramp begins (1.0 = old hard switch)
steer_kp = 1.2                # Proportional gain for the steering P-controller
# PROVISIONAL, 2026-08-28: lowered from 2.0. Real hardware bag
# (run_20260828_220533) showed the controller repeatedly saturating against
# this cap at hard corners -- steering swinging exactly 0.6 rad (rate x 0.3s
# window) at many unrelated corners throughout the run, which is what read as
# "too drastic" on the track. Past sim sweeps only tested RAISING this value
# (1.5x/3.0x), both of which scored worse than baseline (107 vs 114,
# speed-envelope.md) -- indirect evidence a lower rate costs little, but this
# exact value is untested; re-check lap completion if this regresses hardware
# cornering.
max_steering_rate = 1.2       # Maximum steering command rate (rad/s)
# How far ALONG THE PATH select_target_point may walk before giving up. 0 = a
# whole lap, which is what shipped and what lost all three rounds of
# 2026-09-11: unbounded, the search wraps the ring and returns the first
# waypoint merely IN FRONT of the chassis, which once the car has turned is on
# the FAR SIDE of the loop. Measured in those windows the selected target sat
# p50 2.08-2.50 m away at 97-140 deg BACKWARDS around the ring, on 60-91% of
# ticks, and pure pursuit tracked it perfectly. A clean 3-lap round never
# selected a target beyond 0.91 m in 2533 ticks (0 beyond 1.0 m) against
# 27-30% beyond it on each lost round. Lookahead is 0.16-0.32 m, so 1.0 m is
# 3x anything the search can legitimately need.
target_search_span_m = 1.0
# Reject a candidate the chassis would only reach by going round the loop the
# WRONG WAY: the pose->candidate bearing projected on the path's own direction
# of travel at that candidate must be positive. SPAN and SENSE are different
# quantities, and the span bound above CONVERTED this failure instead of
# closing it. Measured 2026-09-12 inside the known reversal windows, against a
# clean 3-lap control reading 0.7% wrong-sense:
#
#   run                          target wrong sense   target behind chassis
#   152318 clean control                       0.7%                    0.0%
#   171915 before the span bound              90.9%                    0.0%
#   172543 before the span bound              56.2%                    0.0%
#   172334 before the span bound              71.1%                    0.0%
#   064539 AFTER the span bound                2.8%                   35.4%
#
# The bound works -- selected-target range fell from p50 2.04-2.07 m (97.9-99.3%
# beyond 1.0 m) to 0.43-0.47 m (0.0-2.8% beyond) -- and the car still drove 0.23
# of a lap backwards, because at 0.45 m the correctly-chosen point sits BEHIND a
# chassis that has turned round, and nothing in this tree turns a chassis round.
#
# So this is PREVENTION aimed at the precursor: on that run, BEFORE the reversal
# window, wrong-sense targets ran 23.0% of ticks with the chassis still
# correctly oriented, arriving in bursts of up to 117 ticks against a longest
# of 14 on the clean control. It does NOT cover the sign-deformation origin --
# that is sign_router.toml's sign_deform_sense_guard.
#
# SHIPS OFF AND UNVALIDATED ON TRACK. Diagnostic:
# scripts/bag/diag_bag_target_loop_sense.py
target_sense_gate = false
# How fast the servo ACTUALLY moves, as opposed to how fast we let the command
# move. Split from max_steering_rate on 2026-09-11: that one is a CORNERING
# POLICY, lowered 2.0 -> 1.2 on 2026-08-28 because cornering was too drastic,
# and it still binds 8.2-13.1% of driving ticks. This one is a MODEL of the
# hardware, and bay_exit budgets its servo standstill from it -- 50 ticks,
# 2.50 s per reversal, against 8-14 reversals. Below the truth it is pure
# wasted time; raising the POLICY to fix the MODEL re-heats cornering.
# STILL UNMEASURED: /motor/steering_position is an ECHO of the command (slope
# 180/pi, lag 0, R2 = 1.000000), so no bag can settle it. The gyro gives a
# lower bound of ~1.27 rad/s even at p90, so 1.2 is too low -- but a bound is
# not a value, and too HIGH under-budgets the pause. Needs a loaded bench
# measurement, together with max_wheel_angle_deg, which multiplies into the
# same swing and is itself unverified.
# MEASURED 2026-09-11 on the bench with the wheel LOADED, via
# scripts/hardware/diag_servo_slew.py: reached the far lock at a 1.20 s hold,
# and at 0.90 s stopped about 20 deg SHORT. That shortfall is the better datum:
# 150 deg in 0.90 s is 2.91 rad/s, implying a 1.02 s full swing, which agrees
# with not finishing at 0.90 and finishing at 1.20. Over the 170 deg lock-to-lock
# swing the estimate is ~2.9 rad/s -- at least TWICE
# the 1.2 that had been assumed since the constant was written.
# Set to the conservative end: too HIGH under-budgets the bay's servo pause and
# its dead reckoning would assume an angle the wheel has not reached, while too
# low only wastes time; 2.4 leaves 23% margin over the measured 1.02 s while
# 2.9 would leave 3%, on a 20 deg read by eye. Bay budget 50 ticks (2.50 s) -> 25 (1.25 s) per
# reversal, about 11 s of a round that finishes at 213-295 s against a 180 limit.
servo_slew_rate_rad_s = 2.4

# The operative crosstrack threshold is the smaller of lookahead_transition and
# what the path's own distance to the outer wall actually affords. Under the
# blind narrow prior the fixed 0.30 exceeded that budget, so the correction
# could not fire before the wall arrived (hardware, 2026-08-06).
wall_margin_safety_m = 0.03        # Clearance to leave between chassis and outer wall (m)
min_lookahead_transition_m = 0.10  # Floor for the derived threshold (m)

# Crosstrack error lags a corner: it cannot rise until the turn has already
# been missed, so gating the lookahead on it alone lands the sharp correction
# after the corner rather than in it (hardware, 2026-08-06). Previewing the
# planned path's own turn arms the short lookahead on entry instead.
#
# Was 0.40, which gave that preview NO LEAD AT ALL. Computed 2026-08-29 by
# running the real planner and path_turn_ahead against the geometric arc entry
# (all-narrow blind prior, seconds at 0.35 m/s):
#
#   preview  lead before the arc   short lookahead armed over lap (narrow/wide)
#     0.40      0.000 m (0.00 s)                27% / 38%
#     0.80      0.257 m (0.73 s)                38% / 64%
#     1.00      0.514 m (1.47 s)                49% / 73%
#     1.20      0.772 m (2.21 s)                61% / 100%
#
# Waypoint spacing is 0.117-0.258 m, and the preview must clear the straight
# remainder AND reach into the arc before any heading change registers, so 0.40
# armed exactly AT the arc -- the "a corner late" failure this preview exists to
# prevent. 0.80 is the smallest value that leads at all; larger spends more of
# the lap on the short lookahead, and curvature is quadratic in it.
corner_preview_distance_m = 0.80   # Path distance previewed for an upcoming turn (m)
# Insensitive over 0.21-0.58: the signal is quantised by waypoint spacing and
# jumps 0.00 -> 0.59 in one step, so every threshold in that band arms at the
# same waypoint. Not the lever for turn timing -- see the preview above.
corner_turn_threshold_rad = 0.35   # Heading change over that preview that counts as a corner

# Written out 2026-09-10 at its shipped value: until then it existed only as a
# Python literal, so no edit here could reach it (pytest's shipped-tree
# completeness check now requires every concrete default to appear in this
# file). 0.0 disables the minimum-radius floor on pursuit planning.
min_target_radius_m = 0.0

