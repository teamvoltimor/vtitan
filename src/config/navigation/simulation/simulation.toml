#:schema ../../../model/navigation/simulation/simulation.schema.json
# Knobs that exist only in the headless simulator.
#
# See shared.config.navigation_tuning.SimulationParams.
#
# These describe neither the robot nor the mat, so they belong in neither
# robot.toml nor track.toml -- but they decide what a simulated run scores,
# which is exactly why they should not be literals buried in a module.

# Opening seconds during which wall contact is treated as an artefact of where
# the robot was placed rather than a crash.
#
# This exists because a legal starting cell may already sit against a wall. The
# starting square's middle band is only millimetres wider than the chassis, so
# a start there begins with almost no clearance to the inner block, and scoring
# that as a collision on tick one would fail a placement the rules allow.
start_collision_window_s = 2.0

# How long such an opening contact may persist before it counts as a real
# failure rather than "still steering clear".
start_collision_grace_s = 15.0

# Does inner-wall contact END an Obstacles run? In the RULES it does not.
# The rule set, operator-confirmed 2026-09-11:
#   OPEN      -- the OUTER wall may not be touched (unchanged by this flag).
#   BOTH      -- a wall may not be MOVED if it is not fixed, and moving one
#                takes considerable force, which a scrape at this chassis's
#                mass and speed does not reach. That is what makes relaxing
#                this sound and not merely permitted.
#   OBSTACLES -- the PARKING LOT may not be touched (9.24.7).
# Terminal regardless of this flag: the parking lot, displacing a sign out of
# its 85 mm circle (9.20), and the wrong pass side (9.19/9.24.5). Those three
# are the whole of what ends an Obstacles round.
# TRUE keeps the strict scoring every figure in this repo was measured under.
# Set FALSE to score the actual rule, and state which scoring a result used --
# one taken under each and compared is meaningless.
obstacles_inner_wall_terminal = true

# Fraction of LIDAR rays returning no measurement, emitted as NaN/inf so the
# sanitising path the real driver uses is actually exercised.
#
# A placeholder. Slamtec drivers emit these off dark or shallow-incidence
# surfaces and the true rate depends on the mat, so this is worth measuring
# from a recorded bag rather than left at a guess. It matters more than it
# looks: a dropout is substituted with MAX RANGE, which reads as "this side is
# wide open" to the direction estimator.
lidar_invalid_ray_rate = 0.095

# Chassis occlusion of the LIDAR, MEASURED 2026-09-14 over 5,763,600 real rays
# from /scan on three of the 2026-09-13/14 rounds. The sensor is blind in two
# bands off the front corners, and the simulator modelled none of it.
#
# At 5 degree resolution, dropout + sub-floor sum to essentially 100% across
# |bearing| 25-60 deg on BOTH sides: -35..-30 reads 56.3% + 43.7%, +30..+35
# reads 54.6% + 45.4%, -50..-45 and +45..+50 both read 80.6% + 19.4%. Outside
# those bands the sweep is clean: 9.5% dropout, 0.13% sub-floor.
#
# So this is GEOMETRY, not noise, and raising lidar_invalid_ray_rate alone
# cannot reproduce it. The 20-25 and 60-65 deg edges are partial (53-77%
# unusable) and are deliberately left out, making this the conservative core.
#
# Why it matters beyond fidelity: the side-clearance comparison that picks the
# K-turn's side reads sectors 45..135 and -135..-45, whose inner edges sit
# inside these bands, and takes a MIN over the sector.
lidar_occlusion_min_deg = 25.0
lidar_occlusion_max_deg = 60.0
lidar_occlusion_dropout_rate = 0.689
lidar_occlusion_self_return_m = 0.0207
lidar_occlusion_self_return_std_m = 0.0052

# Confidence stamped on emulated camera detections. Must stay above the sign
# router's min_confidence or no emulated detection would ever be accepted.
detection_confidence = 0.9

# How far past the visual wall face TrackModel's chassis keep-out extends.
# Zero: the chassis may drive right up to the wall it can see, matching the
# real robot -- NOT the Go generator's fatter Gazebo collision mesh. See
# TrackModel's module docstring for the full reasoning.
collision_margin_m = 0.0

# |cos(yaw)| below this counts as a quarter-turn for ObstacleBox.from_pose.
axis_align_tolerance = 1e-6

# The simulator's no-progress bailout: a run is abandoned once the robot moves
# less than no_progress_displacement_m within no_progress_window_s. A HARNESS
# artefact, not a robot behaviour -- it ends a manoeuvre that is working but
# slow, which is exactly what the bay-exit ratchet looks like (diag_bay_start
# grew --no-progress-window for this). Written out 2026-09-05; both existed
# only as Python literals, at these same shipped values.
no_progress_window_s = 30.0
no_progress_displacement_m = 0.08

# Emulate camera BOUNDING BOXES and decode them with the shipped perception
# code, instead of handing the router world coordinates built from the TRUE
# range and bearing. Off, the simulator never runs _detection_to_world at all --
# no pinhole, no bearing formula, no bbox-height gate, no aspect or frame-clip
# test -- all of which are live on the robot. That is how a MIRRORED camera
# bearing (fixed 2026-09-06) survived the 256-scenario corpus for weeks: the
# emulator reproduced the true geometry and the router's unit tests built their
# boxes by inverting the same formula, so both agreed with the error.
# The emulated box round-trips EXACTLY (1e-15 m) through the correct decode, so
# this is a wiring change rather than a noise source; with the historical mirror
# reintroduced it puts a sign 0.600 m onto the WRONG SIDE of a 1 m corridor.
# Ships false until the Obstacles corpus is re-baselined on it, since it changes
# which detections survive the discovery gates.
vision_through_pinhole = false

# Written out 2026-09-10: all three existed only as Python literals (the
# shipped-tree completeness test now requires every concrete default to
# appear in this file). Shipped values, so naming them changed nothing.

# Emulate detection RANGE falloff (not just geometry) on the emulated camera:
# a probit-ish falloff around R50, in metres.
vision_range_model = true
# Floor the curvature at min(cap, intercept + slope * |v|) instead of the
# constant min_turn_radius_m. That constant is the curve's value at ONE speed:
# re-measured 2026-09-10 over 33 bags in free space at lock >= 30 deg, the
# achieved radius is 0.105 m at 0.025 m/s, 0.298 at 0.132 and saturates near
# 0.43 above 0.22, so 0.29 corresponds to ~0.118 m/s. The bay exit creeps end
# to end, where the constant is nearly 2x too large. The three constants live
# in robot.toml beside min_turn_radius_m; this only decides whether the
# simulator uses them. FALSE pending a corpus A/B -- it moves every contact-
# and corner-dependent number, exactly as shipping the constant floor did.
min_turn_radius_tracks_speed = false

vision_detect_r50_m = 1.1
vision_detect_falloff_m = 0.15


# ---------------------------------------------------------------------------
# SENSOR ERROR BUDGET, on by default since 2026-09-14
#
# Until then every value here was effectively 0.0: `ScenarioSimulator` did
# `sensor_errors or SensorErrors()` and nothing in the corpus ever passed one,
# so the whole 256-scenario suite ran with a PERFECT pose and a PERFECT start
# placement. That is the easy side of every question that depends on the pose
# estimate, and it flatters any threshold whose job is to rescue a plan that
# went wrong.
#
# These are the numbers from scripts/common/sensor_errors.py REAL_SENSOR_ERRORS,
# which were sized from the real robot rather than invented. Set them all to 0.0
# to recover the old idealised behaviour.
#
# Any non-zero value implies use_lidar_localization: sensor error is only
# observable through the estimate, so on ground-truth pose a mis-seeded
# estimator is never consulted and the run is unaffected.
sensor_start_pos_error_m = 0.05
sensor_yaw_bias_rad = 0.03
sensor_imu_drift_rad_per_s = 0.000145
sensor_gyro_scale_error = 0.005
sensor_imu_noise_rad = 0.005

# ---------------------------------------------------------------------------
# CAMERA REALISM, on by default since 2026-09-14
#
# The emulator emitted from the CURRENT tick's true state, so the simulated
# camera spoke on ~54.5% of ticks with ZERO lag. Hardware carries a detection on
# 11.6% of ticks (measured over 125 bags) and the real gateway compensates a
# MEASURED 0.85 s pipeline delay. That gap IS the anticipation budget: it
# decides whether the planner or the reactive layer handles a pillar, so a sim
# without it asks the reactive layer to rescue far fewer situations than the mat
# does.
vision_latency_s = 0.85
# VALIDATED 2026-09-14 after wiring, not just derived: pooled over the first
# five official Obstacles scenarios driven end to end, the emulated camera now
# carries a detection on 11.0% of ticks against hardware's 11.6%. Per-scenario
# spread 7.9-14.4%, which is ordinary variance. Before this it was ~54.5%.
vision_frame_miss_rate = 0.79

# UNMEASURED, so they ship at 0.0 rather than at a guess. Defaulting an invented
# error rate would make the simulator wrong in a new way rather than more
# realistic. Both knobs exist because the emulator copies ground-truth colour
# directly and never invents a sign, which makes the single biggest real
# perception failure -- the magenta parking barrier arriving as a RED pillar --
# impossible to screen in simulation at all.
vision_color_flip_rate = 0.0
vision_false_positive_rate = 0.0
