#:schema ../../../model/navigation/simulation/simulation.schema.json
# Knobs that exist only in the headless simulator.
#
# See shared.config.navigation_tuning.SimulationParams.
#
# These describe neither the robot nor the mat, so they belong in neither
# robot.toml nor track.toml -- but they decide what a simulated run scores,
# which is exactly why they should not be literals buried in a module.

# Opening seconds during which wall contact is treated as an artefact of where
# the robot was placed rather than a crash.
#
# This exists because a legal starting cell may already sit against a wall. The
# starting square's middle band is only millimetres wider than the chassis, so
# a start there begins with almost no clearance to the inner block, and scoring
# that as a collision on tick one would fail a placement the rules allow.
start_collision_window_s = 2.0

# How long such an opening contact may persist before it counts as a real
# failure rather than "still steering clear".
start_collision_grace_s = 15.0

# Does inner-wall contact END an Obstacles run? In the RULES it does not.
# The rule set, operator-confirmed 2026-09-11:
#   OPEN      -- the OUTER wall may not be touched (unchanged by this flag).
#   BOTH      -- a wall may not be MOVED if it is not fixed, and moving one
#                takes considerable force, which a scrape at this chassis's
#                mass and speed does not reach. That is what makes relaxing
#                this sound and not merely permitted.
#   OBSTACLES -- the PARKING LOT may not be touched (9.24.7).
# Terminal regardless of this flag: the parking lot, displacing a sign out of
# its 85 mm circle (9.20), and the wrong pass side (9.19/9.24.5). Those three
# are the whole of what ends an Obstacles round.
# TRUE keeps the strict scoring every figure in this repo was measured under.
# Set FALSE to score the actual rule, and state which scoring a result used --
# one taken under each and compared is meaningless.
obstacles_inner_wall_terminal = true

# Fraction of LIDAR rays returning no measurement, emitted as NaN/inf so the
# sanitising path the real driver uses is actually exercised.
#
# A placeholder. Slamtec drivers emit these off dark or shallow-incidence
# surfaces and the true rate depends on the mat, so this is worth measuring
# from a recorded bag rather than left at a guess. It matters more than it
# looks: a dropout is substituted with MAX RANGE, which reads as "this side is
# wide open" to the direction estimator.
lidar_invalid_ray_rate = 0.095

# Chassis occlusion of the LIDAR, MEASURED 2026-09-14 over 5,763,600 real rays
# from /scan on three of the 2026-09-13/14 rounds. The sensor is blind in two
# bands off the front corners, and the simulator modelled none of it.
#
# At 5 degree resolution, dropout + sub-floor sum to essentially 100% across
# |bearing| 25-60 deg on BOTH sides: -35..-30 reads 56.3% + 43.7%, +30..+35
# reads 54.6% + 45.4%, -50..-45 and +45..+50 both read 80.6% + 19.4%. Outside
# those bands the sweep is clean: 9.5% dropout, 0.13% sub-floor.
#
# So this is GEOMETRY, not noise, and raising lidar_invalid_ray_rate alone
# cannot reproduce it. The 20-25 and 60-65 deg edges are partial (53-77%
# unusable) and are deliberately left out, making this the conservative core.
#
# Why it matters beyond fidelity: the side-clearance comparison that picks the
# K-turn's side reads sectors 45..135 and -135..-45, whose inner edges sit
# inside these bands, and takes a MIN over the sector.
lidar_occlusion_min_deg = 25.0
lidar_occlusion_max_deg = 60.0
lidar_occlusion_dropout_rate = 0.689
lidar_occlusion_self_return_m = 0.0207
lidar_occlusion_self_return_std_m = 0.0052

# Confidence stamped on emulated camera detections. Must stay above the sign
# router's min_confidence or no emulated detection would ever be accepted.
detection_confidence = 0.9

# The measured confidence DISTRIBUTION, five quantiles at levels
# [0.00, 0.10, 0.50, 0.90, 1.00], sampled by inverse-CDF interpolation.
# An empty list falls back to the constant above.
#
# MEASURED 2026-09-15 over 3,315 red/green detections on the three rounds whose
# pillar map reconstructs to the operator's layout: min 0.451, p10 0.515,
# p50 0.760, p90 0.917, max 0.958. The shipped constant 0.9 sits at the real
# p90 -- the emulator believes every frame is one of its best.
#
# Why a constant is not harmless: `_SignTrack` weights its COLOUR VOTE by
# confidence, so with a constant every vote weighs the same, while on the robot
# a 0.45 detection counts half of a 0.95 one. The vote's tie-breaking -- which
# decides a rule that ENDS a round, and which was measured at 68-to-61 on one
# real pillar -- is untested in simulation without this.
#
# It does NOT make sign_router.min_confidence meaningful: that gate is 0.25 and
# the real minimum is 0.451, so it rejects nothing on hardware either. Raising
# it would start discarding genuine detections.
vision_confidence_quantiles = [0.451, 0.515, 0.76, 0.917, 0.958]

# The probability levels those quantiles were measured AT. Half of a PAIR:
# a quantile array without its levels cannot be interpolated, and the two must
# stay the same length. Not evenly spaced on purpose -- the tails are what a
# confidence-weighted vote turns on, so the resolution is spent at p10 and p90
# rather than at the quartiles.
#
# This was a Python constant until 2026-09-15, which made the pair separable and
# the failure silent: assuming even spacing still returns the median EXACTLY
# while reading p10 as 0.477 against a measured 0.515 and p90 as 0.942 against
# 0.917 -- calibrated at the one point anybody checks.
vision_confidence_levels = [0.0, 0.1, 0.5, 0.9, 1.0]

# How far past the visual wall face TrackModel's chassis keep-out extends.
# Zero: the chassis may drive right up to the wall it can see, matching the
# real robot -- NOT the Go generator's fatter Gazebo collision mesh. See
# TrackModel's module docstring for the full reasoning.
collision_margin_m = 0.0

# |cos(yaw)| below this counts as a quarter-turn for ObstacleBox.from_pose.
axis_align_tolerance = 1e-6

# The simulator's no-progress bailout: a run is abandoned once the robot moves
# less than no_progress_displacement_m within no_progress_window_s. A HARNESS
# artefact, not a robot behaviour -- it ends a manoeuvre that is working but
# slow, which is exactly what the bay-exit ratchet looks like (diag_bay_start
# grew --no-progress-window for this). Written out 2026-09-05; both existed
# only as Python literals, at these same shipped values.
no_progress_window_s = 30.0
no_progress_displacement_m = 0.08

# Emulate camera BOUNDING BOXES and decode them with the shipped perception
# code, instead of handing the router world coordinates built from the TRUE
# range and bearing. Off, the simulator never runs _detection_to_world at all --
# no pinhole, no bearing formula, no bbox-height gate, no aspect or frame-clip
# test -- all of which are live on the robot. That is how a MIRRORED camera
# bearing (fixed 2026-09-06) survived the 256-scenario corpus for weeks: the
# emulator reproduced the true geometry and the router's unit tests built their
# boxes by inverting the same formula, so both agreed with the error.
# The emulated box round-trips EXACTLY (1e-15 m) through the correct decode, so
# this is a wiring change rather than a noise source; with the historical mirror
# reintroduced it puts a sign 0.600 m onto the WRONG SIDE of a 1 m corridor.
# Ships false until the Obstacles corpus is re-baselined on it, since it changes
# which detections survive the discovery gates.
vision_through_pinhole = false

# Written out 2026-09-10: all three existed only as Python literals (the
# shipped-tree completeness test now requires every concrete default to
# appear in this file). Shipped values, so naming them changed nothing.

# Emulate detection RANGE falloff (not just geometry) on the emulated camera:
# a probit-ish falloff around R50, in metres.
vision_range_model = true
# Floor the curvature at min(cap, intercept + slope * |v|) instead of the
# constant min_turn_radius_m. That constant is the curve's value at ONE speed:
# re-measured 2026-09-10 over 33 bags in free space at lock >= 30 deg, the
# achieved radius is 0.105 m at 0.025 m/s, 0.298 at 0.132 and saturates near
# 0.43 above 0.22, so 0.29 corresponds to ~0.118 m/s. The bay exit creeps end
# to end, where the constant is nearly 2x too large. The three constants live
# in robot.toml beside min_turn_radius_m; this only decides whether the
# simulator uses them. FALSE pending a corpus A/B -- it moves every contact-
# and corner-dependent number, exactly as shipping the constant floor did.
#
# TURNED ON 2026-09-14. The corpus A/B it was waiting for is the re-baselining
# that landed with the sensor-error and camera-realism commits, and the bag
# evidence for it is now direct rather than inferred. Replaying recorded command
# streams through AckermannKinematics (diag_bag_sim_fidelity.py --replay):
#
#   run_20260913_182253    0 escapes   sim/real yaw 1.02x   <- model is CORRECT
#   run_20260913_191740   21 escapes            0.63x
#   run_20260914_000926   91 escapes            0.62x
#   run_20260914_004547  121 escapes            0.52x
#
# Monotonic in escape load, and the zero-escape run validates yaw_gain = 0.55
# exactly. So the deficit is not the cornering model, it is the MANOEUVRE
# regime -- escapes creep at 0.152 m/s where this constant is ~2x too large, and
# they are the one place the radius floor rather than tan(steer) decides the
# curvature. Leaving it false makes the simulator physically unable to rotate as
# fast as the car during precisely the manoeuvre the escape work is tuned on.
min_turn_radius_tracks_speed = true

vision_detect_r50_m = 1.1
vision_detect_falloff_m = 0.15


# ---------------------------------------------------------------------------
# SENSOR ERROR BUDGET, on by default since 2026-09-14
#
# Until then every value here was effectively 0.0: `ScenarioSimulator` did
# `sensor_errors or SensorErrors()` and nothing in the corpus ever passed one,
# so the whole 256-scenario suite ran with a PERFECT pose and a PERFECT start
# placement. That is the easy side of every question that depends on the pose
# estimate, and it flatters any threshold whose job is to rescue a plan that
# went wrong.
#
# These are the numbers from scripts/common/sensor_errors.py REAL_SENSOR_ERRORS,
# which were sized from the real robot rather than invented. Set them all to 0.0
# to recover the old idealised behaviour.
#
# Any non-zero value implies use_lidar_localization: sensor error is only
# observable through the estimate, so on ground-truth pose a mis-seeded
# estimator is never consulted and the run is unaffected.
sensor_start_pos_error_m = 0.05
sensor_yaw_bias_rad = 0.03
sensor_imu_drift_rad_per_s = 0.000145
sensor_gyro_scale_error = 0.005
sensor_imu_noise_rad = 0.005

# ---------------------------------------------------------------------------
# CAMERA REALISM, on by default since 2026-09-14
#
# The emulator emitted from the CURRENT tick's true state, so the simulated
# camera spoke on ~54.5% of ticks with ZERO lag. Hardware carries a detection on
# 11.6% of ticks (measured over 125 bags) and the real gateway compensates a
# MEASURED 0.85 s pipeline delay. That gap IS the anticipation budget: it
# decides whether the planner or the reactive layer handles a pillar, so a sim
# without it asks the reactive layer to rescue far fewer situations than the mat
# does.
vision_latency_s = 0.85
# VALIDATED 2026-09-14 after wiring, not just derived: pooled over the first
# five official Obstacles scenarios driven end to end, the emulated camera now
# carries a detection on 11.0% of ticks against hardware's 11.6%. Per-scenario
# spread 7.9-14.4%, which is ordinary variance. Before this it was ~54.5%.
vision_frame_miss_rate = 0.79

# MEASURED 2026-09-15, which is what this knob was explicitly waiting for.
#
# 111 of 2,162 camera detections carry the WRONG colour -- 5.1% -- scored
# against the operator's stated layout over the three rounds of that day whose
# pillar map reconstructs to it (140852, 141413, 141832). See
# scripts/bag/diag_bag_colour_attribution.py, which refuses to score a round
# that misses the 5 GREEN / 3 RED control.
#
# TWO THINGS THIS NUMBER IS NOT, both of which matter before reading a result:
#
# 1. It is a MARGINAL rate and the real errors are CONCENTRATED, while the flip
#    here is i.i.d. per observation. Per pillar the measured rate runs from ~0%
#    on most of them to 47% on one -- the east green at (2.58,1.18) in 141413,
#    decided 68 green to 61 red, which is a coin flip deciding a round-ending
#    rule. The hard geometry carries nearly all of the error. Reproducing that
#    needs a model keyed on bearing or range, and there is not enough bag
#    evidence to fit one yet, so this ships the honest marginal rate and says so.
# 2. It EXCLUDES the magenta parking barrier. Detections that match no pillar
#    within 0.35 m are not scored, so the barrier-arriving-as-RED failure is not
#    in this figure and is still unscreenable here.
#
# At the per-pillar level the shipped colour vote is right 24 of 24 on those
# rounds, so 5.1% of frames being wrong is survivable TODAY. That is exactly why
# it belongs in the simulator: the margin that absorbs it is invisible until
# something spends it.
vision_color_flip_rate = 0.051

# Per-detection camera BEARING scatter, standard deviation in radians.
#
# MEASURED 2026-09-15 over 2,588 detections on the three rounds whose pillar
# map reconstructs to the operator's stated layout. Median +1.27 deg, so this
# is SCATTER and NOT an offset -- there is no mounting yaw or HFOV scale that
# fixes it. IQR runs -9.36 to +8.59 deg, giving a robust sigma of 13.30 deg =
# 0.232 rad. The raw stdev is 18.19 deg, inflated by outliers and by detections
# attributed to the wrong pillar, so the IQR-derived figure is the honest one.
#
# The emulator projects every sign from its TRUE bearing, so without this the
# only angular error in a simulated run is the pose estimate's -- about 1.7 deg
# from sensor_yaw_bias_rad plus sensor_imu_noise_rad, an order of magnitude too
# small. (Those 1.7 deg are inside the measurement, so this double-counts by
# under 2%.)
#
# 0.232 rad at 1.5 m is 0.35 m of lateral miss, WIDER than the radii meant to
# contain it: sign_discovery.association_dist_m is 0.25 and the router's
# detection_match_dist_m is 0.30. Every gate sized against that scatter --
# the slot map, the colour vote, the barrier belief -- is untested without it.
# CORRECTED 2026-09-15, same day: 0.232 rad (13.30 deg) DOUBLE-COUNTS.
#
# That figure came from every detection within 0.45 m of a pillar -- a generous
# radius, chosen so as not to gate on the quantity being measured. The side
# effect is that a detection of pillar A matched to pillar B enters as a huge
# "bearing error", which is MIS-ATTRIBUTION and not sensor scatter. Restricting
# to detections whose nearest pillar is clearly nearest:
#
#   nearest/second <= 1.00 (all)   sigma 13.30 deg   <- what shipped first
#   nearest/second <= 0.70         sigma 11.28 deg
#   nearest/second <= 0.50         sigma  9.22 deg
#   nearest/second <= 0.35         sigma  6.66 deg   <- unambiguous
#
# Feeding a scatter that already contains mis-attribution into a model that then
# PRODUCES mis-attribution counts the same error twice, and the corpus response
# is the signature of exactly that: 22 failures with the knob off, 26 at 6.66
# deg, 42 at 13.30 deg. Five times the effect for twice the parameter is a
# cliff, not a sensor.
#
# HONEST BRACKET: 6.66 is a LOWER bound, because filtering on "close to its own
# pillar" preferentially drops the large errors. 13.30 is an UPPER bound. The
# truth is between and these bags cannot pin it. 0.116 is chosen for the
# structural reason above, not because it fails less -- the double-count is a
# defect in the measurement, while the selection bias is a limit of it.
vision_bearing_scatter_rad = 0.116

# ---------------------------------------------------------------------------
# CONTACT PHYSICS
#
# ON by default since 2026-09-14. A blocked translation now slides along the
# surface instead of being scaled to nothing. The old model stopped a chassis
# dead on contact at ANY angle, which is not what a smooth track wall does and
# which measured 56x less progress at a 20 degree approach. The bay exit is a
# sequence of shallow-angle contacts, so that model voided every in-bay A/B
# taken before this.
contact_slides_along_surfaces = true

# Does a shoved pillar actually MOVE, or only move on the scoreboard?
#
# The scorer already works out how far each pillar was pushed and by which
# component of travel. That number stayed a scalar: the pillar's collision box --
# the same one the LIDAR raycasts against -- never moved, so the sensor kept
# reporting it from its original cell while the robot was physically shifting it,
# and the map stayed consistent with a track that no longer existed.
#
# MEASURED 2026-09-15: accumulating LIDAR returns PER LAP rather than over the
# whole bag shows pillars marching monotonically, up to 0.15 m over one round,
# with a stationary neighbour moving 0.4 cm as the control.
#
# SHIPS FALSE, pending its own corpus A/B. It only bites inside the window before
# the displacement rule ends the run anyway (0.0594 m, where a corner leaves the
# 85 mm placement circle), so it buys at most six centimetres of movement -- but
# inside that window it changes what the planner sees, and therefore which runs
# finish.
#
# NOT modelled: a TOPPLED pillar, which on hardware leaves the LIDAR plane and
# never returns (three objects did in run_20260915_140014). It cannot matter
# here: 0.15 m of drift is 2.5x the legal limit, so a judge ends the round long
# before the object goes over. Toppling is a post-failure phenomenon.
obstacles_are_pushed = false

# CONTROL-LOOP JITTER. Per-tick period, sampled from the measured distribution;
# an empty list keeps the fixed dt the simulator has always stepped at.
#
# MEASURED 2026-09-15 over 9,552 nav ticks on five rounds: p50 0.0500 (the
# nominal 20 Hz), p90 0.0633, p99 0.0795. The lowest knot sits BELOW p50 because
# the loop also runs early, not only late.
#
# dt is not free: it feeds the elapsed-time total the round's time limit is
# judged on, so a jittered run must ACCUMULATE time rather than multiply steps
# by a constant. That is the whole of the change -- dt reaches gw.advance, the
# no-progress window and the time total, and nothing else.
#
# EXCLUDES THE STALL. One round carried a 1,977 ms gap -- 45 cm at 0.229 m/s with
# no control update at all, far more significant than the jitter here. It is out
# because it appeared in ONE round of five (stdev 72.7 ms against 10-12 ms) and
# promoting a one-off to a 1%-of-ticks event would be inventing physics.
sim_tick_period_quantiles = [0.044, 0.05, 0.0633, 0.0795]
sim_tick_period_levels = [0.0, 0.5, 0.9, 0.99]

# Emit the PARKING BARRIER as camera detections. The emulator projects SIGNS
# only, so the barrier is invisible in simulation -- and with it the aspect gate,
# the barrier belief, the corridor exemption and barrier_span_along_wall, all of
# which are dead code in the corpus. Even at a zero red rate this is not inert:
# a magenta detection exercises the discard path, which nothing reaches today.
vision_emits_barrier = false

# Probability a barrier detection arrives as a RED pillar instead of magenta.
# This is the failure that matters: magenta is discarded correctly, so a barrier
# that is always magenta screens nothing.
#
# MEASURED 2026-09-15 by locating the lot from its OWN LIDAR cluster -- not by
# 'near a wall', which caught 563 green pillar detections and measured its own
# contamination. Scoring what lands on the cluster: 60% in run_20260915_140852,
# 4% in 141413, 9% in 141832, with ZERO green detections on the lot in all three
# as the control. A fourth round is excluded: the car toppled three objects in it
# and its cluster map is not trustworthy.
#
# THE SPREAD IS THE POINT. 4% to 60% is not a rate, it is a range, and no single
# constant models those rounds. Sweep it; do not quote a mean.
vision_barrier_red_rate = 0.0
