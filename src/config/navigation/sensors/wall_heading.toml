# LIDAR wall-direction estimation for the blind heading reference.
#
# See shared.config.navigation_tuning.WallHeadingParams.

# How aligned the fitted segment directions must be before the estimate is
# trusted. Low concentration means the returns disagree about where the wall
# runs -- which is what a corner, a traffic sign or an open side looks like, and
# in those cases the heading reference is worse than none.
min_concentration = 0.55

# How far apart (in rays) the two returns forming one segment are taken. Wider
# is less sensitive to per-ray range noise but blurs genuine corners into the
# straight it is trying to measure.
baseline_rays = 15

# Range step above which two returns are treated as different surfaces rather
# than one continuous wall.
max_segment_jump_m = 0.30

# Segments shorter than this are dominated by range noise, not wall direction.
min_segment_m = 0.02

# Returns at or beyond this are no-return rays sanitised to max range by the
# driver, not real surfaces. The C1 reports 12 m; this sits just under it.
near_max_range_m = 11.0

# Fewer usable returns than this cannot form a segment at all.
min_returns = 3
