#:schema ../../../model/hardware/camera/rpi_camera_module_3.schema.json
# Picamera2 driver for RPi Camera Module 3 Wide. Rationale: adr:0078-camera-mount-and-focus, adr:0072-vision-data-path
# Keys use the shared camera_* validation aliases (SHOUT_CASE CAMERA_* still works as an env override).

camera_device = "/dev/video0"
camera_width = 1536
camera_height = 864
camera_fps = 30
camera_inverted = true
camera_rotation = 0
camera_hflip = false
camera_vflip = false
camera_af_mode = "manual"
camera_lens_position = 1.25
# camera_af_speed = "fast"
camera_ae_exposure_mode = "short"
# camera_exposure_time_us = 8000
camera_analogue_gain = 1.0
camera_awb_mode = "fluorescent"
camera_noise_reduction_mode = "fast"
camera_sharpness = 1.2
