#:schema ../../../model/hardware/camera/rpicam.schema.json
# rpicam-vid capture driver. Rationale: adr:0078-camera-mount-and-focus, adr:0072-vision-data-path
# Keys use the shared camera_* validation aliases (SHOUT_CASE CAMERA_* still works as an env override).

camera_width = 1536
camera_height = 864
camera_fps = 30
camera_inverted = true
camera_hflip = false
camera_vflip = false
camera_read_timeout_sec = 5.0
camera_af_mode = "manual"
camera_lens_position = 1.25
# camera_af_speed = "fast"
camera_awb_mode = "auto"
camera_noise_reduction_mode = "auto"
camera_sharpness = 1.0
camera_metering_mode = "centre"
camera_exposure_value = 0.0
# camera_flicker_period_us = 10000
# camera_awb_gains = [1.8, 1.6]
camera_exposure_mode = "short"
# camera_exposure_time_us = 8000
camera_analogue_gain = 1.0
