#:schema ../../../model/hardware/vision/node.schema.json
# VisionNode ROS2 parameter fallback defaults (rpi5_nodes.launch.py overrides at launch).
# Rationale: adr:0072-vision-data-path, adr:0071-round-recording-mcap

camera_topic = "/camera/image_raw"
model_path = "yolov8n.pt"
backend = "yolo"
camera_source = "topic"
capture_fps = 15.0
publish_annotated = false
annotated_topic = "/vision/image_annotated"
publish_raw = false
video_width = 1536
capture_dataset_frames = true
capture_interval_s = 10.0
capture_subdir = "captures"
