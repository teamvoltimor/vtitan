#:schema ../../../model/hardware/imu/bno08x_uart_rvc.schema.json
# BNO08x IMU over plain UART RVC. Rationale: adr:0079-imu-6axis-and-yaw-reference

default_port = "/dev/ttyACM0"
baudrate = 115200
poll_rate_hz = 100.0
serial_timeout = 1.0
data_lock_timeout = 2.0

[quaternion]
euler_sequence = "xyz"
negate_yaw = true
negate_pitch = false
negate_roll = true
