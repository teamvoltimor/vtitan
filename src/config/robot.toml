#:schema ../model/robot.schema.json
# Single source of truth for the WRO robot's physical constants (custom chassis, counter-phase four-wheel steering). Units: metres, kilograms, radians unless a field is named _deg. Rationale in other/docs/adr.

[chassis]
length = 0.30
width = 0.194
height = 0.10
mass = 1.3

[ackermann]
wheelbase = 0.19
track_width = 0.1675

[steering]

[wheel]
radius = 0.035
width = 0.025
mass = 0.05

[drivetrain]
rear_steer_ratio = 1.0
