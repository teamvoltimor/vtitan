#:schema ../model/track.schema.json
# Single source of truth for the WRO 2026 Future Engineers mat geometry. Units: metres; colours normalized RGB in [0, 1]. Rationale in other/docs/adr.

[track]
mat_size = 3.2
size = 3.0
min_coord = 0.0
max_coord = 3.0
corner_min = 1.0
corner_max = 2.0

[wall]
height = 0.10
thickness = 0.10
collision_thickness = 0.10
exterior_offset = 0.05
interior_offset = 0.05
color = [0.0, 0.0, 0.0]

[corridor]
narrow = 0.6
wide = 1.0
obstacles = 1.0
min_width = 0.5
max_width = 1.5
division_lines = [0.40, 0.60]

[sign]
width = 0.05
depth = 0.05
height = 0.10
z_position = 0.05
grid_depth_near = 1.0
grid_depth_middle = 1.5
grid_depth_far = 2.0
placement_circle_diameter = 0.085
min_count = 6
max_count = 14
red_color = [0.933, 0.153, 0.216]
green_color = [0.267, 0.839, 0.173]
red_std = [0.05, 0.02, 0.02]
green_std = [0.02, 0.05, 0.02]

[parking]
length = 0.20
width = 0.02
height = 0.10
z_position = 0.05
wall_offset = 0.10
spacing_factor = 1.5
color = [1.0, 0.0, 1.0]

[starting_zone]
default_length = 0.5
thickness = 0.001
obstacles_size_factor = 0.9
indicator_radius = 0.035
color = [0.5, 0.5, 0.5]
clockwise_color = [0.2, 0.4, 1.0]
counterclockwise_color = [0.2, 1.0, 0.4]
spawn_alignment = ["inner", "outer", "outer"]

[markings]
orange_color = [1.0, 0.4, 0.0]
blue_color = [0.0, 0.2, 1.0]
angle = 30
