#:schema ../model/ros_topics.schema.json
# Single source of truth for ROS2 topic names used by the robot and telemetry. Rationale in other/docs/adr.

[state_machine]
state = "/robot_state"
race_metrics = "/race_metrics"
system_status = "/system_status"

[navigation]
# odometry = "/odom"
laps_completed = "/race/laps_completed"
current_corridor = "/race/current_corridor"
nav_debug = "/nav_debug"

[sensors]
scan = "/scan"
imu = "/imu/data"
vision_detections = "/vision/detections"
camera_image_raw = "/camera/image_raw"
joy = "/joy"

[commands]
ackermann_cmd = "/ackermann_cmd"

[actuators]
joint_states = "/joint_states"
steering_position = "/motor/steering_position"
drive_speed = "/motor/drive_speed"
status = "/motor/status"

[challenge_mode]
jumper_inserted = "/challenge_mode/jumper_inserted"
active = "/challenge_mode/active"

[button]
event = "/button/event"
hold = "/button/hold"

[ui]
telemetry_summary = "/ui/telemetry_summary"
oled_mirror = "/ui/oled_mirror"

[bag_recorder]
run_path = "/bag_recorder/run_path"

[simulation]
odom = "/sim/odom"
track = "/sim/track"
plan = "/sim/plan"
sign_estimates = "/sim/sign_estimates"
robot_model = "/sim/robot_model"
