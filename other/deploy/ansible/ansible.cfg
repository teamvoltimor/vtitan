[defaults]
# The Pi Zero 2 W is slow enough that the 10s default is not a safety margin,
# it is a coin flip: a run died with "Timeout (12s) waiting for privilege
# escalation prompt" simply because apt was mid-install and sudo took longer
# than that to answer. Raised for the board, not for the network -- keepalives
# in [ssh_connection] are what catch a genuinely dead link, so a longer timeout
# here does not reintroduce indefinite hangs.
timeout = 60
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# Keepalives, because without them a flaky link does not fail a run -- it hangs
# it forever. Observed 2026-08-01: the deploy task finished its work on the Pi 5
# at 14:45, the Pi 5's WiFi flapped, and the connection went half-open; Ansible
# was still waiting on that same task 39 minutes later with nothing running on
# the far end. Note this bites even when Ansible runs ON the Pi 5, because
# `delegate_to: pi5` still dials the Pi 5's own WiFi address rather than
# connecting locally. 15s x 4 gives up after ~60s instead of never.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
