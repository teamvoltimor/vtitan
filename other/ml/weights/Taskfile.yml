version: "3"

tasks:
  models:promote:
    desc: "Promote a compiled model from other/ml/hailo/shared_with_docker/ into a new tracked other/ml/weights/<name>/vN/ (usage: task models:promote NAME=gmr HEF=gmr_cpu_opt0.hef [ONNX=gmr.onnx])"
    dir: "{{.ROOT_DIR}}"
    requires:
      vars:
        - NAME
        - HEF
    vars:
      ONNX: '{{.ONNX | default ""}}'
    cmds:
      - bash other/ml/weights/scripts/promote-from-hailo.sh {{.NAME}} {{.HEF}} {{.ONNX}}

  models:deploy:
    desc: "Deploy a tracked model version into other/apps/auto-annotator/ml-service/models/<name>/ (usage: task models:deploy NAME=gmr [VERSION=v1], defaults to LATEST)"
    dir: "{{.ROOT_DIR}}"
    requires:
      vars:
        - NAME
    vars:
      VERSION: '{{.VERSION | default ""}}'
    cmds:
      - bash other/ml/weights/scripts/deploy-to-ml-service.sh {{.NAME}} {{.VERSION}}
