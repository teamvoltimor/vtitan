version: '3'

vars:
  THEME_DIR: themes/hugo-book
  THEME_REPO: https://github.com/alex-shpak/hugo-book.git
  HUGO_CONTENT: content/v1

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # theme: hugo-book submodule management
  theme:init:
    desc: Initialise hugo-book submodule (pinned to committed revision)
    aliases: [theme]
    cmds:
      - git -C .. submodule update --init hugo-docs/themes/hugo-book

  # content: sync and clean Markdown sources
  content:sync:
    desc: Copy Markdown files from ../docs into content/v1/ via Go script
    aliases: [copy-docs]
    cmds:
      - go run scripts/copy_docs.go

  content:clean:
    desc: Remove generated content from content/v1/
    aliases: [clean]
    prompt: This will delete all files under {{.HUGO_CONTENT}}. Continue?
    cmds:
      - cmd: powershell -Command "Remove-Item -Recurse -Force {{.HUGO_CONTENT}}\* -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: rm -rf {{.HUGO_CONTENT}}/*
        platforms: [linux, darwin]

  # site: serve, build, and clean the Hugo output
  site:serve:
    desc: Start Hugo dev server with live reload
    aliases: [serve]
    deps: [theme:init, content:sync]
    cmds:
      - hugo server --disableFastRender

  site:build:
    desc: "Build the site (usage: task site:build [PROD=true] for a minified production build to public/)"
    aliases: [build]
    deps: [theme:init, content:sync]
    vars:
      PROD: '{{.PROD | default "false"}}'
    cmds:
      - cmd: |
          if [ "{{.PROD}}" = "true" ]; then
            hugo --minify --destination public
          else
            hugo
          fi

  site:clean:
    desc: Remove the public/ build output directory
    aliases: [clean:public]
    cmds:
      - cmd: powershell -Command "Remove-Item -Recurse -Force public -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: rm -rf public
        platforms: [linux, darwin]

  # code: Biome lint and format
  code:lint:
    desc: Run Biome linter
    aliases: [lint]
    cmds:
      - biome lint .

  code:fmt:
    desc: Format files with Biome (writes in place)
    aliases: [fmt]
    cmds:
      - biome format --write .

  code:check:
    desc: Run Biome lint + format check (CI-safe, no writes)
    aliases: [check]
    cmds:
      - biome check .

  # deploy: publish the built site
  deploy:github:
    desc: Build and deploy to GitHub Pages (requires GITHUB_TOKEN env var)
    aliases: [deploy]
    deps:
      - task: site:build
        vars:
          PROD: "true"
    dir: public
    cmds:
      - cmd: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN is required for deployment."
            exit 1
          fi
          git init && \
          git config user.name "github-actions[bot]" && \
          git config user.email "github-actions[bot]@users.noreply.github.com" && \
          git add . && \
          git commit -m "Deploy to GitHub Pages" && \
          git branch -M gh-pages && \
          git remote add origin https://x-access-token:$GITHUB_TOKEN@github.com/teamvoltimor/vtitan.git && \
          git push --force origin gh-pages

  deploy:cloudflare:
    desc: Build for Cloudflare Pages (outputs to public/)
    aliases: [cloudflare]
    deps:
      - task: site:build
        vars:
          PROD: "true"
    cmds:
      - cmd: echo "Built to public/ — connect your repo in the Cloudflare Pages dashboard and set output dir to public"
        silent: true
