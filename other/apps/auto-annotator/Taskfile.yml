version: '3'

vars:
  API_PORT: '8000'
  GRPC_PORT: '50051'
  FRONTEND_PORT: '80'

tasks:
  auto-annotator:default:
    desc: Show available tasks
    aliases: [auto-annotator]
    cmds:
      - task --list

  # ML Service (SAM model server + gRPC compute workers)

  auto-annotator:ml-service:dev:
    desc: "Start SAM model server + gRPC compute service (local development). Usage: task auto-annotator:ml-service:dev [MODEL_ID=sam2_hiera_large] to pre-load a specific model"
    dir: ml-service
    vars:
      MODEL_ID: '{{.MODEL_ID | default ""}}'
    env:
      GRPC_PORT: '{{.GRPC_PORT}}'
    cmds:
      - cmd: |
          if [ -n "{{.MODEL_ID}}" ]; then
            uv run python grpc_main.py --model {{.MODEL_ID}}
          else
            uv run python grpc_main.py
          fi

  auto-annotator:ml-service:sync:
    desc: Install ML service dependencies with uv
    dir: ml-service
    cmds:
      - uv sync

  auto-annotator:ml-service:test:
    desc: Run ML service unit tests (pure modules only, no GPU/model weights needed)
    dir: ml-service
    cmds:
      - uv run pytest tests/ -v

  auto-annotator:ml-service:typecheck:
    desc: Run mypy on ML service code
    dir: ml-service
    cmds:
      - uv run mypy src/

  # Go API (orchestration service)

  auto-annotator:api:dev:
    desc: Run the Go orchestration API (Gin + SQLite + gRPC clients)
    dir: api
    cmds:
      - go run ./cmd/api

  auto-annotator:api:build:
    desc: Build the Go API binary
    dir: api
    cmds:
      - go build -o bin/api ./cmd/api

  auto-annotator:api:deps:
    desc: Download Go API module dependencies
    dir: api
    cmds:
      - go mod download

  auto-annotator:api:test:
    desc: Run Go API tests
    dir: api
    cmds:
      - go test ./...

  auto-annotator:api:typecheck:
    desc: Run go vet on the Go API
    dir: api
    cmds:
      - go vet ./...

  # Database (sqlc + goose migrations)

  auto-annotator:sqlc:gen:
    desc: Regenerate Go DB access code from db/migrations via sqlc
    dir: api
    cmds:
      - sqlc generate

  auto-annotator:db:migrate:new:
    desc: 'Create a new goose migration under db/migrations. Usage: task auto-annotator:db:migrate:new NAME=add_foo_column'
    dir: api
    requires:
      vars: [NAME]
    cmds:
      - goose -dir db/migrations create {{.NAME}} sql

  auto-annotator:db:migrate:status:
    desc: >-
      Show which migrations in db/migrations are applied/pending against a
      SQLite file. Usage: task auto-annotator:db:migrate:status [DB_PATH=data/manifest.db]
    dir: api
    vars:
      DB_PATH: '{{.DB_PATH | default "data/manifest.db"}}'
    cmds:
      - goose -dir db/migrations sqlite3 {{.DB_PATH}} status

  # OpenAPI contract

  auto-annotator:openapi:validate:
    desc: >-
      Lint the OpenAPI spec with Redocly (structural + semantic checks, not
      just YAML syntax -- see .redocly.yaml for the one disabled rule)
    dir: frontend
    cmds:
      - pnpm exec redocly lint ../api/openapi.yaml --config ../.redocly.yaml

  auto-annotator:openapi:generate:backend:
    desc: Generate Go types from OpenAPI spec
    deps: [auto-annotator:openapi:validate]
    cmds:
      - oapi-codegen -config .oapi-codegen.yaml api/openapi.yaml
      - echo "[OK] Generated api/internal/http/handlers/openapi.gen.go"

  auto-annotator:openapi:generate:frontend:
    desc: Generate TypeScript types from OpenAPI spec
    deps: [auto-annotator:openapi:validate]
    dir: frontend
    cmds:
      - pnpm exec openapi-typescript ../api/openapi.yaml -o src/api/types.generated.ts
      - echo "[OK] Generated src/api/types.generated.ts"

  auto-annotator:openapi:generate:all:
    desc: Generate types for both backend and frontend
    cmds:
      - task: auto-annotator:openapi:generate:backend
      - task: auto-annotator:openapi:generate:frontend

  # Shared gRPC contract (proto/)

  auto-annotator:proto:gen:
    desc: Regenerate Go + Python gRPC stubs from the shared proto contract
    cmds:
      - task: auto-annotator:proto:gen:go
      - task: auto-annotator:proto:gen:py

  auto-annotator:proto:gen:go:
    desc: Regenerate Go gRPC stubs (buf) into api/internal/compute/pb
    dir: proto
    cmds:
      - buf lint
      - buf generate

  auto-annotator:proto:lint:
    desc: Lint the shared proto contract (buf lint) without regenerating stubs
    dir: proto
    cmds:
      - buf lint

  auto-annotator:proto:breaking:
    desc: >-
      Check the shared proto contract for breaking changes against the base
      branch (default master). Usage: task auto-annotator:proto:breaking [BASE=master]
    dir: proto
    vars:
      BASE: '{{.BASE | default "master"}}'
    cmds:
      - buf breaking --against "../../.git#branch={{.BASE}},subdir=auto-annotator/proto"

  auto-annotator:proto:gen:py:
    desc: >-
      Regenerate Python gRPC stubs (+ .pyi type stubs for mypy) into
      ml-service/src/grpc_server/pb, and the buf.validate runtime stub the
      protovalidate package needs into ml-service/buf/
    dir: ml-service
    cmds:
      # protovalidate's validate.proto isn't a local file -- buf resolves it from
      # the BSR dependency pinned in proto/buf.lock. grpc_tools.protoc has no BSR
      # awareness, so export a fresh copy into a gitignored scratch dir on every
      # run rather than vendoring a static copy that could drift from buf.lock.
      - rm -rf .proto-deps && mkdir -p .proto-deps
      - cd ../proto && buf export buf.build/bufbuild/protovalidate -o ../ml-service/.proto-deps
      - uv run python -m grpc_tools.protoc -I ../proto/autoannotator/v1 -I .proto-deps
        --python_out=src/grpc_server/pb --grpc_python_out=src/grpc_server/pb --pyi_out=src/grpc_server/pb
        ../proto/autoannotator/v1/compute.proto
      # The `protovalidate` PyPI package imports `from buf.validate import
      # validate_pb2` as an absolute top-level import -- it doesn't bundle this
      # stub itself, so it must be generated and land at ml-service/buf/ (on
      # sys.path alongside src/) rather than nested under src/grpc_server/pb.
      - rm -rf buf && uv run python -m grpc_tools.protoc -I .proto-deps --python_out=. --pyi_out=.
        .proto-deps/buf/validate/validate.proto
      - rm -rf .proto-deps

  # Frontend (Vite)

  auto-annotator:frontend:dev:
    desc: Start Vite dev server (http://localhost:5173)
    dir: frontend
    cmds:
      - npm run dev

  auto-annotator:frontend:build:
    desc: Build frontend for production
    dir: frontend
    cmds:
      - npm run build

  auto-annotator:frontend:preview:
    desc: Preview production build locally
    dir: frontend
    cmds:
      - npm run preview

  auto-annotator:frontend:test:
    desc: Run frontend parity tests with Vitest
    dir: frontend
    cmds:
      - npm run test:run

  auto-annotator:frontend:install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - npm install

  # Code Quality

  auto-annotator:lint:ml-service:
    desc: Run ruff linter on ML service code
    dir: ml-service
    cmds:
      - uv run ruff check .

  auto-annotator:lint:frontend:
    desc: Run Biome linter on frontend code
    dir: frontend
    cmds:
      - npm run lint

  auto-annotator:lint:api:
    desc: Run golangci-lint on Go API
    dir: api
    cmds:
      - golangci-lint run ./...

  auto-annotator:align:api:
    desc: Check Go struct field alignment (betteralign)
    dir: api
    cmds:
      - betteralign ./...

  auto-annotator:align:fix:api:
    desc: Auto-fix Go struct field alignment with betteralign
    dir: api
    cmds:
      - betteralign -fix ./...

  auto-annotator:lint:all:
    desc: Run linters on ml-service, frontend, and Go API
    aliases: [auto-annotator:lint]
    cmds:
      - task: auto-annotator:lint:ml-service
      - task: auto-annotator:lint:frontend
      - task: auto-annotator:lint:api

  auto-annotator:format:ml-service:
    desc: Fix and format ML service code with ruff
    dir: ml-service
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  auto-annotator:format:frontend:
    desc: Fix and format frontend code with Biome
    dir: frontend
    cmds:
      - npm run format

  auto-annotator:format:api:
    desc: Format Go API code with golangci-lint fmt
    dir: api
    cmds:
      - golangci-lint fmt ./...

  auto-annotator:format:proto:
    desc: Format the shared proto contract with buf format
    dir: proto
    cmds:
      - buf format -w

  auto-annotator:format:all:
    desc: Fix and format ml-service, frontend, Go API, and proto code
    aliases: [auto-annotator:fmt]
    cmds:
      - task: auto-annotator:format:ml-service
      - task: auto-annotator:format:frontend
      - task: auto-annotator:format:api
      - task: auto-annotator:format:proto

  # Docker

  auto-annotator:docker:build:api:
    desc: Build Go API Docker image
    cmds:
      - docker build -f Dockerfile.api -t auto-annotator-api .

  auto-annotator:docker:build:ml-service:
    desc: Build ML service Docker image
    cmds:
      - docker build -f Dockerfile.ml-service -t auto-annotator-ml-service .

  auto-annotator:docker:run:api:
    desc: Run Go API container
    cmds:
      - docker run -p {{.API_PORT}}:{{.API_PORT}} auto-annotator-api
    env:
      API_PORT: '{{.API_PORT}}'

  auto-annotator:docker:run:ml-service:
    desc: Run ML service container with GPU and volume mounts for development
    cmds:
      - docker run --gpus all
        -p {{.GRPC_PORT}}:{{.GRPC_PORT}}
        -v "{{.ROOT_DIR}}/ml-service/data:/app/data"
        -v "{{.ROOT_DIR}}/ml-service/models:/app/models"
        auto-annotator-ml-service
    env:
      GRPC_PORT: '{{.GRPC_PORT}}'

  auto-annotator:docker:up:
    desc: "Start all services with docker compose (ml-service + api + frontend). Usage: task auto-annotator:docker:up [DETACHED=true]"
    vars:
      DETACHED_FLAG: '{{if eq .DETACHED "true"}}-d {{end}}'
    cmds:
      - docker compose up {{.DETACHED_FLAG}}--build
    env:
      API_PORT: '{{.API_PORT}}'
      FRONTEND_PORT: '{{.FRONTEND_PORT}}'
      GRPC_PORT: '{{.GRPC_PORT}}'

  auto-annotator:docker:down:
    desc: Stop and remove docker compose services
    cmds:
      - docker compose down

  auto-annotator:docker:logs:
    desc: "Follow docker compose logs (usage: task auto-annotator:docker:logs [SERVICE=api|ml-service|frontend], default all services)"
    vars:
      SERVICE: '{{.SERVICE | default ""}}'
    cmds:
      - docker compose logs -f {{.SERVICE}}

  # Full Stack

  auto-annotator:dev:serve:
    desc: Run ml-service + api + frontend concurrently (assumes deps installed)
    deps:
      - auto-annotator:ml-service:dev
      - auto-annotator:api:dev
      - auto-annotator:frontend:dev

  auto-annotator:dev:local:
    desc: Install deps, then start the full local development stack
    aliases: [auto-annotator:dev]
    cmds:
      - task: auto-annotator:dev:init
      - task: auto-annotator:dev:serve

  auto-annotator:dev:docker:
    desc: "Start full Docker stack (ml-service + api + frontend). Usage: task auto-annotator:dev:docker [DETACHED=true]"
    cmds:
      - task: auto-annotator:docker:up
        vars:
          DETACHED: '{{.DETACHED | default "false"}}'

  # Utility

  auto-annotator:clean:build:
    desc: Clean build artifacts and cache
    cmds:
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue ml-service/.ruff_cache, api/bin, frontend/dist, frontend/node_modules"
        platforms: [windows]
      - cmd: rm -rf ml-service/.ruff_cache api/bin frontend/dist frontend/node_modules
        platforms: [linux, darwin]
      - echo "Cleaned build artifacts"

  auto-annotator:clean:deep:
    desc: Clean everything including dependencies
    cmds:
      - task: auto-annotator:clean:build
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue ml-service/.venv"
        platforms: [windows]
      - cmd: rm -rf ml-service/.venv
        platforms: [linux, darwin]
      - echo "Full clean complete"

  auto-annotator:dev:init:
    desc: Initialize development environment
    cmds:
      - task: auto-annotator:ml-service:sync
      - task: auto-annotator:frontend:install
      - echo "Development environment initialized"
