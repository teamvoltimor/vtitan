version: '3'

vars:
  SCENARIOS: '10'
  CHALLENGE: 'open'
  OUTPUT_DIR: '../training_data'
  BASE_WORLD: './worlds/wro_track_2026.sdf'
  METADATA: '{{.OUTPUT_DIR}}/{{.CHALLENGE}}/scenarios/scenario_0000_metadata.json'
  LAPS: '3'
  PARAMS: './scripts/navigator_params.json'

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: Show help message
    cmds:
      - |
        echo ""
        echo "  WRO 2026 Platform"
        echo ""
        echo "  Setup:"
        echo "    task install              Install Python deps (UV) + ROS2 env (Pixi)"
        echo ""
        echo "  Track:"
        echo "    task generate-track       Re-generate worlds/wro_track_2026.sdf"
        echo ""
        echo "  Scenario generation:"
        echo "    task generate             Generate SCENARIOS (default: 10) open scenarios"
        echo "    task generate-open        Generate open-challenge scenarios"
        echo "    task generate-obstacles   Generate obstacles-challenge scenarios"
        echo ""
        echo "  Navigation:"
        echo "    task navigate             Run navigator on METADATA (default: scenario_0000)"
        echo ""
        echo "  Recording:"
        echo "    task record               Record scenario videos (requires Gazebo + ROS2)"
        echo "    task convert-bags         Convert ROS2 bags to MP4 videos"
        echo "    task extract-frames       Extract frames from bags and annotate"
        echo ""
        echo "  Testing:"
        echo "    task test                 Run all tests via UV"
        echo "    task lint                 Run ruff linter via UV"
        echo ""
        echo "  Cleanup:"
        echo "    task clean                Remove generated training data"
        echo ""
        echo "  Variables (override with task VAR=value):"
        echo "    SCENARIOS={{.SCENARIOS}}  CHALLENGE={{.CHALLENGE}}  LAPS={{.LAPS}}"
        echo "    OUTPUT_DIR={{.OUTPUT_DIR}}"
        echo "    METADATA={{.METADATA}}"
        echo ""

  install:
    desc: Install Python deps (UV) + ROS2 env (Pixi)
    cmds:
      - uv sync
      - pixi install

  generate-track:
    desc: Re-generate worlds/wro_track_2026.sdf
    cmds:
      - uv run python -m src.generation.track_generator --output {{.BASE_WORLD}}

  generate:
    desc: Generate SCENARIOS open scenarios (alias for generate-open)
    cmds:
      - task: generate-open
        vars:
          SCENARIOS: '{{.SCENARIOS}}'

  generate-open:
    desc: Generate open-challenge scenarios
    cmds:
      - uv run python -m src.generation.generator
          --challenge open
          --num-scenarios {{.SCENARIOS}}
          --output-dir {{.OUTPUT_DIR}}
          --base-world {{.BASE_WORLD}}
          --randomize-all

  generate-obstacles:
    desc: Generate obstacles-challenge scenarios
    cmds:
      - uv run python -m src.generation.generator
          --challenge obstacles
          --num-scenarios {{.SCENARIOS}}
          --output-dir {{.OUTPUT_DIR}}
          --base-world {{.BASE_WORLD}}
          --randomize-all

  navigate:
    desc: Run navigator on METADATA scenario
    cmds:
      - pixi run python -m src.navigation.navigator
          --metadata {{.METADATA}}
          --laps {{.LAPS}}
          --params {{.PARAMS}}

  record:
    desc: Record scenario videos (requires Gazebo + ROS2)
    cmds:
      - pixi run python -m src.recording.recorder
          --output-dir {{.OUTPUT_DIR}}/{{.CHALLENGE}}/videos

  convert-bags:
    desc: Convert ROS2 bags to MP4 videos
    cmds:
      - uv run python -m src.recording.bag_converter
          --input-dir {{.OUTPUT_DIR}}/{{.CHALLENGE}}/bags
          --output-dir {{.OUTPUT_DIR}}/{{.CHALLENGE}}/videos

  extract-frames:
    desc: Extract frames from bags and annotate
    cmds:
      - uv run python -m src.recording.frame_extractor
          --input-dir {{.OUTPUT_DIR}}/{{.CHALLENGE}}/bags
          --output-dir {{.OUTPUT_DIR}}/{{.CHALLENGE}}/frames

  test:
    desc: Run all tests via UV
    cmds:
      - uv run pytest tests/ -v

  lint:
    desc: Run ruff linter via UV
    cmds:
      - uv run ruff check src/ tests/

  clean:
    desc: Remove generated training data
    cmds:
      - rm -rf {{.OUTPUT_DIR}}
      - find . -type d -name __pycache__ -delete
      - find . -name "*.pyc" -delete
