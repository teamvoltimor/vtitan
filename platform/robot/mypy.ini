[mypy]
python_version = 3.12
# This is Raspberry Pi (Linux) hardware code; resolve platform-conditional
# stdlib stubs (signal.SIGALRM, fcntl.ioctl, etc.) against the real
# deployment target, not whatever OS mypy happens to run on locally.
platform = linux
mypy_path = .:ros2_ws/src/voldemorbot_drivers:ros2_ws/src/voldemorbot_navigation:ros2_ws/src/voldemorbot_vision:ros2_ws/src/voldemorbot_state_machine
explicit_package_bases = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True

# Hardware/vendor libraries (board, busio, adafruit_*, picamera2, buildhat,
# mcp2221) and ROS2 message/launch packages are installed via conda, not pip,
# and ship no type stubs. Blanket-ignore missing imports rather than
# enumerating every one -- this still catches real errors in our own code
# (wrong return types, undeclared attributes, etc.), just not
# type-mismatches against those specific untyped externals.
ignore_missing_imports = True

exclude = (?x)(
    ^\.pixi/
    | ^ros2_ws/(build|install|log)/
    | ^src/gen/
  )
