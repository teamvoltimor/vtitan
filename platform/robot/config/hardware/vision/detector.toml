# Vision detector -- src/vision/detector.py
# class_to_color is always passed explicitly by callers (derived from the
# model's class order). model_path is normally passed explicitly too; the
# default below only matters for test/debug callers that build a detector
# with no config at all.

model_path = "yolov8n.pt"
min_confidence = 0.45
# Matches hailo.toml and hailo_streaming.toml threshold for consistency.
output_format = "normalized"
