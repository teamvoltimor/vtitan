# BNO08x IMU over plain UART RVC -- src/hardware/imu/bno08x/uart_rvc.py
# port: device path stays in .env (BNO08X_UART_RVC_PORT) by preference, but
# falls back to default_port if unset. Override per-unit with env var if needed.

default_port = "/dev/ttyACM0"
baudrate = 115200
poll_rate_hz = 100.0

[quaternion]
euler_sequence = "xyz"
negate_yaw = true
negate_pitch = false
negate_roll = true
