# Quadrature encoder + closed-loop PID -- src/hardware/motors/encoder/config.py
# Independent of which H-bridge (l298n/bts7960/...) is turning the shaft this
# encoder reads.

# Bench-calibrated odometry + drive-motor limits (measured 2026-07-25). See
# src/hardware/motors/encoder/calibration.py for the derivation; re-measure
# with scripts/hardware/calibrate_encoder.py if the drivetrain changes.
counts_per_rev = 676.0
max_rpm = 42.5
# wheel_diameter_m is not set here -- it derives from RobotSpecs.WHEEL_RADIUS
# (src/hardware/motors/encoder/calibration.py), not restated as a literal.

# Closed-loop speed PID gains, tuned on hardware 2026-07-25 against true wheel
# rpm. Feedforward (1/max_rpm) lands near stiction duty; these gains close the
# remainder without overshoot.
pid_kp = 0.010
pid_ki = 0.020
pid_kd = 0.0
