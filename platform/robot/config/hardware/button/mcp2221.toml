# MCP2221A button driver -- src/hardware/button/mcp2221/config.py
# gpio_pin (validation_alias MCP2221_BUTTON_GPIO_PIN) has no known real
# value documented in .env.example -- left out here, same as before this
# migration it was required straight from that env var with no default.

[mcp2221]
vid = "0x04D8"
pid = "0x00DD"

[button]
pull_up = true
debounce_ms = 50
long_press_threshold_sec = 3.0
