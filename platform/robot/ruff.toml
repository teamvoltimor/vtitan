# Ruff Configuration
# An extremely fast Python linter and code formatter, written in Rust
# Compatible with ruff >= 0.1.0
# Last updated: 2025-01-29
# Documentation: https://docs.astral.sh/ruff/

# ============================================================================
# Basic Configuration
# ============================================================================
target-version = "py312"
line-length = 120
indent-width = 4

# Output
output-format = "concise"
show-fixes = true

# Cache
cache-dir = ".ruff_cache"

# ============================================================================
# File Selection
# ============================================================================
# Files to include
include = ["*.py", "*.pyi", "**/pyproject.toml"]

# Respect `exclude` even when a file is passed explicitly on the command line.
force-exclude = true

# Files and directories to exclude
exclude = [
    # Version control
    ".git",
    ".github",
    ".gitignore",

    # Python artifacts
    "__pycache__",
    "*.pyc",
    ".Python",

    # Virtual environments
    ".env",
    ".venv",
    "env",
    "venv",
    "ENV",
    "env.bak",
    "venv.bak",

    # Build and distribution
    "build",
    "dist",
    "*.egg-info",
    ".eggs",

    # IDEs and editors
    ".vscode",
    ".idea",
    "*.swp",
    "*.swo",
    "*~",

    # Testing and coverage
    ".tox",
    ".pytest_cache",
    ".coverage",
    "htmlcov",
    ".mypy_cache",
    ".ruff_cache",

    # Documentation
    "docs/conf.py",
    "_build",

    # Migrations
    "*/migrations/*",
    "*/alembic/versions/*",

    # Generated files
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*_gen.py",
    "*.pyi",
]

# ============================================================================
# Linting Rules
# ============================================================================
[lint]
# Rule categories to enable
select = [
    # Pyflakes (F)
    "F",

    # Pycodestyle (E, W)
    "E",
    "W",

    # McCabe complexity (C90)
    "C90",

    # isort (I)
    "I",

    # pydocstyle (D)
    "D",

    # pyupgrade (UP)
    "UP",

    # flake8-future-annotations (FA)
    "FA",

    # flake8-2020 (YTT)
    "YTT",

    # flake8-annotations (ANN)
    "ANN",

    # flake8-async (ASYNC)
    "ASYNC",

    # flake8-bandit (S)
    "S",

    # flake8-blind-except (BLE)
    "BLE",

    # flake8-boolean-trap (FBT)
    "FBT",

    # flake8-bugbear (B)
    "B",

    # flake8-builtins (A)
    "A",

    # flake8-commas (COM)
    "COM",

    # flake8-comprehensions (C4)
    "C4",

    # flake8-datetimez (DTZ)
    "DTZ",

    # flake8-debugger (T10)
    "T10",

    # flake8-django (DJ)
    # "DJ",

    # flake8-errmsg (EM)
    "EM",

    # flake8-executable (EXE)
    "EXE",

    # flake8-implicit-str-concat (ISC)
    "ISC",

    # flake8-import-conventions (ICN)
    "ICN",

    # pep8-naming (N)
    "N",

    # flake8-logging-format (G)
    "G",

    # flake8-no-pep420 (INP)
    "INP",

    # flake8-pie (PIE)
    "PIE",

    # flake8-print (T20)
    "T20",

    # flake8-pyi (PYI)
    "PYI",

    # flake8-pytest-style (PT)
    "PT",

    # flake8-quotes (Q)
    "Q",

    # flake8-raise (RSE)
    "RSE",

    # flake8-return (RET)
    "RET",

    # flake8-self (SLF)
    "SLF",

    # flake8-simplify (SIM)
    "SIM",

    # flake8-tidy-imports (TID)
    "TID",

    # flake8-type-checking (TCH)
    "TCH",

    # flake8-unused-arguments (ARG)
    "ARG",

    # flake8-use-pathlib (PTH)
    "PTH",

    # eradicate (ERA)
    "ERA",

    # pandas-vet (PD)
    # "PD",

    # pygrep-hooks (PGH)
    "PGH",

    # Pylint (PL)
    "PL",

    # tryceratops (TRY)
    "TRY",

    # flynt (FLY)
    "FLY",

    # NumPy-specific rules (NPY)
    # "NPY",

    # Perflint (PERF)
    "PERF",

    # Refurb (FURB)
    "FURB",

    # flake8-logging (LOG)
    "LOG",

    # Ruff-specific rules (RUF)
    "RUF",
]

# Rules to ignore
ignore = [
    # Conflicts with formatter
    "W191",    # Tab indentation
    "E111",    # Indentation
    "E114",    # Indentation
    "E117",    # Over-indented
    "E501",    # Line too long (handled by formatter)
    "COM812",  # Trailing comma missing (ruff's own formatter warns this rule fights it)

    # Docstring rules (too strict for all code)
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "D203",    # 1 blank line required before class docstring (conflict)
    "D212",    # Multi-line docstring summary should start at first line (conflict)
    "D213",    # Multi-line docstring summary should start at second line

    # Type annotation rules (can be too strict)
    "ANN401",  # Dynamically typed expressions (Any)

    # Boolean traps (sometimes necessary)
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default value in function definition

    # Exception handling (sometimes too strict)
    "TRY003",  # Avoid specifying long messages outside exception class

    # Complexity (adjust as needed)
    "PLR0913", # Too many arguments

    # Unicode characters in docstrings and strings (intentional)
    "RUF001",  # String contains ambiguous Unicode character
    "RUF002",  # Docstring contains ambiguous Unicode character
    "RUF003",  # Comment contains ambiguous Unicode character

    # Module naming (src/state_machine/types.py intentionally shadows stdlib `types`)
    "A005",    # Module shadows a Python standard-library module
]

# Rules to treat as fixable
fixable = ["ALL"]

# Rules to not auto-fix
unfixable = [
    "F401",    # Unused imports (might be re-exports)
    "F841",    # Unused variables (might be intentional)
    "ERA001",  # Commented-out code (need manual review)
]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

