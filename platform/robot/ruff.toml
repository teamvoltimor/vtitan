    "T20",
    "INP001",
]

# Root-level entrypoints (not in a package)
"main.py" = [
    "INP001",
    "PLC0415",
]

# scipy's own docs use `from scipy.spatial.transform import Rotation as R`
"src/hardware/imu/bno08x/utils.py" = ["N817"]

# IMU_I2CNode / IMU_UART_RVCNode violate CapWords (N801) but renaming ripples
# across ~90 call sites (driver, the ros2_ws ament re-export shim including its
# IMU_RVCNode backward-compat alias, and both test files); deferred as a
# deliberate follow-up rather than done incidentally while enabling N.
"src/ros2/imu/bno08x/mcp2221/i2c_node.py" = ["N801"]
"src/ros2/imu/bno08x/mcp2221/uart_rvc_node.py" = ["N801"]

# Core navigator step() is complex by design — orchestrates all navigation subsystems
"src/navigation/core_navigator.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]

# corridor_for_position has 8 return branches for corridor classification
"src/navigation/planning/waypoints.py" = ["PLR0911"]

# ROS2 launch files are implicit namespace packages; function sig required by ROS2
"**/launch/*.py" = ["INP001", "ANN201", "D103"]

# `assert self.<property> is not None` narrows an internal invariant already
# enforced by the calling convention (e.g. only reachable after a successful
# connect()) so mypy can see it too -- not a bypassable security check.
"src/hardware/display/ssd1306/driver_raw_i2c.py" = ["S101"]
"src/hardware/hailo/streaming.py" = ["S101"]
"src/hardware/imu/bno08x/mcp2221/i2c.py" = ["S101"]
"ros2_ws/src/vtitan_drivers/vtitan_drivers/oled_display_node.py" = ["S101"]

# `Field(default_factory=lambda: X())` (not the bare class) is required so
# mypy's pydantic overload resolution actually type-checks X()'s own required
# fields instead of silently degrading to an "incompatible Callable" error.
"src/hardware/button/gpio/driver.py" = ["PLW0108"]
"src/hardware/button/mcp2221/config.py" = ["PLW0108"]
"src/hardware/imu/bno08x/i2c.py" = ["PLW0108"]
"src/hardware/imu/bno08x/uart_rvc.py" = ["PLW0108"]
"src/hardware/imu/bno08x/mcp2221/uart_rvc.py" = ["PLW0108"]
"src/hardware/motors/config.py" = ["PLW0108"]

"src/*.py" = []

# ============================================================================
# Rule-specific Configuration
# ============================================================================

# isort configuration
[lint.isort]
known-first-party = ["src"]
known-third-party = []
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
combine-as-imports = true
split-on-trailing-comma = true
force-wrap-aliases = true

# flake8-quotes configuration
[lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

# pydocstyle configuration
[lint.pydocstyle]
convention = "google"

# pylint configuration
[lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

# McCabe complexity
[lint.mccabe]
max-complexity = 10

# flake8-annotations configuration
[lint.flake8-annotations]
allow-star-arg-any = true
suppress-dummy-args = true
suppress-none-returning = true

# flake8-bugbear configuration
[lint.flake8-bugbear]
extend-immutable-calls = []

# flake8-builtins configuration
[lint.flake8-builtins]
builtins-ignorelist = ["id", "type", "format"]

# flake8-comprehensions configuration
[lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

# flake8-import-conventions configuration
[lint.flake8-import-conventions]
[lint.flake8-import-conventions.aliases]
"datetime" = "dt"
"numpy" = "np"
"pandas" = "pd"
"seaborn" = "sns"
"matplotlib.pyplot" = "plt"
"tensorflow" = "tf"
"torch" = "torch"

# flake8-pytest-style configuration
[lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true
parametrize-names-type = "tuple"
parametrize-values-type = "tuple"
parametrize-values-row-type = "tuple"

# flake8-tidy-imports configuration
[lint.flake8-tidy-imports]
ban-relative-imports = "all"

# flake8-type-checking configuration
[lint.flake8-type-checking]
strict = false
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

# ============================================================================
# Formatting Configuration
# ============================================================================
[format]
# Formatting style
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Docstring formatting
docstring-code-format = true
docstring-code-line-length = "dynamic"

# Preview features (opt-in to new formatting)
preview = false

# ============================================================================
# Usage Examples
# ============================================================================
# Lint entire project:
#   ruff check .
#
# Auto-fix issues:
#   ruff check --fix .
#
# Format code:
#   ruff format .
#
# Check and format:
#   ruff check --fix . && ruff format .
#
# Show violations without fixing:
#   ruff check --no-fix .
#
# Check specific files:
#   ruff check src/ tests/
#
# Watch mode (re-run on changes):
#   ruff check --watch .
#
# Generate configuration:
#   ruff check --show-settings
#
# List all rules:
#   ruff rule --all
#
# Explain a specific rule:
#   ruff rule E501
