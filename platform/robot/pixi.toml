[workspace]
name = "klevor-robot"
version = "0.1.0"
description = "WRO 2026 Future Engineers — ROS2 navigation runtime (hardware + simulation)"
channels = ["robostack-kilted", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64"]

[dependencies]
# ROS2 Kilted base (via RoboStack: https://github.com/RoboStack/ros-kilted)
ros-kilted-ros-base      = "*"
ros-kilted-geometry-msgs = "*"
ros-kilted-nav-msgs      = "*"
ros-kilted-sensor-msgs   = "*"

# Python runtime
python = ">=3.11"
numpy  = ">=1.26"
ros-kilted-rviz2 = ">=15.0.11,<16"
ros-kilted-rqt-graph = ">=1.7.1,<2"
scipy = ">=1.17.1,<2"
ros-kilted-ros-gz = ">=2.1.12,<3"
pyserial = ">=3.5,<4"
scipy-stubs = ">=1.17.1.3,<2"

[feature.dev.dependencies]
pytest = ">=8.0"
ruff   = ">=0.4"

[environments]
default = { features = [], solve-group = "default" }
dev     = { features = ["dev"], solve-group = "default" }

[tasks]
# Global defaults (Works for Linux x86 and ARM)
navigate = "python main.py navigate --metadata ../training_data/open/scenarios/scenario_0000_metadata.json"
drive    = "python main.py drive"
lint     = "ruff check src/"
test     = { cmd = "pytest tests/", env = { PYTHONPATH = "." } }

# ROS2 utilities
graph = "ros2 run rqt_graph rqt_graph"
viz   = "ros2 run rviz2 rviz2"
list-topics = "ros2 topic list"

# Launch a blank Gazebo world
sim = "gz sim empty.sdf"

# Launch Gazebo with the ROS bridge enabled
sim-bridge = "gz sim -r empty.sdf"

# ROS2 nodes
run-bno08x-mcp2221-uart-rvc-node = { cmd = "python src/ros2/imu/bno08x/mcp2221/uart_rvc_node.py", env = { PYTHONPATH = "." } }

[target.win-64.tasks]
# Windows-specific overrides to fix the "Multiple executables" error
graph = "ros2 run rqt_graph rqt_graph.exe"
viz   = "ros2 run rviz2 rviz2.exe"

[pypi-dependencies]
adafruit-circuitpython-bno08x-rvc = ">=1.0.23, <2"
buildhat = ">=0.9.0, <0.10"
