[workspace]
name = "vtitan-robot"
version = "0.1.0"
description = "WRO 2026 Future Engineers — ROS2 navigation runtime (hardware + simulation)"
channels = ["robostack-kilted", "conda-forge"]
# lgpio (Pi 5 GPIO backend) ships only builds requiring glibc >=2.34. Pixi defaults to an
# older minimum, so declare it explicitly per-platform (the modern replacement for the
# deprecated top-level [system-requirements] table). Satisfied by Debian 12+/Ubuntu 22.04+
# and the Pi OS image (glibc 2.41). win-64 has no glibc concept, left unconstrained.
platforms = [
  { platform = "linux-64", glibc = "2.34" },
  { platform = "linux-aarch64", glibc = "2.34" },
  "win-64",
]

[dependencies]
# ROS2 Kilted base
ros-kilted-ros-base       = "*"
ros-kilted-geometry-msgs  = "*"
ros-kilted-nav-msgs       = "*"
ros-kilted-sensor-msgs    = "*"
ros-kilted-ackermann-msgs = "*"
ros-kilted-vision-msgs    = "*"
ros-kilted-joy            = "*"

# ROS2 Kilted tools
ros-kilted-std-srvs = ">=5.5.1,<6"
ros-kilted-cv-bridge = "*"

# Python runtime
# Pinned below the repo's 3.14 baseline (see hailo/.python-version) because
# this environment is RoboStack/conda-managed via Pixi, not uv/mise -- the
# ceiling here is whatever ros-kilted-* conda packages currently support, not
# a standalone choice.
python = ">=3.12"
numpy  = ">=1.26,<2"
scipy = ">=1.17.1,<2"
pyserial = ">=3.5,<4"
scipy-stubs = ">=1.17.1.3,<2"
opencv = ">=4.9.0,<5"
ros-kilted-std-msgs = "*"
pydantic = ">=2.13.3,<3"
pydantic-settings = ">=2.14.0,<3"
# Declared explicitly (not just left as a transitive adafruit-circuitpython-ssd1306
# requirement) -- the solver otherwise only resolved it into environments that also
# pull ultralytics/rviz2 through the same conda-mapping path, silently dropping it
# from default/dev and breaking every "from PIL import Image" in the OLED code.
pillow = ">=8"
# Runtime dependency of telemetry_bridge_node (posts to the backend over
# HTTP) -- only types-requests (the mypy stub) was declared before, so the
# node imported cleanly under type-checking but crashed at runtime.
requests = ">=2.32,<3"
# Backend<->robot gRPC command channel (RobotCommandService, gen/telemetry/v1).
# protobuf floor matches the runtime version stamped into the generated
# *_pb2.py files (see ValidateProtobufRuntimeVersion in commands_pb2.py) --
# a runtime older than that raises at import time, not just at call time. No
# upper bound: conda-forge's protobuf is tied to libprotobuf, which several
# ROS2/Gazebo conda packages also constrain, so pinning <6 here made the
# solver unsatisfiable against ros-kilted-cv-bridge/ros-kilted-ros-gz.
# (buf.validate's own generated buf/validate/validate_pb2.py -- every message
# here carries buf.validate field options, referenced unconditionally at
# module load -- is vendored straight into gen/ via buf.gen.yaml's
# include_imports, not a separate PyPI dependency: no current protovalidate
# release actually bundles it, unlike protovalidate-go on the backend side.)
grpcio = ">=1.66"
protobuf = ">=5.28"

[feature.dev.dependencies]
pytest                   = ">=8.0"
ruff = ">=0.15.8,<0.16"
mypy = ">=1.14,<2"
types-pyyaml = "*"
types-requests = "*"
ros-kilted-ament-cmake   = ">=2.7.4,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
cmake                    = ">=4.3.1,<5"
ninja                    = ">=1.13.2,<2"

# Simulation/visualization tooling — NOT needed on real hardware (headless Pi
# 5 / Pi Zero running actual ROS2 nodes), only for local dev-machine work.
# Kept out of the unconditional base [dependencies] so `pixi install -e dev`
# on the Pi doesn't have to solve/fetch Gazebo + RViz.
[feature.sim.dependencies]
ros-kilted-rviz2 = ">=15.0.11,<16"
ros-kilted-rqt-graph = ">=1.7.1,<2"
ros-kilted-ros-gz = ">=2.1.12,<3"

[pypi-dependencies]
vtitan-shared = { path = "../shared", editable = true }
adafruit-circuitpython-bno08x-rvc = ">=1.0.23, <2"
buildhat = ">=0.9.0, <0.10"
adafruit-blinka = ">=9.0.4, <10"
adafruit-circuitpython-bno08x = ">=1.3.2, <2"
adafruit-circuitpython-ssd1306 = ">=2.12, <3"
python-dotenv = ">=1.0, <2"
mcp2221 = ">=1.0"

# No Windows build deps — sllidar_ros2 only builds on Linux
[feature.dev.target.linux-64.dependencies]
cxx-compiler = "*"

[feature.dev.target.linux-aarch64.dependencies]
cxx-compiler = "*"

# ARCH: AARCH64 (Raspberry Pi 5 / Pi Zero 2W)
# lgpio backs adafruit-blinka GPIO on Bookworm+ (bcm2712/bcm2710) — required by
# the IMU and OLED hardware nodes. Pi-only: no GPIO on dev x86/Windows hosts.
[target.linux-aarch64.dependencies]
lgpio = ">=0.2.2,<0.3"

[target.linux-aarch64.pypi-dependencies]
# adafruit-blinka's board/GPIO detection imports the "RPi" namespace directly
# (not "lgpio") -- rpi-lgpio is a drop-in RPi.GPIO-compatible shim built on
# lgpio, needed on Bookworm+ where the classic RPi.GPIO package doesn't work.
rpi-lgpio = ">=0.6,<1"

# Vision (ultralytics + hailort) — ONLY needed where vision_node/Hailo NPU
# actually run (Pi 5). Feature-gated out of every other environment: pulling
# ultralytics drags in torch/torchvision/CUDA metadata (1GB+), which is fine
# on a dev machine or Pi 5 but repeatedly destabilized `pixi install`/`pixi
# run` on the Pi Zero 2W (415MB RAM) -- a device that only ever runs the
# button + OLED nodes and has no Hailo hardware at all. Use: pixi run -e vision ...
[feature.vision.pypi-dependencies]
ultralytics = ">=8.1.0,<9"

[feature.vision.target.linux-64.pypi-dependencies]
hailort = { path = "libs/linux_x86_64/hailort-4.23.0-cp312-cp312-linux_x86_64.whl" }

[feature.vision.target.linux-aarch64.pypi-dependencies]
hailort = { path = "libs/linux_aarch64/hailort-4.23.0-cp312-cp312-linux_aarch64.whl" }

# ARCH: AMD64 (Windows 10/11) — ROS2 Kilted doesn't support Windows, so no build deps, but we can still install the Python runtime deps for development and testing
[feature.vision.target.win-64.pypi-dependencies]
hailort = { path = "libs/win_amd64/hailort-4.23.0-cp312-cp312-win_amd64.whl" }

[environments]
default = { features = [], solve-group = "default" }
dev     = { features = ["dev"], solve-group = "default" }
# Adds ultralytics/hailort on top of dev -- for Pi 5 (vision_node/Hailo NPU) and
# dev-machine vision work. NOT installed on the Pi Zero (button + OLED only).
vision  = { features = ["dev", "vision"], solve-group = "default" }
# Local dev-machine environment for simulation/visualization work (Gazebo,
# RViz, rqt_graph) — not installed on real hardware. Use: pixi run -e sim ...
sim     = { features = ["dev", "sim"], solve-group = "default" }

[tasks]
# Global defaults (Works for Linux x86 and ARM)
navigate = "python main.py navigate --metadata ../training_data/open/scenarios/scenario_0000_metadata.json"
drive    = "python main.py drive"
visualize-scenario = { cmd = "python -m src.simulation.visualize_scenario", env = { PYTHONPATH = "." } }
deviation-envelope = { cmd = "python -m src.simulation.find_recovery_envelope", env = { PYTHONPATH = "." } }

# ROS2 utilities
graph = "ros2 run rqt_graph rqt_graph"
viz   = "ros2 run rviz2 rviz2 -d config/live_visualization.rviz"
list-topics = "ros2 topic list"

# Launch a blank Gazebo world
sim = "gz sim empty.sdf"

# Launch Gazebo with the ROS bridge enabled
sim-bridge = "gz sim -r empty.sdf"

# ROS2 nodes (requires: pixi run -e dev build-ws first)
# Wrapped in `bash -c` because pixi's built-in cross-platform task shell has
# no sourcing support at all (neither bash's "source" nor POSIX "."), so it
# can't apply ros2_ws/install/setup.bash's env side effects on its own.
run-imu-i2c        = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 run vtitan_drivers bno08x_i2c_node'", env = { PYTHONPATH = "." } }
run-imu-rvc        = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 run vtitan_drivers bno08x_uart_rvc_node'", env = { PYTHONPATH = "." } }
run-state-machine  = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 run vtitan_state_machine state_machine_node'", env = { PYTHONPATH = "." } }
run-oled           = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 run vtitan_drivers oled_display_node'", env = { PYTHONPATH = "." } }
run-motor          = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 run vtitan_drivers ackermann_motor_node'", env = { PYTHONPATH = "." } }
run-joy-teleop     = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 run vtitan_drivers joy_teleop_node'", env = { PYTHONPATH = "." } }
run-telemetry      = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 run vtitan_state_machine telemetry_bridge_node'", env = { PYTHONPATH = "." } }
run-vision         = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 run vtitan_vision vision_node'", env = { PYTHONPATH = "." } }
run-navigator      = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 run vtitan_navigation track_navigator_node --metadata ../training_data/open/scenarios/scenario_0000_metadata.json'", env = { PYTHONPATH = "." } }

# ROS2 launch files (compose multiple nodes — requires build-ws first)
launch-rpi5            = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 launch vtitan_bringup rpi5_nodes.launch.py'", env = { PYTHONPATH = "." } }
launch-rpi-zero        = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 launch vtitan_bringup rpi_zero_nodes.launch.py'", env = { PYTHONPATH = "." } }
launch-state-machine   = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 launch vtitan_bringup wro_state_machine_launch.py'", env = { PYTHONPATH = "." } }
launch-telemetry       = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 launch vtitan_bringup telemetry_bridge_launch.py'", env = { PYTHONPATH = "." } }
launch-simulator       = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 launch vtitan_bringup simulator.launch.py'", env = { PYTHONPATH = "." } }
launch-lidar           = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 launch vtitan_bringup lidar_launch.py'", env = { PYTHONPATH = "." } }
launch-joy-teleop      = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 launch vtitan_bringup joy_teleop_launch.py'", env = { PYTHONPATH = "." } }

# Control mode switching -- exactly one of these should be running on the Pi
# 5 at a time (both publish to /ackermann_cmd; nothing arbitrates between
# them). ackermann_motor_node on the Pi Zero stays running throughout either
# way, so switching just means stopping one of these and starting the other.
# `drive-mode` picks between them at runtime via ROBOT_CONTROL_MODE (default
# navigation) so the same command works from a script/alias regardless of
# mode; `drive-navigation`/`drive-controller` are the explicit equivalents.
# (Not named `drive` -- that task already runs the simulation's main.py.)
# SCENARIO_METADATA overrides the default scenario for drive-navigation/drive-mode.
drive-navigation       = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 launch vtitan_bringup race.launch.py metadata:=${SCENARIO_METADATA:-../training_data/open/scenarios/scenario_0000_metadata.json}'", env = { PYTHONPATH = "." } }
drive-controller       = { cmd = "bash -c '. ros2_ws/install/setup.bash && ros2 launch vtitan_bringup joy_teleop_launch.py'", env = { PYTHONPATH = "." } }
drive-mode             = { cmd = "bash -c '. ros2_ws/install/setup.bash && case \"${ROBOT_CONTROL_MODE:-navigation}\" in joystick) ros2 launch vtitan_bringup joy_teleop_launch.py ;; navigation) ros2 launch vtitan_bringup race.launch.py metadata:=${SCENARIO_METADATA:-../training_data/open/scenarios/scenario_0000_metadata.json} ;; *) echo \"Unknown ROBOT_CONTROL_MODE: ${ROBOT_CONTROL_MODE} (expected joystick or navigation)\" 1>&2; exit 1 ;; esac'", env = { PYTHONPATH = "." } }
# Zeros the drive command and recenters steering immediately -- run after
# switching modes (or after Ctrl+C'ing either drive-* task) instead of
# waiting on ackermann_motor_node's 1s watchdog, which stops the drive motor
# but never recenters steering. See scripts/reset-motors.py.
reset-motors           = { cmd = "bash -c '. ros2_ws/install/setup.bash && python3 scripts/reset-motors.py'", env = { PYTHONPATH = "." } }

# Fetch the third-party Slamtec LIDAR driver into the workspace (idempotent).
# Required before build-ws if you intend to use run-lidar / launch-lidar.
fetch-lidar-driver = "test -d ros2_ws/src/sllidar_ros2 || git clone https://github.com/Slamtec/sllidar_ros2.git ros2_ws/src/sllidar_ros2"

[target.win-64.tasks]
# Windows-specific overrides to fix the "Multiple executables" error.
# `ros2` itself is unusable here: conda-forge ships Library/bin/ros2.exe as a
# setuptools console-script launcher whose embedded shebang is the relative
# `#!python.exe`, so it looks for python.exe next to itself in Library/bin --
# but the env's interpreter lives in the env root. Every invocation dies with
# "failed to create process." before ros2cli ever runs. rviz2 is a native C++
# binary on Library/bin (already on PATH inside the env), so call it directly
# instead of routing through `ros2 run`.
graph = "python Library/bin/rqt_graph-script.py"
viz   = "rviz2.exe -d config/live_visualization.rviz"

# pytest/ruff/mypy only exist in the dev feature (see [feature.dev.dependencies])
# -- these must live here, not in the global [tasks], or `pixi run <task>`
# silently resolves against the `default` environment, which lacks all three
# and falls through to whatever's on the system PATH instead of the pinned
# pixi-managed tool. That's a silent false-pass, not a "command not found"
# error: system mypy in particular can't see this env's editable-installed
# packages (e.g. vtitan-shared), so every third-party/first-party type
# check silently degrades to Any instead of raising the configured errors.
[feature.dev.tasks]
# check-only by default (CI-safe -- fails on violations instead of silently
# rewriting files); use lint-fix for the old auto-fix convenience locally.
lint       = "ruff check ."
lint-fix   = "ruff check --fix ."
format-check = "ruff format --check ."
typecheck  = { cmd = "mypy src/ ros2_ws/src/vtitan_drivers/vtitan_drivers ros2_ws/src/vtitan_navigation/vtitan_navigation ros2_ws/src/vtitan_vision/vtitan_vision ros2_ws/src/vtitan_state_machine/vtitan_state_machine", env = { PYTHONPATH = "." } }
test     = { cmd = "pytest tests/ -m 'not hardware'", env = { PYTHONPATH = "." } }
test-hardware = { cmd = "pytest tests/hardware -m hardware", env = { PYTHONPATH = "." } }

# sllidar_ros2 SDK hardcodes Linux arch sources — build-ws is Linux-only
[feature.dev.target.linux-64.tasks]
# --merged-install: colcon's isolated per-package install layout drops the
# ament_prefix_path environment hook for ament_python packages that install
# real Python modules (find_packages() non-empty) -- ros2 run/ros2 pkg list
# can't find them even though the build succeeds. Merging into one shared
# prefix sidesteps the per-package hook-generation gap entirely.
build-ws = "colcon build --symlink-install --merge-install --base-paths ros2_ws/src --build-base ros2_ws/build --install-base ros2_ws/install"

[feature.dev.target.linux-aarch64.tasks]
build-ws = "colcon build --symlink-install --merge-install --base-paths ros2_ws/src --build-base ros2_ws/build --install-base ros2_ws/install"

[target.linux-aarch64.tasks]
# frame_id matches static_tfs.launch.py's child_frame_id for lidar -- must stay in sync.
# inverted:=true -- the C1 is mounted upside-down, which mirrors left/right in the raw
# scan (confirmed empirically: front/back read correctly with just the yaw offset, but
# left and right came out swapped until this was set).
run-lidar = "bash -c '. ros2_ws/install/setup.bash && ros2 launch sllidar_ros2 sllidar_c1_launch.py serial_port:=/dev/ttyUSB0 frame_id:=lidar_link inverted:=true'"

# Run ON Pi 5 -- one-shot setup for a freshly-flashed Pi Zero (SSH trust,
# .env, pixi CLI, I2C, systemd unit). Idempotent, safe to re-run. See
# docs/sensor-verification.md's "Setting up a freshly-flashed Pi Zero" section.
# Run this BEFORE deploy-dev-env-to-zero for a Zero that's never been set up.
bootstrap-fresh-zero = "bash scripts/bootstrap-fresh-zero.sh"

# Run ON Pi 5 -- builds the dev env + ros2_ws there and ships it to the Pi
# Zero as tarballs instead of running pixi/colcon directly on the Zero's
# ~415MB RAM (see scripts/deploy-dev-env-to-zero.sh's header and
# docs/sensor-verification.md's Pi Zero deployment section for why).
deploy-dev-env-to-zero = "bash scripts/deploy-dev-env-to-zero.sh"

# Run ON Pi 5 -- cleanly shuts the Zero down (stop service, sync, shutdown -h
# now) before you cut its power. See docs/sensor-verification.md's "Always
# shut the Zero down cleanly before cutting power" section for why: pulling
# power on a running Zero leaves the ext4 journal uncommitted and has
# corrupted the filesystem before.
safe-shutdown-zero = "bash scripts/safe-shutdown-zero.sh"

# Run ON Pi 5 -- shuts the Zero down first (via safe-shutdown-zero, above),
# then shuts Pi 5 itself down last, once the Zero is confirmed offline. Use
# this before switching the robot's power source (e.g. wall/USB -> battery)
# so both boards go down cleanly in the right order with one command.
safe-shutdown-both = "bash scripts/safe-shutdown-both.sh"

# Run ON Pi 5 -- end-to-end health check: USB-gadget link, systemd service
# state, ROS2 cross-board topic discovery, and a real AckermannDriveStamped
# publish -> motor driver -> feedback round-trip. Safe with motors unpowered.
verify-zero-integration = "bash scripts/verify-zero-integration.sh"

# Run ON Pi 5 -- one-shot Bluetooth pairing for a joystick used with
# joy_teleop_node (e.g. 8BitDo Ultimate 2). Idempotent, safe to re-run. Put
# the controller in pairing mode first. See docs/joystick-teleop.md.
setup-joystick = "bash scripts/setup-joystick.sh"

# Run ON Pi 5 -- hardware smoke test for ackermann_motor_node: steering servo
# range of motion, then a low-speed drive pulse, checking real feedback (not
# just that the topics exist) after each command. Steering-only is safe with
# the robot sitting still; the drive test spins the wheels and asks for a
# typed confirmation first (pass --yes to skip the prompt, --skip-drive to
# omit it entirely). See scripts/test-motors.py --help for all options.
test-motors = "bash -c '. ros2_ws/install/setup.bash && python3 scripts/test-motors.py'"
