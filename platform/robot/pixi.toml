[workspace]
name = "voldemorbot-robot"
version = "0.1.0"
description = "WRO 2026 Future Engineers — ROS2 navigation runtime (hardware + simulation)"
channels = ["robostack-kilted", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64"]

# lgpio (Pi 5 GPIO backend) ships only builds requiring glibc >=2.34. Pixi
# defaults to an older minimum, so declare it explicitly. Satisfied by Debian
# 12+/Ubuntu 22.04+ and the Pi OS image (glibc 2.41).
[system-requirements]
libc = { family = "glibc", version = "2.34" }

[dependencies]
# ROS2 Kilted base
ros-kilted-ros-base       = "*"
ros-kilted-geometry-msgs  = "*"
ros-kilted-nav-msgs       = "*"
ros-kilted-sensor-msgs    = "*"
ros-kilted-ackermann-msgs = "*"

# ROS2 Kilted tools
ros-kilted-rviz2 = ">=15.0.11,<16"
ros-kilted-rqt-graph = ">=1.7.1,<2"
ros-kilted-ros-gz = ">=2.1.12,<3"
ros-kilted-std-srvs = ">=5.5.1,<6"

# Python runtime
python = ">=3.12"
numpy  = ">=1.26,<2"
scipy = ">=1.17.1,<2"
pyserial = ">=3.5,<4"
scipy-stubs = ">=1.17.1.3,<2"
opencv = ">=4.9.0,<5"
ros-kilted-std-msgs = "*"
pydantic = ">=2.13.3,<3"
pydantic-settings = ">=2.14.0,<3"

[feature.dev.dependencies]
pytest                   = ">=8.0"
ruff = ">=0.15.8,<0.16"
ros-kilted-ament-cmake   = ">=2.7.4,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
cmake                    = ">=4.3.1,<5"
ninja                    = ">=1.13.2,<2"

[pypi-dependencies]
voldemorbot-shared = { path = "../shared", editable = true }
adafruit-circuitpython-bno08x-rvc = ">=1.0.23, <2"
buildhat = ">=0.9.0, <0.10"
adafruit-blinka = ">=9.0.4, <10"
adafruit-circuitpython-bno08x = ">=1.3.2, <2"
adafruit-circuitpython-ssd1306 = ">=2.12, <3"
python-dotenv = ">=1.0, <2"
ultralytics = ">=8.1.0,<9"
mcp2221 = ">=1.0"

# No Windows build deps — sllidar_ros2 only builds on Linux
[feature.dev.target.linux-64.dependencies]
cxx-compiler = "*"

[feature.dev.target.linux-aarch64.dependencies]
cxx-compiler = "*"

# ARCH: AMD64 (Linux x86_64)
[target.linux-64.pypi-dependencies]
hailort = { path = "libs/linux_x86_64/hailort-4.23.0-cp312-cp312-linux_x86_64.whl" }

# ARCH: AARCH64 (Raspberry Pi 5)
# lgpio backs adafruit-blinka GPIO on the Pi 5 (bcm2712) — required by the IMU
# and OLED hardware nodes. Pi-only: no GPIO on dev x86/Windows hosts.
[target.linux-aarch64.dependencies]
lgpio = ">=0.2.2,<0.3"

[target.linux-aarch64.pypi-dependencies]
hailort = { path = "libs/linux_aarch64/hailort-4.23.0-cp312-cp312-linux_aarch64.whl" }

# ARCH: AMD64 (Windows 10/11) — ROS2 Kilted doesn't support Windows, so no build deps, but we can still install the Python runtime deps for development and testing
[target.win-64.pypi-dependencies]
hailort = { path = "libs/win_amd64/hailort-4.23.0-cp312-cp312-win_amd64.whl" }

[environments]
default = { features = [], solve-group = "default" }
dev     = { features = ["dev"], solve-group = "default" }

[tasks]
# Global defaults (Works for Linux x86 and ARM)
navigate = "python main.py navigate --metadata ../training_data/open/scenarios/scenario_0000_metadata.json"
drive    = "python main.py drive"
visualize-scenario = { cmd = "python -m src.simulation.visualize_scenario", env = { PYTHONPATH = "." } }
lint     = "ruff check --fix src/"
test     = { cmd = "pytest tests/ -m 'not hardware'", env = { PYTHONPATH = "." } }
test-hardware = { cmd = "pytest tests/hardware -m hardware", env = { PYTHONPATH = "." } }

# ROS2 utilities
graph = "ros2 run rqt_graph rqt_graph"
viz   = "ros2 run rviz2 rviz2 -d config/live_visualization.rviz"
list-topics = "ros2 topic list"

# Launch a blank Gazebo world
sim = "gz sim empty.sdf"

# Launch Gazebo with the ROS bridge enabled
sim-bridge = "gz sim -r empty.sdf"

# ROS2 nodes (requires: pixi run -e dev build-ws first)
run-imu-i2c        = { cmd = "source ros2_ws/install/setup.bash && ros2 run voldemorbot_robot bno08x_i2c_node", env = { PYTHONPATH = "." } }
run-imu-rvc        = { cmd = "source ros2_ws/install/setup.bash && ros2 run voldemorbot_robot bno08x_uart_rvc_node", env = { PYTHONPATH = "." } }
run-state-machine  = { cmd = "source ros2_ws/install/setup.bash && ros2 run voldemorbot_robot state_machine_node", env = { PYTHONPATH = "." } }
run-oled           = { cmd = "source ros2_ws/install/setup.bash && ros2 run voldemorbot_robot oled_display_node", env = { PYTHONPATH = "." } }
run-motor          = { cmd = "source ros2_ws/install/setup.bash && ros2 run voldemorbot_robot ackermann_motor_node", env = { PYTHONPATH = "." } }
run-telemetry      = { cmd = "source ros2_ws/install/setup.bash && ros2 run voldemorbot_robot telemetry_bridge_node", env = { PYTHONPATH = "." } }
run-vision         = { cmd = "source ros2_ws/install/setup.bash && ros2 run voldemorbot_robot vision_node", env = { PYTHONPATH = "." } }
run-navigator      = { cmd = "source ros2_ws/install/setup.bash && ros2 run voldemorbot_robot track_navigator_node --metadata ../training_data/open/scenarios/scenario_0000_metadata.json", env = { PYTHONPATH = "." } }

# ROS2 launch files (compose multiple nodes — requires build-ws first)
launch-rpi5            = { cmd = "source ros2_ws/install/setup.bash && ros2 launch voldemorbot_robot rpi5_nodes.launch.py", env = { PYTHONPATH = "." } }
launch-rpi-zero        = { cmd = "source ros2_ws/install/setup.bash && ros2 launch voldemorbot_robot rpi_zero_nodes.launch.py", env = { PYTHONPATH = "." } }
launch-state-machine   = { cmd = "source ros2_ws/install/setup.bash && ros2 launch voldemorbot_robot wro_state_machine_launch.py", env = { PYTHONPATH = "." } }
launch-telemetry       = { cmd = "source ros2_ws/install/setup.bash && ros2 launch voldemorbot_robot telemetry_bridge_launch.py", env = { PYTHONPATH = "." } }
launch-simulator       = { cmd = "source ros2_ws/install/setup.bash && ros2 launch voldemorbot_robot simulator.launch.py", env = { PYTHONPATH = "." } }
launch-lidar           = { cmd = "source ros2_ws/install/setup.bash && ros2 launch voldemorbot_robot lidar_launch.py", env = { PYTHONPATH = "." } }

# Fetch the third-party Slamtec LIDAR driver into the workspace (idempotent).
# Required before build-ws if you intend to use run-lidar / launch-lidar.
fetch-lidar-driver = "test -d ros2_ws/src/sllidar_ros2 || git clone https://github.com/Slamtec/sllidar_ros2.git ros2_ws/src/sllidar_ros2"

[target.win-64.tasks]
# Windows-specific overrides to fix the "Multiple executables" error
graph = "ros2 run rqt_graph rqt_graph.exe"
viz   = "ros2 run rviz2 rviz2.exe -d config/live_visualization.rviz"

# sllidar_ros2 SDK hardcodes Linux arch sources — build-ws is Linux-only
[feature.dev.target.linux-64.tasks]
build-ws = "colcon build --symlink-install --base-paths ros2_ws/src --build-base ros2_ws/build --install-base ros2_ws/install"

[feature.dev.target.linux-aarch64.tasks]
build-ws = "colcon build --symlink-install --base-paths ros2_ws/src --build-base ros2_ws/build --install-base ros2_ws/install"

[target.linux-aarch64.tasks]
run-lidar = "source ros2_ws/install/setup.bash && ros2 launch sllidar_ros2 sllidar_c1_launch.py serial_port:=/dev/ttyUSB0"
