[workspace]
name = "klevor-robot"
version = "0.1.0"
description = "WRO 2026 Future Engineers — ROS2 navigation runtime (hardware + simulation)"
channels = ["robostack-kilted", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64"]

[dependencies]
# ROS2 Kilted base
ros-kilted-ros-base      = "*"
ros-kilted-geometry-msgs = "*"
ros-kilted-nav-msgs      = "*"
ros-kilted-sensor-msgs   = "*"

# ROS2 Kilted tools
ros-kilted-rviz2 = ">=15.0.11,<16"
ros-kilted-rqt-graph = ">=1.7.1,<2"
ros-kilted-ros-gz = ">=2.1.12,<3"
ros-kilted-std-srvs = ">=5.5.1,<6"

# Python runtime
python = ">=3.11"
numpy  = ">=1.26"
scipy = ">=1.17.1,<2"
pyserial = ">=3.5,<4"
scipy-stubs = ">=1.17.1.3,<2"

[feature.dev.dependencies]
pytest                   = ">=8.0"
ruff = ">=0.15.8,<0.16"
ros-kilted-ament-cmake   = ">=2.7.4,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
cmake                    = ">=4.3.1,<5"
ninja                    = ">=1.13.2,<2"

# No Windows build deps — sllidar_ros2 only builds on Linux
[feature.dev.target.linux-64.dependencies]
cxx-compiler = "*"

[feature.dev.target.linux-aarch64.dependencies]
cxx-compiler = "*"

[environments]
default = { features = [], solve-group = "default" }
dev     = { features = ["dev"], solve-group = "default" }

# sllidar_ros2 SDK hardcodes Linux arch sources — build-ws is Linux-only
[feature.dev.target.linux-64.tasks]
build-ws = "colcon build --symlink-install --base-paths ros2_ws/src --build-base ros2_ws/build --install-base ros2_ws/install"

[feature.dev.target.linux-aarch64.tasks]
build-ws = "colcon build --symlink-install --base-paths ros2_ws/src --build-base ros2_ws/build --install-base ros2_ws/install"

[target.linux-aarch64.tasks]
run-lidar = "source ros2_ws/install/setup.bash && ros2 launch sllidar_ros2 sllidar_c1_launch.py serial_port:=/dev/ttyUSB0"

[tasks]
# Global defaults (Works for Linux x86 and ARM)
navigate = "python main.py navigate --metadata ../training_data/open/scenarios/scenario_0000_metadata.json"
drive    = "python main.py drive"
lint     = "ruff check --fix src/"
test     = { cmd = "pytest tests/", env = { PYTHONPATH = "." } }

# ROS2 utilities
graph = "ros2 run rqt_graph rqt_graph"
viz   = "ros2 run rviz2 rviz2"
list-topics = "ros2 topic list"

# Launch a blank Gazebo world
sim = "gz sim empty.sdf"

# Launch Gazebo with the ROS bridge enabled
sim-bridge = "gz sim -r empty.sdf"

# ROS2 nodes (requires: pixi run -e dev build-ws first)
run-imu-i2c     = { cmd = "source ros2_ws/install/setup.bash && ros2 run klevor_robot bno08x_i2c_node", env = { PYTHONPATH = "." } }
run-imu-rvc     = { cmd = "source ros2_ws/install/setup.bash && ros2 run klevor_robot bno08x_uart_rvc_node", env = { PYTHONPATH = "." } }

[target.win-64.tasks]
# Windows-specific overrides to fix the "Multiple executables" error
graph = "ros2 run rqt_graph rqt_graph.exe"
viz   = "ros2 run rviz2 rviz2.exe"

[pypi-dependencies]
adafruit-circuitpython-bno08x-rvc = ">=1.0.23, <2"
buildhat = ">=0.9.0, <0.10"
adafruit-blinka = ">=9.0.4, <10"
adafruit-circuitpython-bno08x = ">=1.3.2, <2"
