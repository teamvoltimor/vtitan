# Minimal nats-server config for the vTitan robot's on-Pi-5 broker.
# Both boards are nats.go clients connecting over the USB-gadget link (usb0);
# this broker is the hub. See platform/robot/docs/internal/plans/
# go-migration-plan.md "Transport decision" for why NATS (not Zenoh) and the
# hub-and-spoke shape.
#
# No auth: the gadget link is a private point-to-point network between the two
# boards, not exposed to WiFi. If the broker is ever reachable from a shared
# network, add `authorization { users [ ... ] }` here before that happens.

# Listen on all interfaces so the Pi Zero reaches us over usb0 (192.168.250.x)
# as well as localhost.
listen: 0.0.0.0:4222

# Write deadline: bound how long a single write to a slow client may block.
write_deadline: 2s

# Ping/pong keepalive -- tuned tighter than nats-server's defaults so a silently
# dead client socket (open but no traffic) is recycled promptly. Mirrors the
# client-side PingInterval/MaxPingsOutstanding in internal/transport/nats, which
# the broker side must also enforce or a half-dead link goes unnoticed.
ping_interval: 10s
ping_max: 2

# Max payload per message. The largest topic is an MCAP/bag debug frame on
# /scan or /nav_debug; 8 MiB covers a single LIDAR scan frame with margin.
max_payload: 8388608

# Disable the HTTP monitoring port by default -- it is not needed on-robot and
# would be another exposed surface. Enable (http_port: 8222) only for local
# debugging, bound to localhost.
http_port: -1

# Don't write a PID file; systemd tracks the process directly.
pid_file: ""
