version: '3'

vars:
  PYTHON: uv
  ROS2: pixi
  SCENARIOS: 10
  CHALLENGE: open
  OUTPUT_DIR: ../training_data
  BASE_WORLD: ./simulation/worlds/wro_track_2026.sdf
  METADATA: ../training_data/open/scenarios/scenario_0000_metadata.json
  LAPS: 3
  PARAMS: ./simulation/scripts/navigator_params.json
  GRPC_ADDR: localhost:9010

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: Display all available commands
    cmds:
      - |
        echo "
        VOLDEMORBOT PLATFORM — Taskfile Commands

        SETUP & INSTALLATION
          task install              Install all dependencies (UV + Pixi + Go)
          task install:backend   Bootstrap Go backend (buf generate + go mod tidy)
          task install:frontend     Install frontend dependencies
          task install:robot        Install robot dependencies
          task install:sim          Install simulation dependencies

        PROTO (buf toolchain — requires buf CLI)
          task proto:update         Update buf registry dependencies
          task proto:generate       Generate Go, Python, and TypeScript code from .proto files
          task proto:lint           Lint proto files
          task proto:breaking       Check proto files for breaking changes vs master

        GO BACKEND
          task dev:backend          Run Go backend with --sim synthetic generator (dev)
          task run:backend          Run Go backend production mode (expects robot gRPC feed)
          task build:backend        Compile Go backend binary to backend/bin/server
          task test:backend         Run Go backend tests
          task lint:backend         Run golangci-lint on Go backend
          task lint:fix:backend     Auto-fix Go backend lint issues
          task fmt:backend          Format Go backend (goimports + gofmt)
          task sqlc:generate        Regenerate Go DB layer from SQL (requires sqlc CLI)

        SIMGEN (Go scenario generator)
          task build:simgen         Compile simgen binary to simgen/bin/simgen
          task test:simgen          Run simgen tests
          task lint:simgen          Run golangci-lint on simgen
          task lint:fix:simgen      Auto-fix simgen lint issues
          task fmt:simgen           Format simgen code (golangci-lint fmt — goimports + golines)

        FRONTEND (Vite + React telemetry dashboard)
          task dev:frontend         Run dev server (http://localhost:5173) — append ?demo for mock data
          task dev:frontend:demo    Run dev server in Demo Mode (mock telemetry, no backend)
          task build:frontend       Type-check + production build (dist/)
          task preview:frontend     Preview the production build locally
          task typecheck:frontend   Type-check only (tsc -b)
          task lint:frontend        Run ESLint on the frontend
          task docker:build:frontend  Build frontend Docker image (nginx static)
          task docker:run:frontend    Run frontend container (http://localhost:8080)

        TRACK GENERATION
          task gen:track        Generate/regenerate WRO 2026 track worlds

        SCENARIO GENERATION
          task gen:open         Generate open-challenge scenarios (SCENARIOS=10 default)
          task gen:obstacles    Generate obstacles-challenge scenarios
          task gen:all          Generate both open and obstacles scenarios

        NAVIGATION & SIMULATION
          task navigate         Run navigator on scenario (METADATA override)
          task record           Record scenario videos (requires Gazebo + ROS2)
          task sim:gazebo       Launch Gazebo simulator
          task sim:rviz         Launch RViz visualization

        VIDEO & FRAME PROCESSING
          task convert:bags     Convert ROS2 bags to MP4 videos
          task extract:frames   Extract frames from bags and annotate

        TESTING & CODE QUALITY
          task test             Run all tests (Python + Go)
          task test:backend  Run Go backend tests
          task test:sim         Run simulation tests
          task lint             Run all linters (ruff + golangci-lint + buf lint)
          task lint:fix         Auto-fix linting issues in all modules

        DOCKER (if configured)
          task docker:build     Build Docker images
          task docker:up        Start Docker Compose services
          task docker:down      Stop Docker Compose services
          task docker:logs      View Docker Compose logs

        CLEANUP
          task clean            Remove all generated training data
          task clean:cache      Clean Python cache and compiled files
          task clean:go         Remove Go build cache and binaries

        ANALYSIS & DEBUGGING
          task analyze          Analyze generated scenarios
          task debug            Run with verbose logging

        VARIABLES (override with task NAME -- VAR=value)
          SCENARIOS={{.SCENARIOS}}   CHALLENGE={{.CHALLENGE}}   LAPS={{.LAPS}}
          OUTPUT_DIR={{.OUTPUT_DIR}}   METADATA={{.METADATA}}
          GRPC_ADDR={{.GRPC_ADDR}}
        "

  # SETUP & INSTALLATION

  install:
    desc: Install all dependencies (UV + Pixi + Go backend bootstrap)
    cmds:
      - uv sync
      - pixi install
      - task: install:backend

  install:backend:
    desc: Bootstrap Go backend — update buf deps, generate proto code, sqlc, tidy Go modules
    cmds:
      - task: proto:update
      - task: proto:generate
      - task: sqlc:generate
      - cd backend && go mod tidy

  sqlc:generate:
    desc: Regenerate Go database access layer from SQL schema and queries (requires sqlc CLI)
    dir: backend
    cmds:
      - sqlc generate

  install:frontend:
    desc: Install frontend dependencies (Node.js)
    dir: frontend
    cmds:
      - npm ci

  install:robot:
    desc: Install robot platform dependencies
    dir: robot
    cmds:
      - uv sync

  install:sim:
    desc: Install simulation dependencies
    dir: simulation
    cmds:
      - uv sync
      - pixi install

  # PROTO (buf toolchain)

  proto:update:
    desc: Update buf registry dependencies (buf.build BSR)
    dir: proto
    cmds:
      - buf dep update

  proto:generate:
    desc: Generate Go, Python, and TypeScript code from .proto definitions
    dir: proto
    cmds:
      - buf generate

  proto:lint:
    desc: Lint proto files against STANDARD buf rule set
    dir: proto
    cmds:
      - buf lint

  proto:breaking:
    desc: Check proto files for breaking changes against master branch
    dir: proto
    cmds:
      - buf breaking --against '.git#branch=master,subdir=platform/proto'

  # GO BACKEND

  build:backend:
    desc: Compile Go telemetry backend binary to backend/bin/server
    dir: backend
    cmds:
      - go build -o bin/server ./cmd/server

  dev:backend:
    desc: Run Go backend with synthetic --sim generator (dev mode, HTTP :8010, gRPC :9010)
    dir: backend
    env:
      TELEMETRY_DEV: "true"
    cmds:
      - go run ./cmd/server -sim

  run:backend:
    desc: Run Go backend production mode (expects real robot gRPC feed on :9010)
    dir: backend
    cmds:
      - go run ./cmd/server

  test:backend:
    desc: Run Go backend tests
    dir: backend
    cmds:
      - go test ./... -v

  lint:backend:
    desc: Run golangci-lint on the Go backend
    dir: backend
    cmds:
      - golangci-lint run ./...

  lint:fix:backend:
    desc: Auto-fix Go backend lint issues with golangci-lint
    dir: backend
    cmds:
      - golangci-lint run --fix ./...

  fmt:backend:
    desc: Format Go backend code (goimports + gofmt)
    dir: backend
    cmds:
      - goimports -w ./...
      - gofmt -w .

  # SIMGEN (Go scenario generator)

  build:simgen:
    desc: Compile simgen binary to simgen/bin/simgen
    dir: simgen
    cmds:
      - go build -o bin/simgen ./cmd/simgen

  test:simgen:
    desc: Run simgen tests
    dir: simgen
    cmds:
      - go test ./... -v

  lint:simgen:
    desc: Run golangci-lint on simgen
    dir: simgen
    cmds:
      - golangci-lint run ./...

  lint:fix:simgen:
    desc: Auto-fix simgen lint issues with golangci-lint
    dir: simgen
    cmds:
      - golangci-lint run --fix ./...

  fmt:simgen:
    desc: Format simgen code via golangci-lint fmt (goimports + golines per .golangci.yml)
    dir: simgen
    cmds:
      - golangci-lint fmt ./...

  clean:go:
    desc: Remove Go build cache and compiled binaries
    cmds:
      - cmd: rm -rf backend/bin
      - go clean -cache

  # FRONTEND

  dev:frontend:
    desc: Run frontend dev server (Vite, http://localhost:5173) — append ?demo to the URL for mock data
    dir: frontend
    cmds:
      - npm run dev

  dev:frontend:demo:
    desc: Run frontend dev server in Demo Mode (mock telemetry, no backend required)
    dir: frontend
    env:
      VITE_DEMO: "true"
    cmds:
      - npm run dev

  build:frontend:
    desc: Type-check and build the frontend for production (tsc -b + vite build → dist/)
    dir: frontend
    cmds:
      - npm run build

  preview:frontend:
    desc: Preview the production frontend build locally (vite preview)
    dir: frontend
    cmds:
      - npm run preview

  typecheck:frontend:
    desc: Type-check the frontend without emitting (tsc -b)
    dir: frontend
    cmds:
      - npx tsc -b

  lint:frontend:
    desc: Run ESLint on the frontend
    dir: frontend
    cmds:
      - npm run lint

  docker:build:frontend:
    desc: Build frontend Docker image (multi-stage — Node builder → nginx static)
    dir: frontend
    cmds:
      - docker build -t voldemorbot-frontend .

  docker:run:frontend:
    desc: Run frontend container serving on http://localhost:8080
    cmds:
      - docker run --rm -p 8080:80 voldemorbot-frontend

  # TRACK GENERATION

  gen:track:
    desc: Generate/regenerate WRO 2026 track SDF world file
    dir: simulation
    cmds:
      - uv run python -m src.generation.track_generator --output ./simulation/worlds/wro_track_2026.sdf

  # SCENARIO GENERATION

  gen:open:
    desc: Generate open-challenge scenarios (SCENARIOS=10 default)
    dir: simulation
    cmds:
      - cmd: |
          uv run python -m src.generation.generator \
            --challenge open \
            --num-scenarios {{.SCENARIOS}} \
            --output-dir {{.OUTPUT_DIR}} \
            --base-world ./simulation/worlds/wro_track_2026.sdf \
            --randomize-all
            
  gen:obstacles:
    desc: Generate obstacles-challenge scenarios (SCENARIOS=10 default)
    dir: simulation
    cmds:
      - cmd: |
          uv run python -m src.generation.generator \
            --challenge obstacles \
            --num-scenarios {{.SCENARIOS}} \
            --output-dir {{.OUTPUT_DIR}} \
            --base-world ./simulation/worlds/wro_track_2026.sdf \
            --randomize-all

  gen:all:
    desc: Generate both open and obstacles scenarios
    cmds:
      - task: gen:open
      - task: gen:obstacles

  # NAVIGATION & SIMULATION

  navigate:
    desc: Run navigator on metadata scenario (METADATA=scenario_0000 default, LAPS=3 default)
    dir: simulation
    cmds:
      - cmd: |
          pixi run python -m src.navigation.navigator \
            --metadata {{.METADATA}} \
            --laps {{.LAPS}} \
            --params {{.PARAMS}}
            
  record:
    desc: Record scenario videos from Gazebo simulation
    dir: simulation
    cmds:
      - cmd: |
          pixi run python -m src.recording.recorder \
            --output-dir {{.OUTPUT_DIR}}/{{.CHALLENGE}}/videos
            
  sim:gazebo:
    desc: Launch Gazebo simulator with WRO 2026 track
    dir: simulation
    cmds:
      - pixi run gazebo --verbose ./simulation/worlds/wro_track_2026.sdf

  sim:rviz:
    desc: Launch RViz visualization
    dir: simulation
    cmds:
      - pixi run rviz2

  # VIDEO & FRAME PROCESSING

  convert:bags:
    desc: Convert ROS2 bags to MP4 videos
    dir: simulation
    cmds:
      - cmd: |
          uv run python -m src.recording.bag_converter \
            --input-dir {{.OUTPUT_DIR}}/{{.CHALLENGE}}/bags \
            --output-dir {{.OUTPUT_DIR}}/{{.CHALLENGE}}/videos

  extract:frames:
    desc: Extract frames from ROS2 bags and annotate
    dir: simulation
    cmds:
      - cmd: |
          uv run python -m src.recording.frame_extractor \
            --input-dir {{.OUTPUT_DIR}}/{{.CHALLENGE}}/bags \
            --output-dir {{.OUTPUT_DIR}}/{{.CHALLENGE}}/frames

  # TESTING & CODE QUALITY

  test:
    desc: Run all tests across all modules (Python + Go)
    cmds:
      - task: test:backend
      - task: test:simgen
      - task: test:sim
      - task: test:robot

  test:sim:
    desc: Run simulation tests
    dir: simulation
    cmds:
      - uv run pytest tests/ -v

  test:robot:
    desc: Run robot tests
    dir: robot
    cmds:
      - uv run pytest tests/ -v

  lint:
    desc: Run all linters (ruff on Python, golangci-lint on Go, ESLint on frontend, buf lint on proto)
    cmds:
      - task: lint:sim
      - task: lint:robot
      - task: lint:backend
      - task: lint:simgen
      - task: lint:frontend
      - task: proto:lint

  lint:sim:
    desc: Lint simulation code
    dir: simulation
    cmds:
      - uv run ruff check src/ tests/

  lint:robot:
    desc: Lint robot code
    dir: robot
    cmds:
      - uv run ruff check src/ tests/

  lint:fix:
    desc: Auto-fix linting issues in all modules
    cmds:
      - task: lint:fix:sim
      - task: lint:fix:robot
      - task: lint:fix:backend
      - task: lint:fix:simgen

  lint:fix:sim:
    desc: Auto-fix simulation linting issues
    dir: simulation
    cmds:
      - uv run ruff check src/ tests/ --fix

  lint:fix:robot:
    desc: Auto-fix robot linting issues
    dir: robot
    cmds:
      - uv run ruff check src/ tests/ --fix

  # DOCKER OPERATIONS (if docker-compose.yml exists)

  docker:build:
    desc: Build Docker images
    cmds:
      - docker compose build

  docker:up:
    desc: Start Docker Compose services
    cmds:
      - docker compose up -d

  docker:down:
    desc: Stop Docker Compose services
    cmds:
      - docker compose down

  docker:logs:
    desc: View Docker Compose logs (follow mode)
    cmds:
      - docker compose logs -f

  docker:restart:
    desc: Restart Docker Compose services
    cmds:
      - task: docker:down
      - task: docker:up

  # CLEANUP

  clean:
    desc: Remove all generated training data
    cmds:
      - cmd: rm -rf {{.OUTPUT_DIR}}

  clean:cache:
    desc: Clean Python cache files and __pycache__ directories
    cmds:
      - cmd: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      - cmd: find . -name "*.pyc" -delete 2>/dev/null || true

  clean:all:
    desc: Deep clean — remove training data, cache, and build artifacts (Python + Go)
    cmds:
      - task: clean
      - task: clean:cache
      - task: clean:go

  # ANALYSIS & DEBUGGING

  analyze:
    desc: Analyze generated scenarios (statistics and summaries)
    dir: simulation
    cmds:
      - uv run python -m src.analysis.scenario_analyzer --output-dir {{.OUTPUT_DIR}}

  debug:
    desc: Run with verbose logging (DEBUG=1)
    cmds:
      - cmd: DEBUG=1 task {{CLI_ARGS}}

  info:
    desc: Display platform information (versions, directories)
    cmds:
      - cmd: |
          echo "=== PYTHON ==="
          uv --version
          echo ""
          echo "=== PIXI ==="
          pixi --version || echo "Pixi not installed"
          echo ""
          echo "=== GO ==="
          go version || echo "Go not installed"
          echo ""
          echo "=== BUF ==="
          buf --version || echo "buf not installed (needed for proto:generate)"
          echo ""
          echo "=== DIRECTORIES ==="
          echo "Output dir:   {{.OUTPUT_DIR}}"
          echo "Simulation:   simulation/"
          echo "Backend (Go): backend/"
          echo "Frontend:     frontend/"
          echo "Robot:        robot/"
          echo "Proto:        proto/"
          echo "Shared:       shared/"

  # UTILITY TASKS

  init:dev:
    desc: One-time setup for development (install + lint)
    cmds:
      - task: install
      - task: lint

  quick:test:
    desc: Quick test run (no full suite)
    cmds:
      - cmd: uv run pytest tests/ -x --tb=short

  # WORKFLOW TASKS (combine multiple steps)

  workflow:generate:
    desc: Full scenario generation pipeline (generate track → all scenarios)
    cmds:
      - task: gen:track
      - task: gen:all
      - cmd: echo "Generation complete! Data in {{.OUTPUT_DIR}}"

  workflow:dev:
    desc: Development workflow (install → lint → test)
    cmds:
      - task: install
      - task: lint
      - task: test
      - cmd: echo "Development checks complete!"

  workflow:record:
    desc: Recording pipeline (record → convert bags → extract frames)
    cmds:
      - task: record
      - task: convert:bags
      - task: extract:frames
      - cmd: echo "Recording pipeline complete!"
