# Single source of truth for ROS2 topic names used by the robot and telemetry.
# Updated 2026-08-08 — replaced stale cmd_vel/Twist with the real ackermann_cmd
# topic, and filled in the topics the 2026-08-08 audit found hardcoded across
# ~10 node files (challenge-mode jumper, motor feedback, button events,
# race_metrics, system_status).
#
# Edit this file, then reference in code via RosTopicConfig.load_default().

[state_machine]
# Robot state published by state_machine_node.
state = "/robot_state"
# Race metrics (JSON), published by state_machine_node.
race_metrics = "/race_metrics"
# System diagnostics, published by both state_machine_node and telemetry_bridge_node.
system_status = "/system_status"

[navigation]
# Odometry from track_navigator_node (if available).
# NOTE: As of 2026-08-02, no node publishes this topic.
# The telemetry_bridge_node subscribes but receives no data.
# Uncomment when odometry is implemented; leave empty or remove if it won't be.
# odometry = "/odom"
# Lap count from track_navigator_node's CoreNavigator/LapDetector -- the only
# thing that actually detects a lap crossing. state_machine_node subscribes
# to drive /race_metrics and the FINISHED transition.
laps_completed = "/race/laps_completed"
# Full per-tick NavigatorDebugSnapshot (JSON) -- see NavigatorDebugSnapshot's own docstring.
nav_debug = "/nav_debug"

[sensors]
# LIDAR range data from the Slamtec C1.
scan = "/scan"
# IMU data from the BNO085.
imu = "/imu/data"
# Hailo inference FPS, published by the vision/detector stack.
hailo_fps = "/hailo/fps"
# Vision detections (std_msgs/String, JSON), published by vision_node.
vision_detections = "/vision/detections"
# Raw camera image, published by the vision stack (for diagnostics/monitoring).
camera_image_raw = "/camera/image_raw"
# Joystick input (sensor_msgs/Joy), consumed by joy_teleop_node.
joy = "/joy"

[commands]
# Ackermann drive command sent to the drive/steering nodes.
ackermann_cmd = "/ackermann_cmd"

[actuators]
# Joint state feedback (steering angle, drive speed, encoder position).
joint_states = "/joint_states"
# Current steering position in degrees, published by ackermann_motor_node.
steering_position = "/motor/steering_position"
# Current drive speed in degrees/s, published by ackermann_motor_node.
drive_speed = "/motor/drive_speed"
# Motor status diagnostics, published by ackermann_motor_node.
status = "/motor/status"

[challenge_mode]
# Challenge-mode jumper state, published by the Pi Zero (which the wire is attached to).
jumper_inserted = "/challenge_mode/jumper_inserted"
# Resolved ScenarioType ("open"/"obstacles"), published by state_machine_node once latched.
active = "/challenge_mode/active"

[button]
# Button events from button_node on the Pi Zero.
event = "/button/event"
# JSON hold-progress feedback from button_node, so the OLED can count down.
hold = "/button/hold"

[ui]
# Low-rate lidar/yaw/detection summary from telemetry_bridge_node for the OLED.
telemetry_summary = "/ui/telemetry_summary"
# Live mirror of the OLED panel, published by oled_display_node.
oled_mirror = "/ui/oled_mirror"

[bag_recorder]
# The run directory bag_recorder_node just started writing to (latched), so a
# separate process (vision_node's per-run video recorder) can write into the
# same directory as the mcap.
run_path = "/bag_recorder/run_path"

[simulation]
# Simulated pose + track marker topics, published by live_visualizer only.
odom = "/sim/odom"
track = "/sim/track"
