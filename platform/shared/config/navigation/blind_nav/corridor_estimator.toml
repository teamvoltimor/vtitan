# Blind corridor-width estimation parameters.
#
# See shared.config.navigation_tuning.CorridorEstimatorParams.

# Width readings a corridor must accumulate before its estimate is trusted.
#
# Readings are attributed to a corridor by heading, so a handful taken while
# the chassis is still swinging through a corner can land in the wrong one.
# Requiring a dozen costs about half a second at the 20 Hz control loop and
# makes a single mis-filed sweep unable to move the answer.
min_samples = 12

# How far outside the legal [NARROW, WIDE] band a measured width may still
# fall and be treated as a plausibility failure (a corner, not a noisy
# corridor) rather than accepted.
plausible_width_margin_m = 0.25

# Length of the rolling window of stationary width readings kept before the
# start button is pressed. Enough to outvote the narrow prior comfortably
# (min_samples above), and at the 20 Hz control rate it spans the last
# second before the button is pressed. A window rather than a total, because
# the robot is often powered on well away from the track and only what it
# sees once placed should count.
max_start_samples = 20
