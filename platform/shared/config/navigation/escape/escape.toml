# Escape maneuver parameters for collision recovery (K-turn, slalom, side
# correction).
#
# See shared.config.navigation_tuning.EscapeManeuverParams.

rev_speed = -0.20             # Reverse speed during escapes
rev_steering_scale = 0.8      # Steering aggressiveness while reversing
k_turn_min_frames = 6         # Minimum K-turn duration (OBSTACLE risk)
k_turn_max_frames = 12        # Maximum K-turn duration (CRITICAL risk)
slalom_reverse_frames = 8     # Frames spent reversing during slalom
slalom_forward_frames = 10    # Frames spent forward-turning during slalom
stuck_move_threshold = 0.03   # Distance threshold (m) to detect stuck
stuck_timeout_frames = 40     # Frames without movement before "stuck" (~2s @ 20Hz)
side_correction_steer = 0.3   # Steering magnitude for a side-threat correction
side_correction_speed = 0.1   # Forward speed during a side-threat correction
side_correction_frames = 4    # Duration of a side-threat correction (frames)
escalate_after_attempts = 3   # Consecutive escapes before escalating (longer duration, opposite side)
escape_side_commit_attempts = 2  # Attempts spent on one side before trying the other (1 = alternate every attempt, which cancels itself out)
max_escape_frames = 20        # Hard cap on any single escalated escape duration
stuck_confirmation_checks = 3            # Consecutive below-threshold checks before declaring "stuck"
stuck_escalation_frames_per_attempt = 2  # Frames added to a stuck-reverse duration per repeated attempt
