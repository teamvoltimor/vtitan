# Blind corridor-following and corner-turn parameters.
#
# See shared.config.navigation_tuning.CorridorFollowerParams.

# Forward clearance at which the corner turn begins. Must stay strictly below
# direction_estimator.toml's corner_clearance_m -- NavigationTuning refuses to
# load otherwise. The gap between the two is the window in which the robot is
# still square to the corridor and the way ahead is visibly closing, which is
# the only chance it gets to read which side is open.
turn_clearance_m = 0.60

# Steering per metre of lateral offset from the centreline, and a hard cap on
# the result.
#
# Both are deliberately timid. The chassis is counter-phase four-wheel steering
# with a 0.034 m minimum turn radius, so it responds violently -- the same
# reason pursuit's steer_kp came down to 1.2. A hot gain here does not merely
# wander: the resulting oscillation swings the heading past the direction
# estimator's alignment gate, which then refuses every reading and the
# direction never settles at all. Measured at gain 2.0, that cost 12 of 28
# fixtures their direction and put 9 into a wall.
#
# Sitting off-centre for one metre costs nothing. Oscillating costs the round.
centering_gain = 0.8
max_centering_steer = 0.25

# Fraction of creep speed while turning a corner blind. Slower than straight
# running, because the turn is committed on one comparison rather than a plan.
corner_speed_scale = 0.6

# Fraction of creep speed while backing off a wall.
reverse_speed_scale = 0.6

# Second opinion on "has the corridor ended?", checked before committing to a
# hard-over corner turn.
#
# turn_clearance_m alone reads the MINIMUM over lidar_sectors.toml's +/-8 deg
# cone, which is too narrow to separate a corridor that has ended from a
# chassis pointed obliquely at the wall beside it: 0.24 m off a wall at 30 deg
# puts that whole cone on the wall at 0.24/sin(30) = 0.48 m -- under the
# threshold, mid-corridor. Measured on run_20260806_162008, that fired the
# corner branch for 53% of a 305 s round at 47% precision against a 45% base
# rate, i.e. no better than chance. The robot held hard-over steering half the
# round, never came square to a corridor, and so never inferred its travel
# direction, never planned a path, and scored zero laps.
#
# This asks the complementary question -- is there anywhere ahead still open --
# as a MAXIMUM over a wider arc. At a real corner the end wall blocks every
# bearing in the arc; an oblique chassis still has the corridor's own axis
# inside it, reading metres. Scored on run_20260806_161659 (a healthy 3-lap
# round) the pair fires 12 times, exactly one episode per corner per lap, at
# 96% precision.
turn_arc_half_fov_deg = 15.0
turn_open_range_m = 1.00
