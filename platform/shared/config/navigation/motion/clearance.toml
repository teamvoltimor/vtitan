# LIDAR clearance thresholds for speed control (meters).
#
# Zones around the robot where speed is controlled based on obstacle
# proximity. See shared.config.navigation_tuning.ClearanceZones.
#
# Loaded via NavigationTuning.load_from_toml_dir(). Regenerate nothing --
# this file IS the source of truth; edit it directly and restart the
# navigator (or re-run tests) to pick up changes.

contact_dist = 0.10    # Robot creeps forward (< this) -- immediate danger
slow_dist = 0.25       # Reduced speed zone
medium_dist = 0.50     # Normal speed zone
fast_dist = 1.00       # Full speed capability (> this)
path_margin = 0.10     # Extra clearance beyond chassis half-width still counted as "in the forward path"
# Back off when the chassis has closed to contact_dist, instead of creeping
# forward into it. ~0.4 s / 25 mm at creep, with a cooldown that only counts
# down while CLEAR so the pair cannot oscillate against the same obstacle.
#
# SHIPS DISABLED (0), and the trail gate did not rescue it. Three back-to-back
# passes over the 256 corpus, 2026-09-06, differing only in this value and the
# gate:
#
#                  off(0)   ungated(8)   trail-gated(8)
#   in-time         149        150           150
#   laps>=3         150        151           151
#   stuck            26         15            24
#   collisions        8         13            11
#     of which wall   4         10             9
#   timeouts         65         70            66
#   rev-run           5          4             2
#
# Gating gave back the timeouts and most of the extra collisions, and gave back
# the stall benefit with them -- the trail rarely confirms 6.1 cm of covered
# ground at the moment the chassis is against something, which is precisely
# when it has stopped moving and stopped laying trail. What survives is +5 wall
# contacts against a FLAT headline, so the behaviour is not earned in either
# form. The code stays, measured and documented; the value stays 0.
#
# The hardware case it was written for (run_20260906_121254: ten seconds of
# +0.152 m/s against a green pillar) is real and still unaddressed -- but the
# sim says a blind reverse is not the answer, and this mount has no rear
# sensing to make a seeing one.
contact_reverse_ticks = 0
contact_reverse_cooldown_ticks = 20

# Obstacles-Challenge contact zone. Resolved by
# ClearanceZones.for_obstacles_challenge(), which CoreNavigator calls once at
# construction; Open keeps contact_dist above. There is deliberately no
# open_contact_dist -- nothing measured wants Open to differ, and an unset knob
# nothing has ever moved reads as tuning that exists.
#
# Why the zone is per-challenge at all: this threshold fires the reversing
# escape (assess_risk returns CRITICAL below it), and the two challenges
# present different things to escape FROM. A wall 0.10 m ahead in Open is a
# genuine emergency. Obstacles additionally has signs the router deliberately
# routes PAST at ~0.175 m from their surface, so 0.10 fires on geometry the
# planner chose on purpose -- the robot escapes from clearances it was aimed
# at. Measured 2026-08-31 on subset128: ~180 escapes per run while colliding
# with a sign only 4-5 times in 128 runs.
#
# Worth, on the full 256 corpus (2026-09-01, raw in
# platform/robot/.corpus/contactdist_256_fixed.txt):
#
#   laps>=3      11 -> 82        timeouts   126 -> 48
#   laps >=1     41 -> 136       stuck       19 -> 10
#   in-time       3 -> 52        escapes/lap 685 -> 44
#   sign collisions/lap 0.132 -> 0.009
#
# Wall collisions stay FLAT at 17, which is the check that the extra laps are
# not bought by driving harder at walls. Pass-side goes 82 -> 122, but that is
# an artefact of survival: it is counted per run, and the 0.10 arm dies early
# enough to drive only 68 laps against 434, so it never reaches enough signs to
# misroute. Per lap it moves the other way.
#
# Verify on 256, never a subset. This exact plumbing check PASSED on 16
# fixtures and on 128 scenarios and FAILED at 256 -- the escape gates never
# bound in the smaller sets.
#
# *** NOT HARDWARE-VALIDATED. THE STOPPING-DISTANCE BENCH IS STILL UNRUN. ***
#
# bumper_gap_ahead already removes the 12.2 cm LIDAR mount offset, so the gate
# compares a CHASSIS-to-obstacle distance: at 0.05 the robot drives normally
# until its bumper is 5 cm out, then declares CRITICAL and reverses. Nobody has
# measured how far the chassis travels between that tick and standstill --
# LIDAR scan period, nav tick, PID response, mechanical deceleration. If that
# chain exceeds 5 cm at Obstacles cruise, this value generates the collisions
# it was meant to prevent, and the sim CANNOT say otherwise: contact there is
# absorbing, so a run ends before the robot can be wedged.
#
# Run docs/internal/algorithms/hardware-bench-procedure.md Session A before any
# Obstacles track run, and revert this line to 0.10 if A3's decision rule says
# so. Its preflight matters: verify reverse on blocks FIRST -- nav commands
# reverse, this whole mechanism IS a reverse, and reverse has never been
# observed on hardware.
obstacles_contact_dist = 0.05

# --- Written out 2026-09-05 ---
#
# Both existed only as Python literals, so no edit to this file could reach
# them. Shipped values, so naming them changed nothing.

# Measure forward clearance from the BUMPER rather than the LIDAR. Off: the
# gates above already subtract the mount offset where they need to, and
# flipping this would double-apply it.
forward_path_ahead_of_bumper = false

# Treat a forward cone that returns NOTHING as degraded rather than clear. A
# whole-cone no-return is the LIDAR failing to see, not open track -- reading
# it as "wide open" drove the robot into walls (fixed 2026-08-28).
forward_no_data_is_degraded = true
