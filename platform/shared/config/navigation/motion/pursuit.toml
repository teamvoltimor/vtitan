# Pure pursuit controller parameters for waypoint following.
#
# See shared.config.navigation_tuning.PurePursuitParams.

lookahead_short = 0.16        # Lookahead distance for sharp corners (m)
lookahead_long = 0.32         # Lookahead distance for straights (m)
lookahead_transition = 0.30   # Crosstrack error threshold to switch modes (m) -- a ceiling; see below

# The switch from long to short used to be a bare step on both arming signals.
# Both hover near their thresholds in normal driving, so the lookahead flipped
# every tick -- hardware run_20260829_104641 shows 0.320, 0.160, 0.320, 0.160 at
# ~2.5 Hz. Curvature is 2y/L**2, quadratic in lookahead, so each flip swung the
# commanded curvature by 4x and the chassis drew a visible zigzag; mean peak
# |steer| through corners rose 0.306 -> 0.398 with no crosstrack gain.
# Ramping removes the discontinuity rather than debouncing it. 0.7 keeps a
# deadband so straights are untouched below 70% of the threshold, and is the
# largest value that leaves every pre-existing lookahead test true.
lookahead_blend_start = 0.70  # Fraction of the threshold where the ramp begins (1.0 = old hard switch)
steer_kp = 1.2                # Proportional gain for the steering P-controller
# PROVISIONAL, 2026-08-28: lowered from 2.0. Real hardware bag
# (run_20260828_220533) showed the controller repeatedly saturating against
# this cap at hard corners -- steering swinging exactly 0.6 rad (rate x 0.3s
# window) at many unrelated corners throughout the run, which is what read as
# "too drastic" on the track. Past sim sweeps only tested RAISING this value
# (1.5x/3.0x), both of which scored worse than baseline (107 vs 114,
# speed-envelope.md) -- indirect evidence a lower rate costs little, but this
# exact value is untested; re-check lap completion if this regresses hardware
# cornering.
max_steering_rate = 1.2       # Maximum steering command rate (rad/s)

# The operative crosstrack threshold is the smaller of lookahead_transition and
# what the path's own distance to the outer wall actually affords. Under the
# blind narrow prior the fixed 0.30 exceeded that budget, so the correction
# could not fire before the wall arrived (hardware, 2026-08-06).
wall_margin_safety_m = 0.03        # Clearance to leave between chassis and outer wall (m)
min_lookahead_transition_m = 0.10  # Floor for the derived threshold (m)

# Crosstrack error lags a corner: it cannot rise until the turn has already
# been missed, so gating the lookahead on it alone lands the sharp correction
# after the corner rather than in it (hardware, 2026-08-06). Previewing the
# planned path's own turn arms the short lookahead on entry instead.
#
# Was 0.40, which gave that preview NO LEAD AT ALL. Computed 2026-08-29 by
# running the real planner and path_turn_ahead against the geometric arc entry
# (all-narrow blind prior, seconds at 0.35 m/s):
#
#   preview  lead before the arc   short lookahead armed over lap (narrow/wide)
#     0.40      0.000 m (0.00 s)                27% / 38%
#     0.80      0.257 m (0.73 s)                38% / 64%
#     1.00      0.514 m (1.47 s)                49% / 73%
#     1.20      0.772 m (2.21 s)                61% / 100%
#
# Waypoint spacing is 0.117-0.258 m, and the preview must clear the straight
# remainder AND reach into the arc before any heading change registers, so 0.40
# armed exactly AT the arc -- the "a corner late" failure this preview exists to
# prevent. 0.80 is the smallest value that leads at all; larger spends more of
# the lap on the short lookahead, and curvature is quadratic in it.
corner_preview_distance_m = 0.80   # Path distance previewed for an upcoming turn (m)
# Insensitive over 0.21-0.58: the signal is quantised by waypoint spacing and
# jumps 0.00 -> 0.59 in one step, so every threshold in that band arms at the
# same waypoint. Not the lever for turn timing -- see the preview above.
corner_turn_threshold_rad = 0.35   # Heading change over that preview that counts as a corner
