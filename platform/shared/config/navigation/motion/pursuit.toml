# Pure pursuit controller parameters for waypoint following.
#
# See shared.config.navigation_tuning.PurePursuitParams.

lookahead_short = 0.16        # Lookahead distance for sharp corners (m)
lookahead_long = 0.32         # Lookahead distance for straights (m)
lookahead_transition = 0.30   # Crosstrack error threshold to switch modes (m) -- a ceiling; see below
steer_kp = 1.2                # Proportional gain for the steering P-controller
max_steering_rate = 2.0       # Maximum steering command rate (rad/s)

# The operative crosstrack threshold is the smaller of lookahead_transition and
# what the path's own distance to the outer wall actually affords. Under the
# blind narrow prior the fixed 0.30 exceeded that budget, so the correction
# could not fire before the wall arrived (hardware, 2026-08-06).
wall_margin_safety_m = 0.03        # Clearance to leave between chassis and outer wall (m)
min_lookahead_transition_m = 0.10  # Floor for the derived threshold (m)

# Crosstrack error lags a corner: it cannot rise until the turn has already
# been missed, so gating the lookahead on it alone lands the sharp correction
# after the corner rather than in it (hardware, 2026-08-06). Previewing the
# planned path's own turn arms the short lookahead on entry instead.
corner_preview_distance_m = 0.40   # Path distance previewed for an upcoming turn (m)
corner_turn_threshold_rad = 0.35   # Heading change over that preview that counts as a corner
