# Traffic-sign avoidance routing parameters.
#
# See shared.config.navigation_tuning.SignRouterParams.

sign_clearance_margin_m = 0.075   # extra margin beyond chassis+sign half-widths
wall_clearance_margin_m = 0.04    # margin beyond chassis half-diagonal from a wall

# Tuned 2026-08-01 against the 256-scenario corpus: 27 -> 47 three-lap finishes
# (229 -> 209 collisions). Stock values were 0.80 / 1.20 / 0.3, none of them
# ever measured against a corpus.
#
# activation_dist MUST stay below passed_dist -- SignRouterConfig enforces it.
# A sign is engaged inside activation_dist and retired outside passed_dist on
# the SAME tick, so inverting them engages and retires every sign a metre out
# and disables avoidance for the whole run (256/256 collisions, silently).
#
# The pair is deliberately 1.40/1.60 rather than the measured peak 1.60/1.80
# (51 finishes): 1.80 costs 19 runs against 1.60, and 1.40 keeps twice the
# margin to that edge for hardware pose error.
#
# deform_depth_buffer is how far past the corner span a target may sit and
# still be deformed. Too small and avoidance switches OFF during the final
# approach to any sign at grid depth 1.0 or 2.0 -- i.e. at the corners, where
# two-thirds of WRO signs sit. 0.70+ is worse again (38 finishes).
activation_dist_m = 1.40          # distance at which deformation activates
passed_dist_m = 1.60              # distance beyond which a sign is "passed"
deform_depth_buffer_m = 0.5       # depth-axis slack for "in corridor" check
detection_match_dist_m = 0.30     # max distance to associate a detection with a sign
min_confidence = 0.25             # minimum confidence to accept a camera color update
settle_ticks = 150                # ticks after lap start before bookkeeping activates

# A LIDAR return landing within this distance of a sign the router is still
# routing around is attributed to that sign and withheld from the reactive
# escape trigger -- the planner owns it, so the escape maneuver must not fire
# and reverse the robot out of a gap the planner aimed for. Sized as the sign's
# own half-diagonal (0.035 m for a 50x50 mm footprint) plus ~0.085 m of pose
# and mapping error. Do NOT raise this much further: the wall behind a sign can
# be as close as ~0.15 m in a narrow corridor, and masking that wall too would
# remove a guard nothing else replaces. Set to 0.0 to disable the split.
escape_mask_radius_m = 0.12


# Once the router has engaged a sign, keep routing around THAT sign until it is
# cleared, rather than re-running the nearest-wins race every tick. With two
# signs in play -- the WRO grid spaces them 0.50 m apart along a 1.0 m corridor,
# so this is common -- a pure per-tick race can flip the winner mid-approach and
# jump the commanded lateral line from one sign's required value to the other's
# with no runway left to track it. Set true to hold the committed sign.
#
# DEFAULT OFF, measured 2026-08-01 over the 256-scenario corpus: sighted 229
# collisions either way, blind 227 off vs 228 on. Flat sighted and marginally
# worse blind, so the mechanism is not earning its place in a safety path. The
# code stays so the `hysteresis` sweep arm can re-test it once the dominant
# failure is understood -- the winner-switch case it targets is real (28 of the
# corpus approaches switch mid-approach) but is evidently not what decides
# those runs.
commit_hysteresis = false


# A discovered sign's corridor decides which world axis its avoidance
# deformation treats as "lateral", and it is re-derived every tick from an
# estimate that keeps moving. Two-thirds of legal WRO grid positions sit ON a
# corner boundary, where millimetres of jitter swing corridor_for_position()
# between two corridors whose lateral axes are ORTHOGONAL -- so the commanded
# waypoint alternates between two unrelated targets at 20 Hz and the chassis
# tracks neither. Measured on go_obstacles_0000: an estimate wobbling +-5 mm
# around (2.40, 2.00) flipped EAST/NORTH on every single tick for the whole
# approach, swinging the steering command between -0.068 and -0.172.
#
# Requiring N consecutive agreeing ticks before moving the label costs a genuine
# corridor change 0.25 s at 20 Hz -- irrelevant against the 1.40 m activation
# distance -- and makes the dither a no-op. Deliberately temporal rather than a
# geometric dead-band: the corner tie-break picks the NEAREST inner face, so a
# point 0.40 m deep in the east band but 0.003 m past the north one classifies
# NORTH, and nudging the position toward the label you want to keep can make
# that label LESS likely. Distance to the decision surface is not usable as a
# margin here; consecutive agreement does not care about the surface's shape.
#
# DEFAULT 1 (mechanism inert), measured 2026-08-15 over the 256-scenario corpus,
# blind, laps-only, all three arms in ONE invocation
# (diag_sign_sweep.py corridor-flip 1 5 10 --corpus):
#
#   ticks  collisions            laps>=1  laps>=3
#   1      252/256 (0 wall)      11/256   4/256
#   5      254/256 (5 wall)      17/256   2/256
#   10     252/256 (3 wall)      15/256   4/256
#
# Flat on collisions and on laps>=3, and both damped arms trade sign strikes for
# a handful of NEW wall strikes -- holding a stale corridor keeps deforming on
# the wrong axis for longer. Same verdict, and for the same reason, as
# commit_hysteresis above: a real mechanism that does not earn its place in a
# safety path on the evidence. The code and the sweep arm stay so it can be
# re-tested once the dominant failure is understood.
#
# Worth re-testing on HARDWARE before dismissing entirely: the sim commands
# steering with infinite bandwidth, so a 20Hz axis flip costs it almost nothing,
# where a real servo has to physically slew between the two commands.
corridor_flip_ticks = 1

# Cap speed at the `slow` tier while the router is actually holding a sign
# deformation this tick. ON.
#
# The docstring shipped this False as "unmeasured over the corpus, ships off
# until it is", and separately records the lever as REFUTED. Both are now
# resolved rather than overridden:
#
# * The refutation was measured SIGHTED, where the shortfall is curvature-
#   limited and extra time cannot buy turning radius. This is measured BLIND,
#   which is the competition configuration and, as `explore_lap_speed_frac`
#   already argues, an INFORMATION-limited problem where time is worth
#   something. Same knob, different constraint.
# * Measured 2026-09-04 over the 256-scenario corpus, blind, both arms in ONE
#   invocation (diag_sign_sweep.py sign-speed-blind 0 1 --corpus
#   --strip-parking), against the rule-9.21 judge added the day before:
#
#     metric        off    on
#     clean          77    79
#     in-time        71    73
#     laps>=3        77    79
#     rev-run (9.21) 14     9
#     unscored       14     9
#     collisions     15    15   (sign 6->4, wall 9->11)
#     timeouts       26    27
#     pass-side     118   119
#
# READ THE COLLISION ROW HONESTLY: the total does not move. Two strikes shift
# from the sign column to the wall column, which this file's own
# `corridor_flip_ticks` note calls out as not an achievement. An earlier
# session's "collisions 17->15, timeouts 31->30 so it costs nothing" does NOT
# reproduce; timeouts cost +1 here.
#
# What earns the flag is the row that session could not see, because 9.21 was
# unenforced when it measured: rev-run falls 14 -> 9, and `unscored` falls by
# the same 5 -- the same runs, five previously ILLEGAL rounds becoming
# scoreable, which is where +2 clean / +2 in-time / +2 laps>=3 come from.
#
# The MECHANISM is not established. Escapes are flat (17293 vs 17283), so
# "fewer sign contacts -> fewer escapes -> fewer heading inversions" is a
# plausible story that has NOT been measured. Do not build on it.
#
# Obstacles-only by construction: it gates on a deformation the router applied,
# and Open never deforms, so this cannot touch the Open ladder.
sign_aware_speed = true

# =====================================================================
# Written out 2026-09-05
#
# Every key below existed ONLY as a Python literal: SignRouterParams carried
# the value, this file did not name it, and so no edit here reached the robot.
# They are written at their shipped values, which means adding them changed
# nothing -- what changed is that they are now tunable without a code edit.
#
# The measured rationale for each lives in SignRouterParams' own docstrings
# (platform/shared/src/shared/config/navigation_tuning/signs.py). Several are
# REFUTED experiments kept configurable so the refutation stays reproducible;
# those are marked. Do not read a `false` here as "unfinished".
# =====================================================================

# --- Lane planner (the shipped sign-avoidance path) ---
sign_lane_planner = true
# Fraction of the full lane offset actually applied.
sign_lane_offset_frac = 1.0
# Metres over which the lane offset ramps in, and is then held.
sign_lane_ramp_m = 0.9
sign_lane_hold_m = 0.25
# Commit the lane this far ahead of the sign; 0 = at the sign.
sign_lane_commit_ahead_m = 0.0
# Distance from a corner at which lane entry is suppressed.
sign_lane_corner_entry_m = 0.5
# Suppress the older per-waypoint deformation while the lane planner drives.
sign_lane_suppress_deform = true
# Re-label a lane that cannot be satisfied rather than skipping it outright.
sign_lane_relabel_unsatisfiable = true
sign_lane_skip_unsatisfiable = false
# Require the corridor's depth reading to agree before committing a lane.
sign_lane_depth_consistent_corridor = true
# Allow two lanes to overlap. REFUTED -- kept off.
sign_lane_split_overlap = false

# --- Guards on the depth/heading pin ---
depth_pin = true
pin_corner_guard = true
pin_heading_guard = true
# Heading disagreement, in degrees, above which the pin is refused.
pin_heading_guard_deg = 35.0

# --- Deformation and speed coupling ---
# Minimum deformation, in metres, that counts as the router having moved the
# path -- what sign_aware_speed above gates on.
sign_deform_speed_threshold_m = 0.02
# Speed fraction during the exploratory first lap. 1.0 = no reduction.
explore_lap_speed_frac = 1.0

# --- Refuted experiments, kept configurable and OFF ---
# Retrace on escape: REFUTED (see steer_cap_from_commit_distance's note in
# corridor_follower.toml -- same session, same 640-case sweep).
retrace_escape = false
retrace_dist_m = 0.25
retrace_steer_gain_deg = 55.0
# Evade a sign on contact rather than routing around it in advance.
sign_contact_evade = false
sign_contact_dist_m = 0.6
sign_contact_steer_deg = 19.25
# Use the SHORT pursuit lookahead while a routed sign is engaged (the comment
# here said "extend" until 2026-09-06; it shortens). Crosstrack is measured
# against the RAW path, so it never rises during a sign pass and never arms the
# short lookahead on its own -- a long lookahead flattens the slope to a lateral
# offset, and the chassis arrives level with the pillar still inside the line it
# was given.
#
# Enabled 2026-09-06 on hardware evidence: abeam a committed sign the chassis
# achieves only 35-40% of its commanded lateral offset (0.12-0.14 m of
# 0.32-0.38 m, runs _112704 and _085551), and a THIRD of passes go within 10 cm
# of the pillar. Measured back-to-back on the 256 corpus, false -> true:
#
#                   off    on
#   in-time         149   148     flat
#   laps>=3         150   149     flat
#   pass-side         2     0     round-enders under 9.24.5
#   rev-run           5     1
#   collisions        8     5
#     of which wall   4     0
#   stuck            26    32     the cost
#   timeouts         65    69     the cost
#
# Shipped ON deliberately against a FLAT headline: a pass-side violation ends
# the round for zero, a timeout keeps the laps already driven. 7 round-enders
# become 1. Open is structurally unaffected (no sign router): 127/127 cases
# byte-identical, 0.0 s delta.
sign_aware_lookahead = true
# Rescue a target that has gone stale mid-approach.
stale_target_rescue = false
