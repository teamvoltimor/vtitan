# Navigation control loop rate.
#
# See shared.config.navigation_tuning.ControlLoopParams.

# Frequency (Hz) the control loop runs at, on the robot and in simulation.
#
# The single source for the loop period. This used to be stated twice -- 0.05 s
# in the waypoint controller and 20 Hz in the simulated gateway -- which agreed
# only by maintenance. The controller rate-limits steering with dt, so the two
# drifting apart would not raise anything: it would tune the robot against a
# cadence the simulator never ran at.
control_hz = 20.0
