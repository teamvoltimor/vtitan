# Single source of truth for the WRO robot's physical constants (custom chassis, counter-phase
# four-wheel steering). Measured 2026-07-11 — see platform/robot/docs/robot-physical-constants.md.
#
# Edit this file, then hand-update its Go/xacro consumers to match (the generator that used
# to regenerate them was removed 2026-09-03 -- see robot-physical-constants.md):
#   - platform/robot-go/internal/simgen/simconfig/robot_constants.gen.go
#   - platform/gazebo/runtime/robot_description/robot_properties.gen.xacro
#
# The Python side reads this file directly at runtime via
# shared.config.robot_constants.RobotConstants -- nothing to regenerate there.
#
# All lengths are meters, masses are kilograms, angles are radians unless a
# field is explicitly named _deg (e.g. lidar.mount_yaw_offset_deg).

[chassis]
length = 0.30
width = 0.194
height = 0.10
# The assembled car weighs ~1.51 kg with the practice battery (Deans) and
# ~1.46 kg with the competition battery (XT60 shorty), connectors included
# (2026-09-07). This field is the chassis body ALONE, because the URDF and
# the Gazebo model sum it with four wheel masses to get the total:
# 1.3 + 4 x 0.05 = 1.5 -- a deliberate middle value between both battery
# configurations, so the simulation never under-predicts required torque.
# Change chassis and wheel mass together, or the simulated car stops
# weighing what the real one does -- mass drives the inertia tensors, so it
# reaches the dynamics.
mass = 1.3

[ackermann]
# Front axle to rear axle distance.
wheelbase = 0.19
# Left wheel to right wheel distance.
track_width = 0.1675
#
# The road-wheel angle at full lock is NOT declared here. It is derived from
# the [steering] section below (max_wheel_angle_deg), because it is not a free
# parameter -- it is whatever the steering hardware produces.
# It used to sit here as a hand-computed 1.2253 rad whose comment pointed at
# platform/robot/.env.example, which by then pointed at motors.toml, which is
# where the two factors actually lived. Three files, one number, and only prose
# holding them together.
#
# It was 0.5236 (~30 deg) before that, which understated the chassis by more
# than half. Since ackermann_motor_node clamps against the SERVO limit, the
# navigator's own decode of steering_norm through this constant was the binding
# limit -- a full-lock command reached only 38.5 of the servo's 90 degrees and
# the clamp never fired to say so.

[steering]
# servo_max_angle_deg and max_wheel_angle_deg are DELIBERATELY ABSENT.
#
# They describe a specific servo, so they live in that servo's profile under
# config/profiles/ -- 180deg-injora-14kg or 270deg-hiwonder-35kg -- and one
# must be named in VTITAN_HARDWARE_PROFILE. Loading fails with a message
# listing the candidates if none is.
#
# This file used to declare the Injora's 90/55, which meant a run with no
# profile set silently modelled whichever servo happened to be checked in
# rather than the one on the robot. That is not hypothetical: a whole night of
# motor tests once ran on the unmodified base ceiling because the variable was
# blank, and there is no way to tell from behaviour alone which config a run
# used. Absent-and-required converts that silent wrong answer into a loud one.
#
# What stays here: everything that is true of the CHASSIS regardless of which
# servo drives it. Everything upstream -- /ackermann_cmd, the navigator, the
# simulator -- speaks WHEEL angles, per the ROS convention; only the servo
# speaks servo angles, and linkage_ratio is derived from the two profile
# fields rather than declared.


[wheel]
radius = 0.035
width = 0.025
mass = 0.05

[drivetrain]
# max_speed_mps is DELIBERATELY ABSENT -- it describes a specific motor, so it
# lives in that motor's profile (generic-motor-1500rpm or
# rev-hd-hex-motor-6000rpm) and one must be named in VTITAN_HARDWARE_PROFILE.
# See the [steering] note above for why absent-and-required beats a default.
#
# It is a hard ceiling, not a tuning knob: AckermannKinematics clamps to it,
# which is why a speed profile capping commands at 0.30 m/s once turned out to
# be completely inert -- both 0.30 and 0.50 saturate against it. Since
# 2026-08-21 the navigation speed ladder is absolute m/s and this value only
# clamps, so raising it delivers nothing until the motor profile's own
# motion/speed.toml raises the tiers too.
#
# max_accel_mps2 and speed_response_tau_s are DELIBERATELY ABSENT for the same
# reason: how hard a drivetrain accelerates, and how long it lags a change of
# command, are properties of the motor, not the chassis. They lived here as one
# shared 2.0 until 2026-08-29, when a bag showed the current motor nowhere near
# it.
# Counter-phase four-wheel steering: the rear axle turns the full opposite of
# the front. 1.0 is counter-phase, 0.0 would be front-steer only.
rear_steer_ratio = 1.0
# Fraction of the yaw rate the kinematic model predicts that the chassis
# ACTUALLY delivers. 1.0 is the zero-slip textbook model; anything less is the
# tyre slip and linkage compliance that model has no term for.
#
# MEASURED 0.55 on 2026-08-29 from run_20260829_140424 (a clean 3-lap Open run)
# via `scripts/bag/diag_bag_sim_fidelity.py --replay`. Before that the simulator
# ran an implicit 1.0 and turned 1.83x sharper than the real car over the same
# command stream -- 3512 deg of yaw against the IMU's 1918 -- so every corner
# the sim cleared was a corner the hardware would have run wide.
#
# The shortfall is flat (~0.49) from 5 to 30 deg of commanded wheel angle, which
# is what makes it a scale factor rather than large-angle saturation. It is a
# property of THESE tyres on THIS surface: re-measure after a tyre, weight or
# mat change, the same way max_speed_mps is re-measured after a motor swap.
yaw_gain = 0.55
# Tightest turn the chassis can actually make (m). The bicycle term has no
# floor: at the shipped 85 deg lock it gives L_eff / (tan(85) * yaw_gain) =
# 1.5 cm of radius, which a 30 x 19.4 cm four-wheeled car cannot do.
#
# MEASURED 2026-09-07 from /joint_states drive-wheel travel against pose yaw
# over five hardware bags -- the real radius SATURATES, buying almost nothing
# past ~30 deg of lock:
#
#   |steer|   effective R   model R   ratio
#    15-30       66.0 cm     41.7 cm   1.6x
#    30-45       38.2 cm     22.5 cm   1.7x
#    75-90       28.9 cm      2.3 cm  12.7x
#
# Sits here rather than beside the simulation parameters because it describes
# THIS chassis, and it is not the simulator alone that must obey it: BayExit
# dead-reckons its own pose from the same bicycle model, and while that copy
# had no floor it over-read the bay ratchet's outward travel by 31x (measured
# 2026-09-09, scripts/sim/diag_bay_guard.py). Re-measure after a tyre, weight
# or linkage change, the same way yaw_gain is.
min_turn_radius_m = 0.29

# The floor is NOT A CONSTANT, and the 0.29 above is its value at ONE speed.
# RE-MEASURED 2026-09-10 (scripts/bag/diag_bay_slip.py, 33 bags, free space,
# lock >= 30 deg, IMU yaw). Stable across --window-s 0.02..0.20 AND
# --settled-s 0..0.8, which is what makes these four points the finding:
#
#   speed m/s   0.02   0.08   0.13   0.16
#   R m         0.090  0.205  0.287  0.349
#
# i.e. R = 0.053 + 1.86 * v, and 0.29 is what that reads at ~0.127 m/s. The bay
# exit runs at CREEP end to end, where the constant is nearly 2x too large --
# which is why 72e7172b took the in-bay exit from 16/16 to 0/16 while hardware
# kept getting out.
#
# THE CAP IS NOT MEASURED. Above ~0.17 m/s the bins fall to n=20-37 and go
# non-monotonic (0.349 at 0.16 m/s, then 0.285 at 0.22), and that is structural
# rather than a sampling accident: at full lock the robot is SLOW by definition,
# because it slows down to turn. The saturation cannot be read from these bags
# at all. 0.35 below is the largest value the measured range supports, carried
# as a bound so the linear term cannot run away -- not a measurement. The OPEN
# challenge runs at 0.26-0.50 m/s, entirely outside the measured range, so for
# the corridor this curve is EXTRAPOLATION. It is inside it for the bay.
#
# Two corrections are already baked in, both found by testing the instrument:
# the numbers are NET yaw over a window (summing |yaw| at the IMU's 166 Hz
# accumulates noise and read 0.088 where this reads 0.29), and they require the
# steering COMMAND to be steady, because the servo slews and its feedback is
# the command echoed back -- unfiltered, corner-entry transients inflated the
# top of the curve from 0.35 to 0.43.
#
# The 2026-09-07 numbers above were taken against POSE yaw. Measured on one time
# base, pose yaw sees 0.66x the rotation the IMU does, so a radius taken against
# it is ~1.5x overstated; treat that table as the shape, not the scale.
min_turn_radius_intercept_m = 0.053
min_turn_radius_slope_s = 1.86
min_turn_radius_cap_m = 0.35

[lidar]
# Closest range the C1 can report (m). Measured ~45 mm; anything nearer is
# unmeasurable rather than clear, which is the distinction that matters when the
# chassis works within a few centimetres of a surface (parking, wall contact,
# escape). Moved here 2026-08-21 from a hand-maintained Python constant that
# stated 0.05 -- a sensor spec belongs with the rest of the hardware
# description, not beside the simulation parameters.
min_range = 0.045
# Farthest range the C1 reports (m). Was a hand-maintained Python constant
# (LIDAR_MAX_RANGE) until the config-driven cleanup; a sensor spec belongs here.
max_range = 12.0
# Horizontal sample count of one 360 deg sweep.
samples = 500
# Sweep refresh rate (Hz).
update_rate = 10.0
# Per-ray range noise stddev (m).
noise_stddev = 0.03
# Puck form factor (m). Matches the lidar_link mesh already modeled in
# wro_robot.urdf.xacro (radius=0.0278, length=0.0413) -- used so the mount-offset
# derivation stays self-consistent with the mesh actually rendered in sim.
diameter = 0.0556
height = 0.0413

# Slamtec C1, flush with the front edge, centered left/right.
# Derived as chassis.length/2 - lidar mesh radius (0.0278, matching the xacro cylinder mesh).
mount_x_offset = 0.1222
# Added to chassis.height for the LIDAR's absolute mount z, i.e. the height of the
# SCAN PLANE off the floor. Was hand-duplicated as simconfig.RobotLidarZOffset (Go)
# and a hardcoded 0.12 (= chassis.height + this) in static_tfs.launch.py and the URDF
# xacro; consolidated here 2026-07-30 so all three consumers derive from one value
# instead of three that could drift.
#
# NEGATIVE because the unit is recessed, not stacked on the chassis top: the beam
# MEASURES ~0.08 m off the floor, so it sits 20mm BELOW chassis.height (0.10), not
# 20mm above it as this field claimed until 2026-09-07.
#
# The old +0.02 put the scan plane at 0.12 m. Every object on the field is 0.10 m
# tall -- wall.height, the pillars and the blocks all -- so the repo's own geometry
# said the beam clears the entire track and the robot is blind. It plainly is not:
# over run_20260907_031019 the +/-90 deg rays read p10 0.20 / median 0.58 / p90 1.79 m
# in a 1.0 m corridor, exactly the walls. At the real 0.08 m the beam crosses a
# 0.10 m sign 2 cm below its top, on the body.
#
# This is load-bearing for reasoning, not just for TF: from the wrong 0.12 it
# follows that the LIDAR cannot see traffic signs at all, which is false and would
# rule out using it to propose obstacle candidates ahead of the camera.
mount_z_offset = -0.02
# The chassis is physically mounted upside-down, which is why an "inverted" correction
# exists at all. Confirmed 2026-08-02: the mount IS upside-down, so `inverted = true`.
# An earlier same-day measurement had found `false` matching behavior, but that was
# testing the wrong data path (raw /scan directly, which the navigator never reads --
# see ros2_hardware_gateway.py); re-confirmed against the physical mount fact itself,
# it is true. Re-measure after any remount or cable work rather than assuming.
#
# Every consumer that needs the LIDAR's angle correction derives it from THIS flag alone,
# not a second independent setting: `inverted` drives both the sllidar_ros2 driver's own
# `inverted` launch parameter (its left-right mirror) AND a mandatory 180 deg yaw rotation
# applied wherever raw /scan angles are consumed (front/back come attached to the same
# upside-down-mount fact as left/right, not a separate one). A driver-level `inverted:=true`
# with no matching 180 deg yaw application (or vice versa) is exactly the bug found and
# fixed today: the two drifted out of sync when only one was re-verified.
inverted = true
# Independent of `inverted` above: any additional yaw miscalibration NOT explained by the
# upside-down mount (e.g. the unit sits rotated a few degrees off dead-ahead within its
# bracket). Added on top of the 180 deg from `inverted`, not a replacement for it. Zero
# until something measures otherwise.
mount_yaw_offset_deg = 0.0

[imu]
# IMU sits 10mm above the chassis floor. Was hand-duplicated as simconfig.RobotImuZOffset
# (Go, correct), a hardcoded 0.01 in static_tfs.launch.py (correct), and the URDF xacro's
# imu_link joint origin (WRONG -- hardcoded to 0, i.e. the IMU wasn't actually placed here);
# consolidated here 2026-07-30, which also fixes that xacro drift.
mount_z_offset = 0.01
# Measurement refresh rate (Hz).
update_rate = 100.0
# Gyroscope angular-rate noise stddev (rad/s).
gyro_noise = 0.054
# Accelerometer linear-acceleration noise stddev (m/s^2).
accel_noise = 0.3
# Board mass (kg).
mass = 0.0025
# Board form factor (m): x (length) x y (width) x z (height).
size = [0.0256, 0.0227, 0.0046]

[camera]
# Raspberry Pi Camera Module 3 Wide, mounted directly above the LIDAR.
mount_x_offset = 0.1222
mount_z_offset = 0.20
# ~10 degrees, tilted down. Approximate measurement (2026-09-07).
mount_pitch = 0.1745
# Horizontal field of view (rad).
hfov = 1.7802
# Sensor resolution (pixels).
width = 1536
height = 864
# Frame capture rate (Hz).
update_rate = 30.0
# Rendering clip planes (m).
near_clip = 0.05
far_clip = 10.0
