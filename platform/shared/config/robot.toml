# Single source of truth for the WRO robot's physical constants (custom chassis, counter-phase
# four-wheel steering). Measured 2026-07-11 — see platform/robot/docs/robot-physical-constants.md.
#
# Edit this file, then regenerate its Go/xacro consumers with `task gen:robot-constants`:
#   - platform/gazebo/generator/internal/simconfig/robot_constants.gen.go
#   - platform/gazebo/runtime/robot_description/robot_properties.gen.xacro
#
# The Python side reads this file directly at runtime via
# shared.config.robot_constants.RobotConstants -- nothing to regenerate there.
#
# All lengths are meters, masses are kilograms, angles are radians unless a
# field is explicitly named _deg (e.g. lidar.mount_yaw_offset_deg).

[chassis]
length = 0.30
width = 0.194
height = 0.10
# The assembled car weighs 1.5 kg (measured 2026-08-01). This field is the
# chassis body ALONE, because the URDF and the Gazebo model sum it with four
# wheel masses to get the total: 1.3 + 4 x 0.05 = 1.5. Change this and the
# wheel mass together, or the simulated car stops weighing what the real one
# does -- mass drives the inertia tensors, so it reaches the dynamics.
mass = 1.3

[ackermann]
# Front axle to rear axle distance.
wheelbase = 0.19
# Left wheel to right wheel distance.
track_width = 0.1675
#
# The road-wheel angle at full lock is NOT declared here. It is derived from
# the [steering] section below (max_wheel_angle_deg), because it is not a free
# parameter -- it is whatever the steering hardware produces.
# It used to sit here as a hand-computed 1.2253 rad whose comment pointed at
# platform/robot/.env.example, which by then pointed at motors.toml, which is
# where the two factors actually lived. Three files, one number, and only prose
# holding them together.
#
# It was 0.5236 (~30 deg) before that, which understated the chassis by more
# than half. Since ackermann_motor_node clamps against the SERVO limit, the
# navigator's own decode of steering_norm through this constant was the binding
# limit -- a full-lock command reached only 38.5 of the servo's 90 degrees and
# the clamp never fired to say so.

[steering]
# servo_max_angle_deg and max_wheel_angle_deg are DELIBERATELY ABSENT.
#
# They describe a specific servo, so they live in that servo's profile under
# config/profiles/ -- 180deg-injora-14kg or 270deg-hiwonder-35kg -- and one
# must be named in VTITAN_HARDWARE_PROFILE. Loading fails with a message
# listing the candidates if none is.
#
# This file used to declare the Injora's 90/55, which meant a run with no
# profile set silently modelled whichever servo happened to be checked in
# rather than the one on the robot. That is not hypothetical: a whole night of
# motor tests once ran on the unmodified base ceiling because the variable was
# blank, and there is no way to tell from behaviour alone which config a run
# used. Absent-and-required converts that silent wrong answer into a loud one.
#
# What stays here: everything that is true of the CHASSIS regardless of which
# servo drives it. Everything upstream -- /ackermann_cmd, the navigator, the
# simulator -- speaks WHEEL angles, per the ROS convention; only the servo
# speaks servo angles, and linkage_ratio is derived from the two profile
# fields rather than declared.


[wheel]
radius = 0.035
width = 0.025
mass = 0.05

[drivetrain]
# max_speed_mps is DELIBERATELY ABSENT -- it describes a specific motor, so it
# lives in that motor's profile (generic-motor-1500rpm or
# rev-hd-hex-motor-6000rpm) and one must be named in VTITAN_HARDWARE_PROFILE.
# See the [steering] note above for why absent-and-required beats a default.
#
# It is a hard ceiling, not a tuning knob: AckermannKinematics clamps to it,
# which is why a speed profile capping commands at 0.30 m/s once turned out to
# be completely inert -- both 0.30 and 0.50 saturate against it. Since
# 2026-08-21 the navigation speed ladder is absolute m/s and this value only
# clamps, so raising it delivers nothing until the motor profile's own
# motion/speed.toml raises the tiers too.
# Physical acceleration limit of the drive motor (m/s^2).
max_accel_mps2 = 2.0
# Counter-phase four-wheel steering: the rear axle turns the full opposite of
# the front. 1.0 is counter-phase, 0.0 would be front-steer only.
rear_steer_ratio = 1.0

[lidar]
# Slamtec C1, flush with the front edge, centered left/right.
# Derived as chassis.length/2 - lidar mesh radius (0.0278, matching the xacro cylinder mesh).
mount_x_offset = 0.1222
# LIDAR sits 20mm above the chassis top -- add to chassis.height for the LIDAR's absolute
# mount z. Was hand-duplicated as simconfig.RobotLidarZOffset (Go) and a hardcoded 0.12
# (= chassis.height + this) in static_tfs.launch.py and the URDF xacro; consolidated here
# 2026-07-30 so all three consumers derive from one value instead of three that could drift.
mount_z_offset = 0.02
# The chassis is physically mounted upside-down, which is why an "inverted" correction
# exists at all. Confirmed 2026-08-02: the mount IS upside-down, so `inverted = true`.
# An earlier same-day measurement had found `false` matching behavior, but that was
# testing the wrong data path (raw /scan directly, which the navigator never reads --
# see ros2_hardware_gateway.py); re-confirmed against the physical mount fact itself,
# it is true. Re-measure after any remount or cable work rather than assuming.
#
# Every consumer that needs the LIDAR's angle correction derives it from THIS flag alone,
# not a second independent setting: `inverted` drives both the sllidar_ros2 driver's own
# `inverted` launch parameter (its left-right mirror) AND a mandatory 180 deg yaw rotation
# applied wherever raw /scan angles are consumed (front/back come attached to the same
# upside-down-mount fact as left/right, not a separate one). A driver-level `inverted:=true`
# with no matching 180 deg yaw application (or vice versa) is exactly the bug found and
# fixed today: the two drifted out of sync when only one was re-verified.
inverted = true
# Independent of `inverted` above: any additional yaw miscalibration NOT explained by the
# upside-down mount (e.g. the unit sits rotated a few degrees off dead-ahead within its
# bracket). Added on top of the 180 deg from `inverted`, not a replacement for it. Zero
# until something measures otherwise.
mount_yaw_offset_deg = 0.0

[imu]
# IMU sits 10mm above the chassis floor. Was hand-duplicated as simconfig.RobotImuZOffset
# (Go, correct), a hardcoded 0.01 in static_tfs.launch.py (correct), and the URDF xacro's
# imu_link joint origin (WRONG -- hardcoded to 0, i.e. the IMU wasn't actually placed here);
# consolidated here 2026-07-30, which also fixes that xacro drift.
mount_z_offset = 0.01

[camera]
# Raspberry Pi Camera Module 3 Wide, mounted directly above the LIDAR.
mount_x_offset = 0.1222
mount_z_offset = 0.16
# ~30 degrees, tilted down. Magnitude is still an estimate pending a real measurement.
mount_pitch = 0.5236
