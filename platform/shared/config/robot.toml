# Single source of truth for the WRO robot's physical constants (custom chassis, counter-phase
# four-wheel steering). Measured 2026-07-11 — see platform/robot/docs/robot-physical-constants.md.
#
# Edit this file, then regenerate every consumer with `task gen:robot-constants`:
#   - platform/gazebo/generator/internal/simconfig/robot_constants.gen.go
#   - platform/gazebo/runtime/robot_description/robot_properties.gen.xacro
#   - platform/shared/src/shared/config/robot_constants_gen.py
#
# All lengths are meters, masses are kilograms, angles are radians unless a
# field is explicitly named _deg (e.g. lidar.mount_yaw_offset_deg).

[chassis]
length = 0.30
width = 0.194
height = 0.10
# The assembled car weighs 1.5 kg (measured 2026-08-01). This field is the
# chassis body ALONE, because the URDF and the Gazebo model sum it with four
# wheel masses to get the total: 1.3 + 4 x 0.05 = 1.5. Change this and the
# wheel mass together, or the simulated car stops weighing what the real one
# does -- mass drives the inertia tensors, so it reaches the dynamics.
mass = 1.3

[ackermann]
# Front axle to rear axle distance.
wheelbase = 0.19
# Left wheel to right wheel distance.
track_width = 0.1675
#
# The road-wheel angle at full lock is NOT declared here. It is derived from
# the [steering] section below as servo_max_angle_deg * linkage_ratio, because
# it is not a free parameter -- it is whatever the steering hardware produces.
# It used to sit here as a hand-computed 1.2253 rad whose comment pointed at
# platform/robot/.env.example, which by then pointed at motors.toml, which is
# where the two factors actually lived. Three files, one number, and only prose
# holding them together.
#
# It was 0.5236 (~30 deg) before that, which understated the chassis by more
# than half. Since ackermann_motor_node clamps against the SERVO limit, the
# navigator's own decode of steering_norm through this constant was the binding
# limit -- a full-lock command reached only 38.5 of the servo's 90 degrees and
# the clamp never fired to say so.

[steering]
# The servo's full travel, in SERVO degrees. With range_deg = 180 and a
# 500-2500us pulse span, 90 deg maps exactly to the maximum pulse, so larger
# values clamp to the same pulse and do nothing. Verified on hardware
# 2026-07-25.
servo_max_angle_deg = 90.0

# Road-wheel degrees produced per servo degree. Measured 0.78 on this chassis:
# the servo at 90 deg puts the wheels at ~70 deg.
#
# Everything upstream -- /ackermann_cmd, the navigator, the simulator -- speaks
# WHEEL angles, per the ROS convention; only the servo speaks servo angles.
# Without this conversion the node fed a wheel angle straight to the servo and
# the wheels under-turned by ~22%, so the robot cornered wider than the path it
# was following.
linkage_ratio = 0.78

[wheel]
radius = 0.035
width = 0.025
mass = 0.05

[drivetrain]
# Measured top speed of the drive motor under load. This is a hard ceiling, not
# a tuning knob: AckermannKinematics clamps to it, which is why a speed profile
# capping commands at 0.30 m/s once turned out to be completely inert -- both
# 0.30 and 0.50 saturate here.
max_speed_mps = 0.156
# Physical acceleration limit of the drive motor (m/s^2).
max_accel_mps2 = 2.0
# Counter-phase four-wheel steering: the rear axle turns the full opposite of
# the front. 1.0 is counter-phase, 0.0 would be front-steer only.
rear_steer_ratio = 1.0

[lidar]
# Slamtec C1, mounted upside-down and flush with the front edge, centered left/right.
# Derived as chassis.length/2 - lidar mesh radius (0.0278, matching the xacro cylinder mesh).
mount_x_offset = 0.1222
# LIDAR sits 20mm above the chassis top -- add to chassis.height for the LIDAR's absolute
# mount z. Was hand-duplicated as simconfig.RobotLidarZOffset (Go) and a hardcoded 0.12
# (= chassis.height + this) in static_tfs.launch.py and the URDF xacro; consolidated here
# 2026-07-30 so all three consumers derive from one value instead of three that could drift.
mount_z_offset = 0.02
# Moved from platform/robot/.env.example's LIDAR_YAW_OFFSET_DEG -- a physical mount fact
# ("the C1 is mounted inverted, so its raw angle-zero points opposite robot-front"), not a
# runtime knob, and the TF tree (sim + real) and perception both need it. Confirmed
# empirically: the sector with the largest ranges (open space, robot-front) lands at +-180
# deg in raw /scan data.
mount_yaw_offset_deg = 180.0

[imu]
# IMU sits 10mm above the chassis floor. Was hand-duplicated as simconfig.RobotImuZOffset
# (Go, correct), a hardcoded 0.01 in static_tfs.launch.py (correct), and the URDF xacro's
# imu_link joint origin (WRONG -- hardcoded to 0, i.e. the IMU wasn't actually placed here);
# consolidated here 2026-07-30, which also fixes that xacro drift.
mount_z_offset = 0.01

[camera]
# Raspberry Pi Camera Module 3 Wide, mounted directly above the LIDAR.
mount_x_offset = 0.1222
mount_z_offset = 0.16
# ~30 degrees, tilted down. Magnitude is still an estimate pending a real measurement.
mount_pitch = 0.5236
