# Speed ladder for the REV HD Hex 6000 rpm motor, in ABSOLUTE m/s.
#
# The ladder lives with the MOTOR because the spread between tiers is chosen
# against what this drivetrain can deliver -- see the generic-motor-1500rpm
# copy for why that is motor-specific while steering tuning is not.
#
# Since the ceiling now only CLAMPS (it stopped being a multiplier on
# 2026-08-21), a faster motor delivers nothing until these tiers are
# deliberately raised. This file is that deliberate edit. Without it the whole
# ladder would silently pin to the slower motor's numbers.

# NOT scaled with the ceiling, deliberately. The friction floor is a property
# of the motor and tyres -- the least speed that overcomes stiction -- and it
# does not rise because the top speed did. The old fraction form would have
# claimed this robot cannot move slower than 0.075 m/s when 0.05 is the
# measured figure. This is the clearest single reason the fractions were the
# wrong representation.
#
# Strictly this should be re-measured on THIS motor rather than inherited; a
# different gearbox has a different stiction threshold.
min_mps = 0.0499

max_mps = 0.50

# REPRODUCED, NOT ARGUED -- and the first tier to re-tune.
#
# The generic-motor copy justifies creep in CENTIMETRES OF TRAVEL: the servo
# slews at a fixed 2.0 rad/s, so full lock takes 0.61 s, and the chassis must
# cover less than its 0.103 m of lateral margin in that time. At 0.1014 m/s it
# covers 6.2 cm. At 0.1521 it covers 9.3 cm -- 90% of the margin, on a budget
# written for 60%.
#
# Left UNCHANGED across the 2026-08-27 motor-speed revision below: this is a
# servo-slew/geometry constant, not a fraction of top speed, so a faster
# motor does not by itself justify moving it. Lowering it toward 0.1014 is
# still a separate, attributable change.
creep_mps = 0.1521

# Raised 2026-08-30 from 0.20/0.28/0.35 after a hardware run showed the ladder
# leaving time on the table. NOT hardware-validated at these values.
#
# The headroom argument changed because the ceiling did. The previous revision
# sized these against "~0.45 m/s at max_duty=0.5" measured 2026-08-28 -- but
# that bench predates the counts_per_rev 86 -> 60 correction, which is exactly
# the error that made measured speed read LOW. The 2026-08-29 bench, after that
# fix, puts the closed-loop ceiling at ~0.58 m/s (recorded in
# navigation/blind_nav/localization.toml, which sized its own speed gate
# against it). The 0.45 figure is superseded; treat it as an artefact of the
# encoder error, not a second opinion.
#
# Against 0.58 the fast tier sits at 72% of available authority, so the PID
# keeps real margin to converge rather than railing at max_duty -- which is the
# same criterion the 0.45-era values were chosen on, just against a ceiling
# that is no longer wrong. max_duty therefore stays at 0.5; raising it is not
# required for this ladder and its own precondition (a live-verified PID gain
# rescale) is still unmet -- see config/hardware/motors/encoder.toml.
#
# Still not a final tune. A real 100%-duty max_rpm has never been bench
# measured, and the friction floor under steering load is unmeasured, so the
# spread between tiers remains argued rather than derived.
slow_mps = 0.22
medium_mps = 0.32
fast_mps = 0.42

# OBSTACLES CHALLENGE ladder. Left UNSET deliberately: the base rungs above
# already are the Obstacles tune, and duplicating them under a prefix would
# create two places to drift apart. Set obstacles_slow_mps / obstacles_medium_mps
# / obstacles_fast_mps / obstacles_max_mps here if the base ever needs to mean
# something other than what Obstacles wants.

# OPEN CHALLENGE ladder. Optional -- omit these four keys on a motor with no
# headroom to spare and both challenges share the ladder above.
#
# The two challenges want opposite things and this motor is fast enough to give
# each what it wants. Obstacles degrades monotonically with speed (measured
# 2026-08-28 on the 256 corpus: in-time 38/256 at 0.156 m/s, 16 at 0.50, 9 at
# 0.60), so it keeps the base ladder. Open tolerates far more, so it can spend
# headroom on speed.
#
# NOT because Open is short of clock. That was the original argument and it is
# now WRONG: it read "the last clean 3-lap run was 159.7 s, about 20 s of
# margin", but the two clean hardware 3-lap runs of 2026-09-01 came in at 71.6 s
# and 98.7 s against the 180 s limit. Open is nowhere near the round limit, so
# raising these buys margin that does not bind. What justifies the rungs below
# is that Open tolerates the speed without collisions -- see the A/B -- not that
# it needs it. If a future change makes speed cost cases, give it up: there is
# no lap-time pressure to defend it with.
#
# Sized against the MEASURED drivetrain, not the ceiling in robot.toml
# (max_speed_mps = 1.0 is an unmeasured feel-based guess and is not the binding
# clamp; max_mps is). Bench, 2026-08-30, robot loaded on the floor, closed
# loop: achieved = 1.042 * commanded + 0.034 m/s across all three rungs. That
# +3.4 cm/s offset is real and does not calibrate out with a gain, so:
#
#   commanded 0.50  -> ~0.555 achieved
#   commanded 0.525 -> ~0.581, i.e. AT the measured closed-loop ceiling
#   commanded 0.56  -> ~0.617, UNREACHABLE; the PID rails at max_duty
#
# fast is 0.50, not the 0.56 a naive +1/3 would give: that would sit above the
# drivetrain ceiling AND above any sane cap, would have been clamped to
# max_mps, and would have measured nothing. open_max_mps must stay above it --
# core_navigator clamps every tier to max_mps(), so a fast tier above the cap
# is silently inert. A validator now rejects that combination outright.
#
# Raised 2026-09-01 from 0.24/0.35/0.46. A/B on the full 640-case Open sweep
# (diag_open_ab.py, both arms same seeded cases): baseline 638/640 -> variant
# 639/640, ZERO collisions in either arm, every failure in both arms
# over-time or incomplete. Case 144 flipped over-time -> ok; the one variant
# failure is case 300, the known creep deadlock, which fails in the baseline
# too. Mean sim time -5.73 s per case, 563 of 638 faster.
#
# The +1 case is inside this sweep's noise floor and is NOT the evidence. The
# evidence is the absence of regression -- specifically that no case turned
# into a collision, which is the failure mode a speed rise threatens, because
# the clearance ladder is in METRES (see the closing note below).
#
# WHY 0.50 AND NOT 0.525. 0.525 is where the fit predicts ~0.581 against a
# ~0.58 measured ceiling: the controller would sit at saturation on the
# straights with nothing left to correct a disturbance, and a duty-capped loop
# stops regulating and behaves open-loop -- which is how "every commanded speed
# above ~0.35 delivered identical motion" was originally observed (2026-08-29,
# before the counts_per_rev fix). 0.50 predicts ~0.555, leaving ~4% of reserve.
# That is thin, not absent.
#
# STILL AN EXTRAPOLATION. The 2026-08-30 fit spans 0.22-0.42 commanded; 0.50 is
# 19% beyond the highest rung actually measured, and a linear fit is only
# evidence inside its range. Whether the loop still tracks there is untested on
# hardware. If a track run shows the fast tier not delivering, drop to 0.46 --
# the previous value, which drove the 71.6 s and 98.7 s clean runs -- and
# re-measure before assuming the ladder is at fault.
#
# NOT VALIDATED ON TRACK at these values. The clearance ladder
# (contact 0.10 / slow 0.25 / medium 0.50) is in METRES, not time, so raising
# speed shrinks the reaction runway those distances buy: medium_dist is 1.19 s
# at the Obstacles fast tier, was 1.09 s here at 0.46, and is 1.00 s at 0.50.
# docs/internal/algorithms/speed-envelope.md section 6 documents that as the
# structural speed cap, and measured the dose-response: at a 0.50 ceiling the
# thresholds are close enough to right that scaling them adds nothing, at 0.60
# they are ~17% off, and at 0.80 they are ~60% off and worth 58 cases. This
# ladder stays inside the band where the shipped thresholds still hold. Going
# further is not a config edit -- it wants the thresholds derived from current
# speed as a time-to-collision budget, which is the refactor that section
# names.
open_slow_mps = 0.26
open_medium_mps = 0.38
open_fast_mps = 0.50
open_max_mps = 0.55
