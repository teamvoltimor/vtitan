# Speed ladder for the REV HD Hex 6000 rpm motor, in ABSOLUTE m/s.
#
# The ladder lives with the MOTOR because the spread between tiers is chosen
# against what this drivetrain can deliver -- see the generic-motor-1500rpm
# copy for why that is motor-specific while steering tuning is not.
#
# Since the ceiling now only CLAMPS (it stopped being a multiplier on
# 2026-08-21), a faster motor delivers nothing until these tiers are
# deliberately raised. This file is that deliberate edit. Without it the whole
# ladder would silently pin to the slower motor's numbers.

# NOT scaled with the ceiling, deliberately. The friction floor is a property
# of the motor and tyres -- the least speed that overcomes stiction -- and it
# does not rise because the top speed did. The old fraction form would have
# claimed this robot cannot move slower than 0.075 m/s when 0.05 is the
# measured figure. This is the clearest single reason the fractions were the
# wrong representation.
#
# Strictly this should be re-measured on THIS motor rather than inherited; a
# different gearbox has a different stiction threshold.
min_mps = 0.0499

max_mps = 0.50

# REPRODUCED, NOT ARGUED -- and the first tier to re-tune.
#
# The generic-motor copy justifies creep in CENTIMETRES OF TRAVEL: the servo
# slews at a fixed 2.0 rad/s, so full lock takes 0.61 s, and the chassis must
# cover less than its 0.103 m of lateral margin in that time. At 0.1014 m/s it
# covers 6.2 cm. At 0.1521 it covers 9.3 cm -- 90% of the margin, on a budget
# written for 60%.
#
# Left UNCHANGED across the 2026-08-27 motor-speed revision below: this is a
# servo-slew/geometry constant, not a fraction of top speed, so a faster
# motor does not by itself justify moving it. Lowering it toward 0.1014 is
# still a separate, attributable change.
creep_mps = 0.1521

# Raised 2026-08-30 from 0.20/0.28/0.35 after a hardware run showed the ladder
# leaving time on the table. NOT hardware-validated at these values.
#
# The headroom argument changed because the ceiling did. The previous revision
# sized these against "~0.45 m/s at max_duty=0.5" measured 2026-08-28 -- but
# that bench predates the counts_per_rev 86 -> 60 correction, which is exactly
# the error that made measured speed read LOW. The 2026-08-29 bench, after that
# fix, puts the closed-loop ceiling at ~0.58 m/s (recorded in
# navigation/blind_nav/localization.toml, which sized its own speed gate
# against it). The 0.45 figure is superseded; treat it as an artefact of the
# encoder error, not a second opinion.
#
# Against 0.58 the fast tier sits at 72% of available authority, so the PID
# keeps real margin to converge rather than railing at max_duty -- which is the
# same criterion the 0.45-era values were chosen on, just against a ceiling
# that is no longer wrong. max_duty therefore stays at 0.5; raising it is not
# required for this ladder and its own precondition (a live-verified PID gain
# rescale) is still unmet -- see config/hardware/motors/encoder.toml.
#
# Still not a final tune. A real 100%-duty max_rpm has never been bench
# measured, and the friction floor under steering load is unmeasured, so the
# spread between tiers remains argued rather than derived.
slow_mps = 0.22
medium_mps = 0.32
fast_mps = 0.42
