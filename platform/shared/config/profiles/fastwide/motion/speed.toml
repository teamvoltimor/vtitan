# Speed ladder for the faster drivetrain this profile describes, deep-merged
# onto platform/shared/config/navigation/motion/speed.toml.
#
# This file exists because the tiers became ABSOLUTE m/s on 2026-08-21. While
# they were fractions of the ceiling, a profile that raised max_speed_mps got a
# faster ladder for free -- which was precisely the defect: the hardware
# description silently edited the navigation policy. Now the ceiling only
# CLAMPS, so a faster motor delivers nothing until the tiers are deliberately
# raised here. That deliberate edit is this file.
#
# Values reproduce exactly what this profile resolved to BEFORE the conversion
# (the old fractions 0.65 / 0.75 / 0.85 / 1.0 against a 0.234 m/s ceiling), so
# the units change is a no-op on this arm as well as on base. Verified against
# the 128-scenario blind Open sweep: 125/128 either way.

# NOT scaled, deliberately. The friction floor is a property of the motor and
# tyres -- the least speed that overcomes stiction -- and it does not rise
# because the top speed did. Scaling it with the ceiling (as the fraction form
# did) would claim this robot cannot move slower than 0.075 m/s when 0.05 is
# the measured figure. This is the single clearest reason the fractions were
# the wrong representation.
min_mps = 0.0499

max_mps = 0.234

# 0.65 x 0.234. REPRODUCED, NOT ARGUED -- and the first thing to re-tune.
#
# The base file justifies creep in CENTIMETRES OF TRAVEL: the servo slews at a
# fixed 2.0 rad/s, so full lock from centre takes 0.61 s, and the chassis must
# cover less than its 0.103 m of lateral margin in that time. At the base
# 0.1014 m/s it covers 6.2 cm. At 0.1521 it covers 9.3 cm -- 90% of the margin,
# on a budget that was written for 60%. The number below is what the fraction
# ladder happened to produce, not what that argument supports.
#
# Left at the reproduced value so the units conversion stays measurable as a
# no-op. Lowering it toward 0.1014 is a separate, attributable change.
creep_mps = 0.1521

slow_mps = 0.1755
medium_mps = 0.1989
fast_mps = 0.234
