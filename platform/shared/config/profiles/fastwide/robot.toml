# Hardware-profile overlay for a HYPOTHETICAL faster, wider-steering car,
# deep-merged onto the base platform/shared/config/robot.toml (see
# shared.config.hardware_profile). Only declares the keys that change --
# chassis, ackermann, wheel, lidar, imu and camera all still come from the
# base file.
#
# Select with VTITAN_HARDWARE_PROFILE=fastwide (Python) or
# `task gen:robot-constants PROFILE=fastwide` (Go/sim regeneration).
#
# STATUS: EXPLORATORY. No such car exists. Unlike servo270 -- which describes
# a real servo someone can buy and bench-measure -- every number here is a
# design question being asked of the simulator: "if the car could do this,
# would the Open Challenge fit inside the 180 s round limit?" Nothing in this
# file has been measured, and nothing should be flown from it.
#
# Chassis mass is deliberately NOT overridden: the base file already declares
# 1.3 kg, which is the figure this profile was described as wanting.

[steering]
# A 55 deg road-wheel limit cannot be reached from a 180 deg servo at this
# linkage ratio, so the wider angle presumes the 270 deg servo the servo270
# profile describes. Kept in step with that profile deliberately -- if
# servo270's angle is ever bench-corrected, this one is wrong by the same
# amount and for the same reason.
servo_max_angle_deg = 135.0

# 85 deg road wheels, up from the base file's bench-measured 55 deg. The upper
# end of the 85-90 range asked for; 85 rather than 90 because it matches
# servo270's own estimate, so the two profiles do not quietly disagree about
# the same physical linkage.
max_wheel_angle_deg = 85.0

[drivetrain]
# 1.5x the base file's measured 0.156 m/s ceiling. The base value is a real
# motor-under-load measurement; this is simply that number scaled by the "~50%
# faster" the profile was described as, and is the single most load-bearing
# assumption in this file -- the Open Challenge time limit is a distance/speed
# problem before it is a control problem.
max_speed_mps = 0.234
