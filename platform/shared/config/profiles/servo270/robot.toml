# Hardware-profile overlay for a 270 deg servo, deep-merged onto the base
# platform/shared/config/robot.toml (see shared.config.hardware_profile).
# Only declares the keys that actually change for this servo -- everything
# else (chassis, ackermann, drivetrain, lidar, imu, camera) still comes
# from the base file.
#
# Select with VTITAN_HARDWARE_PROFILE=servo270 (Python) or
# `task gen:robot-constants PROFILE=servo270` (Go/sim regeneration).
#
# STATUS: scaffolding only. max_wheel_angle_deg below has NOT been
# bench-verified -- do not fly this profile until it is re-measured on real
# hardware the same way the base file's 55.0 was (protractor, full servo
# lock). See docs/internal/plans/2026-08-11-servo-hardware-profiles.md.

[steering]
# 270 deg / 2 -- half of full servo travel, the same "deg from center to
# full lock" convention as the base file's servo_max_angle_deg = 90.0 (for
# a 180 deg servo). This is a direct geometric fact given the servo's
# spec, not a tuning guess.
servo_max_angle_deg = 135.0

# TODO(servo270): bench figure only (protractor not yet applied). Needs
# re-measurement the same way the base file's 55.0 was: command the servo
# to servo_max_angle_deg and measure the actual road-wheel angle at full
# lock -- the linkage may not scale linearly with servo travel.
max_wheel_angle_deg = 85.0
