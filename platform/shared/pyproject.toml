[project]
name = "klevor-shared"
version = "0.1.0"
description = "Shared constants and enums for Klevor platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
