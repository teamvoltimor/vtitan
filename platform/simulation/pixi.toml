[project]
name = "klevor-platform"
version = "0.1.0"
description = "WRO 2026 Future Engineers — hardware-agnostic ROS2 Kilted runtime"
channels = ["robostack-kilted", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64", "osx-arm64"]

[dependencies]
# ROS2 Kilted base (via RoboStack: https://github.com/RoboStack/ros-kilted)
ros-kilted-ros-base         = "*"
ros-kilted-geometry-msgs    = "*"
ros-kilted-nav-msgs         = "*"
ros-kilted-sensor-msgs      = "*"
ros-kilted-cv-bridge        = "*"

# Gazebo Ionic + ROS2 integration
ros-kilted-gazebo-ros-pkgs  = "*"
ros-kilted-ackermann-msgs   = "*"

# Python runtime
python    = ">=3.11"
numpy     = ">=1.26"
opencv    = ">=4.9"

[feature.dev.dependencies]
pytest = ">=8.0"
ruff   = ">=0.4"

[environments]
default = { features = [], solve-group = "default" }
dev     = { features = ["dev"], solve-group = "default" }

[tasks]
record = "python -m src.recording.recorder"
test   = "pytest tests/ -v"
lint   = "ruff check src/ tests/"
