syntax = "proto3";

package vtitan.telemetry.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/teamvoltimor/vtitan/platform/backend/gen/telemetry/v1;telemetryv1";

// NodeHealth mirrors shared.config.enums.NodeHealth.
enum NodeHealth {
  NODE_HEALTH_UNSPECIFIED = 0;
  NODE_HEALTH_NOMINAL     = 1;
  NODE_HEALTH_WATCHDOG    = 2;
  NODE_HEALTH_REPLANNING  = 3;
}

// Position3D is a point in 3-D space (meters).
message Position3D {
  double x = 1;
  double y = 2;
  double z = 3;
}

// ImuData carries BNO085 sensor readings.
message ImuData {
  // linear_acceleration in m/s² (x, y, z)
  Position3D linear_acceleration = 1;
  // angular_velocity in rad/s (roll, pitch, yaw)
  Position3D angular_velocity = 2;
  // orientation quaternion components (x, y, z, w)
  double orientation_x = 3;
  double orientation_y = 4;
  double orientation_z = 5;
  double orientation_w = 6;
}

// Detection represents a single YOLO traffic-sign detection.
message Detection {
  string class_name = 1; // "red_sign" | "green_sign"
  double confidence  = 2 [(buf.validate.field).double = {
    gte: 0,
    lte: 1
  }];
  // Bounding box: x, y, w, h — normalized [0, 1]
  double bbox_x = 3;
  double bbox_y = 4;
  double bbox_w = 5;
  double bbox_h = 6;
}

// MotorState carries BuildHAT motor telemetry.
message MotorState {
  double steering_angle    = 1; // radians
  double drive_speed       = 2; // motor speed 0-100 scale
  int32  encoder_position  = 3; // encoder ticks
}

// TelemetryMetrics aggregates stats from the ROS bridge.
message TelemetryMetrics {
  google.protobuf.Timestamp timestamp   = 1 [(buf.validate.field).required = true];
  NodeHealth                node_health = 2;

  // LiDAR metrics
  int32           points_captured = 3  [(buf.validate.field).int32.gte = 0];
  optional double range_min       = 4  [(buf.validate.field).double.gte = 0];
  optional double range_max       = 5  [(buf.validate.field).double.gte = 0];
  optional double range_mean      = 6  [(buf.validate.field).double.gte = 0];
  optional double forward         = 7  [(buf.validate.field).double.gte = 0];
  optional double left            = 8  [(buf.validate.field).double.gte = 0];
  optional double right           = 9  [(buf.validate.field).double.gte = 0];
  optional double back            = 10 [(buf.validate.field).double.gte = 0];

  // Navigation metrics
  optional double speed = 11 [(buf.validate.field).double.gte = 0];
  string          stage = 12;

  // Sensor availability flags (fields 13-15 use 1-byte field numbers)
  bool lidar_available    = 13;
  bool imu_available      = 14;
  bool camera_available   = 15;
  bool odometry_available = 16;
}

// RobotSnapshot is the complete payload the frontend consumes.
message RobotSnapshot {
  google.protobuf.Timestamp timestamp    = 1 [(buf.validate.field).required = true];
  string                    mission_name = 2 [(buf.validate.field).string.min_len = 1];

  optional Position3D robot_position    = 3;
  optional double     robot_orientation = 4; // radians

  repeated Position3D lidar_points      = 5;
  repeated Position3D path_history      = 6;
  repeated string     logs              = 7;

  TelemetryMetrics metrics = 8 [(buf.validate.field).required = true];

  optional ImuData      imu_data          = 9;
  repeated Detection    vision_detections = 10;
  optional MotorState   motor_state       = 11;
}

// TopicUpdate carries a single ROS2 topic frame.
message TopicUpdate {
  string                    topic_name    = 1 [(buf.validate.field).string.min_len = 1];
  string                    message_type  = 2;
  google.protobuf.Timestamp timestamp     = 3 [(buf.validate.field).required = true];
  double                    update_rate_hz = 4 [(buf.validate.field).double.gt = 0];
  google.protobuf.Struct    data          = 5; // raw message fields; structure varies by message_type
}

// TopicsSnapshot is a point-in-time collection of all active topic updates.
message TopicsSnapshot {
  google.protobuf.Timestamp timestamp = 1 [(buf.validate.field).required = true];
  repeated TopicUpdate      topics    = 2;
}

// ReplaySessionInfo describes a stored JSONL session available for replay.
message ReplaySessionInfo {
  string                    session_id  = 1 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp created_at  = 2 [(buf.validate.field).required = true];
  int32                     entry_count = 3 [(buf.validate.field).int32.gte = 0];
}
