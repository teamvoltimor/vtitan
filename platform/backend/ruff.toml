# Ruff Configuration
# An extremely fast Python linter and code formatter, written in Rust
# Compatible with ruff >= 0.1.0
# Last updated: 2025-01-29
# Documentation: https://docs.astral.sh/ruff/

# ============================================================================
# Basic Configuration
# ============================================================================
target-version = "py312"
line-length = 120
indent-width = 4

# Output
output-format = "concise"
show-fixes = true

# Cache
cache-dir = ".ruff_cache"

# ============================================================================
# File Selection
# ============================================================================
# Files to include
include = ["*.py", "*.pyi", "**/pyproject.toml"]

# Files and directories to exclude
exclude = [
    # Version control
    ".git",
    ".github",
    ".gitignore",

    # Python artifacts
    "__pycache__",
    "*.pyc",
    ".Python",

    # Virtual environments
    ".env",
    ".venv",
    "env",
    "venv",
    "ENV",
    "env.bak",
    "venv.bak",

    # Build and distribution
    "build",
    "dist",
    "*.egg-info",
    ".eggs",

    # IDEs and editors
    ".vscode",
    ".idea",
    "*.swp",
    "*.swo",
    "*~",

    # Testing and coverage
    ".tox",
    ".pytest_cache",
    ".coverage",
    "htmlcov",
    ".mypy_cache",
    ".ruff_cache",

    # Documentation
    "docs/conf.py",
    "_build",

    # Migrations
    "*/migrations/*",
    "*/alembic/versions/*",

    # Generated files
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*.pyi",
]

# ============================================================================
# Linting Rules
# ============================================================================
[lint]
# Rule categories to enable
select = [
    # Pyflakes (F)
    "F",

    # Pycodestyle (E, W)
    "E",
    "W",

    # McCabe complexity (C90)
    "C90",

    # isort (I)
    "I",

    # pydocstyle (D)
    "D",

    # pyupgrade (UP)
    "UP",

    # flake8-2020 (YTT)
    "YTT",

    # flake8-annotations (ANN)
    "ANN",

    # flake8-async (ASYNC)
    "ASYNC",

    # flake8-bandit (S)
    "S",

    # flake8-blind-except (BLE)
    "BLE",

    # flake8-boolean-trap (FBT)
    "FBT",

    # flake8-bugbear (B)
    "B",

    # flake8-builtins (A)
    "A",

    # flake8-commas (COM)
    "COM",

    # flake8-comprehensions (C4)
    "C4",

    # flake8-datetimez (DTZ)
    "DTZ",

    # flake8-debugger (T10)
    "T10",

    # flake8-django (DJ)
    # "DJ",

    # flake8-errmsg (EM)
    "EM",

    # flake8-executable (EXE)
    "EXE",

    # flake8-implicit-str-concat (ISC)
    "ISC",

    # flake8-import-conventions (ICN)
    "ICN",

    # flake8-logging-format (G)
    "G",

    # flake8-no-pep420 (INP)
    "INP",

    # flake8-pie (PIE)
    "PIE",

    # flake8-print (T20)
    "T20",

    # flake8-pyi (PYI)
    "PYI",

    # flake8-pytest-style (PT)
    "PT",

    # flake8-quotes (Q)
    "Q",

    # flake8-raise (RSE)
    "RSE",

    # flake8-return (RET)
    "RET",

    # flake8-self (SLF)
    "SLF",

    # flake8-simplify (SIM)
    "SIM",

    # flake8-tidy-imports (TID)
    "TID",

    # flake8-type-checking (TCH)
    "TCH",

    # flake8-unused-arguments (ARG)
    "ARG",

    # flake8-use-pathlib (PTH)
    "PTH",

    # eradicate (ERA)
    "ERA",

    # pandas-vet (PD)
    # "PD",

    # pygrep-hooks (PGH)
    "PGH",

    # Pylint (PL)
    "PL",

    # tryceratops (TRY)
    "TRY",

    # flynt (FLY)
    "FLY",

    # NumPy-specific rules (NPY)
    # "NPY",

    # Perflint (PERF)
    "PERF",

    # Refurb (FURB)
    "FURB",

    # flake8-logging (LOG)
    "LOG",

    # Ruff-specific rules (RUF)
    "RUF",
]

# Rules to ignore
ignore = [
    # Conflicts with formatter
    "W191",    # Tab indentation
    "E111",    # Indentation
    "E114",    # Indentation
    "E117",    # Over-indented
    "E501",    # Line too long (handled by formatter)

    # Docstring rules (too strict for all code)
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "D203",    # 1 blank line required before class docstring (conflict)
    "D212",    # Multi-line docstring summary should start at first line (conflict)
    "D213",    # Multi-line docstring summary should start at second line

    # Type annotation rules (can be too strict)
    "ANN401",  # Dynamically typed expressions (Any)

    # Boolean traps (sometimes necessary)
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default value in function definition

    # Exception handling (sometimes too strict)
    "TRY003",  # Avoid specifying long messages outside exception class

    # Complexity (adjust as needed)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison

    # Unicode characters in docstrings and strings (intentional)
    "RUF001",  # String contains ambiguous Unicode character
    "RUF002",  # Docstring contains ambiguous Unicode character
    "RUF003",  # Comment contains ambiguous Unicode character

    # FastAPI Depends() in default arguments is the correct pattern
    "B008",

    # Module naming (html.py intentionally shadows stdlib; rename would break API)
    "A005",    # Module shadows a Python standard-library module
]

# Rules to treat as fixable
fixable = ["ALL"]

# Rules to not auto-fix
unfixable = [
    "F401",    # Unused imports (might be re-exports)
    "F841",    # Unused variables (might be intentional)
    "ERA001",  # Commented-out code (need manual review)
]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# ============================================================================
# Per-file Rule Ignores
# ============================================================================
[lint.per-file-ignores]
# Tests
"test_*.py" = [
    "S101",    # Use of assert
    "S105",    # Possible hardcoded password
    "S106",    # Possible hardcoded password argument
    "PLR2004", # Magic value used in comparison
    "ANN",     # Type annotations
    "D",       # Docstrings
]
"tests/*.py" = [
    "S101",
    "S105",
    "S106",
    "PLR2004",
    "ANN",
    "D",
]
"*_test.py" = [
    "S101",
    "S105",
    "S106",
    "PLR2004",
    "ANN",
    "D",
]
"conftest.py" = [
    "F401",    # Unused imports (fixtures)
    "F811",    # Redefinition
    "E402",    # Imports after sys.path manipulation
]

# __init__.py files
"__init__.py" = [
    "F401",    # Unused imports (re-exports)
    "F403",    # Star imports
]

# Setup and config files
"setup.py" = ["D", "ANN"]
"config.py" = ["E501"]
"settings.py" = ["E501"]

# Scripts
"scripts/*.py" = [
    "T20",     # Print statements
    "INP001",  # Implicit namespace package
]

# Root-level entrypoints (not in a package)
"main.py" = [
    "INP001",
    "PLC0415",  # lazy mode imports inside _run_app / _run_server are intentional
]

# Inference pipeline: heavy imports are deferred; function complexity is domain-driven
"src/inference.py" = ["PLC0415", "BLE001", "C901", "PLR0911", "PLR0912", "PLR0915"]

# Rendering: single complex function by design (many overlay layers)
"src/render.py" = ["C901"]

# ENV_HF_TOKEN is a key name string, not a hardcoded secret value
"src/constants.py" = ["S105"]

# pickle is the intentional wire protocol for the TCP model server
"src/sam_client.py" = ["S301"]

# model_ctrl defers numpy import to avoid heavy startup cost
"src/handlers/model_ctrl.py" = ["PLC0415"]

# TCP server: pickle protocol; broad catch is intentional server robustness
"src/server/main.py" = ["S301", "BLE001"]

# Broad catch in load_model is intentional — ML loading can fail in arbitrary ways
"src/server/loader.py" = ["BLE001"]

# ML backends defer all framework imports until the model is actually loaded
"src/server/sam1.py" = ["PLC0415"]
"src/server/sam2.py" = ["PLC0415"]
"src/server/sam3.py" = ["PLC0415", "BLE001"]

# Broad catch in model-dropdown init is a UI fallback; S104 bind-all is intentional for Docker
"src/app.py" = ["BLE001", "S104"]

"src/*.py" = []

# ============================================================================
# Rule-specific Configuration
# ============================================================================

# isort configuration
[lint.isort]
known-first-party = ["src"]
known-third-party = []
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
combine-as-imports = true
split-on-trailing-comma = true
force-wrap-aliases = true

# flake8-quotes configuration
[lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

# pydocstyle configuration
[lint.pydocstyle]
convention = "google"

# pylint configuration
[lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

# McCabe complexity
[lint.mccabe]
max-complexity = 10

# flake8-annotations configuration
[lint.flake8-annotations]
allow-star-arg-any = true
suppress-dummy-args = true
suppress-none-returning = true

# flake8-bugbear configuration
[lint.flake8-bugbear]
extend-immutable-calls = []

# flake8-builtins configuration
[lint.flake8-builtins]
builtins-ignorelist = ["id", "type", "format"]

# flake8-comprehensions configuration
[lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

# flake8-import-conventions configuration
[lint.flake8-import-conventions]
[lint.flake8-import-conventions.aliases]
"datetime" = "dt"
"numpy" = "np"
"pandas" = "pd"
"seaborn" = "sns"
"matplotlib.pyplot" = "plt"
"tensorflow" = "tf"
"torch" = "torch"

# flake8-pytest-style configuration
[lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true
parametrize-names-type = "tuple"
parametrize-values-type = "tuple"
parametrize-values-row-type = "tuple"

# flake8-tidy-imports configuration
[lint.flake8-tidy-imports]
ban-relative-imports = "all"

# flake8-type-checking configuration
[lint.flake8-type-checking]
strict = false
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

# ============================================================================
# Formatting Configuration
# ============================================================================
[format]
# Formatting style
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Docstring formatting
docstring-code-format = true
docstring-code-line-length = "dynamic"

# Preview features (opt-in to new formatting)
preview = false

# ============================================================================
# Usage Examples
# ============================================================================
# Lint entire project:
#   ruff check .
#
# Auto-fix issues:
#   ruff check --fix .
#
# Format code:
#   ruff format .
#
# Check and format:
#   ruff check --fix . && ruff format .
#
# Show violations without fixing:
#   ruff check --no-fix .
#
# Check specific files:
#   ruff check src/ tests/
#
# Watch mode (re-run on changes):
#   ruff check --watch .
#
# Generate configuration:
#   ruff check --show-settings
#
# List all rules:
#   ruff rule --all
#
# Explain a specific rule:
#   ruff rule E501
