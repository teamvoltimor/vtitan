[project]
name = "klevor-platform"
version = "0.2.0"
description = "Hardware-agnostic backend/frontend platform with telemetry APIs"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.24",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
