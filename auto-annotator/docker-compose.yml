services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DB_PATH=/app/data/manifest.db
      - MODELS_DIR=/app/models
      - MODELS_CONFIG=/app/config/models.toml
      - SERVER_PORT=${SERVER_PORT:-8765}
      - API_PORT=${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ./backend/data:/app/data:rw
      - ./backend/models:/app/models:rw
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${API_PORT:-8000}/gallery"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
