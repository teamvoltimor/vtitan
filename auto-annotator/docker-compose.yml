services:
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml-service
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - GRPC_PORT=${GRPC_PORT:-50051}
      - MODELS_DIR=/app/models
    volumes:
      - ./ml-service/data:/app/data:rw
      - ./ml-service/models:/app/models:rw
    # gRPC is only reachable within the compose network — no external port binding.
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', ${GRPC_PORT:-50051}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 16g
    cpus: 4

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      - DB_PATH=/app/data/manifest.db
      - DATA_DIR=/app/data
      - MODELS_CONFIG=/app/config/models.toml
      - API_PORT=${API_PORT:-8000}
      - SEGMENT_GRPC_ADDR=ml-service:${GRPC_PORT:-50051}
      - AUGMENT_GRPC_ADDR=ml-service:${GRPC_PORT:-50051}
      - TRAIN_GRPC_ADDR=ml-service:${GRPC_PORT:-50051}
    volumes:
      - ./ml-service/data:/app/data:rw
      - ./ml-service/models:/app/models:ro
      - ./ml-service/config:/app/config:ro
    depends_on:
      ml-service:
        condition: service_healthy
    # The distroless runtime image has no shell/wget -- /app/bin/healthcheck
    # is the Go-native probe binary built alongside the API in Dockerfile.api.
    healthcheck:
      test: ["CMD", "/app/bin/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: 1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
