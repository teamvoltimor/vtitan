[project]
name = "auto-annotator"
version = "0.2.0"
description = "SAM 2.1 Interactive Annotator for YOLO training data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3.0",
    "torchvision",
    "sam2",
    "opencv-python",
    "numpy",
    "pillow",
    "python-dotenv",
    "transformers>=4.50.0",
    "accelerate",
    "ultralytics>=8.4.14",
    "autodistill==0.1.29",
    "autodistill-grounded-sam==0.1.2",
    "fastapi[standard]>=0.115.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch       = [{ index = "pytorch-cu121", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu121", marker = "sys_platform != 'darwin'" }]
