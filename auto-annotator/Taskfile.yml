version: '3'

vars:
  API_PORT: '8000'
  SERVER_PORT: '8765'
  GRPC_PORT: '50051'
  FRONTEND_PORT: '80'
  MODELS_DIR: './ml-service/models'
  DB_PATH: './ml-service/data/manifest.db'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ML Service (SAM model server + gRPC compute workers)

  ml-service:dev:
    desc: Start SAM model server + gRPC compute service (local development)
    dir: ml-service
    cmds:
      - uv run python grpc_main.py

  ml-service:dev:model:
    desc: Start ML service with a specific SAM model pre-loaded
    dir: ml-service
    cmds:
      - uv run python grpc_main.py --model {{.MODEL_ID}}
    vars:
      MODEL_ID: sam2_hiera_large
    env:
      SERVER_PORT: '{{.SERVER_PORT}}'
      GRPC_PORT: '{{.GRPC_PORT}}'

  ml-service:legacy:
    desc: Start legacy SAM model server + FastAPI API (pre-cutover compatibility)
    dir: ml-service
    cmds:
      - uv run python main.py

  ml-service:sync:
    desc: Install ML service dependencies with uv
    dir: ml-service
    cmds:
      - uv sync

  # Go API (orchestration service)

  api:run:
    desc: Run the Go orchestration API (Gin + SQLite + gRPC clients)
    dir: api
    cmds:
      - go run ./cmd/api

  api:build:
    desc: Build the Go API binary
    dir: api
    cmds:
      - go build -o bin/api ./cmd/api

  api:test:
    desc: Run Go API tests
    dir: api
    cmds:
      - go test ./...

  # Shared gRPC contract (proto/)

  proto:gen:
    desc: Regenerate Go + Python gRPC stubs from the shared proto contract
    cmds:
      - task: proto:gen:go
      - task: proto:gen:py

  proto:gen:go:
    desc: Regenerate Go gRPC stubs (buf) into api/internal/compute/pb
    dir: proto
    cmds:
      - buf lint
      - buf generate

  proto:gen:py:
    desc: Regenerate Python gRPC stubs into ml-service/src/grpc_server/pb
    dir: ml-service
    cmds:
      - uv run python -m grpc_tools.protoc -I ../proto/autoannotator/v1
        --python_out=src/grpc_server/pb --grpc_python_out=src/grpc_server/pb
        ../proto/autoannotator/v1/compute.proto

  frontend:dev:
    desc: Start Vite dev server (http://localhost:5173)
    dir: frontend
    cmds:
      - npm run dev

  frontend:build:
    desc: Build frontend for production
    dir: frontend
    cmds:
      - npm run build

  frontend:preview:
    desc: Preview production build locally
    dir: frontend
    cmds:
      - npm run preview

  frontend:test:
    desc: Run frontend parity tests with Vitest
    dir: frontend
    cmds:
      - npm run test:run

  frontend:install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - npm install

  # Code Quality

  lint:ml-service:
    desc: Run ruff linter on ML service code
    dir: ml-service
    cmds:
      - uv run ruff check .

  lint:frontend:
    desc: Run Biome linter on frontend code
    dir: frontend
    cmds:
      - npm run lint

  lint:api:
    desc: Run golangci-lint on Go API
    dir: api
    cmds:
      - golangci-lint run ./...

  lint:all:
    desc: Run linters on ml-service, frontend, and Go API
    cmds:
      - task: lint:ml-service
      - task: lint:frontend
      - task: lint:api

  format:ml-service:
    desc: Fix and format ML service code with ruff
    dir: ml-service
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  format:frontend:
    desc: Fix and format frontend code with Biome
    dir: frontend
    cmds:
      - npm run format

  format:api:
    desc: Format Go API code with golangci-lint fmt
    dir: api
    cmds:
      - golangci-lint fmt ./...

  format:all:
    desc: Fix and format ml-service, frontend, and Go API code
    cmds:
      - task: format:ml-service
      - task: format:frontend
      - task: format:api

  # Docker

  docker:build:api:
    desc: Build Go API Docker image
    cmds:
      - docker build -f Dockerfile.api -t auto-annotator-api .

  docker:build:ml-service:
    desc: Build ML service Docker image
    cmds:
      - docker build -f Dockerfile.ml-service -t auto-annotator-ml-service .

  docker:run:api:
    desc: Run Go API container
    cmds:
      - docker run -p {{.API_PORT}}:{{.API_PORT}} auto-annotator-api
    env:
      API_PORT: '{{.API_PORT}}'

  docker:run:ml-service:
    desc: Run ML service container with GPU and volume mounts for development
    cmds:
      - docker run --gpus all
        -p {{.GRPC_PORT}}:{{.GRPC_PORT}}
        -v "{{.PWD}}/ml-service/data:/app/data"
        -v "{{.PWD}}/ml-service/models:/app/models"
        auto-annotator-ml-service
    env:
      GRPC_PORT: '{{.GRPC_PORT}}'
      PWD: '.'

  docker:compose:up:
    desc: Start all services with docker-compose (ml-service + api + frontend)
    cmds:
      - docker-compose up --build
    env:
      API_PORT: '{{.API_PORT}}'
      FRONTEND_PORT: '{{.FRONTEND_PORT}}'
      SERVER_PORT: '{{.SERVER_PORT}}'
      GRPC_PORT: '{{.GRPC_PORT}}'

  docker:compose:up:detached:
    desc: Start all services in background with docker-compose
    cmds:
      - docker-compose up -d --build
    env:
      API_PORT: '{{.API_PORT}}'
      FRONTEND_PORT: '{{.FRONTEND_PORT}}'
      SERVER_PORT: '{{.SERVER_PORT}}'
      GRPC_PORT: '{{.GRPC_PORT}}'

  docker:compose:down:
    desc: Stop and remove docker-compose services
    cmds:
      - docker-compose down

  docker:compose:logs:
    desc: Follow docker-compose logs
    cmds:
      - docker-compose logs -f

  docker:compose:logs:api:
    desc: Follow Go API service logs
    cmds:
      - docker-compose logs -f api

  docker:compose:logs:ml-service:
    desc: Follow ML service logs
    cmds:
      - docker-compose logs -f ml-service

  docker:compose:logs:frontend:
    desc: Follow frontend service logs
    cmds:
      - docker-compose logs -f frontend

  # Full Stack

  dev:local:
    desc: Start full local development stack (ml-service + api + frontend)
    cmds:
      - task: ml-service:sync
      - task: frontend:install
      - echo "Starting services..."
      - cmd: "cd ml-service && uv run python grpc_main.py & cd ../api && go run ./cmd/api & cd ../frontend && npm run dev"
        ignore_error: true

  dev:docker:
    desc: Start full Docker stack (ml-service + api + frontend)
    cmds:
      - task: docker:compose:up

  dev:docker:detached:
    desc: Start full Docker stack in background
    cmds:
      - task: docker:compose:up:detached

  # Utility

  help:
    desc: Show this help message
    cmds:
      - task --list

  clean:
    desc: Clean build artifacts and cache
    cmds:
      - cmd: rm -rf ml-service/.ruff_cache
        ignore_error: true
      - cmd: rm -rf api/bin
        ignore_error: true
      - cmd: rm -rf frontend/dist
        ignore_error: true
      - cmd: rm -rf frontend/node_modules
        ignore_error: true
      - echo "Cleaned build artifacts"

  clean:deep:
    desc: Clean everything including dependencies
    cmds:
      - task: clean
      - cmd: rm -rf ml-service/.venv
        ignore_error: true
      - echo "Full clean complete"

  init:
    desc: Initialize development environment
    cmds:
      - task: ml-service:sync
      - task: frontend:install
      - echo "Development environment initialized"
