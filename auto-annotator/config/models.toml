# models.toml – SAM model configuration for model_server.py
#
# The server loads the first available model on startup.
# Set DEFAULT_MODEL env-var to override which one loads first.
#
# Fields per [[models]] entry
# ───────────────────────────
#   id            – unique key used in the API and UI
#   label         – human-readable name shown in the app
#   type          – "sam1" | "sam2" | "sam3" | "yoloe" | "grounding_dino"
#   checkpoint    – local .pt path (relative to project root); takes priority
#   hiera_config  – Hydra config path for sam2 builds (relative, passed to build_sam2)
#   hf_repo       – HuggingFace repo; used when checkpoint is absent
#   variant       – SAM1 only: "vit_h" | "vit_l" | "vit_b"
#   supports_text – SAM3/YOLOE/Grounding DINO: enables text-prompted auto-annotation

default_model = "sam2.1-large"

[[models]]
id            = "yoloe-26l"
label         = "YOLOE 26L (Auto-detect)"
type          = "yoloe"
checkpoint    = "models/yoloe-26l-seg.pt"
supports_text = true

[[models]]
id            = "grounding-dino-sam"
label         = "Grounding DINO + SAM"
type          = "grounding_dino"
supports_text = true

[[models]]
id           = "sam2.1-large"
label        = "SAM 2.1 Large"
type         = "sam2"
checkpoint   = "models/sam2.1_l.pt"
hiera_config = "configs/sam2.1/sam2.1_hiera_l.yaml"
hf_repo      = "facebook/sam2.1-hiera-large"

[[models]]
id           = "sam2.1-base-plus"
label        = "SAM 2.1 Base+"
type         = "sam2"
checkpoint   = "models/sam2.1_bp.pt"
hiera_config = "configs/sam2.1/sam2.1_hiera_b+.yaml"
hf_repo      = "facebook/sam2.1-hiera-base-plus"

[[models]]
id           = "sam2.1-small"
label        = "SAM 2.1 Small"
type         = "sam2"
checkpoint   = "models/sam2.1_s.pt"
hiera_config = "configs/sam2.1/sam2.1_hiera_s.yaml"
hf_repo      = "facebook/sam2.1-hiera-small"

[[models]]
id           = "sam2-large"
label        = "SAM 2 Large"
type         = "sam2"
checkpoint   = "models/sam2_l.pt"
hiera_config = "configs/sam2/sam2_hiera_l.yaml"
hf_repo      = "facebook/sam2-hiera-large"

[[models]]
id            = "sam3"
label         = "SAM 3"
type          = "sam3"
hf_repo       = "facebook/sam3"
supports_text = true

[[models]]
id         = "sam1-vit-h"
label      = "SAM 1 ViT-H"
type       = "sam1"
checkpoint = "models/sam_vit_h_4b8939.pth"
variant    = "vit_h"

[[models]]
id         = "sam1-vit-l"
label      = "SAM 1 ViT-L"
type       = "sam1"
checkpoint = "models/sam_vit_l_0b3195.pth"
variant    = "vit_l"

[[models]]
id         = "sam1-vit-b"
label      = "SAM 1 ViT-B"
type       = "sam1"
checkpoint = "models/sam_vit_b_01ec64.pth"
variant    = "vit_b"
