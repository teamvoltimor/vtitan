map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API routes to the Go orchestration service.
    # Uses the docker-compose service name "api" which resolves within the
    # container network.  All versioned API routes (/api/v1/*) and the health
    # probes (/healthz, /readyz) are forwarded to Go; everything else falls
    # through to the React SPA.
    location ~ ^/(api/v1|healthz|readyz) {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Allow long-running inference requests (SAM can take several seconds).
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    # React SPA fallback — serve index.html for all unknown paths so
    # client-side routing works on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
