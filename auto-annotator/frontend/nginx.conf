env API_BACKEND_URL;

events {
    worker_connections 1024;
}

http {
    map $API_BACKEND_URL $resolved_backend {
        "" "http://localhost:8000";
        default $API_BACKEND_URL;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Proxy FastAPI routes to the backend service.
        # Requests to /gallery, /images/*, and /segment are forwarded to FastAPI;
        # everything else is served as a static React SPA file.
        location ~ ^/(gallery|images|segment) {
            proxy_pass $resolved_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Allow long-running inference requests.
            proxy_read_timeout 300s;
        }

        # React SPA fallback — serve index.html for all unknown paths so
        # client-side routing works on hard refresh.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
