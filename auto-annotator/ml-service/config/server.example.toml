# server.example.toml – ML service runtime configuration template
#
# Copy to server.toml and adjust values for your environment:
#   cp config/server.example.toml config/server.toml
#
# Environment variables override every key below.
# Priority order: env var > server.toml > built-in default.

# gRPC compute server
# The gRPC server is the boundary between the Go API and Python compute.
# All three services (Segmentation, Augmentation, Training) share one port.
[grpc]
# Port the gRPC server binds to (all interfaces, 0.0.0.0).
# Override: GRPC_PORT env var.
port = 50051

# Thread-pool size for the gRPC executor.
# SAM inference is GPU-bound; 4–8 workers lets augmentation/training jobs
# overlap without starving segmentation requests.
# Override: not available via env — set here.
max_workers = 8

# Local SAM2 inference fallback
# Used only by src/inference_backends.py's standalone SAM2/ultralytics loaders
# (the fallback path when no in-process model client is active).
[inference]
sam2_checkpoint_filename = "sam2.1_l.pt"
sam2_hf_repo = "facebook/sam2.1-hiera-large"
sam2_config_path = "configs/sam2.1/sam2.1_hiera_l.yaml"
default_mask_score = 1.0
mask_labels = ["Precise (0)", "Object (1)", "Broad (2)"]
