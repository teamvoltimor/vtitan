[mypy]
plugins = pydantic.mypy
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True

# torch/sam2/ultralytics/albumentations/cv2 ship no type stubs (or only
# partial ones); grpc_server/pb is protoc-generated code we don't own.
# Blanket-ignore missing imports rather than enumerating every one -- this
# still catches real errors in our own code (wrong return types, undeclared
# attributes, etc.), just not type-mismatches against those externals.
ignore_missing_imports = True

exclude = (?x)(
    ^\.venv/
    | ^\.venv-test/
    | ^src/grpc_server/pb/
  )

[mypy-src.grpc_server.pb.*]
ignore_errors = True
