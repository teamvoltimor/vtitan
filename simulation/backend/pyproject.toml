[project]
name = "klevor-simulation"
version = "0.2.0"
description = "Split backend/ and frontend/ architecture with telemetry APIs"
requires-python = ">=3.11"

dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "fastapi>=0.100",
  "uvicorn>=0.24",
  "pydantic>=2.5",
  "ros2-launch>=0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
generate-track = "src.generation.track_generator:main"
generate-scenarios = "src.generation.generator:main"
