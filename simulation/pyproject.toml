[project]
name = "klevor-simulation"
version = "0.1.0"
description = "WRO 2026 Future Engineers — Gazebo simulation & training pipeline"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
generate-track     = "src.generation.track_generator:main"
generate-scenarios = "src.generation.generator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]
