# Open Challenge Configuration
# WRO Future Engineers - Open Challenge Rules

challenge_type: "open"

track:
  dimensions:
    length: 3.0  # meters
    width: 3.0   # meters
    wall_height: 0.3  # meters

traffic_signs:
  types:
    - red_pillar
    - green_pillar

  pillar_specs:
    radius: 0.03  # meters (3cm)
    height: 0.30  # meters (30cm)

  placement:
    num_pillars_min: 6
    num_pillars_max: 10
    min_distance_between: 0.3  # meters
    avoid_start_zone: true

  colors:
    red:
      ambient: [1.0, 0.0, 0.0]
      diffuse: [1.0, 0.0, 0.0]
      specular: [0.2, 0.2, 0.2]
    green:
      ambient: [0.0, 1.0, 0.0]
      diffuse: [0.0, 1.0, 0.0]
      specular: [0.2, 0.2, 0.2]

robot:
  start_position:
    x: 0.0
    y: -1.2
    z: 0.1
  start_orientation:
    roll: 0.0
    pitch: 0.0
    yaw: 1.5708  # 90 degrees (facing forward)

randomization:
  enabled: true

  lighting:
    sun_intensity:
      min: 0.5
      max: 1.5
    ambient_intensity:
      min: 0.3
      max: 0.8
    direction_variance: 0.3

  colors:
    enable_noise: true
    gaussian_std: 0.05  # Color channel noise

  physics:
    friction:
      min: 0.6
      max: 1.2
    mass_variance: 0.1  # ±10%

recording:
  camera_topic: "/wro_robot/camera/image_raw"
  fps: 30
  resolution:
    width: 640
    height: 480
  format: "mp4"

dataset:
  save_frames: true
  frame_skip: 10  # Save every 10th frame
  annotation_format: "yolo"  # YOLO format bounding boxes

training:
  num_scenarios: 100
  duration_per_scenario: 30  # seconds
  autonomous_drive: false  # Use teleoperation for diverse data
