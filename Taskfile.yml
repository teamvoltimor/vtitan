version: "3"

vars:
  WINDOWS_ETHERNET_IP: 192.168.1.50
  RPI_DIRECT_IP: 192.168.1.1
  RPI_PING_RETRIES: 30
  RPI_PING_INTERVAL: 2

includes:
  platform:
    taskfile: ./platform/Taskfile.yml
    dir: ./platform
  infra:
    taskfile: ./infra/Taskfile.yml
  fleet:
    taskfile: ./fleet/Taskfile.yml

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # GPG

  gpg:fix-tty:
    desc: "Fix 'Inappropriate ioctl for device' GPG error"
    cmds:
      - export GPG_TTY=$(tty)
    platforms: [linux, darwin]

  # Windows host commands (run from this machine)

  windows:ping:
    desc: "Ping a Pi (usage: task windows:ping PING_HOST=address)"
    cmds:
      - cmd: powershell -NoProfile -Command "Test-Connection -ComputerName '{{.PING_HOST}}' -Count 3"
        platforms: [windows]
      - cmd: ping -c3 {{.PING_HOST}}
        platforms: [linux, darwin]

  windows:ssh:
    desc: "SSH into a Pi (usage: task windows:ssh SSH_HOST=alias)"
    cmds:
      - ssh {{.SSH_HOST}}
    requires:
      vars:
        - SSH_HOST

  windows:run:
    desc: "Run a command on a Pi via SSH (usage: task windows:run SSH_HOST=alias CMD=command)"
    cmds:
      - ssh {{.SSH_HOST}} "{{.CMD}}"
    requires:
      vars:
        - CMD

  windows:setup-usb-gadget:
    desc: "Install rpi-usb-gadget on a Pi and enable it (usage: task windows:setup-usb-gadget SSH_HOST=alias PING_HOST=address)"
    cmds:
      - echo "Installing rpi-usb-gadget on {{.SSH_HOST}}..."
      - ssh {{.SSH_HOST}} "sudo apt update && sudo apt install -y rpi-usb-gadget"
      - ssh {{.SSH_HOST}} "sudo rpi-usb-gadget on"
      - echo "Installation complete. Rebooting {{.SSH_HOST}}..."
      - ssh {{.SSH_HOST}} "sudo reboot"
      - echo "Waiting for {{.SSH_HOST}} ({{.PING_HOST}}) to come back online..."
      - cmd: powershell -NoProfile -Command "$count = 0; do { Start-Sleep -Seconds {{.RPI_PING_INTERVAL}}; $count++; $ok = Test-Connection -ComputerName '{{.PING_HOST}}' -Count 1 -Quiet } while (-not $ok -and $count -lt {{.RPI_PING_RETRIES}}); if ($ok) { Write-Host '{{.SSH_HOST}} is back online!' } else { Write-Host 'Timed out waiting for {{.SSH_HOST}}' }"
        platforms: [windows]
      - cmd: |
          count=0
          until ping -c1 {{.PING_HOST}} >/dev/null 2>&1; do
            sleep {{.RPI_PING_INTERVAL}}
            count=$((count+1))
            [ $count -ge {{.RPI_PING_RETRIES}} ] && echo "Timed out waiting for {{.SSH_HOST}}" && exit 1
          done
          echo "{{.SSH_HOST}} is back online!"
        platforms: [linux, darwin]

  windows:setup-usb-gadget:dry-run:
    desc: "Show setup commands without executing"
    cmds:
      - echo "[DRY-RUN] ssh {{.SSH_HOST}} \"sudo apt update && sudo apt install -y rpi-usb-gadget\""
      - echo "[DRY-RUN] ssh {{.SSH_HOST}} \"sudo rpi-usb-gadget on\""
      - echo "[DRY-RUN] ssh {{.SSH_HOST}} \"sudo reboot\""

  windows:ssh:print-config:
    desc: "Print recommended ~/.ssh/config entries (vars: SSH_USER, SSH_KEY_PATH, RPI_DIRECT_IP)"
    cmds:
      - echo "=== Recommended SSH Config Entries ==="
      - echo ""
      - echo "# --- Local network (router) ---"
      - echo "Host rpi-5-local"
      - echo "    HostName {{.RPI_LOCAL_IP}}"
      - echo "    User {{.SSH_USER}}"
      - echo "    Port 22"
      - echo "    IdentityFile {{.SSH_KEY_PATH}}"
      - echo "    ServerAliveInterval 60"
      - echo "    ConnectTimeout 10"
      - echo ""
      - echo "# --- Direct Ethernet (USB gadget, target=pair device) ---"
      - echo "Host rpi-5-direct"
      - echo "    HostName {{.RPI_DIRECT_IP}}"
      - echo "    User {{.SSH_USER}}"
      - echo "    Port 22"
      - echo "    IdentityFile {{.SSH_KEY_PATH}}"
      - echo "    ServerAliveInterval 60"
      - echo "    ConnectTimeout 10"
      - echo ""
      - echo "# --- Remote access (Cloudflare Tunnel) ---"
      - echo "Host rpi-5-remote"
      - echo "    HostName pi.{{.SSH_DOMAIN}}.dev"
      - echo "    ProxyCommand cloudflared access ssh --hostname %h"
      - echo "    User {{.SSH_USER}}"
      - echo "    Port 22"
      - echo "    IdentityFile {{.SSH_KEY_PATH}}"
      - echo "    ServerAliveInterval 60"
      - echo "    ConnectTimeout 10"
      - echo ""
      - echo ""
      - echo "Override with task <task> SSH_USER=user SSH_KEY_PATH=~/.ssh/key SSH_DOMAIN=yourdomain RPI_DIRECT_IP=x.x.x.x"
    vars:
      SSH_USER: "{{.SSH_USER | default \"YOUR_USERNAME\"}}"
      SSH_KEY_PATH: "{{.SSH_KEY_PATH | default \"~/.ssh/YOUR_KEY_FILE\"}}"
      SSH_DOMAIN: "{{.SSH_DOMAIN | default \"YOUR_DOMAIN\"}}"
      RPI_LOCAL_IP: 192.168.0.50

  windows:ssh:setup-config:
    desc: "Append missing SSH host entries to ~/.ssh/config (vars: SSH_USER, SSH_KEY_PATH, RPI_DIRECT_IP)"
    cmds:
      - cmd: powershell -NoProfile -File ./scripts/setup-ssh-config.ps1 -RpiDirectIp {{.RPI_DIRECT_IP}} -User {{.SSH_USER}} -KeyFile {{.SSH_KEY_PATH}} -RemoteHost pi.{{.SSH_DOMAIN}}.dev
        platforms: [windows]
    vars:
      SSH_USER: "{{.SSH_USER | default \"YOUR_USERNAME\"}}"
      SSH_KEY_PATH: "{{.SSH_KEY_PATH | default \"~/.ssh/YOUR_KEY_FILE\"}}"
      SSH_DOMAIN: "{{.SSH_DOMAIN | default \"YOUR_DOMAIN\"}}"

  windows:ethernet:set-ip:
    desc: Set Windows Ethernet adapter IP for direct link to a Pi (run as Admin)
    cmds:
      - cmd: powershell -NoProfile -Command "New-NetIPAddress -InterfaceAlias 'Ethernet' -IPAddress '{{.WINDOWS_ETHERNET_IP}}' -PrefixLength 24 -ErrorAction SilentlyContinue; if (-not (Get-NetIPAddress -InterfaceAlias 'Ethernet' -IPAddress '{{.WINDOWS_ETHERNET_IP}}' -ErrorAction SilentlyContinue)) { Write-Host 'IP already set or adapter not found'; Get-NetIPAddress -InterfaceAlias 'Ethernet' -AddressFamily IPv4 | Select-Object IPAddress } else { Write-Host 'Set {{.WINDOWS_ETHERNET_IP}} on Ethernet adapter' }"

  windows:ethernet:remove-ip:
    desc: Remove the direct-link IP from the Windows Ethernet adapter (run as Admin)
    cmds:
      - cmd: netsh interface ip delete address "Ethernet" addr={{.WINDOWS_ETHERNET_IP}} & echo Removed {{.WINDOWS_ETHERNET_IP}} from Ethernet adapter
        platforms: [windows]

  windows:ethernet:set-dhcp:
    desc: Remove static IP and re-enable DHCP on the Windows Ethernet adapter (run as Admin)
    cmds:
      - cmd: powershell -NoProfile -Command "Set-NetIPInterface -InterfaceAlias 'Ethernet' -Dhcp Enabled; Remove-NetIPAddress -InterfaceAlias 'Ethernet' -AddressFamily IPv4 -ErrorAction SilentlyContinue; Write-Host 'DHCP enabled on Ethernet adapter'"
        platforms: [windows]

  # Raspberry Pi commands (run directly on the Pi)

  rpi:ip:
    desc: Show usb0 (gadget) IP address
    cmds:
      - ip -4 a show usb0

  rpi:eth-ip:
    desc: Show Ethernet IP address
    cmds:
      - ip -4 a show eth0

  rpi:wlan-ip:
    desc: Show WiFi IP address
    cmds:
      - ip -4 a show wlan0

  rpi:nudge:
    desc: Force gadget client profile
    cmds:
      - sudo nmcli con up 'USB Gadget (client)'

  rpi:diagnose:
    desc: Run connectivity diagnostics
    cmds:
      - echo "=== usb0 interface ==="
      - ip -4 a show usb0
      - echo ""
      - echo "=== routing table ==="
      - ip route show dev usb0
      - echo ""
      - echo "=== USB Gadget profile ==="
      - nmcli -t -f NAME con show --active 2>/dev/null | grep -i gadget || echo '(no gadget profile active)'

  # Health & thermal

  rpi:temp:
    desc: Show CPU/GPU temperature
    cmds:
      - vcgencmd measure_temp

  rpi:throttled:
    desc: Show throttling / under-voltage status (0x0 = healthy)
    cmds:
      - vcgencmd get_throttled

  rpi:disk:
    desc: Show root filesystem disk usage
    cmds:
      - df -h /

  rpi:mem:
    desc: Show memory usage
    cmds:
      - free -h

  rpi:uptime:
    desc: Show uptime and load average
    cmds:
      - uptime

  # Power & lifecycle

  rpi:reboot:
    desc: Reboot the Pi
    cmds:
      - sudo reboot

  rpi:shutdown:
    desc: Shut down the Pi (safe poweroff)
    cmds:
      - sudo shutdown -h now

  rpi:set-static-ip:
    desc: "Set static IP on any connection (usage: task rpi:set-static-ip IP=x.x.x.x [CONNECTION=name] [GATEWAY=gw])"
    cmds:
      - sudo nmcli con modify '{{.CONNECTION}}' ipv4.addresses {{.IP}}/24 ipv4.gateway {{.GATEWAY}} ipv4.dns {{.GATEWAY}} ipv4.method manual && sudo nmcli con down '{{.CONNECTION}}' && sudo nmcli con up '{{.CONNECTION}}'
    requires:
      vars:
        - IP
    vars:
      GATEWAY: '{{.GATEWAY | default "192.168.0.1"}}'
      CONNECTION: '{{.CONNECTION | default "Wired connection 1"}}'

  rpi:set-static-ip:router:
    desc: "Set static IP on Wired connection 1 (router network)"
    cmds:
      - task: rpi:set-static-ip
        vars:
          IP: '{{.IP}}'
          CONNECTION: 'Wired connection 1'
          GATEWAY: '192.168.0.1'
    vars:
      IP: '{{.IP | default "192.168.0.50"}}'

  rpi:set-static-ip:direct:
    desc: "Set static IP on USB Gadget (client) for direct ethernet link"
    cmds:
      - task: rpi:set-static-ip
        vars:
          IP: '{{.IP}}'
          CONNECTION: 'USB Gadget (client)'
          GATEWAY: '{{.WINDOWS_ETHERNET_IP}}'
    vars:
      IP: '{{.IP | default .RPI_DIRECT_IP}}'

  rpi:set-dhcp:
    desc: Revert Ethernet to DHCP
    cmds:
      - sudo nmcli con modify '{{.CONNECTION}}' ipv4.method auto && sudo nmcli con down '{{.CONNECTION}}' && sudo nmcli con up '{{.CONNECTION}}'
    vars:
      CONNECTION: '{{.CONNECTION | default "Wired connection 1"}}'

  rpi:update:
    desc: Update and upgrade all packages
    cmds:
      - sudo apt update && sudo apt full-upgrade -y

  rpi:set-wifi:
    desc: "Set WiFi credentials (usage: task rpi:set-wifi SSID=name PASSWORD=pass)"
    cmds:
      - sudo nmcli device wifi connect '{{.SSID}}' password '{{.PASSWORD}}'
    requires:
      vars:
        - SSID
        - PASSWORD

  rpi:wifi-scan:
    desc: List available WiFi networks
    cmds:
      - sudo nmcli device wifi list

  # Health & composite

  rpi:health:
    desc: Full system health snapshot (temp, throttle, GPU mem, disk, mem, uptime)
    cmds:
      - vcgencmd measure_temp
      - vcgencmd get_throttled
      - vcgencmd get_mem gpu
      - df -h /
      - free -h
      - uptime

  # Hailo AI accelerator

  rpi:hailo:status:
    desc: Show HailoRT service status
    cmds:
      - systemctl status hailort

  rpi:hailo:restart:
    desc: Restart HailoRT service
    cmds:
      - sudo systemctl restart hailort

  rpi:hailo:logs:
    desc: Tail HailoRT service logs (last 50 lines)
    cmds:
      - journalctl -u hailort -n 50 --no-pager

  rpi:hailo:models:
    desc: List compiled HEF models in home directory
    cmds:
      - ls -lh ~/*.hef

  # Camera

  rpi:camera:info:
    desc: List detected cameras
    cmds:
      - rpicam-hello --list-cameras

  rpi:camera:test:
    desc: Run 2-second camera preview (smoke test)
    cmds:
      - rpicam-hello -t 2000

  rpi:camera:capture:
    desc: Capture a still to /tmp/snap.jpg
    cmds:
      - rpicam-still -o /tmp/snap.jpg && echo "Saved to /tmp/snap.jpg"

  # Repos

  rpi:repos:pull:
    desc: Pull latest on all voldemorbot repos
    cmds:
      - |
        for d in ~/voldemorbot ~/voldemorbot-auto-annotator ~/voldemorbot-platform ~/voldemorbot-docs ~/voldemorbot-hugo-docs; do
          echo "=== $d ===" && git -C $d pull
        done

  rpi:repos:status:
    desc: Show git status across all voldemorbot repos
    cmds:
      - |
        for d in ~/voldemorbot ~/voldemorbot-auto-annotator ~/voldemorbot-platform ~/voldemorbot-docs ~/voldemorbot-hugo-docs; do
          echo "=== $d ===" && git -C $d status -sb
        done
