version: "3"

vars:
  # Distinct from the Pi5<->PiZero USB gadget subnet (also 192.168.250.0/24, see
  # ansible/roles/pi5 and ansible/roles/pi_zero) to avoid both landing on Pi 5's
  # usb0 and 'Wired connection 1' with the same address.
  WINDOWS_ETHERNET_IP: 192.168.251.1
  RPI_DIRECT_IP: 192.168.251.2
  RPI_LOCAL_IP: 192.168.0.50
  RPI_PING_RETRIES: 30
  RPI_PING_INTERVAL: 2
  ZERO_WIFI_IP: 192.168.0.51
  # Pi Zero's usb0 gadget address (Zero=.1, Pi5=.2) — see ansible/roles/pi_zero
  RPI_ZERO_GADGET_IP: 192.168.250.1
  RPI_5_GADGET_IP: 192.168.250.2
  # scripts/ and ansible/ live on master alongside the robot runtime code, so
  # both are served from the single ~/vtitan checkout — no separate
  # dev-tooling worktree needed (the old ~/voldemorbot-platform "platform"
  # branch worktree this used to point at is being retired, see roles/pi5).
  PLATFORM_SCRIPTS: "{{.HOME}}/vtitan/scripts"
  ANSIBLE_DIR: "{{.HOME}}/vtitan/ansible"
  WIFI_CONN: for
  WIFI_2G_BSSID: AA:D3:62:23:33:28
  FLEET_USER: ralvarezdev   # account created on every Pi via Raspberry Pi Imager (not "pi")

includes:
  platform:
    taskfile: ./platform/Taskfile.yml
    dir: ./platform
  infra:
    taskfile: ./infra/Taskfile.yml
  auto-annotator:
    taskfile: ./auto-annotator/Taskfile.yml
    dir: ./auto-annotator
  hailo:
    taskfile: ./hailo/Taskfile.yml
    dir: ./hailo
  models:
    taskfile: ./models/Taskfile.yml
    dir: ./models
  hugo-docs:
    taskfile: ./hugo-docs/Taskfile.yml
    dir: ./hugo-docs

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # GPG

  gpg:fix-tty:
    desc: "Fix 'Inappropriate ioctl for device' GPG error"
    cmds:
      - export GPG_TTY=$(tty)
    platforms: [linux, darwin]

  # Windows host commands (run from this machine)

  windows:ping:
    desc: "Ping a Pi (usage: task windows:ping PING_HOST=address)"
    cmds:
      - cmd: powershell -NoProfile -Command "Test-Connection -ComputerName '{{.PING_HOST}}' -Count 3"
        platforms: [windows]
      - cmd: ping -c3 {{.PING_HOST}}
        platforms: [linux, darwin]

  windows:ssh:
    desc: "SSH into a Pi (usage: task windows:ssh SSH_HOST=alias)"
    cmds:
      - ssh {{.SSH_HOST}}
    requires:
      vars:
        - SSH_HOST

  windows:run:
    desc: "Run a command on a Pi via SSH (usage: task windows:run SSH_HOST=alias CMD=command)"
    cmds:
      - ssh {{.SSH_HOST}} "{{.CMD}}"
    requires:
      vars:
        - CMD

  windows:set-wifi:pi5:
    desc: "Set the Pi 5's WiFi credentials from Windows -- works even with no WiFi yet, since rpi-5-direct is a direct link independent of it (usage: task windows:set-wifi:pi5 SSID=name PASSWORD=pass [SSH_HOST=alias])"
    requires:
      vars:
        - SSID
        - PASSWORD
    vars:
      SSH_HOST: '{{.SSH_HOST | default "rpi-5-direct"}}'
    cmds:
      - ssh {{.SSH_HOST}} "cd ~/vtitan && task rpi:set-wifi SSID='{{.SSID}}' PASSWORD='{{.PASSWORD}}'"

  windows:set-wifi:zero:
    desc: "Set the Pi Zero's WiFi credentials from Windows, hopping through the Pi 5 over the USB gadget link -- works even with no WiFi on the Zero at all (usage: task windows:set-wifi:zero SSID=name PASSWORD=pass [SSH_HOST=alias])"
    requires:
      vars:
        - SSID
        - PASSWORD
    vars:
      SSH_HOST: '{{.SSH_HOST | default "rpi-5-direct"}}'
    cmds:
      - ssh {{.SSH_HOST}} "ssh ralvarezdev@{{.RPI_ZERO_GADGET_IP}} \"cd ~/vtitan && task rpi:set-wifi SSID='{{.SSID}}' PASSWORD='{{.PASSWORD}}'\""

  windows:audit:pi5:
    desc: "Pull latest + run the Pi 5 provisioning audit (usage: task windows:audit:pi5 [SSH_HOST=alias])"
    cmds:
      - ssh {{.SSH_HOST}} "cd ~/vtitan && git pull && bash ~/vtitan/platform/robot/scripts/provisioning/audit-pi5-provisioning.sh"
    vars:
      SSH_HOST: '{{.SSH_HOST | default "rpi-5-direct"}}'

  windows:audit:zero:
    desc: "Pull latest + run the Pi Zero provisioning audit (usage: task windows:audit:zero [SSH_HOST=alias])"
    cmds:
      - ssh {{.SSH_HOST}} "cd ~/vtitan && git pull && bash ~/vtitan/platform/robot/scripts/provisioning/audit-pi-zero-provisioning.sh"
    vars:
      SSH_HOST: '{{.SSH_HOST | default "rpi-zero-local"}}'

  windows:provision:pi5:
    desc: "Kick off Pi 5 provisioning from Windows -- runs task rpi:provision:pi5 ON the Pi 5 itself over SSH, since Ansible's control node needs a POSIX shell and can't run directly on Windows (usage: task windows:provision:pi5 [SSH_HOST=alias] [PI5_IP=x.x.x.x] [TAGS=network,hardware] [SKIP_TAGS=extras])"
    cmds:
      - ssh -t {{.SSH_HOST}} "cd ~/vtitan && git pull && task rpi:provision:pi5 PI5_IP={{.PI5_IP}} {{if .TAGS}}TAGS={{.TAGS}}{{end}} {{if .SKIP_TAGS}}SKIP_TAGS={{.SKIP_TAGS}}{{end}}"
    vars:
      SSH_HOST: '{{.SSH_HOST | default "rpi-5-direct"}}'
      PI5_IP: '{{.PI5_IP | default .RPI_DIRECT_IP}}'
      TAGS: '{{.TAGS | default ""}}'
      SKIP_TAGS: '{{.SKIP_TAGS | default ""}}'

  # WiFi band management (Pi Zero is 2.4 GHz only; provision_pi_zero.yml
  # locks Pi 5 to the same band automatically, with a dead-man's-switch
  # failsafe -- rpi:wifi:lock-2g was the old manual equivalent, removed
  # 2026-08-10 as redundant and less safe. rpi:wifi:unlock stays: it's the
  # documented immediate-fix path if you're watching a lock get stuck mid-run
  # and don't want to wait for the failsafe (see wifi_lock_failsafe_seconds
  # in ansible/inventory/group_vars/all.yml).

  rpi:wifi:unlock:
    desc: "Restore Pi 5 WiFi to automatic band selection (run after provisioning)"
    cmds:
      - echo "Clearing BSSID lock on {{.WIFI_CONN}}..."
      - sudo nmcli connection modify {{.WIFI_CONN}} 802-11-wireless.bssid ""
      - sudo nmcli connection up {{.WIFI_CONN}}
      - echo "WiFi restored to auto band selection."

  # Provisioning (Ansible, run from dev Pi 5 — playbooks live in ~/vtitan-platform/ansible/).
  # Ansible replaces the old scp+ssh setup_pi_*.sh flow: same coverage, but
  # idempotent (safe to re-run, --check/--diff dry-runs) and the Pi Zero's
  # WiFi 2.4GHz lock is now released even if provisioning fails partway (see
  # ansible/playbooks/provision_pi_zero.yml's block/always). requires ansible
  # + community.general on the dev Pi 5 (task rpi:ansible:setup once).

  rpi:provision:zero:
    desc: "Provision Pi Zero 2W via Ansible, inside tmux so a dropped SSH session doesn't kill the run (usage: task rpi:provision:zero [ZERO_IP=x.x.x.x] [PI5_IP=x.x.x.x] [TAGS=os,network] [SKIP_TAGS=extras]). Prompts for the Zero's (and Pi 5's) sudo password. Tags: auth,os,repo,network,hardware,apps,services,extras -- see `task rpi:ansible:tags`."
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - echo "Running Ansible provisioner against {{.ZERO_IP}} (Pi 5 at {{.PI5_IP}}, takes ~20-40 min)..."
      - |
        SCRIPT=$(mktemp)
        cat > "$SCRIPT" <<'INNER'
        export PATH="$HOME/.pixi/bin:$HOME/.local/bin:$PATH"
        # The Zero's host key changes every reflash, and it's reachable at
        # two different addresses (WiFi first-contact, USB gadget) that each
        # cache their own known_hosts entry -- a stale entry on either one
        # hard-fails ansible.cfg's host_key_checking = True with no way to
        # answer the "yes/no/fingerprint" prompt non-interactively. Refresh
        # both, every run: -R is a silent no-op if the entry is already
        # correct or absent, so this costs nothing on a normal run.
        for zero_addr in "{{.ZERO_WIFI_IP}}" "{{.RPI_ZERO_GADGET_IP}}"; do
          ssh-keygen -f "$HOME/.ssh/known_hosts" -R "$zero_addr" >/dev/null 2>&1 || true
          ssh-keyscan -H "$zero_addr" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
        done
        GH_TOKEN=$(gh auth token) ansible-playbook playbooks/provision_pi_zero.yml -e zero_ip={{.ZERO_IP}} -e pi5_ip={{.PI5_IP}} {{if .TAGS}}--tags {{.TAGS}}{{end}} {{if .SKIP_TAGS}}--skip-tags {{.SKIP_TAGS}}{{end}} --ask-become-pass
        ec=$?
        echo
        echo [exit $ec] press Enter to close this tmux pane
        read _
        exit $ec
        INNER
        if [ -n "$TMUX" ]; then
          bash "$SCRIPT"
        else
          echo "(running inside tmux session '{{.TMUX_SESSION}}' -- reconnecting? just re-run this same command, -A reattaches instead of duplicating)"
          tmux new-session -A -s {{.TMUX_SESSION}} "bash '$SCRIPT'"
        fi
    vars:
      ZERO_IP: '{{.ZERO_IP | default .ZERO_WIFI_IP}}'
      PI5_IP: '{{.PI5_IP | default .RPI_LOCAL_IP}}'
      TAGS: '{{.TAGS | default ""}}'
      SKIP_TAGS: '{{.SKIP_TAGS | default ""}}'
      TMUX_SESSION: vtitan-provision-zero

  rpi:provision:zero:tail:
    desc: "Tail live progress of the Zero dev-env deploy step during provisioning (usage: task rpi:provision:zero:tail [SSH_HOST=alias]) -- run in a SECOND session alongside task rpi:provision:zero, not instead of it"
    cmds:
      - ssh {{.SSH_HOST}} "tail -f ~/vtitan-deploy-zero.log"
    vars:
      SSH_HOST: '{{.SSH_HOST | default "rpi-5-direct"}}'

  rpi:provision:all:
    desc: "Provision both boards via Ansible's site.yml (Pi 5 first, then the Zero), inside tmux (usage: task rpi:provision:all [PI5_IP=x.x.x.x] [ZERO_IP=x.x.x.x] [TAGS=network,hardware] [SKIP_TAGS=extras]). Prompts once for sudo, covering both plays."
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - echo "Running Ansible site.yml against Pi 5 ({{.PI5_IP}}) then the Zero ({{.ZERO_IP}}), takes ~30-60 min total..."
      - |
        SCRIPT=$(mktemp)
        cat > "$SCRIPT" <<'INNER'
        export PATH="$HOME/.pixi/bin:$HOME/.local/bin:$PATH"
        # Same known_hosts refresh as rpi:provision:zero -- site.yml's second
        # play is the Zero playbook, subject to the exact same stale-entry
        # failure on a reflashed board.
        for zero_addr in "{{.ZERO_WIFI_IP}}" "{{.RPI_ZERO_GADGET_IP}}"; do
          ssh-keygen -f "$HOME/.ssh/known_hosts" -R "$zero_addr" >/dev/null 2>&1 || true
          ssh-keyscan -H "$zero_addr" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
        done
        GH_TOKEN=$(gh auth token) ansible-playbook playbooks/site.yml -e pi5_ip={{.PI5_IP}} -e zero_ip={{.ZERO_IP}} {{if .TAGS}}--tags {{.TAGS}}{{end}} {{if .SKIP_TAGS}}--skip-tags {{.SKIP_TAGS}}{{end}} --ask-become-pass
        ec=$?
        echo
        echo [exit $ec] press Enter to close this tmux pane
        read _
        exit $ec
        INNER
        if [ -n "$TMUX" ]; then
          bash "$SCRIPT"
        else
          echo "(running inside tmux session '{{.TMUX_SESSION}}' -- reconnecting? just re-run this same command, -A reattaches instead of duplicating)"
          tmux new-session -A -s {{.TMUX_SESSION}} "bash '$SCRIPT'"
        fi
    vars:
      PI5_IP: '{{.PI5_IP | default .RPI_LOCAL_IP}}'
      ZERO_IP: '{{.ZERO_IP | default .ZERO_WIFI_IP}}'
      TAGS: '{{.TAGS | default ""}}'
      SKIP_TAGS: '{{.SKIP_TAGS | default ""}}'
      TMUX_SESSION: vtitan-provision-all

  rpi:provision:pi5:
    desc: "Provision Robot Pi 5 via Ansible, inside tmux so a dropped SSH session doesn't kill the run (usage: task rpi:provision:pi5 PI5_IP=x.x.x.x [TAGS=network,hardware] [SKIP_TAGS=extras]). Prompts for the Pi 5's sudo password. Tags: auth,os,repo,network,hardware,apps,services,cleanup,extras -- see `task rpi:ansible:tags`."
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - echo "Running Ansible provisioner against {{.PI5_IP}}..."
      - |
        SCRIPT=$(mktemp)
        cat > "$SCRIPT" <<'INNER'
        export PATH="$HOME/.pixi/bin:$HOME/.local/bin:$PATH"
        GH_TOKEN=$(gh auth token) ansible-playbook playbooks/provision_pi5.yml -e pi5_ip={{.PI5_IP}} {{if .TAGS}}--tags {{.TAGS}}{{end}} {{if .SKIP_TAGS}}--skip-tags {{.SKIP_TAGS}}{{end}} --ask-become-pass
        ec=$?
        echo
        echo [exit $ec] press Enter to close this tmux pane
        read _
        exit $ec
        INNER
        if [ -n "$TMUX" ]; then
          bash "$SCRIPT"
        else
          echo "(running inside tmux session '{{.TMUX_SESSION}}' -- reconnecting? just re-run this same command, -A reattaches instead of duplicating)"
          tmux new-session -A -s {{.TMUX_SESSION}} "bash '$SCRIPT'"
        fi
    vars:
      TMUX_SESSION: vtitan-provision-pi5
      TAGS: '{{.TAGS | default ""}}'
      SKIP_TAGS: '{{.SKIP_TAGS | default ""}}'
    requires:
      vars:
        - PI5_IP

  rpi:ansible:setup:
    desc: "Install Ansible + required collections on the dev Pi 5 (one-time)"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - pixi global install ansible || pipx install --include-deps ansible
      - ansible-galaxy collection install -r requirements.yml

  rpi:ansible:check:
    desc: "Dry-run the Ansible provisioner against an already-provisioned Pi and diff (usage: task rpi:ansible:check TARGET=pi5|zero [IP=x.x.x.x])"
    dir: "{{.ANSIBLE_DIR}}"
    requires:
      vars:
        - TARGET
    cmds:
      - |
        playbook="provision_{{.TARGET}}.yml"
        [ "{{.TARGET}}" = "zero" ] && playbook="provision_pi_zero.yml"
        extra=""
        # Scoped per-host (pi5_ip/zero_ip), not a global ansible_host override —
        # see inventory/hosts.yml's comment on why that matters for the Zero
        # playbook's delegate_to: pi5 tasks.
        if [ -n "{{.IP}}" ]; then
          [ "{{.TARGET}}" = "zero" ] && extra="-e zero_ip={{.IP}}" || extra="-e pi5_ip={{.IP}}"
        fi
        GH_TOKEN=$(gh auth token) ansible-playbook "playbooks/$playbook" $extra --check --diff --ask-become-pass

  rpi:ansible:tags:
    desc: "List the phase tags available on a provisioning playbook, for use with rpi:provision:*'s TAGS/SKIP_TAGS (usage: task rpi:ansible:tags TARGET=pi5|zero)"
    dir: "{{.ANSIBLE_DIR}}"
    requires:
      vars:
        - TARGET
    cmds:
      - |
        playbook="provision_{{.TARGET}}.yml"
        [ "{{.TARGET}}" = "zero" ] && playbook="provision_pi_zero.yml"
        ansible-playbook "playbooks/$playbook" --list-tags

  rpi:cleanup:old-services:
    desc: "Remove the pre-rename voldemorbot-*.service units on both boards — run manually, only after confirming the renamed vtitan-*.service units work (usage: task rpi:cleanup:old-services [PI5_IP=x.x.x.x] [ZERO_IP=x.x.x.x])"
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - echo "Removing old voldemorbot-*.service units from Pi 5 ({{.PI5_IP}}) and Pi Zero ({{.ZERO_IP}})..."
      - ansible-playbook playbooks/cleanup_old_services.yml -e pi5_ip={{.PI5_IP}} -e zero_ip={{.ZERO_IP}} --ask-become-pass
    vars:
      PI5_IP: '{{.PI5_IP | default .RPI_LOCAL_IP}}'
      ZERO_IP: '{{.ZERO_IP | default .ZERO_WIFI_IP}}'

  windows:ssh:print-config:
    desc: "Print recommended ~/.ssh/config entries (vars: SSH_USER, SSH_KEY_PATH, RPI_DIRECT_IP)"
    cmds:
      - echo "=== Recommended SSH Config Entries ==="
      - echo ""
      - echo "# --- Local network (router) ---"
      - echo "Host rpi-5-local"
      - echo "    HostName {{.RPI_LOCAL_IP}}"
      - echo "    User {{.SSH_USER}}"
      - echo "    Port 22"
      - echo "    IdentityFile {{.SSH_KEY_PATH}}"
      - echo "    ServerAliveInterval 60"
      - echo "    ConnectTimeout 10"
      - echo ""
      - echo "# --- Direct Ethernet (point-to-point cable to Pi 5, separate subnet from the Pi5<->PiZero USB gadget) ---"
      - echo "# Also matches the raw IP so ProxyJump (rpi-zero-direct below) inherits IdentityFile/User."
      - echo "Host rpi-5-direct {{.RPI_DIRECT_IP}}"
      - echo "    HostName {{.RPI_DIRECT_IP}}"
      - echo "    User {{.SSH_USER}}"
      - echo "    Port 22"
      - echo "    IdentityFile {{.SSH_KEY_PATH}}"
      - echo "    ServerAliveInterval 60"
      - echo "    ConnectTimeout 10"
      - echo ""
      - echo "# --- Remote access (Cloudflare Tunnel) ---"
      - echo "Host rpi-5-remote"
      - echo "    HostName pi.{{.SSH_DOMAIN}}.dev"
      - echo "    ProxyCommand cloudflared access ssh --hostname %h"
      - echo "    User {{.SSH_USER}}"
      - echo "    Port 22"
      - echo "    IdentityFile {{.SSH_KEY_PATH}}"
      - echo "    ServerAliveInterval 60"
      - echo "    ConnectTimeout 10"
      - echo ""
      - echo "# --- Pi Zero, WiFi ---"
      - echo "Host rpi-zero-local"
      - echo "    HostName {{.SSH_ZERO_HOSTNAME}}"
      - echo "    User {{.SSH_USER}}"
      - echo "    Port 22"
      - echo "    IdentityFile {{.SSH_KEY_PATH}}"
      - echo "    ServerAliveInterval 60"
      - echo "    ConnectTimeout 10"
      - echo ""
      - echo "# --- Pi Zero, via USB-gadget hop through Pi 5 (needs rpi-5-direct cable connected) ---"
      - echo "Host rpi-zero-direct"
      - echo "    HostName {{.RPI_ZERO_GADGET_IP}}"
      - echo "    User {{.SSH_USER}}"
      - echo "    Port 22"
      - echo "    ProxyJump {{.SSH_USER}}@{{.RPI_DIRECT_IP}}"
      - echo "    IdentityFile {{.SSH_KEY_PATH}}"
      - echo "    ServerAliveInterval 60"
      - echo "    ConnectTimeout 10"
      - echo ""
      - echo ""
      - echo "Override with task <task> SSH_USER=user SSH_KEY_PATH=~/.ssh/key SSH_DOMAIN=yourdomain RPI_DIRECT_IP=x.x.x.x SSH_ZERO_HOSTNAME=host.local"
    vars:
      SSH_USER: "{{.SSH_USER | default \"YOUR_USERNAME\"}}"
      SSH_KEY_PATH: "{{.SSH_KEY_PATH | default \"~/.ssh/YOUR_KEY_FILE\"}}"
      SSH_DOMAIN: "{{.SSH_DOMAIN | default \"YOUR_DOMAIN\"}}"
      SSH_ZERO_HOSTNAME: "{{.SSH_ZERO_HOSTNAME | default \"YOUR_PI_ZERO_HOSTNAME.local\"}}"
      RPI_LOCAL_IP: 192.168.0.50

  windows:ssh:setup-config:
    desc: "Append missing SSH host entries to ~/.ssh/config (vars: SSH_USER, SSH_KEY_PATH, RPI_DIRECT_IP, SSH_ZERO_HOSTNAME)"
    cmds:
      - cmd: powershell -NoProfile -File ./scripts/setup-ssh-config.ps1 -RpiDirectIp {{.RPI_DIRECT_IP}} -User {{.SSH_USER}} -KeyFile {{.SSH_KEY_PATH}} -RemoteHost pi.{{.SSH_DOMAIN}}.dev -RpiZeroHostname {{.SSH_ZERO_HOSTNAME}} -RpiZeroGadgetIp {{.RPI_ZERO_GADGET_IP}}
        platforms: [windows]
    vars:
      SSH_USER: "{{.SSH_USER | default \"YOUR_USERNAME\"}}"
      SSH_KEY_PATH: "{{.SSH_KEY_PATH | default \"~/.ssh/YOUR_KEY_FILE\"}}"
      SSH_DOMAIN: "{{.SSH_DOMAIN | default \"YOUR_DOMAIN\"}}"
      SSH_ZERO_HOSTNAME: "{{.SSH_ZERO_HOSTNAME | default \"YOUR_PI_ZERO_HOSTNAME.local\"}}"

  windows:ethernet:configure:
    desc: "Set Windows Ethernet adapter state for a direct Pi link (run as Admin, usage: task windows:ethernet:configure MODE=static|remove|dhcp)"
    requires:
      vars:
        - MODE
    cmds:
      - cmd: |
          powershell -NoProfile -Command "switch ('{{.MODE}}') { 'static' { New-NetIPAddress -InterfaceAlias 'Ethernet' -IPAddress '{{.WINDOWS_ETHERNET_IP}}' -PrefixLength 24 -ErrorAction SilentlyContinue; if (-not (Get-NetIPAddress -InterfaceAlias 'Ethernet' -IPAddress '{{.WINDOWS_ETHERNET_IP}}' -ErrorAction SilentlyContinue)) { Write-Host 'IP already set or adapter not found'; Get-NetIPAddress -InterfaceAlias 'Ethernet' -AddressFamily IPv4 | Select-Object IPAddress } else { Write-Host 'Set {{.WINDOWS_ETHERNET_IP}} on Ethernet adapter' } } 'remove' { & netsh interface ip delete address 'Ethernet' addr={{.WINDOWS_ETHERNET_IP}}; Write-Host 'Removed {{.WINDOWS_ETHERNET_IP}} from Ethernet adapter' } 'dhcp' { Set-NetIPInterface -InterfaceAlias 'Ethernet' -Dhcp Enabled; Remove-NetIPAddress -InterfaceAlias 'Ethernet' -AddressFamily IPv4 -ErrorAction SilentlyContinue; Write-Host 'DHCP enabled on Ethernet adapter' } default { Write-Host 'Unknown MODE: {{.MODE}}. Use static|remove|dhcp'; exit 1 } }"
        platforms: [windows]

  windows:ethernet:setup-link:
    desc: "Configure direct ethernet link: set Windows IP + Pi Ethernet IP (run as Admin, usage: task windows:ethernet:setup-link [SSH_HOST=alias])"
    cmds:
      - echo "[1/3] Setting Windows Ethernet adapter IP to {{.WINDOWS_ETHERNET_IP}}..."
      - task: windows:ethernet:configure
        vars:
          MODE: static
      - echo "[2/3] Setting Pi Ethernet IP to {{.RPI_DIRECT_IP}} (gateway {{.WINDOWS_ETHERNET_IP}})..."
      - echo "      (Configuring via Cloudflare tunnel — VPN safe)"
      - ssh {{.SSH_HOST}} "sudo nmcli con modify 'Wired connection 1' ipv4.addresses {{.RPI_DIRECT_IP}}/24 ipv4.gateway {{.WINDOWS_ETHERNET_IP}} ipv4.dns {{.WINDOWS_ETHERNET_IP}} ipv4.method manual ipv4.never-default yes connection.autoconnect-priority -10 && (sudo nmcli con down 'Wired connection 1' 2>/dev/null || true) && sudo nmcli con up 'Wired connection 1' 2>/dev/null || true"
      - echo "[3/3] Done. Plug in the Ethernet cable now, then:"
      - echo "      task windows:ssh SSH_HOST=rpi-5-direct"
    vars:
      SSH_HOST: '{{.SSH_HOST | default "rpi-5-remote"}}'

  windows:route:add:
    desc: "Add both WiFi and Ethernet persistent routes (run as Admin)"
    cmds:
      - task: windows:route:add:wifi
      - task: windows:route:add:ethernet

  windows:route:add:ethernet:
    desc: "Add persistent route for direct ethernet link (run as Admin)"
    internal: true
    cmds:
      - echo "Adding persistent route for {{.SUBNET}}/{{.MASK}} via {{.GATEWAY}}..."
      - cmd: route add {{.SUBNET}} mask {{.MASK}} {{.GATEWAY}} IF {{.INTERFACE}} metric 1 -p
        platforms: [windows]
    vars:
      SUBNET: '{{.SUBNET | default "192.168.251.0"}}'
      MASK: '{{.MASK | default "255.255.255.0"}}'
      GATEWAY: '{{.GATEWAY | default "192.168.251.1"}}'
      INTERFACE: '{{.INTERFACE | default "8"}}'

  windows:route:add:wifi:
    desc: "Add persistent route for WiFi subnet to bypass VPN (run as Admin)"
    internal: true
    cmds:
      - echo "Adding persistent route for {{.SUBNET}}/{{.MASK}} via {{.GATEWAY}}..."
      - cmd: route add {{.SUBNET}} mask {{.MASK}} {{.GATEWAY}} IF {{.INTERFACE}} metric 1 -p
        platforms: [windows]
    vars:
      SUBNET: '{{.SUBNET | default "192.168.0.0"}}'
      MASK: '{{.MASK | default "255.255.255.0"}}'
      GATEWAY: '{{.GATEWAY | default "192.168.0.1"}}'
      INTERFACE: '{{.INTERFACE | default "9"}}'

  windows:route:delete:
    desc: "Remove persistent route (run as Admin)"
    cmds:
      - echo "Removing route for {{.SUBNET}}..."
      - cmd: route delete {{.SUBNET}}
        platforms: [windows]
    vars:
      SUBNET: '{{.SUBNET | default "192.168.251.0"}}'

  windows:ethernet:unlink:
    desc: "Tear down direct ethernet link: revert Windows + Pi to DHCP (run as Admin, usage: task windows:ethernet:unlink [SSH_HOST=alias])"
    cmds:
      - echo "[1/2] Reverting Windows Ethernet adapter to DHCP..."
      - task: windows:ethernet:configure
        vars:
          MODE: dhcp
      - echo "[2/2] Reverting Pi Ethernet to DHCP..."
      - ssh {{.SSH_HOST}} "sudo nmcli con modify 'Wired connection 1' ipv4.method auto && (sudo nmcli con down 'Wired connection 1' 2>/dev/null || true) && sudo nmcli con up 'Wired connection 1' 2>/dev/null || true"
      - echo "Direct link torn down. Pi Ethernet back on DHCP."
      - echo "You can unplug the Ethernet cable now."
    vars:
      SSH_HOST: '{{.SSH_HOST | default "rpi-5-remote"}}'

  # Raspberry Pi commands (run directly on the Pi)

  rpi:iface-ip:
    desc: "Show IP address for a network interface (usage: task rpi:iface-ip IFACE=usb0|eth0|wlan0, default usb0)"
    cmds:
      - ip -4 a show {{.IFACE}}
    vars:
      IFACE: '{{.IFACE | default "usb0"}}'

  rpi:nudge:
    desc: Force usb0 gadget-link profile up
    cmds:
      - sudo nmcli con up 'usb0'

  rpi:usb-link:status:
    desc: "Check the Pi5<->Zero USB gadget link in both directions (run ON the Pi 5, needs SSH trust into the Zero already set up)"
    cmds:
      - echo "=== Pi 5 side (usb0) ==="
      - ip -s link show usb0
      - echo
      - echo "=== Pi 5 -> Zero ping ==="
      - ping -c 3 -W 2 {{.RPI_ZERO_GADGET_IP}} || true
      - echo
      - echo "=== Zero side (usb0) ==="
      - ssh -o ConnectTimeout=5 {{.FLEET_USER}}@{{.RPI_ZERO_GADGET_IP}} "ip -s link show usb0" || echo "(could not reach the Zero over the gadget link to check)"
      - echo
      - echo "=== Zero -> Pi 5 ping ==="
      - ssh -o ConnectTimeout=5 {{.FLEET_USER}}@{{.RPI_ZERO_GADGET_IP}} "ping -c 3 -W 2 {{.RPI_5_GADGET_IP}}" || echo "(could not reach the Zero over the gadget link to check)"

  rpi:usb-link:repair:
    desc: "Force-reload g_ether to recover a half-dead gadget link (run ON the Pi ZERO, not the Pi 5 -- see scripts/provisioning/usb-link-watchdog.sh for why)"
    cmds:
      - sudo modprobe -r g_ether
      - sleep 3
      - sudo modprobe g_ether
      - echo "Reloaded -- wait a few seconds, then check from the Pi 5 with task rpi:usb-link:status"

  rpi:diagnose:
    desc: Run connectivity diagnostics
    cmds:
      - echo "=== default routes (only one should exist, via wlan0) ==="
      - ip route show default
      - echo ""
      - echo "=== usb0 interface ==="
      - ip -4 a show usb0
      - echo ""
      - echo "=== routing table (usb0) ==="
      - ip route show dev usb0
      - echo ""
      - echo "=== usb0 profile ==="
      - nmcli -t -f NAME con show --active 2>/dev/null | grep -i '^usb0$' || echo '(usb0 profile not active)'
      - echo ""
      - echo "=== 'Wired connection 1' never-default check ==="
      - nmcli -t -f ipv4.never-default con show 'Wired connection 1' 2>/dev/null || echo "('Wired connection 1' profile not found)"

  # Health & thermal

  rpi:stat:
    desc: "Show a single health stat (usage: task rpi:stat NAME=temp|throttled|disk|mem|uptime)"
    requires:
      vars:
        - NAME
    cmds:
      - cmd: |
          case "{{.NAME}}" in
            temp) vcgencmd measure_temp ;;
            throttled) vcgencmd get_throttled ;;
            disk) df -h / ;;
            mem) free -h ;;
            uptime) uptime ;;
            *) echo "Unknown NAME: {{.NAME}}. Use temp|throttled|disk|mem|uptime" && exit 1 ;;
          esac

  # Power & lifecycle

  rpi:reboot:
    desc: Reboot the Pi
    cmds:
      - sudo reboot

  rpi:shutdown:
    desc: Shut down the Pi (safe poweroff)
    cmds:
      - sudo shutdown -h now

  rpi:set-static-ip:
    desc: "Set static IP on any connection (usage: task rpi:set-static-ip IP=x.x.x.x [CONNECTION=name] [GATEWAY=gw])"
    cmds:
      - sudo nmcli con modify '{{.CONNECTION}}' ipv4.addresses {{.IP}}/24 ipv4.gateway {{.GATEWAY}} ipv4.dns {{.GATEWAY}} ipv4.method manual && (sudo nmcli con down '{{.CONNECTION}}' 2>/dev/null || true) && sudo nmcli con up '{{.CONNECTION}}' 2>/dev/null || echo "Profile updated. It will activate when the cable is connected."
    requires:
      vars:
        - IP
    vars:
      GATEWAY: '{{.GATEWAY | default "192.168.0.1"}}'
      CONNECTION: '{{.CONNECTION | default "Wired connection 1"}}'

  rpi:set-static-ip:router:
    desc: "Set static IP on Wired connection 1 (router network)"
    cmds:
      - task: rpi:set-static-ip
        vars:
          IP: '{{.IP}}'
          CONNECTION: 'Wired connection 1'
          GATEWAY: '192.168.0.1'
    vars:
      IP: '{{.IP | default "192.168.0.50"}}'

  rpi:set-static-ip:direct:
    desc: "Set static IP on Ethernet for direct link to Windows"
    cmds:
      - task: rpi:set-static-ip
        vars:
          IP: '{{.IP}}'
          CONNECTION: 'Wired connection 1'
          GATEWAY: '{{.WINDOWS_ETHERNET_IP}}'
      - echo "Setting Wired connection 1 to never-default (keep WiFi as primary route)..."
      - sudo nmcli con modify 'Wired connection 1' ipv4.never-default yes connection.autoconnect-priority -10
    vars:
      IP: '{{.IP | default .RPI_DIRECT_IP}}'

# rpi:set-static-ip:gadget removed 2026-08-10: duplicated the usb0 static-IP
# setup ansible/roles/pi5 and roles/pi_zero now configure automatically, but
# was missing the routes4: [224.0.0.0/4] multicast route those roles added
# to fix a real bug (DDS discovery following the default route instead of
# the gadget link, so both boards ran healthy ROS2 graphs that couldn't see
# each other). Using this task instead of ansible would have silently
# reintroduced that bug.

  rpi:set-dhcp:
    desc: Revert Ethernet to DHCP
    cmds:
      - sudo nmcli con modify '{{.CONNECTION}}' ipv4.method auto && sudo nmcli con down '{{.CONNECTION}}' && sudo nmcli con up '{{.CONNECTION}}'
    vars:
      CONNECTION: '{{.CONNECTION | default "Wired connection 1"}}'

  rpi:update:
    desc: Update and upgrade all packages
    cmds:
      - sudo apt update && sudo apt full-upgrade -y

  rpi:set-wifi:
    desc: "Set WiFi credentials (usage: task rpi:set-wifi SSID=name PASSWORD=pass)"
    cmds:
      - sudo nmcli device wifi connect '{{.SSID}}' password '{{.PASSWORD}}'
    requires:
      vars:
        - SSID
        - PASSWORD

  rpi:wifi-scan:
    desc: List available WiFi networks
    cmds:
      - sudo nmcli device wifi list

  # Health & composite

  rpi:health:
    desc: Full system health snapshot (temp, throttle, GPU mem, disk, mem, uptime)
    cmds:
      - vcgencmd measure_temp
      - vcgencmd get_throttled
      - vcgencmd get_mem gpu
      - df -h /
      - free -h
      - uptime

  # vTitan service stack (run on the Pi 5)

  rpi:stack:
    desc: "vTitan service stack ops (usage: task rpi:stack ACTION=up|down|restart|status|logs)"
    requires:
      vars:
        - ACTION
    vars:
      # Order matters on up: the backend should be accepting gRPC before the
      # robot's telemetry bridge starts dialling it, the lidar should be
      # publishing /scan before the nodes that consume it come up, and the
      # race navigator (Wants=vtitan-pi5.service) needs pi5's topics already
      # there. `down` reverses this.
      UNITS: vtitan-backend.service vtitan-lidar.service vtitan-pi5.service vtitan-race.service
      UNITS_REVERSED: vtitan-race.service vtitan-pi5.service vtitan-lidar.service vtitan-backend.service
    cmds:
      - cmd: |
          case "{{.ACTION}}" in
            up) sudo systemctl start {{.UNITS}} && echo "Started: {{.UNITS}}" ;;
            down) sudo systemctl stop {{.UNITS_REVERSED}} && echo "Stopped: {{.UNITS_REVERSED}}" ;;
            restart) sudo systemctl stop {{.UNITS_REVERSED}} && sudo systemctl start {{.UNITS}} ;;
            status) systemctl status --no-pager {{.UNITS}} ;;
            logs) journalctl -u vtitan-backend -u vtitan-lidar -u vtitan-pi5 -u vtitan-race -n 80 --no-pager ;;
            *) echo "Unknown ACTION: {{.ACTION}}. Use up|down|restart|status|logs" && exit 1 ;;
          esac

  # Hailo AI accelerator

  rpi:hailo:
    desc: "HailoRT service ops (usage: task rpi:hailo ACTION=status|restart|logs|models)"
    requires:
      vars:
        - ACTION
    cmds:
      - cmd: |
          case "{{.ACTION}}" in
            status) systemctl status hailort ;;
            restart) sudo systemctl restart hailort ;;
            logs) journalctl -u hailort -n 50 --no-pager ;;
            models) ls -lh ~/*.hef ;;
            *) echo "Unknown ACTION: {{.ACTION}}. Use status|restart|logs|models" && exit 1 ;;
          esac

  # Camera

  rpi:camera:
    desc: "Camera ops (usage: task rpi:camera ACTION=info|test|capture)"
    requires:
      vars:
        - ACTION
    cmds:
      - cmd: |
          case "{{.ACTION}}" in
            info) rpicam-hello --list-cameras ;;
            test) rpicam-hello -t 2000 ;;
            capture) rpicam-still -o /tmp/snap.jpg && echo "Saved to /tmp/snap.jpg" ;;
            *) echo "Unknown ACTION: {{.ACTION}}. Use info|test|capture" && exit 1 ;;
          esac

  # Shared brand assets

  assets:sync-logos:
    desc: >-
      Copy the canonical Voltimor logo files (assets/) into every frontend's
      public/ dir. assets/ is the single source of truth -- Vite can't
      reference files outside a project's own root, so each frontend needs
      its own copy; re-run this after replacing either source PNG.
    cmds:
      - cp assets/voltimor-logo-square.png assets/voltimor-logo-banner.png auto-annotator/frontend/public/
      - cp assets/voltimor-logo-square.png assets/voltimor-logo-banner.png platform/frontend/public/
      - echo "[OK] Synced logo assets to auto-annotator/frontend/public and platform/frontend/public"

  # Repos

  rpi:repos:
    desc: "Ops across all vtitan repos (usage: task rpi:repos ACTION=pull|status)"
    requires:
      vars:
        - ACTION
    cmds:
      - cmd: |
          case "{{.ACTION}}" in
            pull) echo "=== ~/vtitan ===" && git -C ~/vtitan pull ;;
            status) echo "=== ~/vtitan ===" && git -C ~/vtitan status -sb ;;
            *) echo "Unknown ACTION: {{.ACTION}}. Use pull|status" && exit 1 ;;
          esac
