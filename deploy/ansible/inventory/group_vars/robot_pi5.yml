---
# Confirmed present on the real Pi 5 as of 2026-07-29 (pre-rename systemd
# units, still enabled). See roles/cleanup_old.
old_systemd_units:
  - vtitan-pi5.service
  - vtitan-lidar.service

# Sibling git-worktree checkouts of ~/vtitan (auto-annotator/docs/hailo/
# hugo-docs/platform branches) plus a stale manual backup dir, all confirmed
# clean on 2026-07-30 (no commits missing from GitHub) — removed by the pi5
# role once the fresh ~/vtitan clone is confirmed to have its .env.
old_worktree_dirs:
  - "/home/{{ ansible_user }}/vtitan-auto-annotator"
  - "/home/{{ ansible_user }}/vtitan-docs"
  - "/home/{{ ansible_user }}/vtitan-hailo"
  - "/home/{{ ansible_user }}/vtitan-hugo-docs"
  - "/home/{{ ansible_user }}/vtitan-platform"
  - "/home/{{ ansible_user }}/vtitan-session-backup"
