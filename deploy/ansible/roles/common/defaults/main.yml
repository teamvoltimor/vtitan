---
hardware_groups:
  - gpio
  - i2c
  - spi
  - dialout
  - video  # camera access on the Pi 5; harmless no-op on the Zero

# Opt-in dev-convenience tooling found already installed by hand on the
# fleet during earlier sessions (2026-08-10 audit) but never provisioned --
# off by default so a normal `provision_pi5.yml`/`provision_pi_zero.yml` run
# doesn't pay for tooling most re-provisions (a fresh SD card, CI, etc.) don't
# want. Turn on with `-e install_extra_tools=true` or `--tags extras`.
install_extra_tools: false

# windscribe-cli ships no apt repo, and windscribe.com/download is a
# JS-gated button with no stable direct-download URL -- so the arm64 .deb
# has to be browser-downloaded by hand and staged onto the control node
# (the Pi 5) first, via `task windows:stage-windscribe-deb DEB=<path>`.
# This just points at where that lands; see "Fail fast if the windscribe
# .deb isn't staged" below for what happens if it's missing.
windscribe_deb_path: "/home/{{ ansible_user }}/vtitan-provisioning-cache/windscribe-cli_arm64.deb"
