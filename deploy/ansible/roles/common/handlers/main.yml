---
- name: Reload udev rules
  become: true
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: true
  notify: Trigger udev

- name: Trigger udev
  become: true
  ansible.builtin.command: udevadm trigger
  changed_when: true

- name: Restart journald
  become: true
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
