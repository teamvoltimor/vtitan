services:
  annotator:
    build: .
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "7860:7860"
    volumes:
      - ./data/pending:/app/data/pending:ro
      - ./data/labels:/app/data/labels:rw
      - ./models:/app/models:rw
      - ./manifest.db:/app/manifest.db:rw
