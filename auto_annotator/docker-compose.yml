services:
  annotator:
    build: .
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DB_PATH=/app/data/manifest.db
      - MODELS_DIR=/app/models
      - MODELS_CONFIG=/app/config/models.toml
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data:rw
      - ./models:/app/models:rw
